services:
  fastapi:
    image: python:3.11-slim
    container_name: fastapi-server
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install fastapi uvicorn Jinja2 couchdb2 && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3.3
    container_name: couchdb-server
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=V7!qR2#nL9@xT4$k
    volumes:
      - ./couchdb_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    restart: always