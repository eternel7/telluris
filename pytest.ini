[pytest]
# Par défaut, les tests marqués `lent` sont écartés (vrai corpus du lore, vrais dépôts git).
# Toute la suite : `python -m pytest tests/ -m ""` ; les lents seuls : `-m lent`.
addopts = -m "not lent"
markers =
	lent: test lourd (corpus réel, sous-processus git) — hors de la passe par défaut
