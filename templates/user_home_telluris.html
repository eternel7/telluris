<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Telluris — {{ title }}</title>
	<link rel="icon" type="image/png" href="{{ url_for('icons', path='favicon.svg') }}" sizes="any">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
	<style>

		{% include "part-root-css.html" without context %}
		{% include "part-footer-css.html" without context %}
		{% include "part-accessibility-css.html" without context %}
		
		/* ── BASE & SCROLL LOCK ─────────────────────────────────── */
		body {
			background-color: var(--ink);
			background: radial-gradient(circle, #1a1612 0%, #0e0b08 100%);
			overflow: hidden;
			padding: 20px;
			box-sizing: border-box;
		}
		#main-content {
			display: flex;
			justify-content: center;			
		}
		.user-container {
			width: 100%;
			max-width: 520px;
			background: var(--parch);
			border: 2px solid var(--gold);
			border-radius: 2px;
			padding: 40px;
			box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(141, 99, 52, 0.1);
			text-align: center;
			position: relative;
			color: var(--ink);
			z-index: 1;
		}

		.user-container::before {
			content: '';
			position: absolute;
			top: 5px; left: 5px; right: 5px; bottom: 5px;
			border: 1px solid var(--bronze);
			pointer-events: none;
			opacity: 0.5;
		}
		
		.logo {
			font-family: 'Cinzel Decorative', serif;
			font-size: 28px;
			font-weight: 700;
			letter-spacing: 0.12em;
			color: var(--ink);
			margin-bottom: 5px;
		}

		.subtitle {
			font-family: 'Cinzel', serif;
			color: var(--bronze);
			font-size: 12px;
			text-transform: uppercase;
			margin-bottom: 20px;
			letter-spacing: 1.5px;
			font-weight: 700;
			animation: heroReveal 2s 0.6s ease both;
			min-height: 1.2em;
		}

		/* ── FORMULAIRE ─────────────────────────────────────────── */
		.form-group {
			text-align: left;
			margin-bottom: 20px;
			position: relative;
		}

		label {
			display: block;
			font-family: 'Cinzel', serif;
			font-size: 12px;
			color: var(--ink);
			margin-bottom: 6px;
			font-weight: 700;
			text-transform: uppercase;
		}

		input {
			width: 100%;
			background: rgba(0, 0, 0, 0.05);
			border: none;
			border-bottom: 1px solid var(--bronze);
			padding: 10px 0;
			color: var(--ink);
			font-family: 'IM Fell English', serif;
			font-size: 16px;
			box-sizing: border-box;
			transition: border-color 0.3s;
		}

		input:focus {
			outline: none;
			border-bottom: 2px solid var(--gold);
		}

		/* ── ICONE DYNAMIQUE DU MOT DE PASSE ────────────────────── */
		.pass-visual {
			position: absolute;
			right: 5px;
			bottom: 10px;
			font-size: 18px;
			pointer-events: none;
			transition: all 0.2s ease;
			opacity: 0;
		}
		.pass-visual.visible {			
			display: inline-flex;
			align-items: center;
			justify-content: center;
			height: 26px;
			width: 26px;
			border-radius: 5px;
			padding: 0px 5px;
			opacity: 1;
		}

		/* ── BOUTONS ────────────────── */
		.btn {
			width: 100%;
			margin-top: 15px;
			padding: 14px 20px;
			font-family: 'Cinzel', serif;
			font-size: 14px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 2px;
			color: var(--parch);
			background: var(--ink);
			border: 1px solid var(--gold);
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: all 0.3s ease;
		}

		.btn:hover {
			background: var(--gold);
			color: var(--ink);
			box-shadow: 0 4px 15px rgba(201, 146, 42, 0.4);
		}
				
		.switch-mode {
			margin-top: 30px;
			font-size: 14px;
			font-style: italic;
			color: var(--bronze);
		}

		.switch-mode a {
			font-family: 'Cinzel', serif;
			color: var(--ink);
			text-decoration: none;
			font-weight: 700;
			cursor: pointer;
			margin-left: 5px;
			font-size: 12px;
		}
		/* Ornement haut */
		.ornament {
			width: 180px;
			height: 1px;
			background: linear-gradient(90deg, transparent, var(--gold), transparent);
			position: relative;
			margin: 0 auto 20px auto;
		}
		.ornament::before {
			content: '✦';
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			color: var(--gold);
			font-size: 12px;
			background: var(--parch);
			padding: 0 6px;
		}		

		.hero-rule {
			width: 60px;
			height: 0.5px;
			background: var(--gold);
			margin: 18px auto;
		}
		.switch-mode a:hover {
			color: var(--gold);
		}
		.hidden { display: none; }
		/* ── RESPONSIVE ───────────────────────────────────────────── */
		@media (max-width: 768px) {
			label {
				font-size: 10px;
			}
		}
	</style>
</head>
<body>
	<svg style="display:none">
		<filter id="noiseFilter">
			<feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" />
		</filter>
	</svg>

	<a href="#main-content" class="skip-link">Aller au contenu principal</a>
	<main id="main-content">
		<section class="user-main" aria-labelledby="User">
		<div class="user-container">
			<div class="ornament"></div>
			<div class="logo">{{ user_doc["username"] }}</div>
			<div id="user-subtitle" class="subtitle">{{ user_doc["email"] }}</div>
			<div class="hero-rule"></div>

			<form id="user-form">
				<div class="form-group">
					<label for="user-name" title="Nom" >Sceau d'identité</label>
					<input type="text" id="player-name" placeholder="votre nom de joueur" value="{{ user_doc["username"] }}">
				</div>
			</form>
		</div>
		</section>
	</main>
	<script>
	</script>
</body>
</html>
