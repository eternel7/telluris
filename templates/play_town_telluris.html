}
async function couperItem(index, itemId, source) {
	try {
		// `compagnon_id` (injecté par _actionBody en mode compagnon) → le serveur coupe le sac
		// du COMPAGNON ; les pièces tombent toujours au sol du principal (partagé). Le payload
		// renvoyé est alors celui du porteur affiché (sac compagnon + sol principal), donc
		// `_applyInventoryPayload` est correct dans les deux modes. Un « sol » reste toujours
		// une coupe du sol du principal côté serveur, quel que soit le porteur actif.
		const res = await fetch('api/couper', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ index, item_id: itemId, source }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		_applyInventoryPayload(data);
		if (data.coupe) showToast('Coupé : ' + data.coupe.n + ' × ' + (data.coupe.nom || data.coupe.taille));
	} catch(err) { console.error('Erreur coupe', err); }
}

// Miroir client de utils/consommables.est_consommable : catégorie + au moins un effet.
function _estConsommable(item) {
	if (!item || item.categorie !== 'consommable') return false;
	const e = item.effets || {};
	return !!(e.pv || e.pm || e.regen_pv || e.regen_pm || (e.buffs && Object.keys(e.buffs).length));
}

// Chips d'effets actifs (colonne gauche de la fiche + onglet stats + panneau perso du jeu).
function _renderEffetsActifs(list) {
	if (Array.isArray(list)) _effetsActifs = list;
	const html = (_effetsActifs || []).map(e => {
		const details = [];
		for (const [k, v] of Object.entries(e.buffs || {})) details.push(`${v > 0 ? '+' : ''}${v} ${k}`);
		if (e.regen_pv) details.push(`+${e.regen_pv} PV/tour`);
		if (e.regen_pm) details.push(`+${e.regen_pm} PM/tour`);
		if (e.esquive) details.push(`+${e.esquive} esquive`);
		return `<span class="sh-effet-chip">${e.icon || '✨'} ${e.nom || 'Effet'}${details.length ? ' (' + details.join(', ') + ')' : ''}<span class="sh-effet-restants">⏳${e.restants}</span></span>`;
	}).join('');
	['sh-effets-actifs', 'sh-effets-actifs-stats', 'sh-effets-actifs-panel'].forEach(id => {
		const el = document.getElementById(id);
		if (el) el.innerHTML = html;
	});
}

async function consommerItem(index, itemId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/consommer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ index, item_id: itemId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);   // re-rend le sac (le bouton disparaît avec l'item)
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		const c = data.consomme || {};
		const gains = [];
		if (c.pv_rendu) gains.push(`+${c.pv_rendu} PV`);
		if (c.pm_rendu) gains.push(`+${c.pm_rendu} PM`);
		if (c.effet) gains.push(`effet actif ${c.effet.restants} tours`);
		showToast(`${c.icon || '🍽️'} ${c.nom || 'Consommé'}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur consommation', err); if (btn) btn.disabled = false; }
}

// ── Sorts (onglet ⚡) ─────────────────────────────────────────────────
// Connus (bouton Lancer si utilisable hors combat) + apprenables (coût en points,
// grimoire requis). Rendus client depuis les payloads serveur, resynchronisés par
// les réponses de lancer_sort / apprendre_sort.

let _sortsApprenables = {{ sorts_apprenables | tojson | safe }};
let _sortsMagies      = {{ sorts_magies | tojson | safe }};      // écoles pratiquées + achetables

// Description complète dépliée au clic — connue si on connaît déjà le sort, ou si on
// porte son grimoire (sinon rien à débloquer). État purement client, pas persisté ;
// survit à un resync (lancer/apprendre) puisque les deux rendus le relisent à chaque appel.
let _sortsDescOuvertes = new Set();
function _toggleSortDesc(sortId) {
	_sortsDescOuvertes.has(sortId) ? _sortsDescOuvertes.delete(sortId) : _sortsDescOuvertes.add(sortId);
	_renderSorts(); _renderSortsApprenables();

// Classe + onclick à injecter sur .sh-skill-info si la description est consultable.
function _sortInfoAttrs(sortId, peutVoir) {

		? ` class="sh-skill-info sh-skill-toggle" onclick="_toggleSortDesc('${sortId}')"`
		: ' class="sh-skill-info"';
}

// ── Barre de combat : grille de slots (utils/slots_actions.py) ────────────────────
// Une entrée par case ; `_barreSlots` remplace les deux anciennes listes d'épinglés, qui
// disaient « en accès rapide » sans jamais dire À QUELLE PLACE.
let _barreSlots      = {{ barre_slots | tojson | safe }};
let _barreSlotsMax   = {{ barre_slots_max | tojson | safe }};
let _consosCombat = {{ consommables | tojson | safe }};   // consommables assignables (effet instantané)

// Case occupée par CETTE entrée, ou undefined. Pour un sort, `composants` fait partie de
// l'identité : « Trait de feu » et « Trait de feu + » sont deux entrées distinctes, qui
// peuvent occuper deux cases à la fois.
function _caseDe(type, ref, composants) {
	return _barreSlots.find(s => s.type === type && s.ref === ref
		&& (composants === undefined || !!s.composants === composants));
}

// Options du sélecteur d'une entrée : « — » (non assignée) + les cases LIBRES, plus la
// case courante. Une case occupée par une obligatoire n'est pas proposée : la déplacer
// est un geste de la grille (échange), pas une affectation qui l'écraserait.
function _slotOptions(type, ref, composants) {
	const courante = _caseDe(type, ref, composants);
	const opts = [`<option value="">—</option>`];
	for (const s of _barreSlots) {
		if (s.obligatoire) continue;
		const estCourante = courante && s.position === courante.position;
		if (s.type && !estCourante) continue;      // occupée par autre chose
		opts.push(`<option value="${s.position}" ${estCourante ? 'selected' : ''}>${s.position}</option>`);
	}
	return { html: opts.join(''), assignee: !!courante };
}
// Sélecteur rendu à côté d'un sort / d'une compétence / d'un consommable.
// `composants` : undefined hors sorts ; true/false pour distinguer les deux variantes.
function _slotSelect(type, ref, composants, titre) {
	const { html, assignee } = _slotOptions(type, ref, composants);
	const arg = composants === undefined ? 'undefined' : String(composants);
	return `<select name="sh-slot-select-${ref}" class="sh-slot-select${assignee ? ' active' : ''}"
		title="${titre || 'Case de la barre de combat'}"
		onchange="affecterSlot('${type}', '${ref}', ${arg}, this)">${html}</select>`;
}

// Affectation depuis un sélecteur : vider l'ancienne case si l'on repasse à « — »,
// sinon poser l'entrée à la position choisie (le serveur gère déplacement et échange).
async function affecterSlot(type, ref, composants, sel) {
	const position = sel.value;
	const courante = _caseDe(type, ref, composants);
	if (!position) {
		if (!courante) return;
		await _postSlots('api/slot_action', { position: courante.position, entree: null });
	} else {
		const entree = { type, ref };
		if (composants !== undefined) entree.composants = composants;
		await _postSlots('api/slot_action', { position: parseInt(position, 10), entree });
	}
}
async function _deplacerSlot(source, cible) {
	await _postSlots('api/slot_deplacer', { source, cible });
}
// Chemin d'écriture unique. Le serveur renvoie la barre RECALCULÉE (invariante des
// obligatoires réparée) — on ne la reconstruit jamais côté client. `_actionBody` y
// injecte le compagnon_id : configurer depuis la fiche d'un compagnon écrit sur SON doc.
async function _postSlots(url, body) {
	try {
		const res = await fetch(url, {
			method: 'POST', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(_actionBody(body)),
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); _renderBarreSlots(); return; }
		_barreSlots = data.slots || _barreSlots;
		_renderBarreSlots();
		_renderSorts(); _renderCompetences(); _refreshInventaire();
	} catch (err) { console.error('Erreur slots', err); }
}

// ── Glisser-déposer par CLIC LONG (miroir de attacherDragLong côté combat) ──────────
// Pointer Events plutôt que le drag & drop HTML5 : celui-ci ne fonctionne pas au doigt.
// Un seul code pour la souris et le tactile.
const _DRAG_DELAI_MS = 400;
const _DRAG_TOLERANCE = 10;

function _attacherDragLong(el, position, selecteur, onDrop) {
	let timer = null, arme = false, depart = null, survolee = null;
	const nettoyer = () => {
		clearTimeout(timer); timer = null;
		el.classList.remove('dragging');
		if (survolee) survolee.classList.remove('drag-over');
		survolee = null; arme = false; depart = null;
	};
	el.addEventListener('pointerdown', e => {
		if (e.button !== undefined && e.button !== 0) return;
		depart = { x: e.clientX, y: e.clientY };
		timer = setTimeout(() => {
			arme = true;
			el.classList.add('dragging');
			try { el.setPointerCapture(e.pointerId); } catch (_) {}
		}, _DRAG_DELAI_MS);
	});
	el.addEventListener('pointermove', e => {
		if (!depart) return;
		if (!arme) {
			// Trop de mouvement avant l'armement = défilement de la page, pas un appui long.
			if (Math.hypot(e.clientX - depart.x, e.clientY - depart.y) > _DRAG_TOLERANCE) nettoyer();
			return;
		}
		const sous = document.elementFromPoint(e.clientX, e.clientY);
		const cible = sous && sous.closest(selecteur);
		if (cible !== survolee) {
			if (survolee) survolee.classList.remove('drag-over');
			survolee = (cible && cible !== el) ? cible : null;
			if (survolee) survolee.classList.add('drag-over');
		}
	});
	el.addEventListener('pointerup', e => {
		if (!arme) { nettoyer(); return; }
		const sous = document.elementFromPoint(e.clientX, e.clientY);
		const cible = sous && sous.closest(selecteur);
		const dest = cible && cible !== el ? parseInt(cible.dataset.slot, 10) : null;
		nettoyer();
		if (dest && dest !== position) onDrop(position, dest);
	});
	el.addEventListener('pointercancel', nettoyer);
}

// Aperçu éditable de la barre : glisser-déposer par clic long (l'affectation passe par
// les sélecteurs des listes) — c'est le seul geste capable de bouger une obligatoire.
function _renderBarreSlots() {
	const box = document.getElementById('sh-slot-grid');
	if (!box) return;
	box.innerHTML = _barreSlots.map(s => {
		const cls = ['sh-barre-slot', s.type ? '' : 'empty', s.obligatoire ? 'oblig' : ''].filter(Boolean).join(' ');
		const titre = s.type ? `${s.nom}${s.disponible ? '' : ' (indisponible)'}` : 'Emplacement libre';
		// « + » : ce sort est réglé pour dépenser ses composants consommés.
		const plus = (s.type === 'sort' && s.composants) ? '<span class="sh-barre-plus sh-barre-plus-pos">+</span>' : '';
		// ✕ au survol : retirer l'action de la case. Rendu seulement là où c'est LÉGAL —
		// une obligatoire ne se vide pas (le serveur répondrait 422), une case vide non plus.
		const del = (s.type && !s.obligatoire)
			? `<button type="button" class="sh-barre-del" title="Retirer cette action de la barre"
				aria-label="Retirer ${(s.nom || '').replace(/"/g, '&quot;')} de la case ${s.position}">✕</button>`
			: '';
		return `<div class="${cls}" data-slot="${s.position}" title="${titre.replace(/"/g, '&quot;')}"
			style="${s.type && !s.disponible ? 'opacity:.4' : ''}">${s.icon || ''}${plus}${del}</div>`;
	}).join('');
	box.querySelectorAll('.sh-barre-slot').forEach(el => {
		const n = parseInt(el.dataset.slot, 10);
		_attacherDragLong(el, n, '.sh-barre-slot', _deplacerSlot);
		const del = el.querySelector('.sh-barre-del');
		if (!del) return;
		// ⚠️ La case entière écoute `pointerdown` pour armer le clic long : sans ce
		// stopPropagation, viser la pastille amorcerait un glisser au lieu d'un clic.
		del.addEventListener('pointerdown', e => e.stopPropagation());
		del.addEventListener('click', e => { e.stopPropagation(); _viderCaseBarre(n); });
	});
	_renderModesAttaque();
}

// Les deux modes d'attaque OPTIONNELS. ⚔ n'y figure pas : il est obligatoire, donc
// toujours sur la barre — son sélecteur n'aurait qu'une seule issue. Une case de mode
// se grise en combat quand l'arme correspondante n'est pas équipée : elle s'assigne
// donc ici sans avoir l'arme en main, et reste en place d'une arme à l'autre.
const _MODES_ATTAQUE = [
	['jet', '🪃', 'Jet', "Lancer une arme de jet (portée de l'arme + F/20)"],
	['tir', '🏹', 'Tir', "Tirer à l'arc (portée de l'arme)"],
];
function _renderModesAttaque() {
	const box = document.getElementById('sh-modes-attaque');
	if (!box) return;
	box.innerHTML = _MODES_ATTAQUE.map(([ref, icon, nom, desc]) => `<div class="sh-skill">
		<span class="sh-skill-icon">${icon}</span>
		<div class="sh-skill-info">
			<div class="sh-skill-name">${nom}</div>
			<div class="sh-skill-desc">${desc}</div>
		</div>
		<div class="sh-inv-actions"><span class='sh-slot-choice'>case: </span>${_slotSelect('attaque', ref, undefined, 'Case de la barre de combat')}</div>
	</div>`).join('');
}

// Retire l'action d'une case, sur confirmation. Le serveur refuse déjà (422) de vider
// une case obligatoire — la pastille n'y est simplement jamais rendue.
function _viderCaseBarre(position) {
	const slot = _barreSlots.find(s => s.position === position);
	if (!slot || !slot.type || slot.obligatoire) return;
	if (!confirm(`Retirer ${slot.nom || 'cette action'} de la case ${position} ?`)) return;
	_postSlots('api/slot_action', { position, entree: null });
}

// `prefixeDegats` : '+' pour une compétence de corps à corps, dont les dés S'AJOUTENT à ceux
// de l'arme (cf. combat._degats_competence). Sans lui le joueur lirait le bonus comme un total.
function _sortEffetsLabel(e, prefixeDegats) {
	if (!e) return '';
	const parts = [];
	if (e.degats) parts.push(`${prefixeDegats || ''}${e.degats} dég.`);
	if (e.pv) parts.push(`+${e.pv} PV`);
	if (e.pm) parts.push(`+${e.pm} PM`);
	for (const [k, v] of Object.entries(e.buffs || {})) parts.push(`${v > 0 ? '+' : ''}${v} ${k}`);
	if (e.regen_pv) parts.push(`+${e.regen_pv} PV/tour`);
	if (e.regen_pm) parts.push(`+${e.regen_pm} PM/tour`);
	if (e.esquive) parts.push(`esquive +${e.esquive}`);
	if (e.furtivite) parts.push(`🥷 furtivité`);
	if (e.duree) parts.push(`${e.duree} tours`);
	return parts.join(', ');
}
function _sortDomId(sortId) { return sortId.replace(/[^a-zA-Z0-9_-]/g, '_'); }

function _renderSorts(list) {
	if (Array.isArray(list)) _sorts = list;
	const box = document.getElementById('sh-sorts-connus');
	if (!box) return;
	if (!_sorts.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">🔮</span>Aucun sort connu.</div>';
		return;
	}
	box.innerHTML = _sorts.map(s => {
		const compos = (s.composants || []).map(c =>
			`<span class="sh-sort-compo${c.disponible ? '' : ' off'}" title="${c.consomme ? 'Consommé au lancement' : 'Catalyseur (non consommé, il suffit de le porter)'}">${c.consomme ? '⚗️' : '💎'} ${c.icon || ''} ${c.nom}${_sortEffetsLabel(c.bonus) ? ' → ' + _sortEffetsLabel(c.bonus) : ''}</span>`
		).join('');
		const hasCompo = (s.composants || []).some(c => c.disponible);
		// Deux cases possibles pour un sort à composants CONSOMMABLES : une qui les
		// dépense (« + »), une qui les économise. Les catalyseurs partent toujours, ils
		// ne créent donc pas de variante. Sans composant consommable, un seul sélecteur.
		const aCompoConso = (s.composants || []).some(c => c.consomme);
		const pin = _slotSelect('sort', s.sort_id, false, 'Case de la barre — sans dépenser de composant')
			+ (aCompoConso
				? '<span class="sh-compo-lbl sh-barre-plus " title="Variante qui dépense les composants">+</span>'
				  + _slotSelect('sort', s.sort_id, true, 'Case de la barre — en dépensant les composants')
				: '');
		const actions = pin + (s.lancable
			? `<label class="sh-sort-uselbl" title="Engager les composants disponibles (renforce le sort ; les consommés sont dépensés)"><input type="checkbox" id="sortchk-${_sortDomId(s.sort_id)}" checked ${hasCompo ? '' : 'disabled'}>compo</label>
			   <button type="button" class="sh-drop-btn" onclick="lancerSort('${s.sort_id}', this)">Lancer</button>`
			: `<span class="sh-skill-lvl" title="Utilisable en combat seulement">⚔ combat</span>`);
		// Sort déjà connu → sa description complète est toujours consultable (s'il y en a une).
		const peutVoir = !!s.description;
		const ouvert = peutVoir && _sortsDescOuvertes.has(s.sort_id);
		return `<div class="sh-skill${ouvert ? ' expanded' : ''}">
			<span class="sh-skill-icon">${s.icon || '🔮'}</span>
			<div${_sortInfoAttrs(s.sort_id, peutVoir)}>
				<div class="sh-skill-name">${s.nom}<span class="sh-sort-pm">${s.cout_pm} PM</span></div>
				<div class="sh-skill-desc">${_sortEffetsLabel(s.effets)}${s.cible === 'ennemi' ? ' · portée ' + s.portee : ''}${s.cible === 'allie' ? ' · 🤝 sur un allié' : ''}</div>
				${compos ? `<div class="sh-sort-compos">${compos}</div>` : ''}
				${ouvert ? `<div class="sh-skill-full-desc">${s.description}</div>` : ''}
			</div>
			<div class="sh-inv-actions">${actions}</div>
		</div>`;
	}).join('');
}

function _renderSortsApprenables(list) {
	if (Array.isArray(list)) _sortsApprenables = list;
	const box = document.getElementById('sh-sorts-apprenables');
	if (!box) return;
	if (!_sortsApprenables.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">📖</span>Aucun sort à apprendre pour l\'instant.</div>';
		return;
	}
	box.innerHTML = _sortsApprenables.map(s => {
		const ok = s.grimoire_ok && _attributePoints >= s.cout_points;
		const grim = s.grimoire_ok
			? '<span class="sh-sort-grim" title="Grimoire porté">📖✔</span>'
			: '<span class="sh-sort-grim" title="Il vous faut le grimoire qui enseigne ce sort (sac ou équipé)">📖✖</span>';
		// Description consultable seulement si le grimoire enseignant est porté — sans
		// lui, rien à débloquer avant d'avoir les moyens d'apprendre le sort.
		const peutVoir = !!s.description && s.grimoire_ok;
		const ouvert = peutVoir && _sortsDescOuvertes.has(s.id);
		return `<div class="sh-skill${ouvert ? ' expanded' : ''}">
			<span class="sh-skill-icon">${s.icon || '🔮'}</span>
			<div${_sortInfoAttrs(s.id, peutVoir)}>
				<div class="sh-skill-name">${s.nom}<span class="sh-sort-pm">${s.cout_pm} PM</span> ${grim}</div>
				<div class="sh-skill-desc">Niv. ${s.niveau} · ${_sortEffetsLabel(s.effets)}</div>
				${ouvert ? `<div class="sh-skill-full-desc">${s.description}</div>` : ''}
			</div>
			<div class="sh-inv-actions">
				<button type="button" class="sh-drop-btn" onclick="apprendreSort('${s.id}', this)" ${ok ? '' : 'disabled'}>Apprendre (${s.cout_points} pts)</button>
			</div>
		</div>`;
	}).join('');
}

// ── Cible d'un effet bénéfique hors combat (`cible: "allie"`) ───────────────────
// Le groupe n'est chargé que quand le panneau 👥 s'ouvre : un sort d'allié peut être
// lancé sans y être passé, d'où ce chargement paresseux.
async function _assurerGroupe() {
	if (_grpEtat) return _grpEtat;
	try {
		const res = await fetch('api/groupe');
		if (res.ok) _grpEtat = await res.json();
	} catch (err) { console.error('Erreur groupe', err); }
	return _grpEtat;
}

// Cibles possibles : tout le groupe — principal, compagnons ET montures — SAUF le
// lanceur (un effet sur soi se déclare `cible: "soi"`, il a son propre bouton).
function _alliesCibles() {
	const d = _grpEtat || {};
	const moi = porteurActifId();
	const nomDe = c => `${c.prenom || ''} ${c.nom || ''}`.trim() || '?';
	const out = [];
	if (d.principal) out.push({ id: d.principal.id, nom: nomDe(d.principal), icon: '👤' });
	(d.groupe || []).forEach(c => out.push({
		id: c.id, nom: nomDe(c), icon: '🧑‍🤝‍🧑',
		pv: c.currentPV, pv_max: c.pv_max }));
	(d.montures || []).forEach(m => out.push({
		id: m.id, nom: nomDe(m), icon: '🐴',
		pv: m.currentPV, pv_max: m.pv_max }));
	return out.filter(c => c.id && c.id !== moi);
}

let _cibleAllieResolve = null;

function closeCibleAllie() {
	document.getElementById('cible-allie-overlay').classList.add('clauses-hidden');
	if (_cibleAllieResolve) { const r = _cibleAllieResolve; _cibleAllieResolve = null; r(null); }
}

function _choisirCibleAllie(id) {
	document.getElementById('cible-allie-overlay').classList.add('clauses-hidden');
	if (_cibleAllieResolve) { const r = _cibleAllieResolve; _cibleAllieResolve = null; r(id); }
}

// Renvoie l'id choisi, ou null si l'utilisateur annule. Une seule cible possible ⇒ pas
// d'overlay : on ne fait pas cliquer quelqu'un sur l'unique choix qui existe.
async function demanderCibleAllie(titre) {
	await _assurerGroupe();
	const cibles = _alliesCibles();
	if (!cibles.length) { showToast('Personne à cibler : votre groupe est vide.'); return null; }
	if (cibles.length === 1) return cibles[0].id;
	document.getElementById('cible-allie-body').innerHTML =
		`<h3 style="margin:.1rem 0 .7rem">${titre}</h3>`
		+ cibles.map(c => `<button type="button" class="cible-allie-btn"
			onclick="_choisirCibleAllie('${c.id}')">
			<span>${c.icon}</span><span class="cible-allie-nom">${c.nom}</span>
			${c.pv != null ? `<span class="cible-allie-pv">${c.pv}/${c.pv_max} PV</span>` : ''}
		</button>`).join('');
	document.getElementById('cible-allie-overlay').classList.remove('clauses-hidden');
	return new Promise(resolve => { _cibleAllieResolve = resolve; });
}

// Vitaux de la cible d'un effet bénéfique : ils ne concernent PAS la fiche ouverte
// (c'est le lanceur), mais la carte du bénéficiaire dans le panneau 👥.
function _appliquerVitauxCible(l) {
	if (!l || !l.cible_id || !l.cible_vitaux) return;
	updateVitals(l.cible_vitaux, l.cible_id);
	if (_grpEtat) _grpEtat = null;   // payload périmé : rechargé au prochain besoin
}

async function lancerSort(sortId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	const s = _sorts.find(x => x.sort_id === sortId);
	const chk = document.getElementById('sortchk-' + _sortDomId(sortId));
	const composants = (s && chk && chk.checked)
		? (s.composants || []).filter(c => c.disponible).map(c => c.item) : [];
	// Sort d'entraide : on demande la cible AVANT d'envoyer (les PM partent à l'envoi).
	// Annuler doit tout arrêter, y compris réactiver le bouton.
	let cible_id = null;
	if (s && s.cible === 'allie') {
		cible_id = await demanderCibleAllie(`${s.icon || '🔮'} ${s.nom} — sur qui ?`);
		if (!cible_id) { if (btn) btn.disabled = false; return; }
	}
	try {
		const res = await fetch('api/lancer_sort', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			// _actionBody injecte `compagnon_id` : c'est le LANCEUR (la fiche ouverte).
			body: JSON.stringify(_actionBody({ sort_id: sortId, composants, cible_id }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);   // composants consommés retirés du sac
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		_renderSorts(data.sorts);
		const l = data.lance || {};
		_appliquerVitauxCible(l);
		const gains = [];
		if (l.pv_rendu) gains.push(`+${l.pv_rendu} PV`);
		if (l.pm_rendu > 0) gains.push(`+${l.pm_rendu} PM`);
		if (l.effet) gains.push(`effet actif ${l.effet.restants} tours`);
		const sur = l.cible_nom ? ` sur ${l.cible_nom}` : '';
		showToast(`${l.icon || '🔮'} ${l.nom || 'Sort lancé'}${sur}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur sort', err); if (btn) btn.disabled = false; }
}

// Écoles de magie : pratiquées (niveau, native/achetée) + achetables (lettré). Rendu
// client depuis sorts_magies, resync après apprendre_magie / monter_magie / apprendre_sort.
function _renderSortsMagies(payload) {
	if (payload) _sortsMagies = payload;
	const box = document.getElementById('sh-sorts-magies');
	if (!box) return;
	const m = _sortsMagies || {};
	const prat = (m.pratiquees || []).map(e => {
		const tag = e.native ? '<span class="sh-skill-lvl" title="École native de votre vocation">native</span>' : '';
		const monter = (e.montable && m.peut_apprendre)
			? `<button type="button" class="sh-drop-btn" onclick="monterMagie('${e.ecole}', this)" ${_attributePoints >= e.cout_montee ? '' : 'disabled'}>Niv. + (${e.cout_montee} pts)</button>`
			: '';
		return `<div class="sh-skill">
			<span class="sh-skill-icon">✨</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${e.ecole}<span class="sh-sort-pm">Niv. ${e.niveau}</span> ${tag}</div>
			</div>
			<div class="sh-inv-actions">${monter}</div>
		</div>`;
	}).join('');
	const achet = (m.achetables || []).map(e =>
		`<div class="sh-skill">
			<span class="sh-skill-icon">🔓</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${e.ecole}</div>
				<div class="sh-skill-desc">Débloquer la pratique de cette magie</div>
			</div>
			<div class="sh-inv-actions">
				<button type="button" class="sh-drop-btn" onclick="apprendreMagie('${e.ecole}', this)" ${_attributePoints >= e.cout ? '' : 'disabled'}>Pratiquer (${e.cout} pts)</button>
			</div>
		</div>`
	).join('');
	box.innerHTML = (prat || '') + (achet || '')
		|| '<div class="sh-empty"><span class="sh-empty-icon">🏫</span>Aucune école de magie.</div>';
}

function _syncPoints(pts) {
	_attributePoints = pts;
	const a = document.getElementById('sh-attribute-points'); if (a) a.textContent = pts;
	const b = document.getElementById('sh-comp-points');      if (b) b.textContent = pts;
	// ⚠️ Les points sont une BOURSE COMMUNE aux caracts, à la vocation, aux sorts, aux
	// écoles et aux compétences : DÉPENSER D'UN CÔTÉ CHANGE CE QUI EST OFFERT DE L'AUTRE.
	// `_syncPoints` est donc le chokepoint unique de « les points ont bougé » et rafraîchit
	// TOUS les boutons qui s'en gardent — sinon l'onglet ⚔ (bouton d'XP, ✦ Dépasser, montée
	// de vocation) et les listes d'apprentissage restent tels quels jusqu'au prochain /play
	// et proposent une dépense que le serveur refusera.
	if (a) _refreshStatBoxes();
	// Pastille du pied de page : les points appartiennent à celui dont la fiche est ouverte
	// (chokepoint `_acteur` côté serveur — en mode compagnon, c'est SON doc qui a été débité).
	// ⚠️ On ne touche PAS `_pointsCompagnons` ici : dépenser les points d'un compagnon ne dit
	// rien de ce qu'il reste aux autres. `closeCompagnonSheet` refait un GET api/groupe, qui
	// repasse par `renderGroupe` — seul writer de la pastille 👥.
	if (_compagnonActif) _compagnonActif.attribute_points = pts;
	else                 _pointsPrincipal = pts;
	_majIndicateursPoints();
	// Les trois renderers gardent leur liste en cache : sans argument ils re-rendent l'état
	// courant, seul le `disabled` des boutons change.
	_renderSortsApprenables();
	_renderSortsMagies();
	_renderCompetencesApprenables();
}

async function apprendreMagie(ecole, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_magie', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ ecole }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSortsMagies(data.sorts_magies);
		_renderSortsApprenables(data.apprenables);
		showToast(`🔓 École ${ecole} : pratique débloquée !`);
	} catch(err) { console.error('Erreur apprendre_magie', err); if (btn) btn.disabled = false; }
}

async function monterMagie(ecole, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/monter_magie', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ ecole }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSortsMagies(data.sorts_magies);
		_renderSortsApprenables(data.apprenables);
		showToast(`✨ ${ecole} : niveau ${data.ecole.niveau}`);
	} catch(err) { console.error('Erreur monter_magie', err); if (btn) btn.disabled = false; }
}

async function apprendreSort(sortId, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_sort', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ sort_id: sortId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSorts(data.sorts);
		_renderSortsApprenables(data.apprenables);
		if (data.sorts_magies) _renderSortsMagies(data.sorts_magies);
		const a = data.appris || {};
		showToast(`${a.icon || '🔮'} ${a.nom || 'Sort'} appris !`);
	} catch(err) { console.error('Erreur apprentissage', err); if (btn) btn.disabled = false; }
}

// ── Compétences (onglet ⚡) ───────────────────────────────────────────
// Miroir des sorts : connues (passives = bonus permanent, actives = bouton Utiliser si
// utilisable hors combat) + apprenables (coût en points, niveau de vocation). Rendues
// client, resynchronisées par les réponses de utiliser_competence / apprendre_competence.
let _competences            = {{ competences | tojson | safe }};
let _competencesApprenables = {{ competences_apprenables | tojson | safe }};

function _renderCompetences(list) {
	if (Array.isArray(list)) _competences = list;
	const box = document.getElementById('sh-competences-connues');
	if (!box) return;

		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">⚡</span>Aucune compétence apprise.</div>';
		return;
	}
	box.innerHTML = _competences.map(c => {
		// Une passive n'a ni action ni case de barre : son bonus est permanent (inclus
		// dans les dérivées), il n'y a rien à déclencher.
		const pin = c.mode === 'active' ? _slotSelect('competence', c.competence_id) : '';
		const actions = c.mode === 'passive'
			? '<span class="sh-skill-lvl" title="Bonus permanent, déjà inclus dans vos caractéristiques">🛡 passive</span>'
			: pin + (c.utilisable
				? `<button type="button" class="sh-drop-btn" onclick="utiliserCompetence('${c.competence_id}', this)">Utiliser</button>`
				: '<span class="sh-skill-lvl" title="Utilisable en combat seulement">⚔ combat</span>');
		const pm = c.cout_pm ? `<span class="sh-sort-pm">${c.cout_pm} PM</span>` : '';
		let portee = '';
		if (c.mode === 'active' && c.cible === 'ennemi') portee = ` · portée ${c.portee}`;
		else if (c.mode === 'active' && c.cible === 'allie') portee = ' · 🤝 sur un allié';
		// Frappe de contact : ses dés s'ajoutent à ceux de l'arme équipée.
		const arme = c.mode === 'active' && c.cible === 'ennemi' && c.jet === 'cc' && c.effets && c.effets.degats;
		const armeTitre = arme ? ' title="Ces dés s\'ajoutent aux dégâts de votre arme"' : '';

	}).join('');

async function utiliserCompetence(competenceId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	const c = (_competences || []).find(x => x.competence_id === competenceId);
	// Compétence d'entraide : miroir exact de lancerSort (cible demandée avant l'envoi).
	let cible_id = null;
	if (c && c.cible === 'allie') {
		cible_id = await demanderCibleAllie(`${c.icon || '⚡'} ${c.nom} — sur qui ?`);
		if (!cible_id) { if (btn) btn.disabled = false; return; }
	}
	try {
		const res = await fetch('api/utiliser_competence', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ competence_id: competenceId, cible_id }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		_renderCompetences(data.competences);
		const u = data.utilisee || {};
		_appliquerVitauxCible(u);
		const gains = [];
		if (u.pv_rendu) gains.push(`+${u.pv_rendu} PV`);
		if (u.pm_rendu > 0) gains.push(`+${u.pm_rendu} PM`);
		if (u.effet) gains.push(`effet actif ${u.effet.restants} tours`);
		const sur = u.cible_nom ? ` sur ${u.cible_nom}` : '';
		showToast(`${u.icon || '⚡'} ${u.nom || 'Compétence utilisée'}${sur}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur compétence', err); if (btn) btn.disabled = false; }
}

async function apprendreCompetence(competenceId, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_competence', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ competence_id: competenceId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderCompetences(data.competences);
		_renderCompetencesApprenables(data.competences_apprenables);
		_renderCaractsMod(data.caracts_detail);
		// Une passive apprise relève les dérivées (donc les max PV/PM) immédiatement — celles
		// du PORTEUR : la fiche peut être ouverte sur un compagnon, qui apprend pour lui-même.
		if (data.vitals) updateVitals(data.vitals, porteurActifId());
		const a = data.appris || {};
		showToast(`${a.icon || '⚡'} ${a.nom || 'Compétence'} apprise !`);
	} catch(err) { console.error('Erreur apprentissage compétence', err); if (btn) btn.disabled = false; }
}

// ── Vente au marchand ────────────────────────────────────────────────
function formatPrix(prix) {
	const parts = [];
	if (prix.or)     parts.push(prix.or + ' or');
	if (prix.argent) parts.push(prix.argent + ' ar');
	if (prix.cuivre) parts.push(prix.cuivre + ' cu');
	return parts.length ? parts.join(' ') : '0 cu';
}

// « Vendu : X (3 ar) · 🤝 fidélité +1 (relation 42) » — une vente et son bonus de fidélité
// sont UN événement : on suffixe plutôt que d'empiler deux bulles.
function _fideliteSuffixe(data) {
	const f = data && data.fidelite;
	return (f && f.gain) ? ' · 🤝 fidélité +1 (relation ' + f.relation + ')' : '';
}

function updatePurse(purse) {
	if (!purse) return;
	const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
	set('amt-or', purse.or);       set('sell-amt-or', purse.or);
	set('amt-argent', purse.argent); set('sell-amt-argent', purse.argent);
	set('amt-cuivre', purse.cuivre); set('sell-amt-cuivre', purse.cuivre);
}

// État relation/blocage du marchand courant. `blocDeadline` = horloge client absolue
// (on convertit `bloque_jusqu`−`now` serveur en délai relatif pour éviter les décalages).
let MARCHAND = { relation: 50, blocDeadline: 0 };

function isMarchBlocked()  { return MARCHAND.blocDeadline > Date.now(); }
function blocRemainingMin(){ return Math.max(1, Math.ceil((MARCHAND.blocDeadline - Date.now()) / 60000)); }

function setMarchandState(data) {
	if (typeof data.relation === 'number') MARCHAND.relation = data.relation;
	if (typeof data.bloque_jusqu === 'number') {
		const now = (typeof data.now === 'number') ? data.now : Math.floor(Date.now() / 1000);
		const remaining = Math.max(0, data.bloque_jusqu - now);
		MARCHAND.blocDeadline = remaining > 0 ? Date.now() + remaining * 1000 : 0;
	}
	updateRelationBadge();
	if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
}

// Onglet 🤝 Relations : rendu client de TOUS les lieux connus, regroupés par ville
// (lieu_parent → lieu categorie:"ville") en accordéon. Alimenté par RELATIONS_LIEUX_INIT
// à l'init et resynchronisé par les SEULS endpoints qui font bouger une relation
// (gain de fidélité, CRIT de marchandage, dialogue PNJ, course échue) — `quotes` ne mute
// rien et ne porte donc plus ce payload, qui relit tous les docs relation + lieu. La ville
// ouverte est retenue par personnage dans localStorage.
function relLieuLabel(v) {
	if (v <= 0)  return 'Banni';
	if (v < 35)  return 'Hostile';
	if (v < 50)  return 'Méfiant';
	if (v === 50) return 'Neutre';
	if (v < 70)  return 'Cordial';
	if (v < 90)  return 'Estimé';
	return 'Honoré';
}

const REL_AUTRES_ID = '__autres__';
function _relOpenKey() { return 'telluris.play.rel_ville_open.' + (typeof REL_CHAR_ID !== 'undefined' ? REL_CHAR_ID : ''); }
function _relLoadOpen() { try { return localStorage.getItem(_relOpenKey()) || ''; } catch (e) { return ''; } }
function _relSaveOpen(id) { try { if (id) localStorage.setItem(_relOpenKey(), id); else localStorage.removeItem(_relOpenKey()); } catch (e) {} }

// Une ligne de lieu (réutilise le markup .sh-relation). Le filtre lit directement le
// texte de .sh-rel-name et .sh-rel-class.
function relLieuRow(r) {
	const v = r.value;
	const cls = v > 50 ? 'pos' : (v < 50 ? 'neg' : 'neu');
	const portrait = r.image
		? `<img src="/${r.image_route}/${r.image}" alt="" class="collapsed">`
		: false;
	return `<div class="sh-relation ${portrait ? "clickable" : ""}">
		${portrait ? "<div class=\"sh-rel-portrait\">"+portrait+"</div>" : ""}
		<div class="sh-rel-info">
			<div class="sh-rel-name"> ${portrait ? "》" : "" } ${r.nom}${r.bloque ? ' <span title="Marchandage bloqué">🚫</span>' : ''}</div>
			<div class="sh-rel-class">${r.categorie || ''}</div>
		</div>
		<div>
			<div class="sh-rel-score ${cls}">${v}<span style="opacity:.5;font-size:.7em">/100</span></div>
			<div class="sh-rel-lbl">${relLieuLabel(v)}</div>
		</div>
		<button class="sh-drop-btn${_focusEst('lieu', r.lieu_id) ? ' btn-highlight' : ''}" data-focus-key="lieu|${r.lieu_id}" onclick="focaliserLieu('${r.lieu_id}')" title="Retrouver ce lieu (guidage)">🧭</button>
	</div>`;
}

function renderFicheRelations(list) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box || !Array.isArray(list)) return;
	if (!list.length) { box.innerHTML = ''; return; }
	const empty = document.getElementById('sh-rel-empty');
	if (empty) empty.remove();

	// Groupement par ville. `own` = la ville elle-même si connue ; `children` = sous-lieux.
	const groups = new Map();
	function ensure(id, nom) {
		let g = groups.get(id);
		if (!g) { g = { id, nom: nom || '', own: null, children: [] }; groups.set(id, g); }
		else if (nom && !g.nom) g.nom = nom;
		return g;
	}
	list.forEach(r => {
		if (r.est_ville) {
			ensure(r.lieu_id, r.nom).own = r;
		} else if (r.lieu_parent) {
			ensure(r.lieu_parent, r.parent_nom).children.push(r);
		} else {
			ensure(REL_AUTRES_ID, 'Autres lieux').children.push(r);
		}
	});
	// Villes triées par nom, « Autres lieux » toujours en dernier.
	const villes = [...groups.values()].filter(g => g.id !== REL_AUTRES_ID)
		.sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
	const autres = groups.get(REL_AUTRES_ID);
	const ordered = autres ? [...villes, autres] : villes;

	const openId = _relLoadOpen();
	let html = '';
	html += ordered.map(g => {
		const children = g.children.slice().sort((a, b) => b.value - a.value);
		const count = children.length + (g.own ? 1 : 0);
		let headScore = '';
		if (g.own) {
			const v = g.own.value;
			const cls = v > 50 ? 'pos' : (v < 50 ? 'neg' : 'neu');
			headScore = `<span class="sh-ville-score ${cls}">${v}/100</span>`;
		}
		const rows = (g.own ? relLieuRow(g.own) : '') + children.map(relLieuRow).join('');
		const isOpen = (g.id === openId);
		return `<div class="sh-ville${isOpen ? ' open' : ''}" data-ville-id="${g.id}">
			<button type="button" class="sh-ville-head" onclick="toggleVilleGroup('${g.id}')">
				<span class="sh-ville-chevron">▶</span>
				<span class="sh-ville-title">${g.nom || g.id}</span>
				<span class="sh-ville-count">${count}</span>
				${headScore}
			</button>
			<div class="sh-ville-body">${rows}</div>
		</div>`;
	}).join('');
	box.innerHTML = html;

	// Ré-appliquer le filtre courant (le rendu remplace tout le HTML).
	const f = document.getElementById('sh-rel-filter');
	if (f && f.value.trim()) applyRelFilter(f.value);
}

// Accordéon : un seul groupe ouvert à la fois, mémorisé par personnage.
function toggleVilleGroup(id) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box) return;
	const target = box.querySelector('.sh-ville[data-ville-id="' + id + '"]');
	if (!target) return;
	const willOpen = !target.classList.contains('open');
	box.querySelectorAll('.sh-ville.open').forEach(el => el.classList.remove('open'));
	if (willOpen) { target.classList.add('open'); _relSaveOpen(id); }
	else { _relSaveOpen(''); }
}

// Filtre texte (nom de lieu, insensible à la casse). Les groupes correspondants sont
// auto-dépliés ; champ vidé → retour à l'état accordéon persistant.
function applyRelFilter(q) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box) return;
	const term = (q || '').trim().toLowerCase();
	const villes = box.querySelectorAll('.sh-ville');
	if (!term) {
		const openId = _relLoadOpen();
		villes.forEach(v => {
			v.classList.remove('hidden');
			v.querySelectorAll('.sh-relation').forEach(r => r.classList.remove('hidden'));
			v.classList.toggle('open', v.getAttribute('data-ville-id') === openId);
		});
		return;
	}
	villes.forEach(v => {
		const villeName = (v.querySelector('.sh-ville-title')?.textContent || '').toLowerCase();
		const villeMatches = villeName.includes(term);
		let anyMatch = false;
		v.querySelectorAll('.sh-relation').forEach(r => {
			const nm = (r.querySelector('.sh-rel-name')?.textContent || '').toLowerCase();
			const cl = (r.querySelector('.sh-rel-class')?.textContent || '').toLowerCase();
			const match = villeMatches || nm.includes(term) || cl.includes(term);
			r.classList.toggle('hidden', !match);
			if (match) anyMatch = true;
		});
		const show = anyMatch || villeMatches;
		v.classList.toggle('hidden', !show);
		v.classList.toggle('open', show);
	});
}

// ── Accordéon PARTAGÉ ────────────────────────────────────────────────────────────
// Brique commune au panneau 👥 Groupe et à l'onglet 📖 Journal : une seule section ouverte
// par accordéon, le choix mémorisé par personnage. Chaque section s'adresse par l'id de son
// EN-TÊTE (`acc-head-<id>`) ; c'est le PARENT (`.acc-section`) qui porte la classe `open`.
//
// ⚠️ `toggleVilleGroup` (accordéon des relations) reste DÉLIBÉRÉMENT à part : chevron ▶ et
// rotation de 90°, pas de cadre, sections générées en JS (`data-ville-id`), et surtout une
// sémantique de mémorisation différente — il SUPPRIME sa clé quand rien n'est ouvert, là où
// celui-ci écrit ''. Les fusionner mélangerait deux conventions pour un gain cosmétique.
function _accLsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function _accLsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function _accAppliquer(ids, ouverte) {
	(ids || []).forEach(s => {
		const tete = document.getElementById('acc-head-' + s);
		if (tete) tete.parentElement.classList.toggle('open', s === ouverte);
	});
}

function toggleAccordeon(ids, id, cle) {
	const tete = document.getElementById('acc-head-' + id);
	if (!tete) return;
	const ouvrir = !tete.parentElement.classList.contains('open');
	_accAppliquer(ids, ouvrir ? id : '');
	if (cle) _accLsSet(cle, ouvrir ? id : '');
}

// ⚠️ `defaut` ne s'applique QUE si rien n'a jamais été mémorisé (`null`) : une chaîne vide
// est un choix explicite du joueur — « tout replié » —, et le rouvrir serait le contredire.
function _accRestaurer(ids, cle, defaut) {
	const ouverte = cle ? _accLsGet(cle) : null;
	_accAppliquer(ids, ouverte === null ? defaut : ouverte);
}

// ── Onglet 📖 Journal ────────────────────────────────────────────────────────────
// Le CARNET du personnage (ce qu'il écrit) et son BESTIAIRE (ce qu'il a croisé).
// ⚠️ Ici « journal » = un carnet, PAS un log — le mot désigne partout ailleurs dans le
// projet le journal de combat.
// Rendu 100 % client, patron renderFicheRelations : payload JOURNAL_INIT à l'init, puis
// resync par la réponse de POST /api/journal (Convention §10).
const JOURNAL_INIT = {{ (journal or {}) | tojson | safe }};
const JNL_SECTIONS = ['carnet', 'bestiaire'];
const JNL_SECTION_KEY = 'telluris.play.journal_section.' + REL_CHAR_ID;
let _jnlEtat = null;

// Fournitures + état du bouton : UNE seule fonction pour les deux, comme `_aubMajEcriture`.
// C'est le même relevé qui décide de ce qu'on affiche et de ce qu'on autorise — les séparer
// laisserait le bouton actif au-dessus d'une ligne barrée.
// ⚠️ Le serveur reste seul juge : ce grisage est indicatif, le 422 est la vraie garde.
function _jnlMajEcriture() {
	const dispo = (_jnlEtat && _jnlEtat.fournitures) || {};
	const four = document.getElementById('jnl-fournitures');
	if (four) {
		// Le papier et l'encre PARTENT avec la page, la plume reste : on le dit avant le clic,
		// pas après. La distinction est déjà dans la donnée (`composant` vs `outil`).
		const noms = { papier: '📄 papier', encre: '🖊️ encre', plume_a_ecrire: '🪶 plume' };
		const consommee = { papier: true, encre: true };
		four.innerHTML = 'Pour écrire : ' + Object.keys(noms).map(k =>
			`<span class="aub-fourniture${dispo[k] ? '' : ' manque'}">${noms[k]}${consommee[k] ? ' <span class="aub-depense">(dépensé)</span>' : ''}</span>`
		).join(' · ');
	}
	const btn = document.getElementById('jnl-btn');
	if (btn) btn.disabled = !Object.keys(dispo).length || !Object.values(dispo).every(Boolean);
}

function _jnlReste() {
	const zone = document.getElementById('jnl-txt');
	const reste = document.getElementById('jnl-reste');
	if (!zone || !reste || !_jnlEtat) return;
	reste.textContent = `${zone.value.length}/${_jnlEtat.longueur_max}`;
}

// ⚠️ Lignes bâties en DOM (`createElement` + `textContent`) et non en template literal : le
// texte est saisi par le joueur, et `textContent` l'échappe sans qu'on ait à y penser
// (même chemin que les messages de taverne).
function _jnlEntreeNode(e) {
	const quand = new Date((e.cree_at || 0) * 1000).toLocaleString([], {
		day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
	});
	const ligne = document.createElement('div');
	ligne.className = 'sh-journal-entry';
	const tete = document.createElement('div');
	tete.className = 'sh-journal-date';
	tete.textContent = quand + (e.lieu ? ' · ' + e.lieu : '');
	const txt = document.createElement('div');
	txt.className = 'sh-journal-txt';
	txt.textContent = e.texte || '';
	ligne.appendChild(tete);
	ligne.appendChild(txt);
	return ligne;
}

function _jnlBestNode(b) {
	const ligne = document.createElement('div');
	ligne.className = 'jnl-best';
	const img = document.createElement('div');
	img.className = 'jnl-best-img';
	// ⚠️ Mount `/monsters` (comme les jetons de combat et les offres d'étable) : le serveur
	// publie un nom de fichier nu, jamais un chemin.
	if (b.image) img.style.backgroundImage = `url('/monsters/${encodeURIComponent(b.image)}')`;
	const corps = document.createElement('div');
	corps.className = 'jnl-best-corps';

	const nom = document.createElement('div');
	nom.className = 'jnl-best-nom';
	nom.textContent = b.nom || '?';
	const compte = document.createElement('span');
	compte.className = 'jnl-best-compte';
	// « rencontres » et « abattus » sont DEUX comptes : on entre au bestiaire pour avoir vu
	// la bête, pas pour l'avoir tuée.
	compte.textContent = ` · ${b.combats} rencontre${b.combats > 1 ? 's' : ''}`
		+ (b.tues ? `, ${b.tues} abattu${b.tues > 1 ? 's' : ''}` : '');
	nom.appendChild(compte);
	corps.appendChild(nom);

	if (b.description) {
		const d = document.createElement('div');
		d.className = 'jnl-best-desc';
		d.textContent = b.description;
		corps.appendChild(d);
	}
	if ((b.lieux || []).length) {
		const l = document.createElement('div');
		l.className = 'jnl-best-lieux';
		l.textContent = '📍 ' + b.lieux.join(', ');
		corps.appendChild(l);
	}
	if ((b.tags || []).length) {
		const tb = document.createElement('div');
		tb.className = 'jnl-best-tags';
		for (const t of b.tags) {
			const chip = document.createElement('span');
			chip.className = 'jnl-best-tag';
			chip.textContent = t;
			tb.appendChild(chip);
		}
		corps.appendChild(tb);
	}
	ligne.appendChild(img);
	ligne.appendChild(corps);
	return ligne;
}

function _jnlVide(icone, texte) {
	const box = document.createElement('div');
	box.className = 'sh-empty';
	const i = document.createElement('span');
	i.className = 'sh-empty-icon';
	i.textContent = icone;
	box.appendChild(i);
	box.appendChild(document.createTextNode(texte));
	return box;
}

function renderFicheJournal(data) {
	if (!data) return;
	_jnlEtat = data;

	const entrees = document.getElementById('jnl-entrees');
	if (entrees) {
		entrees.innerHTML = '';
		const liste = data.entrees || [];
		if (!liste.length) {
			entrees.appendChild(_jnlVide('📖', 'Le carnet est vierge.'));
		} else {
			// Le serveur les renvoie DÉJÀ de la plus récente à la plus ancienne : le client
			// ne réordonne rien (c'est l'ordre de lecture d'un carnet).
			for (const e of liste) entrees.appendChild(_jnlEntreeNode(e));
		}
	}

	const best = document.getElementById('jnl-bestiaire');
	if (best) {
		best.innerHTML = '';
		const liste = data.bestiaire || [];
		if (!liste.length) {
			best.appendChild(_jnlVide('🐾', "Aucune créature rencontrée pour l'instant."));
		} else {
			for (const b of liste) best.appendChild(_jnlBestNode(b));
		}
	}
	const compte = document.getElementById('jnl-best-compte');
	if (compte) compte.textContent = (data.bestiaire || []).length;

	_jnlMajEcriture();
	_jnlReste();
	// ⚠️ Ré-appliquer l'accordéon APRÈS le rendu, comme renderFicheRelations ré-applique son
	// filtre : le carnet ouvert par défaut, le joueur vient là pour écrire.
	_accRestaurer(JNL_SECTIONS, JNL_SECTION_KEY, 'carnet');
}

async function ecrireJournal() {
	const zone = document.getElementById('jnl-txt');
	if (!zone || !zone.value.trim()) return;
	const btn = document.getElementById('jnl-btn');
	if (btn) btn.disabled = true;          // une page ne s'écrit pas deux fois d'un double-clic
	try {
		const res = await fetch('api/journal', {
			method: 'POST', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ texte: zone.value }),
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		zone.value = '';
		renderFicheJournal(data);
		// Le papier et l'encre viennent d'être dépensés : sans ce resync, l'onglet 🎒
		// montrerait encore une feuille que le joueur n'a plus (Convention §10).
		if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
		showToast('🖋️ Consigné. (papier et encre dépensés)');
	} catch (err) {
		console.error('Erreur journal', err);
	} finally {
		// ⚠️ `_jnlMajEcriture` et non `disabled = false` : après une écriture réussie il ne
		// reste peut-être plus de papier, et le bouton doit alors RESTER grisé.
		_jnlMajEcriture();
	}
}

renderFicheJournal(JOURNAL_INIT);
document.addEventListener('input', e => {
	if (e.target && e.target.id === 'jnl-txt') _jnlReste();
});
(function () {
	const f = document.getElementById('sh-rel-filter');
	if (f) f.addEventListener('input', () => applyRelFilter(f.value));
})();

function updateRelationBadge() {
	const el = document.getElementById('sell-relation');
	if (!el) return;
	const r = MARCHAND.relation;
	if (r <= 0) {
		el.textContent = '🚫 Transactions fermées';
		el.classList.add('relation-bad');
		return;
	}
	el.classList.remove('relation-bad');
	el.textContent = '🤝 Relation : ' + r + (isMarchBlocked() ? ' · marchandage bloqué (~' + blocRemainingMin() + ' min)' : '');
}

// Sérialise l'id du PORTEUR en argument d'onclick — compagnon (`'aventurier:xxx'`) ou
// monture (`'monture:xxx'`) —, ou le littéral null (objet du personnage principal).
function _cgArg(id) { return id ? `'${id}'` : 'null'; }

function marchBtn(index, itemId, sens, compagnonId) {
	const idxArg = (index === null || index === undefined) ? 'null' : index;
	return `<button class="sh-marchander-btn" ${isMarchBlocked() ? 'disabled' : ''} onclick="marchanderItem(${idxArg},'${itemId}','${sens}',${_cgArg(compagnonId)},this)" title="Marchander">🤝</button>`;
}

// Tri par nom + scroll : même pattern que le sac/le sol (_sortedOrder rend un ordre
// d'AFFICHAGE seulement — chaque entrée porte son index/item_id d'origine). Les listes
// sont mémorisées sur MARCHAND pour re-rendre au clic de tri sans re-fetch.
let _sellSort = _loadSort('telluris.play.sell_sort');
let _buySort  = _loadSort('telluris.play.buy_sort');
function cycleSellSort() { _sellSort = _cycleSort(_sellSort); _saveSort('telluris.play.sell_sort', _sellSort); renderSellList({ vendables: MARCHAND.vendables }); }
function cycleBuySort()  { _buySort  = _cycleSort(_buySort);  _saveSort('telluris.play.buy_sort',  _buySort);  renderBuyList({ achetables: MARCHAND.achetables }); }

function renderSellList(data) {
	const list = document.getElementById('sell-list');
	const scrollEl = document.getElementById('sell-scroll');
	const vendables = MARCHAND.vendables = data.vendables || [];
	_updateSortBtn('sell-sort-btn', _sellSort);
	if (!vendables.length) {
		list.innerHTML = '<li class="sell-empty">Rien à vendre ici.</li>';
		if (scrollEl) scrollEl.classList.remove('scrollable');
		return;
	}
	list.innerHTML = _sortedOrder(vendables, _sellSort).map(idx => {
		const v = vendables[idx];
		const owner = v.compagnon_id ? `<span class="sell-owner" title="Objet de ${v.porteur_nom}">${v.porteur_icon || '👤'} ${v.porteur_nom}</span>` : '';
		return `<li class="sh-inv-item">
		<span class="sh-inv-open" onclick="openMarchandDetail('vente',${idx})" title="Voir la fiche">${v.icon || '📦'}</span>
		<span class="sh-inv-name sh-inv-open" onclick="openMarchandDetail('vente',${idx})" title="Voir la fiche">${v.nom || '—'}${owner}</span>
		<span class="sh-inv-poids">${(+v.poids).toFixed(1)} kg</span>
		<span class="sell-prix">${v.negocie ? '🤝 ' : ''}${formatPrix(v.prix)}</span>
		<span class="sh-inv-actions">
			<button class="sh-drop-btn" onclick="sellItem(${v.index},'${v.item_id}',${_cgArg(v.compagnon_id)},this)" title="Vendre">Vendre</button>
			${marchBtn(v.index, v.item_id, 'vente', v.compagnon_id)}
		</span>
	</li>`;
	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', vendables.length > INV_VISIBLE);
}

function renderBuyList(data) {
	const list = document.getElementById('buy-list');
	if (!list) return;
	const scrollEl = document.getElementById('buy-scroll');
	const achetables = MARCHAND.achetables = data.achetables || [];
	_updateSortBtn('buy-sort-btn', _buySort);
	if (!achetables.length) {
		list.innerHTML = '<li class="sell-empty">Rien à acheter ici.</li>';
		if (scrollEl) scrollEl.classList.remove('scrollable');
		return;
	}
	list.innerHTML = _sortedOrder(achetables, _buySort).map(idx => {
		const v = achetables[idx];
		return `<li class="sh-inv-item">
		<span class="sh-inv-open" onclick="openMarchandDetail('achat',${idx})" title="Voir la fiche">${v.icon || '📦'}</span>
		<span class="sh-inv-name sh-inv-open" onclick="openMarchandDetail('achat',${idx})" title="Voir la fiche">${v.nom || '—'} ×${v.qty}</span>
		<span class="sh-inv-poids">${(+v.poids).toFixed(1)} kg</span>
		<span class="sell-prix">${v.negocie ? '🤝 ' : ''}${formatPrix(v.prix)}</span>
		<span class="sh-inv-actions">
			<button class="sh-drop-btn" onclick="buyItem('${v.item_id}',this)" title="Acheter">Acheter</button>
			${marchBtn(null, v.item_id, 'achat')}
		</span>
	</li>`;
	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', achetables.length > INV_VISIBLE);
}

// Prix RÉELLEMENT appliqué après marchandage = celui affiché dans la liste re-rendue
// (`prix_marche` = négocié × facteur_stock, re-clampé), et non le prix de bande `prix_negocie`
// renvoyé par l'endpoint (qui ignore l'offre/demande) → le toast doit refléter la liste.
function _appliedMarchPrice(data, index, itemId, sens, compagnonId) {
	const list = sens === 'vente' ? (data.vendables || []) : (data.achetables || []);
	const cg = compagnonId || null;
	let e = null;
	if (sens === 'vente') e = list.find(v => v.index === index && v.item_id === itemId && (v.compagnon_id || null) === cg)
						   || list.find(v => v.item_id === itemId && (v.compagnon_id || null) === cg)
						   || list.find(v => v.item_id === itemId);
	else                  e = list.find(v => v.item_id === itemId);
	return e ? e.prix : null;
}

// Le groupe laisse parler son beau parleur (serveur : `_negociateur`). On ne le mentionne
// QUE si c'est un compagnon : le cas nominal — le joueur négocie lui-même — n'a rien à
// annoncer, et commenter chaque marchandage rendrait le toast bavard pour rien.
// ⚠️ Pas d'échappement ici : `showToast` écrit en textContent, pas en innerHTML — on
// n'échappe QUE là où l'on écrit du HTML (cf. escapeHtml, côté cartes de compagnon).
function _negoPrefixe(d) {
	const n = d.negociateur;
	return (n && n.compagnon) ? n.nom + ' négocie pour vous — ' : '';
}

function marchToast(d, applied) {
	const deal = d.deal || {};
	const par  = _negoPrefixe(d);
	if (d.crit === 'reussite') return par + 'Marchandage brillant ! Relation +1 (désormais ' + d.relation + ').';
	if (d.crit === 'echec')    return par + 'Marchandage désastreux ! Relation −1 (désormais ' + d.relation + '). Le marchand refuse de négocier pendant 1 h.';
	if (deal.succes)           return par + 'Marchandage réussi 🤝' + (applied ? ' — nouveau prix : ' + formatPrix(applied) : '');
	return par + 'Marchandage raté — prix inchangé.';
}

// ⚠️ `btn` est ici plus qu'un confort : deux jets partis d'un double-clic, ce sont deux
// chances de crit d'échec, donc de blocage du marchandage pendant une heure.
async function marchanderItem(index, itemId, sens, compagnonId, btn) {
	if (isMarchBlocked()) { showToast('Le marchand boude — revenez dans ~' + blocRemainingMin() + ' min.'); return; }
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const body = {index, item_id: itemId, sens};
		if (compagnonId) body.compagnon_id = compagnonId;
		const res  = await fetch('api/marchander', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		// Réactivé sur erreur SEULEMENT : le succès reconstruit la liste, donc le bouton.
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		showToast(marchToast(data, _appliedMarchPrice(data, index, itemId, sens, compagnonId)));
	} catch(err) { console.error('Erreur marchandage', err); if (btn) btn.disabled = false; }
}

// Le panneau est révélé AVANT le fetch : l'attendre laissait l'écran figé pendant tout
// l'aller-retour, sans le moindre retour visuel. Les deux listes affichent « Chargement… »
// puis sont remplacées par le rendu réel. `_sellLoading` couvre le double-clic sur 🏷️
// (le bouton, lui, disparaît avec `game-container`).
let _sellLoading = false;
function _sellChargement() {
	['sell-list', 'buy-list'].forEach(id => {
		const el = document.getElementById(id);
		if (el) el.innerHTML = '<li class="sell-empty">Chargement…</li>';
	});
	// Pas encore de liste à faire défiler : l'ombre de bas de cadre n'aurait rien à annoncer.
	['sell-scroll', 'buy-scroll'].forEach(id => {
		const el = document.getElementById(id);
		if (el) el.classList.remove('scrollable');
	});
	// La cote affichée est celle du marchand PRÉCÉDENT tant que `quotes` n'a pas répondu.
	const rel = document.getElementById('sell-relation');
	if (rel) { rel.classList.remove('relation-bad'); rel.textContent = '🤝 Relation : —'; }
}

async function openSellPanel() {
	if (_sellLoading) return;
	_sellLoading = true;
	_sellChargement();
	document.getElementById('game-container').classList.add('panel-hidden');
	document.getElementById('sell-panel').classList.remove('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'instant' });
	try {
		const res  = await fetch('api/marchand/quotes');
		const data = await res.json();
		// Le panneau est déjà ouvert : sur échec on le referme, comme quand il ne s'ouvrait pas.
		if (!res.ok) { showToast('Erreur : ' + data.detail); closeSellPanel(); return; }
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
	} catch(err) {
		console.error('Erreur quotes', err);
		showToast('Le marchand ne répond pas.');
		closeSellPanel();
	} finally { _sellLoading = false; }
}

function closeSellPanel() {
	// ⚠️ AVANT de retirer `panel-hidden` : le rendu différé écrit dans le sac / le sol /
	// la silhouette, qui redeviennent visibles juste après (cf. _renderInventaireDiffere).
	_viderRenduInventaireDiffere();
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('sell-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function sellItem(index, itemId, compagnonId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const body = {index, item_id: itemId};
		if (compagnonId) body.compagnon_id = compagnonId;
		const res  = await fetch('api/sell_item', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		// Réactivé sur erreur SEULEMENT : le succès reconstruit la liste, donc le bouton.
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		if (data.vendu) showToast('Vendu : ' + data.vendu.nom + ' (' + formatPrix(data.vendu.prix) + ')' + _fideliteSuffixe(data));
	} catch(err) { console.error('Erreur vente', err); if (btn) btn.disabled = false; }
}

async function buyItem(itemId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res  = await fetch('api/buy_item', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({item_id: itemId})
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		if (data.achete) showToast('Acheté : ' + data.achete.nom + ' (' + formatPrix(data.achete.prix) + ')' + _fideliteSuffixe(data));
	} catch(err) { console.error('Erreur achat', err); if (btn) btn.disabled = false; }
}

// ── Tableau des quêtes (guilde) ───────────────────────────────────────
// Reconstruit l'onglet 📜 de la fiche (rendu serveur au chargement) pour qu'il reflète
// accept/terminer sans recharger la page. Miroir du gabarit Jinja de #sh-quetes.
// ── Chronos des quêtes à délai réel (transport) ───────────────────────────────────
// Le serveur envoie `expire_at` ET son `now` : on en déduit une deadline LOCALE (l'horloge
// du navigateur peut dériver de celle du serveur — même précaution que le blocage de
// marchandage). Un seul intervalle pour tous les chronos, arrêté dès qu'il n'y en a plus.
let _questTimer = null;

// Une course dont le délai a expiré est soldée par le serveur au premier point de passage
// (rendu de la page, déplacement, dialogue) : on ne fait qu'en informer le joueur.
function _notifierTransportsEchoues(rep) {
	((rep && rep.transports_echoues) || []).forEach(q => {
		showToast('📦 Course échouée : ' + q.titre + ' — réputation en baisse.');
	});
}

// Escorte : la rencontre (on entre dans le 3×3 du rendez-vous) et la dépose (on franchit la
// porte de la destination) sont AUTOMATIQUES — aucune UI, aucun bouton : seul un toast dit
// au joueur ce qui vient de se produire.
// ⚠️ `showToast` écrit en textContent : rien à échapper ici (cf. règle XSS de CLAUDE.md).
// Le récap d'une dépose tient en UN message : arrivée, quête, puis les gains sur une ligne.
// Quatre `showToast` d'affilée n'en laissaient voir qu'un — le dernier, « +30 XP » —, donc
// jamais l'arrivée, qui est pourtant le paiement narratif de toute la quête.
// ⚠️ `d.relation` est la VALEUR de réputation après gain (`quetes.recompenser_lieux` renvoie
// les cotes, pas les deltas), d'où « réputation 53 » et non « +1 ».
function _escorteDeposeTexte(d) {
	const lignes = ['🛡️ ' + (d.noms || 'Votre protégé') + ' est de retour à bon port.'];
	if (d.titre) lignes.push(d.titre);
	const gains = [];
	const prime = formatPrix(d.purse || {});
	if (prime !== '0 cu') gains.push('💰 ' + prime);
	if (d.xp > 0) gains.push('✨ +' + d.xp + ' XP');
	if (typeof d.relation === 'number') gains.push('🤝 réputation ' + d.relation);
	if (gains.length) lignes.push('', gains.join('   '));
	if (d.niveau_up) lignes.push('🎉 Niveau atteint !');
	return lignes.join('\n');
}

function _notifierEscorte(esc) {
	if (!esc) return;
	// ⚠️ AUCUN accord de genre : `sex` est facultatif dans la donnée de progéniture et le
	// protégé peut être de l'un ou l'autre (même règle que les dialogues autour de {protege}).
	(esc.rencontres || []).forEach(r => {
		showToast('🛡️ ' + (r.noms || 'Votre protégé') + ' vous rejoint.\n'
			+ 'Ramenez cette personne vivante : ' + (r.titre || '—'));
	});
	if (esc.depose) showToast(_escorteDeposeTexte(esc.depose), {major: true});
}

function _deadlineLocale(expireAt, nowServeur) {
	const now = Number.isFinite(nowServeur) ? nowServeur : Math.floor(Date.now() / 1000);
	return Date.now() + Math.max(0, expireAt - now) * 1000;
}

function _questDeadlineAttr(q) {
	if (typeof q.expire_at !== 'number') return '';
	return ` data-deadline="${_deadlineLocale(q.expire_at, q.now)}"`;
}

function _fmtRestant(ms) {
	if (ms <= 0) return 'délai dépassé';
	const s = Math.ceil(ms / 1000);
	if (s < 60) return s + ' s';
	const m = Math.floor(s / 60);
	return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function _tickQuestTimers() {
	const spans = document.querySelectorAll('.sh-quest-timer[data-deadline]');
	if (!spans.length) { clearInterval(_questTimer); _questTimer = null; return; }
	spans.forEach(sp => {
		const reste = Number(sp.dataset.deadline) - Date.now();
		sp.textContent = '⏳ ' + _fmtRestant(reste);
		sp.classList.toggle('urgent', reste > 0 && reste < 5 * 60 * 1000);
		sp.classList.toggle('expire', reste <= 0);
	});
}

function _startQuestTimers() {
	// Chronos posés par le rendu Jinja initial : ils portent l'échéance et l'heure SERVEUR
	// et doivent être convertis en deadline locale, comme ceux du rendu client.
	document.querySelectorAll('.sh-quest-timer[data-expire]:not([data-deadline])').forEach(sp => {
		sp.dataset.deadline = _deadlineLocale(Number(sp.dataset.expire), Number(sp.dataset.now));
	});
	_tickQuestTimers();
	if (!_questTimer && document.querySelector('.sh-quest-timer[data-deadline]')) {
		_questTimer = setInterval(_tickQuestTimers, 1000);
	}
}

// Échappe une chaîne (souvent du JSON) pour l'insérer dans un attribut HTML entre
// apostrophes : le nom d'un lieu peut contenir une apostrophe (« L'Étal ») qui, non
// échappée, romprait `data-carte='…'`.
function _escAttr(s) {
	return String(s)
		.replace(/&/g, '&amp;').replace(/'/g, '&#39;')
		.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Carte QMAP_N×QMAP_N d'une quête de chasse : crop de l'image du lieu centré sur la case cible.
// La géométrie reprend celle de #bg-image (image décalée pour centrer une case) ; la case
// cible est centrée dans une fenêtre de N cases (N pair → centre entre 2 cases).
const QMAP_N = 9;
function showQuestMap(el) {
	let carte;
	try { carte = JSON.parse(el.dataset.carte); } catch (e) { return; }
	if (!carte || !carte.image || !carte.dimensions) return;
	const dims = carte.dimensions, pos = carte.position || {};
	const px = pos.x || 0, py = pos.y || 0;
	const view = document.getElementById('qmap-view');
	document.getElementById('qmap-title').textContent =
		`${carte.lieu_nom || 'Zone'}`;
	document.getElementById('qmap-dir').textContent = carte.direction_texte || '';
	view.innerHTML = '';
	view.style.width = view.style.height = '';
	const img = new Image();
	img.onload = () => {
		// Taille native MESURÉE dans le navigateur → px par case (les cases ne sont pas
		// forcément carrées : on garde l'aspect natif via une échelle unique).
		const cw = img.naturalWidth / (dims.x || 1);
		const ch = img.naturalHeight / (dims.y || 1);
		const TARGET = 270;                       // ~270 px pour le plus grand côté du 6×6 (2×)
		const scale = TARGET / (QMAP_N * Math.max(1, cw, ch));
		const cW = cw * scale, cH = ch * scale;
		// Décalage pour centrer le CENTRE de la case cible au centre de la fenêtre N×N.
		const off = QMAP_N / 2 - 0.5;             // 2.5 pour N=6
		view.style.width  = (QMAP_N * cW) + 'px';
		view.style.height = (QMAP_N * cH) + 'px';
		img.style.width  = (img.naturalWidth  * scale) + 'px';
		img.style.height = (img.naturalHeight * scale) + 'px';
		img.style.left = ((off - px) * cW) + 'px';
		img.style.top  = ((off - py) * cH) + 'px';
		view.appendChild(img);
		const marker = document.createElement('div');
		marker.className = 'qmap-marker';
		marker.textContent = '🎯';
		marker.style.left = (off * cW) + 'px';  marker.style.top = (off * cH) + 'px';
		marker.style.width = cW + 'px'; marker.style.height = cH + 'px';
		view.appendChild(marker);
	};
	img.onerror = () => { view.textContent = 'Carte indisponible.'; };
	img.src = `/${carte.image_route}/${carte.image}`;
	document.getElementById('quest-map-overlay').classList.remove('hidden');
}
function closeQuestMap() {
	document.getElementById('quest-map-overlay').classList.add('hidden');
}

function renderFicheQuetes(data) {
	const panel = document.getElementById('sh-quetes');
	if (!panel || !data || (!data.fiche_actives && !data.fiche_terminees)) return;
	// Resync focalisation : les réponses du tableau la portent (terminer/abandonner l'effacent).
	if ('focalisation' in data) {
		_focalisation = data.focalisation || null;
		if (!_focalisation) { _guidage = null; _refreshGuidage(); updateControls(); buildLocationslist(); }
		_syncFocusBtns();
	}
	const qa = data.fiche_actives || [];
	const qt = data.fiche_terminees || [];
	let html = '';
	if (qa.length) {
		html += '<div class="sh-section">📜 Actives</div>';
		// ⚠️ Double rendu : ce markup doit rester STRICTEMENT identique à celui de
		// l'onglet 📜 côté Jinja (wrapper .sh-scroll qui porte l'ombre + scroller).
		html += `<div class="sh-quest-list-active sh-scroll scrollable"><div class="sh-rel-scroll">`;
		// Plus récemment acceptée en premier ; slice() pour ne pas retourner la liste du payload.
		html += qa.slice().reverse().map(q => {
			const rang = q.rang || 'F';
			const rew = q.recompenses || {};
			let reward = '';
			if (rew.or)     reward += `<span>🟡 ${rew.or} or</span>`;
			if (rew.argent) reward += `<span>⚪ ${rew.argent} ar</span>`;
			if (rew.xp)     reward += `<span>✨ ${rew.xp} XP</span>`;
			const prog = q.progress_txt ? `<div class="sh-quest-progress">🎯 ${q.progress_txt}${q.complete ? ' ✓ prêt à rendre' : ''}</div>` : '';
			const timer = (typeof q.expire_at === 'number')
				? `<span class="sh-quest-timer"${_questDeadlineAttr(q)}></span>` : '';
			// 🎯 seulement là où la focalisation a un effet (pas sur une course de transport).
			const focusBtn = q.focalisable
				? `<button class="sh-drop-btn${_focusEst('quete', q.id) ? ' btn-highlight' : ''}" data-focus-key="quete|${q.id}" onclick="focaliserQuete('${q.id}')" title="Se focaliser sur cette quête (biaise les rencontres/récoltes)">🎯</button>`
				: '';
			// 🗺️ carte de la zone à explorer (quête de chasse localisée) : les données du crop
			// voyagent dans data-carte pour rester disponibles sans re-fetch.
			const mapBtn = q.carte
				? `<button class="sh-drop-btn" data-carte='${_escAttr(JSON.stringify(q.carte))}' onclick="showQuestMap(this)" title="Voir la zone à explorer sur la carte">Carte</button>`
				: '';
			return `<div class="sh-quest ${rang}">
				<div class="sh-quest-hdr">
					<span class="sh-quest-rang">${rang}</span>
					<span class="sh-quest-title">${q.titre || '—'}</span>
					<span class="sh-quest-status en-cours">En cours</span>
					${timer}
					<span class="sh-inv-actions">
						${mapBtn}
						${focusBtn}
						<button class="sh-drop-btn sh-abandon-btn" onclick="abandonnerQuete('${q.id}',this)" title="Abandonner la quête (perte de la progression)">✕ Abandonner</button>
					</span>
				</div>
				<div class="sh-quest-desc">${q.description || ''}</div>
				${prog}
				${reward ? `<div class="sh-quest-reward">${reward}</div>` : ''}
			</div>`;
		}).join('');
		html += `</div></div>`;
	}
	if (qt.length) {
		html += `<div class="sh-section" style="opacity:0.6">✓ Terminées (${qt.length})</div>`;
		html += `<div class="sh-quest-list-ended sh-scroll scrollable"><div class="sh-rel-scroll">`;
		// Plus récemment terminée en premier ; slice() pour ne pas retourner la liste du payload.
		html += qt.slice().reverse().map(q => {
			const rang = q.rang || 'F';
			return `<div class="sh-quest ${rang}" style="opacity:0.5">
				<div class="sh-quest-hdr"><span class="sh-quest-rang">${rang}</span><span class="sh-quest-title">${q.titre || '—'}</span><span class="sh-quest-status termine">Terminée</span></div>
			</div>`;
		}).join('');
		html += `</div></div>`;
	}
	if (!qa.length && !qt.length) {
		html = '<div class="sh-empty"><span class="sh-empty-icon">📜</span>Aucune quête en cours.</div>';
	}
	panel.innerHTML = html;
	_startQuestTimers();
}

// Init des chronos — DOIT rester après les `let` ci-dessus : appelé plus haut dans le script,
// il lèverait une ReferenceError (zone morte temporelle) qui interromprait tout le reste des
// déclarations de haut niveau (dialogue PNJ, panneau de vente…).

_notifierTransportsEchoues({ transports_echoues: {{ transports_echoues | tojson | safe }} });
// Course expirée pendant un changement de lieu : le toast a été mis de côté avant le reload.
(function () {

	if (!differe) return;
	sessionStorage.removeItem('transports_echoues_notif');

})();
// Escorte rejointe / déposée pendant un changement de lieu : le toast a été mis de côté
// avant le reload (même patron que ci-dessus et qu'`intro_fin_notif`).
(function () {
	const differe = sessionStorage.getItem('escorte_notif');
	if (!differe) return;
	sessionStorage.removeItem('escorte_notif');
	try { _notifierEscorte(JSON.parse(differe)); } catch (e) {}
})();

function renderQuetesActives(data) {
	const list = document.getElementById('quetes-actives-list');
	if (!list) return;
	const actives = data.actives || [];
	if (!actives.length) { list.innerHTML = '<li class="sell-empty">Aucune quête en cours ici.</li>'; return; }
	list.innerHTML = actives.map(q => `<li class="sh-inv-item">
		<span>
			<strong>${q.titre}</strong><br>
			<span class="sh-inv-poids">🎯 ${q.progress_txt}</span>
			<span class="sell-prix">✨ ${q.recompenses.xp} XP · ${formatPrix(q.recompenses)}</span>
		</span>
		${q.focalisable ? `<button class="sh-drop-btn${_focusEst('quete', q.id) ? ' btn-highlight' : ''}" data-focus-key="quete|${q.id}" onclick="focaliserQuete('${q.id}')" title="Se focaliser sur cette quête (biaise les rencontres/récoltes)">🎯</button>` : ''}
		${(q.objectif && q.objectif.type === 'collect' && !q.complete) ? `<button class="sh-drop-btn" onclick="deposerQuete('${q.id}',this)" title="Déposer les pièces portées (en plusieurs voyages si besoin)">📥 Déposer</button>` : ''}
		<button class="sh-drop-btn quest-done-btn" ${q.complete ? '' : 'disabled'} onclick="terminerQuete('${q.id}',this)" title="Terminer la quête">${q.complete ? 'Terminer' : 'En cours'}</button>
		<button class="sh-drop-btn sh-abandon-btn" onclick="abandonnerQuete('${q.id}',this)" title="Abandonner la quête (perte de la progression)">✕ Abandonner</button>
	</li>`).join('');
}

function renderQuetesOffres(data) {
	const list = document.getElementById('quetes-offres-list');
	if (!list) return;
	const offres = data.offres || [];
	if (!offres.length) { list.innerHTML = '<li class="sell-empty">Aucune offre pour le moment.</li>'; return; }
	list.innerHTML = offres.map(o => `<li class="sh-inv-item">
		<span>
			<strong>${o.titre}</strong>${o.source === 'authoree' ? ' 📌' : ''}<br>
			<span class="q-desc">${o.description}</span>
			<span class="sell-prix">✨ ${o.recompenses.xp} XP · ${formatPrix(o.recompenses)}</span>
		</span>
		<button class="sh-drop-btn" onclick="accepterQuete('${o.id}',this)" title="Accepter la quête">Accepter</button>

// Le panneau est révélé AVANT le fetch : l'attendre laissait l'écran figé pendant tout
// l'aller-retour, sans le moindre retour visuel (même défaut, même correctif que
// `openSellPanel`). `_quetesLoading` couvre le double-clic sur 📜 — le bouton, lui,
// disparaît avec `game-container`.
let _quetesLoading = false;
function _quetesChargement() {
	['quetes-actives-list', 'quetes-offres-list'].forEach(id => {
		const el = document.getElementById(id);
		if (el) el.innerHTML = '<li class="sell-empty">Chargement…</li>';
	});
}

async function openQuetesBoard() {
	if (_quetesLoading) return;
	_quetesLoading = true;
	_quetesChargement();
	document.getElementById('game-container').classList.add('panel-hidden');
	document.getElementById('quetes-panel').classList.remove('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'instant' });
	try {
		const res = await fetch('api/quetes/board');
		const data = await res.json();
		// Le panneau est déjà ouvert : sur échec on le referme, comme quand il ne s'ouvrait pas.
		if (!res.ok) { showToast('Erreur : ' + data.detail); closeQuetesPanel(); return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
	} catch(err) {
		console.error('Erreur tableau de quêtes', err);
		showToast('Le tableau des quêtes ne répond pas.');
		closeQuetesPanel();
	} finally { _quetesLoading = false; }
}

function closeQuetesPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('quetes-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function accepterQuete(queteId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/quetes/accepter', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		// Réactivé sur erreur SEULEMENT : le succès reconstruit la liste, donc le bouton.
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.accepte) showToast('Quête acceptée : ' + data.accepte.titre);
	} catch(err) { console.error('Erreur acceptation quête', err); if (btn) btn.disabled = false; }
}

async function terminerQuete(queteId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/quetes/terminer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.termine) {
			let msg = 'Quête terminée : ' + data.termine.titre + ' (+' + data.termine.xp + ' XP)';
			if (data.termine.niveau_up) msg += ' — Niveau supérieur !';
			msg += _xpCompagnieSuffixe(data.termine.xp_compagnie);
			showToast(msg);
			// Parts de butin des compagnons, prélevées sur le cuivre de la récompense.
			const pc = data.termine.parts_compagnons;
			if (pc) (pc.parts || []).forEach(p => {
				if (p.cuivre > 0) showToast('💰 ' + p.nom + ' prend sa part : ' + p.cuivre + ' cu');
			});
		}
		if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
