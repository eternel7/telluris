		// La réussite a monté la cote du donneur — l'onglet 🤝 est rendu 100 % client, sans ce
		// resync il resterait figé sur les valeurs du dernier chargement de /play.
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
	} catch(err) { console.error('Erreur fin de quête', err); if (btn) btn.disabled = false; }
}

// Abandon d'une quête active. Autorisé PARTOUT (backend assoupli) : depuis le tableau de la guilde
// OU l'onglet 📜 de la fiche. Hors guilde le payload est allégé (fiche + bourse + focalisation) ;
// renderQuetesActives/Offres sont alors des no-op (panneau guilde fermé, garde `if (!list) return`).
async function abandonnerQuete(queteId, btn) {
	if (!confirm('Abandonner cette quête ? La progression sera perdue.')) return;
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/quetes/abandonner', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		if (data.purse) updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);   // resync fiche + focalisation (via `'focalisation' in data`)
		// Renoncer fâche toute la maison du donneur : même resync que la réussite.
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
		showToast('Quête abandonnée' + (data.abandonne ? ' : ' + data.abandonne.titre : ''));
	} catch(err) { console.error('Erreur abandon de quête', err); if (btn) btn.disabled = false; }
}

async function deposerQuete(queteId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/quetes/deposer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);   // le dépôt a retiré des pièces du sac
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.depose) {
			showToast('Déposé : ' + data.depose.n + ' pièce(s)' + (data.depose.complete ? ' — objectif atteint, à terminer !' : ''));
		}
	} catch(err) { console.error('Erreur dépôt de quête', err); if (btn) btn.disabled = false; }
}

// ── Recrutement d'aventuriers (🤝) ──────────────────────────────────────────
// Panneau plein écran (clone structurel du tableau de quêtes). Le board exige la
// carte d'aventurier de la cité (403 explicite sinon → toast). Les affinités de
// l'onglet 🤝 sont resynchronisées par chaque réponse (renderFicheCompagnons).

function _affLabel(sc) {
	return sc >= 90 ? 'Dévoué' : sc >= 70 ? 'Ami' : sc >= 55 ? 'Bienveillant'
		: sc >= 45 ? 'Neutre' : sc >= 30 ? 'Méfiant' : sc >= 10 ? 'Hostile' : 'Ennemi';
}

// Tout le rendu client de cette page passe par des template literals dans `innerHTML` :
// une chaîne SAISIE PAR LE JOUEUR (le nom de sa compagnie, seule à ce jour) doit être
// échappée avant d'y être interpolée. Le serveur, lui, se contente de BORNER
// (`nettoyer_nom_compagnie`) — échapper des deux côtés doublerait l'échappement.
// ⚠️ JAMAIS dans un onclick="…('${x}')" : `'` devient &#39; et casse la chaîne JS.
// ⚠️ Inutile (et nuisible) pour showToast, qui écrit en textContent.
function escapeHtml(s) {
	return String(s == null ? '' : s).replace(/[&<>"']/g,
		c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

// Onglet 🤝 section 👥 : tous les compagnons CONNUS (mémo du perso), actifs d'abord.
function renderFicheCompagnons(list) {
	const box = document.getElementById('sh-rel-compagnons');
	const titre = document.getElementById('sh-rel-comp-titre');
	if (!box) return;
	if (!list || !list.length) {
		box.innerHTML = '';
		if (titre) titre.style.display = 'none';
		return;
	}
	if (titre) titre.style.display = '';
	box.innerHTML = list.map(r => {
		const sc = (r.affinite === null || r.affinite === undefined) ? 50 : r.affinite;
		const cls = sc > 50 ? 'pos' : sc < 50 ? 'neg' : 'neu';
		const part = (r.exigences_effectives || {}).part_butin_pct;
		// Un permanent ne prend rien : « part 0% » serait la bonne valeur mais la mauvaise
		// information — ce qui le caractérise, c'est son engagement (miroir de _piedCompagnon).
		const contrat = r.permanent ? ` · ✦ engagé`
			: (part !== undefined ? ` · part ${part}%` : '');
		// Vitaux : présents pour les compagnons ACTIFS seulement (le mémo d'un parti n'en porte pas).
		const vit = r.pv_max !== undefined
			? ` · ❤️ ${r.currentPV}/${r.pv_max} · 🔵 ${r.currentPM}/${r.pm_max}` : '';
		return `<div class="sh-relation">
			<strong>${r.actif ? '⚔' : '·'}</strong>
			<div class="sh-rel-info">
				<div class="sh-rel-name">${escapeHtml(r.prenom || '?')} ${escapeHtml(r.nom || '')}${r.actif ? ' <span style="opacity:.6;font-size:.75em">(dans le groupe)</span>' : ''}</div>
				<div class="sh-rel-class">${escapeHtml(r.voc || '')} · ${escapeHtml(r.race || '')} · rang ${escapeHtml(r.rang || 'F')}${contrat}${vit}</div>
			</div>
			<div>
				<div class="sh-rel-score ${cls}">${sc}<span style="opacity:.5;font-size:.7em">/100</span></div>
				<div class="sh-rel-lbl">${_affLabel(sc)}</div>
			</div>
			${r.actif ? `<button class="sh-drop-btn sh-abandon-btn" onclick="congedierAventurier('${r.id}', ${!!r.permanent})" title="${r.permanent ? 'Rompre l\'engagement' : 'Congédier ce compagnon'}">✕</button>` : ''}
			<div class="sh-rel-portrait">
				${r.image ? `<img src="/characters/${encodeURIComponent(r.image)}" alt="" class="collapsed compagnon-portrait">`
					: '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">👤</div>'}
			</div>
		</div>`;
	}).join('');
}

// ── Cartes de compagnons / recrues ──────────────────────────────────────────
// Le groupe et le board affichent les MÊMES personnages, avec la même carte que la fiche du
// joueur ; seuls le pied et les actions changent. Rien n'est écrit en HTML de carte ici : la
// macro Jinja reste la seule source du markup (cf. renderCharacterCard).

// Pied d'un compagnon : ce que la carte ne dit pas DÉJÀ — ses PV/PM sont dans ses barres et sa
// ligne de vitaux, inutile de les répéter. Restent le contrat (part de butin) et le lien (affinité).
// Nom de la compagnie du joueur — hors de portée de `_piedCompagnon`, qui ne reçoit qu'une
// carte. Une globale plutôt que de répéter la compagnie dans CHAQUE `_recrue_view` : elle
// appartient au joueur, pas à ses compagnons. Posée par tout payload qui la porte.
let _compagnieNom = {{ (compagnie.nom if compagnie else '') | tojson }};

function _majCompagnie(data) {
	if (data && 'compagnie' in data) _compagnieNom = (data.compagnie || {}).nom || '';
}

function _piedCompagnon(c) {
	const aff = (c.affinite === null || c.affinite === undefined) ? 50 : c.affinite;
	const part = (c.exigences_effectives || {}).part_butin_pct;
	// Un permanent ne prend RIEN : afficher « part 0% » serait la bonne valeur mais la
	// mauvaise information — ce qui le caractérise, c'est son appartenance à la compagnie.
	const contrat = c.permanent
		? `<span title="Engagé durablement : aucune part de butin">✦ ${escapeHtml(_compagnieNom || 'Compagnie')}</span>`
		: `<span>💰 part ${part}%</span>`;
	// ★ Points d'attribut non dépensés — MÊME symbole et MÊME vert (`.pts-dispo`) que la
	// pastille du bouton 👥, qui ne dit que « quelqu'un en a » : c'est ici, sur la carte,
	// qu'on apprend DE QUI il s'agit et combien. Rien à afficher quand il n'y a rien à
	// dépenser (contrairement aux pastilles des boutons, rendues en dur puis masquées :
	// une carte est reconstruite à chaque payload, il n'y a pas d'état à basculer).
	const pts = +(c.attribute_points || 0);
	const points = pts > 0
		? `<span class="pts-dispo" title="Points d'attribut à répartir">★ ${pts}</span>` : '';
	return points + contrat + `<span>🤝 ${aff} — ${_affLabel(aff)}</span>`;
}

// Prend la CARTE (et non un id) pour transporter `c.permanent` jusqu'à la confirmation :
// rompre un engagement durable ne se demande pas dans les mêmes termes qu'un congédiement.
function _btnCongedier(c) {
	const perm = !!c.permanent;
	return `<button class="sh-drop-btn sh-abandon-btn"
		onclick="congedierAventurier('${c.id}', ${perm})"
		title="${perm ? 'Rompre l\'engagement (blesse durablement)' : 'Congédier (le lien est conservé)'}"
		>${perm ? '✕ Rompre l\'engagement' : '✕ Congédier'}</button>`;
}

// Offert au seul compagnon assez DÉVOUÉ et pas encore engagé. ⚠️ `c.affinite` peut être
// `null` (valeur brute du payload) → repli sur le neutre 50, comme dans `_piedCompagnon` ;
// sans ce repli, la comparaison `null >= 90` serait fausse par accident et non par règle.
function _btnEngager(c, seuil) {
	const aff = (c.affinite === null || c.affinite === undefined) ? 50 : c.affinite;
	if (c.permanent || seuil === undefined || aff < seuil) return '';
	return `<button class="sh-drop-btn" onclick="ouvrirEngagement('${c.id}')"
		title="L'attacher durablement à votre compagnie">✦ Engager durablement</button>`;
}

// Places du plafond RÉELLEMENT prises : le serveur les compte (les permanents en sortent),
// le client ne fait que les lire. Repli sur `groupe.length` pour un payload d'avant la
// feature — le compteur reste juste tant qu'aucun compagnon n'est engagé.
function _placesOccupees(data) {
	return (data.places_occupees !== undefined && data.places_occupees !== null)
		? data.places_occupees : (data.groupe || []).length;
}

// Une liste de cartes de compagnons. `actions(c)` compose les boutons propres à l'endroit.
function _rendreCartesCompagnons(container, groupe, actions) {
	if (!container) return;
	clearCharacterCards(container);
	if (!groupe.length) {
		container.innerHTML = '<div class="sell-empty">Personne ne vous accompagne.</div>';
		return;
	}
	groupe.forEach(c => renderCharacterCard(container, c, {
		// Un compagnon du groupe est à nous : son cadrage est enregistrable (cf. _acteur).
		editable: true,
		footer: _piedCompagnon(c),
		actions: actions(c),
	}));
}

// Payload des recrues affichées (id → recrue), pour le dialogue de clauses : le bouton
// d'embauche ne transporte qu'un id, et il faut relire les exigences à l'ouverture.
// Repeuplé à CHAQUE rendu — une recrue disparue du tableau ne doit pas y survivre.
let _recEtat = {};

function renderRecrutement(data) {
	_majCompagnie(data);
	// ⚠️ `places_occupees` (serveur), jamais `groupe.length` : un compagnon engagé
	// durablement fait partie du groupe SANS occuper de place. Recompter ici afficherait
	// un plafond que le serveur n'applique pas — la liste et le garde doivent s'accorder.
	const places = _placesOccupees(data);
	const plafondEl = document.getElementById('rec-plafond');
	if (plafondEl) plafondEl.textContent = `${places}/${data.plafond}`;
	const full = places >= (data.plafond || 0);

	_rendreCartesCompagnons(document.getElementById('rec-groupe-list'), data.groupe || [],
		c => _btnCongedier(c));

	const rl = document.getElementById('rec-recrues-list');
	if (rl) {
		const recrues = data.recrues || [];
		_recEtat = {};
		clearCharacterCards(rl);
		if (!recrues.length) {
			rl.innerHTML = '<div class="sell-empty">Personne au tableau pour le moment.</div>';
		}
		recrues.forEach(r => {
			_recEtat[r.id] = r;
			const ex = r.exigences_effectives || {};
			const clauses = (ex.clauses || []).map(c => `<span class="q-desc">• ${c}</span>`).join('');
			const aff = (r.affinite !== null && r.affinite !== undefined)
				? `<span>🤝 ${r.affinite}${r.deja_connu ? ' (déjà connu)' : ''}</span>` : '';
			renderCharacterCard(rl, r, {
				// Recrue seulement OFFERTE : elle n'est pas dans le groupe, `_acteur` refuserait
				// d'enregistrer son cadrage (403) → pas d'éditeur de portrait sur sa carte.
				editable: false,
				footer: `<span class="q-desc">${r.specialite || ''}</span>`
					+ `<span class="sell-prix">💰 part de butin : ${ex.part_butin_pct} %</span>`
					+ aff + clauses,
				actions: `<button class="sh-drop-btn"
					${full ? 'disabled title="Votre groupe est au complet"'
						   : 'title="Entendre ses conditions — rien n\'est engagé avant votre réponse"'}
					onclick="demanderEmbauche('${r.id}')">Embaucher</button>`,
			});
		});
	}
	if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
	(data.departs || []).forEach(n => showToast('👋 ' + n + ' a quitté le groupe.'));
}

async function openRecrutementBoard() {
	try {
		const res = await fetch('api/recrutement/board');
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderRecrutement(data);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('recrutement-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch(err) { console.error('Erreur tableau de recrutement', err); }
}

function closeRecrutementPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('recrutement-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Étable : montures de transport ───────────────────────────────────────────────
// Panneau jumeau du tableau de recrutement, à deux différences près : on ACHÈTE (la bourse
// est le seul obstacle, il n'y a ni clause ni affinité), et le plafond est propre aux
// montures — elles ne prennent pas la place d'un compagnon.

function renderEtable(data) {
	const plafondEl = document.getElementById('mnt-plafond');
	const possedees = data.montures || [];
	if (plafondEl) plafondEl.textContent = `${possedees.length}/${data.plafond}`;
	const full = possedees.length >= (data.plafond || 0);
	const bourse = _purseEnCuivre(data.purse);

	_rendreCartesMontures(document.getElementById('mnt-possedees-list'), possedees,
		m => _btnRelacher(m));
	const vide = document.getElementById('mnt-possedees-list');
	if (vide && !possedees.length) {
		vide.innerHTML = '<div class="sell-empty">Vous ne menez aucune monture.</div>';
	}

	const ol = document.getElementById('mnt-offres-list');
	if (!ol) return;
	const offres = data.offres || [];
	if (!offres.length) {
		ol.innerHTML = '<div class="sell-empty">Aucune bête à vendre ici pour le moment.</div>';
		return;
	}
	ol.innerHTML = offres.map(o => {
		const trop = o.prix > bourse;
		const raison = full ? 'Vous ne pouvez pas mener davantage de montures'
					 : trop ? 'Vous n\'avez pas de quoi payer' : 'Acheter cette monture';
		return `<div class="mnt-offre">
			<img src="/monsters/${o.image}" alt="" class="mnt-offre-img">
			<div class="mnt-offre-txt">
				<strong>${o.nom}</strong>
				<span class="q-desc">${o.description || ''}</span>
				<span class="q-desc">🎒 porte ${o.charge_min} à ${o.charge_max} kg</span>
				<span class="sell-prix">💰 ${_prixTexte(o.prix)}</span>
			</div>
			<button class="sh-drop-btn" ${(full || trop) ? 'disabled' : ''} title="${raison}"
				onclick="acheterMonture('${o.espece}')">Acheter</button>
		</div>`;
	}).join('');
}

// La bourse arrive en {or, argent, cuivre} : le comparateur de prix travaille en cuivre.
function _purseEnCuivre(p) {
	p = p || {};
	return (+(p.or || 0)) * 10000 + (+(p.argent || 0)) * 100 + (+(p.cuivre || 0));
}

// Un prix de monture se compte en dizaines d'or : l'afficher en cuivre serait illisible.
function _prixTexte(cuivre) {
	cuivre = +(cuivre || 0);
	const or = Math.floor(cuivre / 10000);
	const argent = Math.floor((cuivre % 10000) / 100);
	const cu = cuivre % 100;
	return [or ? `${or} or` : '', argent ? `${argent} ar` : '', cu ? `${cu} cu` : '']
		.filter(Boolean).join(' ') || '0 cu';
}

async function openEtable() {
	try {
		const res = await fetch('api/montures/etable');
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderEtable(data);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('montures-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch (err) { console.error('Erreur étable', err); }
}

function closeEtable() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('montures-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function acheterMonture(espece) {
	try {
		const res = await fetch('api/montures/acheter', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ espece })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderEtable(data);
		showToast(`🐴 ${(data.achetee || {}).nom || 'Monture'} vous suit désormais.`);
	} catch (err) { console.error('Erreur achat de monture', err); }
}

async function relacherMonture(monture_id) {
	try {
		const res = await fetch('api/montures/relacher', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ monture_id })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		showToast(`👋 ${data.relachee} retrouve la liberté.`);
		// Le bouton vit dans DEUX panneaux : on rafraîchit celui qui est ouvert.
		if (!document.getElementById('montures-panel').classList.contains('panel-hidden')) {
			renderEtable(data);
		} else {
			openGroupe();
		}
	} catch (err) { console.error('Erreur relâchement', err); }
}

// ── Salle commune d'une taverne ──────────────────────────────────────────────────
// Tables (chatrooms) + tableau d'information + la nuit.
//
// ⚠️ SONDAGE et non WebSocket : `uvicorn` tourne sans `[standard]`, il n'y a pas de support
// WebSocket dans l'image, et un intervalle de 4 s suffit largement pour 10 messages par
// table. `_aubTimer` DOIT être arrêté à la fermeture, sinon le panneau continue d'interroger
// le serveur pour une salle qu'on a quittée.
//
// ⚠️ Tout ce qui vient d'un joueur (`texte`, `auteur_nom`) passe par escapeHtml avant
// d'entrer dans un innerHTML, et JAMAIS dans un onclick="…('${x}')" : les boutons adressent
// par data-id + délégation.
let _aubEtat = null;
let _aubTimer = null;
// Coût et log de la nuit, servis par /play : le bouton 🌙 vit dans la SIDEBAR et doit
// marcher sans qu'on ait jamais ouvert la salle commune. `_aubEtat` les reporte quand il
// existe (il est plus frais), mais il peut parfaitement être null.
const AUBERGE_NUIT = {{ (auberge_nuit or {}) | tojson }};
// Signature des messages DÉJÀ PEINTS, par table. C'est elle qui permet au sondage de ne
// rien réécrire tant que rien n'est arrivé : un message est immuable une fois posté, la
// liste de ses ids suffit donc à décrire l'état affiché.
let _aubSigs = new Map();
// Idem pour les ATTABLÉS. Deux signatures et non une : la conversation et la tête bougent
// séparément, et les fusionner ferait repeindre l'une chaque fois que l'autre change.
let _aubSigsOcc = new Map();
const AUB_PERIODE = 4000;

function _aubSigTable(t) {
	return (t.messages || []).map(m => m.id).join(',');
}

// Signature de la TÊTE, distincte de celle des messages : la tête et la conversation bougent
// indépendamment, et le sondage doit pouvoir repeindre l'une sans toucher l'autre.
// ⚠️ Elle couvre le COMPTEUR de messages autant que les noms : le même span porte les deux,
// et l'oublier figerait le « 3/10 » tant que personne ne s'assied ni ne se lève.
function _aubSigOcc(t) {
	return (t.noms || []).join('|') + '#' + t.occupants + '#' + (t.messages || []).length;
}

// Qui est attablé — source unique du libellé, lue par le rendu complet ET par le sondage.
// ⚠️ `escapeHtml` obligatoire : ce sont des noms saisis par des joueurs, et le libellé part en
// `innerHTML` (Convention §9).
//
// ⚠️ Le repli est PARTIEL, jamais tout-ou-rien : une table où un seul convive s'est assis avant
// que le champ `noms` n'existe a moins de noms que d'occupants, et jeter alors les noms CONNUS
// (ce que faisait la première version) rendait la tête muette pour tout le monde. On montre donc
// ce qu'on sait et l'on COMPTE le reste. Le serveur répare le sien à chaque ouverture de la
// salle (`rafraichir_mon_nom`), donc le « + N autre(s) » s'efface de lui-même.
function _aubOccupants(t) {
	const noms = (t.noms || []).map(escapeHtml);
	const inconnus = Math.max(0, (t.occupants || 0) - noms.length);
	if (!noms.length) return `${t.occupants} attablé(s)`;
	if (inconnus) noms.push(`+ ${inconnus} autre${inconnus > 1 ? 's' : ''}`);
	return noms.join(', ');
}

// ⚠️ Les lignes de message sont bâties en DOM (`createElement` + `textContent`), plus en
// template literal : `renderCharacterCard` APPEND une carte dans un conteneur, elle ne rend
// pas de chaîne. Bénéfice au passage — le texte et le nom d'un joueur n'ont plus besoin
// d'`escapeHtml` du tout, c'est le chemin que CLAUDE.md recommande pour un chat.
function _aubDiv(cls, texte) {
	const el = document.createElement('div');
	el.className = cls;
	if (texte !== undefined) el.textContent = texte;
	return el;
}

function _aubMsgVide(quoi) {
	return _aubDiv('aub-msg-vide', quoi || "Personne n'a encore rien dit ici.");
}

// Portrait de l'AUTEUR, cloné du gabarit `tpl-character-portrait` (rendu par la macro Jinja
// `cards.character_card` : le JS n'écrit jamais de markup de carte). `cadre: true` applique
// le cadrage que l'auteur s'est choisi — sans lui, la carte étant en lecture seule, on
// verrait sa silhouette entière. Sans image (message hérité), on retombe sur une silhouette.
function _aubPortrait(m) {
	const boite = _aubDiv('aub-msg-portrait');
	if (!m.auteur_image) {
		boite.appendChild(_aubDiv('aub-msg-anon', '👤'));
		return boite;
	}
	// ⚠️ AUCUN id d'auteur n'est transmis, et ce n'est pas un oubli : un `_id` de personnage
	// s'écrit `character:user:<email>_<uuid>` — le publier livrerait l'ADRESSE E-MAIL de
	// chaque joueur à toute la salle. Le serveur ne l'expose donc pas (il calcule `mien`
	// lui-même), et l'on efface ici le `data-porteur` que `_setCardIdentite` remplit sinon
	// avec PRINCIPAL_ID : cette carte n'appartient à personne qu'on ait le droit de nommer.
	const carte = renderCharacterCard(boite, {
		image: m.auteur_image,
		portrait_zoom: m.auteur_zoom,
		portrait_translate: m.auteur_translate,
	}, { tpl: 'tpl-character-portrait', editable: false, cadre: true });
	if (carte) carte.dataset.porteur = '';
	return boite;
}

function _aubMsgNode(m) {
	const quand = new Date((m.cree_at || 0) * 1000)
		.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
	const ligne = _aubDiv('aub-msg');
	ligne.appendChild(_aubPortrait(m));
	const corps = _aubDiv('aub-msg-corps');
	corps.appendChild(_aubDiv('aub-msg-tete', `${m.auteur_nom || '?'} · ${quand}`));
	corps.appendChild(_aubDiv('aub-msg-txt', m.texte || ''));
	ligne.appendChild(corps);
	return ligne;
}

// Peint une liste de messages dans un conteneur. ⚠️ `clearCharacterCards` et NON un simple
// `innerHTML = ''` : chaque portrait a inscrit son viewport dans `_cardViewports` (Map dont
// la CLÉ est la carte). Sans la purge, le sondage y accumulerait des cartes détachées pour
// toute la session, et le handler `resize` finirait par itérer sur des nœuds morts.
function _aubPeindreMessages(box, messages, vide) {
	if (!box) return;
	clearCharacterCards(box);
	if (!(messages || []).length) { box.appendChild(_aubMsgVide(vide)); return; }
	for (const m of messages) box.appendChild(_aubMsgNode(m));
}

// Le prix de la chambre s'affiche DANS le bouton de la sidebar : il doit être posé au
// chargement de la page, pas seulement à l'ouverture de la salle commune.
function _aubMajCoutNuit(cout) {
	const el = document.getElementById('aub-nuit-cout');
	if (el) el.textContent = cout ? `(${_prixTexte(cout)})` : '';
}
_aubMajCoutNuit(AUBERGE_NUIT.cout);

// Qui tient la plume — l'id du compagnon choisi, `''` pour le personnage principal (même
// convention que `compagnon_id`, absent ⇒ le principal). ⚠️ Mémorisé HORS de `_aubEtat` :
// `renderAuberge` est rejoué après chaque écriture et écraserait le choix du joueur, qui
// n'a aucune raison de repasser au principal parce que son compagnon vient de signer.
let _aubEcrivain = '';

// L'entrée d'écrivain choisie, avec repli sur la première (le principal). Le choix peut
// devenir caduc entre deux rendus — un compagnon congédié depuis un autre onglet, par
// exemple : on ne laisse alors pas le panneau pointer sur quelqu'un qui n'est plus là.
function _aubEcrivainCourant() {
	const liste = (_aubEtat && _aubEtat.ecrivains) || [];
	const choisi = liste.find(e => (e.id || '') === _aubEcrivain);
	if (!choisi && liste.length) _aubEcrivain = liste[0].id || '';
	return choisi || liste[0] || null;
}

// Fournitures de l'écrivain COURANT + état du bouton. ⚠️ Une seule fonction pour les deux :
// c'est le même relevé qui décide de ce qu'on affiche et de ce qu'on autorise — les séparer
// laisserait le bouton actif au-dessus d'une ligne barrée.
function _aubMajEcriture() {
	const qui = _aubEcrivainCourant();
	const four = document.getElementById('aub-fournitures');
	if (four) {
		// Le papier et l'encre PARTENT avec l'avis, la plume reste : on le dit avant le clic,
		// pas après. La plume est un `outil`, les deux autres des `composant` — l'affichage
		// ne fait que rendre visible une distinction qui est déjà dans la donnée.
		const noms = { papier: '📄 papier', encre: '🖊️ encre', plume_a_ecrire: '🪶 plume' };
		const consommee = { papier: true, encre: true };
		const dispo = (qui && qui.fournitures) || {};
		four.innerHTML = 'Pour écrire : ' + Object.keys(noms).map(k =>
			`<span class="aub-fourniture${dispo[k] ? '' : ' manque'}">${noms[k]}${consommee[k] ? ' <span class="aub-depense">(dépensé)</span>' : ''}</span>`
		).join(' · ');
	}
	const btnAnnonce = document.getElementById('aub-annonce-btn');
	if (btnAnnonce) btnAnnonce.disabled = !(qui && qui.peut_ecrire);
}

// Le sélecteur d'écrivain. ⚠️ Il n'est REBÂTI que si la liste a changé (nom, id, capacité
// à écrire) : le reconstruire à chaque rendu refermerait la liste déroulante sous le doigt
// du joueur, exactement comme le champ « Dire quelque chose… » que le sondage détruisait.
function _aubMajEcrivains(data) {
	const ligne = document.getElementById('aub-ecrivain-ligne');
	const sel = document.getElementById('aub-ecrivain');
	const liste = data.ecrivains || [];
	if (!ligne || !sel) return;
	// Seul à bord : rien à choisir, on ne montre pas la question.
	ligne.hidden = liste.length < 2;
	const sig = liste.map(e => `${e.id}${e.nom}${e.peut_ecrire ? 1 : 0}`).join('');
	if (sel.dataset.sig !== sig) {
		sel.dataset.sig = sig;
		// ⚠️ Construit en DOM et jamais en template literal : `nom` est saisi par le joueur
		// à la création de son personnage, et un `<option>` composé à la chaîne l'injecterait
		// tel quel (Convention §9 ; `textContent` échappe sans qu'on ait à y penser).
		sel.innerHTML = '';
		for (const e of liste) {
			const opt = document.createElement('option');
			opt.value = e.id || '';
			opt.textContent = e.nom + (e.peut_ecrire ? '' : ' — sans fournitures');
			sel.appendChild(opt);
		}
	}
	_aubEcrivainCourant();          // recale `_aubEcrivain` si le choix n'existe plus
	sel.value = _aubEcrivain;
}

function renderAuberge(data) {
	if (!data) return;
	_aubEtat = data;
	_aubMajCoutNuit(data.cout_nuit);
	const compte = document.getElementById('aub-tables-compte');
	// ⚠️ `tables_total` et non `tables.length` : les tables où ce personnage a dormi ne
	// lui sont plus montrées, mais elles occupent la salle tout de même.
	if (compte) compte.textContent = `${data.tables_total}/${data.tables_max}`;

	const liste = document.getElementById('aub-tables-list');
	if (liste) {
		const tables = data.tables || [];
		let html = tables.map(t => {
			const cls = 'aub-table' + (t.assis ? ' assis' : '');
			// Une table fermée ne l'est QUE pour ce personnage : il y a dormi. Les autres
			// convives la voient normalement — la soirée ne s'achève que pour le dormeur.
			// Une table où l'on a dormi n'arrive plus jusqu'ici : le serveur la retire de
			// la salle de CE personnage (`anciens`). Il n'y a donc plus d'état « fermée ».
			const bouton = t.assis
				? '<span class="aub-table-occ">vous y êtes</span>'
				: `<button class="sub-loc-btn" data-aub-table="${t.id}">S'y asseoir</button>`;
			const dire = t.assis ? `<div class="aub-dire">
					<input type="text" id="aub-dire-txt" maxlength="${data.annonce_max}"
						   placeholder="Dire quelque chose…">
					<button class="sub-loc-btn aub-dire-btn" data-aub-dire="1">Dire</button>
				</div>` : '';
			return `<div class="${cls}" data-table="${t.id}">
				<div class="aub-table-tete">
					<span class="aub-table-titre">🪑 Table ${t.numero}</span>
					<span class="aub-table-occ">${_aubOccupants(t)} · ${(t.messages || []).length}/${data.messages_max}</span>
					${bouton}
				</div>
				<div class="aub-msgs"></div>
				${dire}
			</div>`;
		}).join('');
		if (data.tables_total < data.tables_max) {
			html += `<div><button class="sub-loc-btn" data-aub-nouvelle="1">➕ Prendre une nouvelle table</button></div>`;
		}
		// ⚠️ Purger AVANT d'écraser : la liste porte les portraits, donc des viewports
		// inscrits dans `_cardViewports`. Un `innerHTML =` sec les y laisserait à jamais.
		clearCharacterCards(liste);
		liste.innerHTML = html;
		// La structure est posée avec des `.aub-msgs` VIDES ; les messages, eux, sont peints
		// en DOM (ils contiennent des cartes clonées, qu'aucune chaîne ne peut porter).
		for (const t of tables) {
			_aubPeindreMessages(liste.querySelector(`.aub-table[data-table="${t.id}"] .aub-msgs`),
								t.messages);
		}
		// Le rendu complet fait foi : on resème les signatures pour que le prochain sondage
		// n'ait rien à réécrire tant que personne n'a parlé.
		_aubSigs = new Map(tables.map(t => [t.id, _aubSigTable(t)]));
		_aubSigsOcc = new Map(tables.map(t => [t.id, _aubSigOcc(t)]));
	}

	// Qui signe, puis ce que CET écrivain a dans son sac : le second dépend du premier.
	_aubMajEcrivains(data);
	_aubMajEcriture();
	_aubReste();

	// Une annonce a un auteur comme un message de table : même ligne, même portrait. Purge
	// obligatoire ici aussi — ces portraits sont des cartes.
	const tab = document.getElementById('aub-tableau-list');
	if (tab) {
		clearCharacterCards(tab);
		if (!(data.tableau || []).length) {
			tab.appendChild(_aubMsgVide('Le tableau est nu.'));
		} else {
			for (const m of data.tableau) {
				const avis = _aubDiv('aub-annonce');
				const corps = _aubDiv('aub-annonce-corps');
				corps.appendChild(_aubMsgNode(m));
				avis.appendChild(corps);
				const btn = document.createElement('button');
				btn.className = 'sh-drop-btn';
				btn.title = 'Décrocher cet avis';
				btn.textContent = '✕';
				btn.setAttribute('data-aub-retirer', m.id);
				avis.appendChild(btn);
				tab.appendChild(avis);
			}
		}
	}
}

function _aubReste() {
	const zone = document.getElementById('aub-annonce-txt');
	const reste = document.getElementById('aub-annonce-reste');
	if (!zone || !reste || !_aubEtat) return;
	reste.textContent = `${zone.value.length}/${_aubEtat.annonce_max}`;
}

async function _aubFetch(url, body) {
	const opts = body === undefined ? {} : {
		method: 'POST', headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify(body)
	};
	const res = await fetch(url, opts);
	const data = await res.json();
	if (!res.ok) { showToast('Erreur : ' + data.detail); return null; }
	return data;
}

// ⚠️ Le sondage n'appelle JAMAIS `renderAuberge` : il n'écrit que dans DEUX zones précises —
// les `.aub-msgs` (la conversation) et le `.aub-table-occ` de tête (qui est attablé) —, et
// seulement pour les tables dont la signature correspondante a bougé. Tout le reste — champs
// de saisie, boutons, fournitures, bourse, tableau d'information — est laissé intact.
//
// Un rendu complet à chaque tour détruisait puis recréait le champ « Dire quelque chose… » :
// le joueur perdait sa phrase et son curseur toutes les 4 s. Le rattraper en recopiant le
// brouillon marchait, mais soignait le symptôme — le vrai remède est de ne pas toucher ce
// qui n'a pas changé. Corollaire assumé : une table OUVERTE par un autre joueur et une annonce
// épinglée n'apparaissent toujours qu'au prochain rendu complet (une action, ou la réouverture
// du panneau) ; la conversation et les convives, eux, sont bien en temps réel.
function _aubMajMessages(data) {
	for (const t of data.tables || []) {
		const carte = document.querySelector(`.aub-table[data-table="${t.id}"]`);
		if (!carte) continue;    // table pas encore peinte : au prochain rendu complet

		// La tête : ⚠️ le PREMIER `.aub-table-occ` seulement. La classe sert aussi au libellé
		// « vous y êtes », posé après lui dans la même tête — les réécrire tous l'effacerait.
		const sigOcc = _aubSigOcc(t);
		if (_aubSigsOcc.get(t.id) !== sigOcc) {
			const occ = carte.querySelector('.aub-table-occ');
			if (occ) {
				occ.innerHTML = `${_aubOccupants(t)} · ${(t.messages || []).length}/${data.messages_max}`;
				_aubSigsOcc.set(t.id, sigOcc);
			}
		}

		const sig = _aubSigTable(t);
		if (_aubSigs.get(t.id) === sig) continue;      // rien de neuf à cette table
		const box = carte.querySelector('.aub-msgs');
		if (!box) continue;
		// « Déjà en bas » se mesure AVANT d'écrire. On ne rattrape le fil que si le joueur y
		// était — le tirer vers le bas pendant qu'il relit plus haut serait pire que de le
		// laisser où il est.
		const enBas = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
		_aubPeindreMessages(box, t.messages);
		if (enBas) box.scrollTop = box.scrollHeight;
		_aubSigs.set(t.id, sig);
	}
}

async function rafraichirSalle() {
	// Sondage SILENCIEUX : une erreur réseau passagère ne doit ni alerter ni couper
	// l'intervalle — le tour suivant réessaiera.
	try {
		const res = await fetch('api/auberge/salle');
		if (!res.ok) return;
		const data = await res.json();
		// L'état en mémoire suit (il porte `nuit_log` et `annonce_max`) — mettre à jour un
		// objet JS ne touche pas le DOM, c'est le rendu qu'on veut éviter, pas l'état.
		_aubEtat = data;
		_aubMajMessages(data);
	} catch (err) { /* silencieux : le prochain tour réessaiera */ }
}

async function openAuberge() {
	const data = await _aubFetch('api/auberge/salle');
	if (!data) return;
	updatePurse(data.purse);
	renderAuberge(data);
	document.getElementById('game-container').classList.add('panel-hidden');
	document.getElementById('auberge-panel').classList.remove('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'instant' });
	if (_aubTimer) clearInterval(_aubTimer);
	_aubTimer = setInterval(rafraichirSalle, AUB_PERIODE);
}

function closeAuberge() {
	// ⚠️ Arrêter le sondage AVANT tout le reste : sans ce clearInterval, le panneau fermé
	// continuerait d'interroger le serveur pour toute la durée de la session.
	if (_aubTimer) { clearInterval(_aubTimer); _aubTimer = null; }
	// Les portraits partent avec le panneau : sans cette purge, leurs viewports resteraient
	// inscrits dans `_cardViewports` alors que plus rien ne les affiche, et le handler
	// `resize` les recalculerait pour rien jusqu'à la fin de la session.
	clearCharacterCards(document.getElementById('aub-tables-list'));
	clearCharacterCards(document.getElementById('aub-tableau-list'));
	_aubSigs = new Map();
	_aubSigsOcc = new Map();
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('auberge-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function prendreTable(tableId) {
	const data = await _aubFetch('api/auberge/table', tableId ? { table_id: tableId } : {});
	if (data) renderAuberge(data);
}

async function direATable() {
	const champ = document.getElementById('aub-dire-txt');
	if (!champ || !champ.value.trim()) return;
	const texte = champ.value;
	champ.value = '';
	const data = await _aubFetch('api/auberge/message', { texte });
	if (!data) { champ.value = texte; return; }   // refusé : on rend sa phrase au joueur
	renderAuberge(data);
	// Le rendu complet a recréé le champ : sans cela le joueur perdrait le curseur à chaque
	// phrase envoyée et devrait recliquer pour enchaîner.
	const neuf = document.getElementById('aub-dire-txt');
	if (neuf) neuf.focus();
	const box = document.querySelector(`.aub-table[data-table="${data.ma_table}"] .aub-msgs`);
	if (box) box.scrollTop = box.scrollHeight;
}

async function poserAnnonce() {
	const zone = document.getElementById('aub-annonce-txt');
	if (!zone || !zone.value.trim()) return;
	// `ecrivain_id` et non `compagnon_id` : c'est un choix propre au tableau, que
	// `_actionBody` n'a pas à écraser avec le porteur actif de la fiche.
	const data = await _aubFetch('api/auberge/annonce',
								 { texte: zone.value, ecrivain_id: _aubEcrivain });
	if (!data) return;
	zone.value = '';
	renderAuberge(data);
	// Le papier et l'encre viennent d'être dépensés : sans ce resync, la fiche montrerait
	// encore une feuille que le joueur n'a plus (Convention §10). ⚠️ Le serveur ne l'envoie
	// que lorsque c'est le PRINCIPAL qui a écrit — le sac d'un compagnon n'a rien à faire
	// dans les globales de la fiche.
	if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
	showToast(data.ecrivain_compagnon
		? `📌 ${data.ecrivain} affiche son avis. (papier et encre dépensés)`
		: '📌 Votre avis est affiché. (papier et encre dépensés)');
}

async function retirerAnnonce(messageId) {
	const data = await _aubFetch('api/auberge/annonce/retirer', { message_id: messageId });
	if (data) { renderAuberge(data); showToast('Avis décroché.'); }
}

// Délégation : les ids de table et de message viennent du serveur, mais on ne les
// interpole JAMAIS dans un onclick — un `'` échappé en `&#39;` y casserait la chaîne JS.
document.addEventListener('click', e => {
	const asseoir = e.target.closest('[data-aub-table]');
	if (asseoir) { prendreTable(asseoir.getAttribute('data-aub-table')); return; }
	if (e.target.closest('[data-aub-nouvelle]')) { prendreTable(null); return; }
	if (e.target.closest('[data-aub-dire]')) { direATable(); return; }
	const retirer = e.target.closest('[data-aub-retirer]');
	if (retirer) { retirerAnnonce(retirer.getAttribute('data-aub-retirer')); return; }
});
document.addEventListener('keydown', e => {
	if (e.key === 'Enter' && e.target && e.target.id === 'aub-dire-txt') {
		e.preventDefault();
		direATable();
	}
});
document.addEventListener('input', e => {
	if (e.target && e.target.id === 'aub-annonce-txt') _aubReste();
});
// Changer d'écrivain ne touche QUE la ligne de fournitures et le bouton : le brouillon reste
// dans la zone de saisie, on ne fait que décider qui le signera.
document.addEventListener('change', e => {
	if (e.target && e.target.id === 'aub-ecrivain') {
		_aubEcrivain = e.target.value || '';
		_aubMajEcriture();
	}
});

// ── La nuit ──────────────────────────────────────────────────────────────────────
// Le log est déjà EN MAIN (payload de la salle) : on l'égrène pendant que le POST est en
// vol. Le bouton « Au matin » ne s'arme que quand les DEUX sont finis — la révélation ne
// doit pas laisser croire que c'est terminé alors que le serveur écrit encore.
async function passerLaNuit() {
	// ⚠️ AUCUNE garde sur `_aubEtat` : le bouton vit dans la sidebar, on peut monter se
	// coucher sans avoir mis les pieds dans la salle commune.
	const btn = document.getElementById('aub-nuit-btn');
	if (btn) btn.disabled = true;
	if (_aubTimer) { clearInterval(_aubTimer); _aubTimer = null; }

	const overlay = document.getElementById('aub-nuit-overlay');
	const log = document.getElementById('aub-nuit-log');
	const fin = document.getElementById('aub-nuit-fin');
	if (log) log.innerHTML = '';
	if (fin) fin.disabled = true;
	if (overlay) overlay.classList.remove('clauses-hidden');

	const lignes = (_aubEtat && _aubEtat.nuit_log) || AUBERGE_NUIT.log || [];
	const recit = (async () => {
		for (const ligne of lignes) {
			const el = document.createElement('div');
			el.className = 'aub-nuit-ligne';
			el.textContent = ligne;                 // texte d'auteur : rien à interpréter
			if (log) log.appendChild(el);
			// ⚠️ Double requestAnimationFrame : une transition n'a rien à interpoler sur un
			// élément qui vient de naître (même piège que les toasts et les jetons).
			requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('vue')));
			await new Promise(r => setTimeout(r, 1200));
		}
	})();

	const [data] = await Promise.all([_aubFetch('api/auberge/nuit', {}), recit]);
	if (fin) fin.disabled = false;
	if (!data) {                                   // refus (fonds, conflit) : on referme
		if (overlay) overlay.classList.add('clauses-hidden');
		if (btn) btn.disabled = false;
		// ⚠️ On ne relance le sondage QUE si la salle est ouverte : la nuit se passe aussi
		// depuis la sidebar, et interroger le serveur toutes les 4 s pour un panneau fermé
		// est exactement ce que `closeAuberge` s'emploie à éviter.
		const panneau = document.getElementById('auberge-panel');
		if (panneau && !panneau.classList.contains('panel-hidden')) {
			_aubTimer = setInterval(rafraichirSalle, AUB_PERIODE);
		}
		return;
	}
	const bilan = [];
	if (data.cout) bilan.push(`−${_prixTexte(data.cout)}`);
	bilan.push('PV et PM au maximum');
	if (data.magasins) bilan.push(`${data.magasins} étal(s) réapprovisionné(s)`);
	if (data.recrues) bilan.push(`${data.recrues} recrue(s) au tableau`);
	const el = document.createElement('div');
	el.className = 'aub-nuit-ligne';
	el.textContent = '— ' + bilan.join(' · ');
	if (log) log.appendChild(el);
	requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('vue')));
}

function fermerNuit() {
	// Stocks, vitaux, sidebar et champs transitoires ont tous bougé : on recharge, comme
	// le fait déjà la branche « lien » d'un déplacement.
	window.location.reload();
}

// ── Conditions d'engagement ──────────────────────────────────────────────────────
// ⚠️ TOUTE embauche passe par ce dialogue, clauses ou pas : la PART DE BUTIN est une
// exigence à part entière, et le joueur ne doit jamais s'engager sans l'avoir lue et
// validée. C'est un dialogue comme celui d'un PNJ — la recrue parle, le joueur répond
// par un choix — mais rendu en overlay : la recrue n'a pas de doc `pnj:*` ni d'arbre,
// elle est générée, et sa seule réplique est le contrat qu'elle propose.
function demanderEmbauche(avId) { openClauses(avId); }

function openClauses(avId) {
	const r = _recEtat[avId];
	const ov = document.getElementById('clauses-overlay');
	if (!r || !ov) return;
	const ex = r.exigences_effectives || {};
	const nom = `${r.prenom || ''} ${r.nom || ''}`.trim();
	const clauses = ex.clauses || [];
	const part = ex.part_butin_pct;
	// ⚠️ Aucun pronom genré : une recrue est M ou F, la réplique doit valoir pour les deux.
	const replique = clauses.length
		? `« Je vous suis volontiers — à mes conditions : ${part} % du butin, et quelques principes auxquels je ne déroge pas. »`
		: `« Je vous suis volontiers — à mes conditions : ${part} % du butin. Rien d'autre à négocier. »`;
	document.getElementById('clauses-body').innerHTML =
		`<h3>🗣 ${escapeHtml(nom)}</h3>`
		+ `<div class="rec-dial">`
		+ (r.image ? `<img class="rec-dial-portrait" src="/characters/${escapeHtml(r.image)}" alt="">` : '')
		+ `<div class="rec-dial-corps">`
		+ (r.specialite ? `<div class="pnj-ambiance">${escapeHtml(r.specialite)}</div>` : '')
		+ `<div class="pnj-replique">${escapeHtml(replique)}</div>`
		+ `<div class="clauses-part">💰 Part de butin : <strong>${part} %</strong></div>`
		+ (clauses.length
			? `<ul class="clauses-list">${clauses.map(c => `<li>• ${escapeHtml(c)}</li>`).join('')}</ul>`
			: '')
		+ `<ul class="rec-dial-choix">`
		+ `<li><button class="sub-loc-btn" onclick="_clausesAccepter('${r.id}')">✔ « J'accepte vos conditions. »</button></li>`
		+ `<li><button class="sub-loc-btn" onclick="_clausesRefuser('${r.id}')">✕ « Vos conditions ne me conviennent pas. »</button></li>`
		+ `<li><button class="sub-loc-btn" onclick="closeClauses()">↩ « Laissez-moi y réfléchir. »</button></li>`
		+ `</ul>`
		+ `<div class="clauses-avert">Écarter ses conditions clôt l'entretien : la recrue quitte le tableau, sans retour.</div>`
		+ `</div></div>`;
	ov.classList.remove('clauses-hidden');
}

// ⚠️ Fermer ≠ décider : ✕, Échap et clic hors carte laissent la recrue au tableau. Le
// refus est irréversible, il ne doit jamais partir d'un geste de sortie accidentel.
function closeClauses() {
	document.getElementById('clauses-overlay').classList.add('clauses-hidden');
}

function _clausesAccepter(id) { closeClauses(); embaucherAventurier(id); }
function _clausesRefuser(id)  { closeClauses(); refuserAventurier(id); }

// ── Engagement durable d'un compagnon (✦) ────────────────────────────────────────
// Le compagnon cesse d'être un contrat : plus de part de butin, hors plafond de groupe,
// et il rejoint la compagnie — que le joueur BAPTISE au tout premier engagement. Les
// contreparties sont rappelées ici : l'engagement est réversible, mais la rupture se paie.

function ouvrirEngagement(avId) {
	const c = ((_grpEtat || {}).groupe || []).find(x => x.id === avId);
	const ov = document.getElementById('engagement-overlay');
	if (!c || !ov) return;
	const premier = !_compagnieNom;
	const nom = `${c.prenom || ''} ${c.nom || ''}`.trim();
	document.getElementById('engagement-body').innerHTML =
		`<h3>Engagement durable — ${escapeHtml(nom)}</h3>`
		+ `<div>« Je ne compte plus mes parts. Où vous irez, j'irai. »</div>`
		+ `<ul class="clauses-list">`
		+ `<li>• Il renonce à toute part de butin.</li>`
		+ `<li>• Il ne compte plus dans la taille de votre groupe.</li>`
		+ `<li>• Il ne vous quittera plus de lui-même, quoi qu'il pense de vous.</li>`
		+ `</ul>`
		+ (premier
			? `<div>Donnez un nom à votre compagnie :</div>`
			  + `<input id="engagement-nom" maxlength="40" placeholder="La Main d'Argent"`
			  + ` onkeydown="if(event.key==='Enter'){event.preventDefault();_engagementValider('${c.id}');}">`
			: `<div class="clauses-part">✦ Il rejoint <strong>${escapeHtml(_compagnieNom)}</strong>.</div>`)
		+ `<div class="clauses-avert">Rompre cet engagement plus tard le blessera durablement.</div>`
		+ `<div class="item-detail-actions">`
		+ `<button class="sh-drop-btn sh-abandon-btn" onclick="closeEngagement()"`
		+ ` title="Fermer sans engager">✕ Pas maintenant</button>`
		+ `<button class="sh-equip-btn" onclick="_engagementValider('${c.id}')"`
		+ ` title="Engager durablement ce compagnon">✦ Engager</button>`
		+ `</div>`;
	ov.classList.remove('clauses-hidden');
	const champ = document.getElementById('engagement-nom');
	if (champ) champ.focus();
}

// ⚠️ Fermer ≠ décider, comme pour les clauses : ✕, Échap et clic hors carte n'engagent rien.
function closeEngagement() {
	document.getElementById('engagement-overlay').classList.add('clauses-hidden');
}

// ⚠️ Le nom est lu depuis l'<input> EN JS, jamais interpolé dans un onclick : escapeHtml
// transformerait `'` en &#39; et casserait la chaîne. Le serveur le borne, le rendu l'échappe.
function _engagementValider(avId) {
	const champ = document.getElementById('engagement-nom');
	const nom = champ ? champ.value.trim() : null;
	if (champ && !nom) { showToast('Donnez un nom à votre compagnie.'); champ.focus(); return; }
	closeEngagement();
	engagerAventurier(avId, nom);
}

async function engagerAventurier(avId, nomCompagnie) {
	try {
		const body = { aventurier_id: avId };
		if (nomCompagnie) body.nom_compagnie = nomCompagnie;
		const res = await fetch('api/recrutement/engager', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
		// Le payload d'engagement ne porte pas les INVENTAIRES : on re-tire l'état complet
		// du panneau, comme le fait le congédiement — sinon la section 🎒 se viderait.
		_majCompagnie(data);
		const r2 = await fetch('api/groupe');
		if (r2.ok) renderGroupe(await r2.json());
		if (data.engage) showToast(`✦ ${data.engage.nom} rejoint ${data.engage.compagnie} !`);
	} catch (err) { console.error('Erreur engagement', err); }
}

// Le refus retire la recrue du tableau (serveur) ; la réponse est le board reconstruit,
// place déjà repeuplée — même forme que l'embauche.
async function refuserAventurier(avId) {
	try {
		const res = await fetch('api/recrutement/refuser', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ aventurier_id: avId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderRecrutement(data);
		if (data.refus) showToast('✕ ' + data.refus.nom + ' remballe ses exigences et s\'en va.');
	} catch(err) { console.error('Erreur refus', err); }
}

async function embaucherAventurier(avId) {
	try {
		const res = await fetch('api/recrutement/embaucher', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ aventurier_id: avId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderRecrutement(data);
		if (data.embauche) showToast('🤝 ' + data.embauche.nom + ' rejoint le groupe !');
	} catch(err) { console.error('Erreur embauche', err); }
}

// Congédier est autorisé PARTOUT (onglet 🤝 ou panneau) : hors lieu recruteur, le
// payload ne porte pas de recrues → seuls groupe + fiche 👥 sont resynchronisés.
// `permanent` : rompre un ENGAGEMENT n'est pas résilier un contrat — la confirmation doit
// dire ce que ça coûte, sinon le joueur découvre la sanction après coup.
async function congedierAventurier(avId, permanent) {
	const question = permanent
		? 'Rompre votre engagement avec ce compagnon ? Il quitte la compagnie, et le blesse durablement.'
		: 'Congédier ce compagnon ? Il gardera le souvenir de vos aventures.';
	if (!confirm(question)) return;
	try {
		const res = await fetch('api/recrutement/congedier', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ aventurier_id: avId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if ('recrues' in data) renderRecrutement(data);
		else if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
		// Congédier depuis le panneau 👥 : son état (liste ET sacs) doit être re-tiré, le
		// payload du congédiement ne porte pas les inventaires.
		const grp = document.getElementById('groupe-panel');
		if (grp && !grp.classList.contains('panel-hidden')) {
			const r2 = await fetch('api/groupe');
			if (r2.ok) renderGroupe(await r2.json());
		}
		if (data.congedie) showToast('👋 ' + data.congedie.nom + ' quitte le groupe.');
	} catch(err) { console.error('Erreur congédiement', err); }
}

// Rendu initial de l'onglet 🤝 section 👥 + toasts des départs volontaires (check
// paresseux au rendu de /play : affinité tombée sous le seuil pendant l'absence).
const AFFINITES_INIT = {{ affinites_detail | tojson | safe }};
renderFicheCompagnons(AFFINITES_INIT);
{{ compagnons_partis | tojson | safe }}.forEach(n => showToast('👋 ' + n + ' a quitté le groupe.'));

// ── Panneau 👥 Groupe ───────────────────────────────────────────────────────────
// Deux sections en accordéon : les compagnons (→ fiche complète de chacun) et l'inventaire
// du groupe (le sac du joueur et celui d'un compagnon côte à côte, flèches de transfert).
// Accessible PARTOUT, contrairement au tableau de recrutement (lieu recruteur + carte).
let _grpEtat = null;          // dernier payload de GET api/groupe
let _grpSelId = null;         // compagnon affiché dans la colonne de droite de l'inventaire

const GRP_SECTION_KEY = 'telluris.play.groupe_section.' + REL_CHAR_ID;
const GRP_INV_KEY     = 'telluris.play.groupe_inv.' + REL_CHAR_ID;
const GRP_SECTIONS    = ['compagnons', 'inventaire'];
function _grpLsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function _grpLsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// Accordéon : une seule section ouverte, mémorisée par personnage. La mécanique vit dans
// `toggleAccordeon` (brique `.acc-*` partagée avec l'onglet 📖) ; il ne reste ici que le nom
// du groupe et sa clé — c'est tout ce qui distingue un accordéon d'un autre.
function toggleGroupeSection(id) {
	toggleAccordeon(GRP_SECTIONS, id, GRP_SECTION_KEY);
}

function renderGroupe(data) {
	_grpEtat = data;
	_majCompagnie(data);
	const groupe = data.groupe || [];
	_majPointsCompagnons(groupe);
	const plafond = document.getElementById('grp-plafond');
	if (plafond) plafond.textContent = `${_placesOccupees(data)}/${data.plafond}`;

	// Chaque compagnon s'affiche avec la MÊME carte que le joueur (portrait cadré, barres
	// PV/PM, identité) ; son pied ne dit que ce qu'elle n'a pas : la part de butin et l'affinité.
	// ⚠️ Le bouton d'engagement n'est offert QUE dans le panneau 👥, jamais au tableau de
	// recrutement : on n'engage pas durablement quelqu'un qu'on vient d'embaucher.
	const seuil = data.seuil_engagement;
	_rendreCartesCompagnons(document.getElementById('grp-compagnons-list'), groupe,
		c => _btnEngager(c, seuil) + _btnCongedier(c));
	// La carte entière ouvre la fiche du compagnon (le bouton 📋 Fiche faisait doublon). Restent
	// exclus : la barre d'actions (→ Congédier) et les contrôles d'édition du portrait.
	document.querySelectorAll('#grp-compagnons-list .character-card').forEach(card => {
		card.classList.add('card-clickable');
		card.addEventListener('click', e => {
			if (e.target.closest('.card-actions, .zoom-bar, [data-role="action-btn"]')) return;
			const vp = card.querySelector('[data-role="vp"]');
			if (vp && vp.classList.contains('drag-mode')) return;  // recadrage du portrait en cours
			openCompagnonSheet(card.dataset.porteur);
		});
	});
	_rendreCartesMontures(document.getElementById('grp-montures-list'), data.montures || [],
		m => _btnRelacher(m));
	const titreMnt = document.getElementById('grp-montures-titre');
	if (titreMnt) titreMnt.style.display = (data.montures || []).length ? '' : 'none';
	// Personnes escortées : même composant, même règle (non éditable, non cliquable), mais
	// AUCUNE action — leur seul « bouton » est de les ramener vivantes à destination.
	const proteges = data.proteges || [];
	_rendreCartesMontures(document.getElementById('grp-proteges-list'), proteges,
		p => '', p => _piedProtege(p));
	const titreProt = document.getElementById('grp-proteges-titre');
	if (titreProt) titreProt.style.display = proteges.length ? '' : 'none';
	renderGroupeInventaire();
}

// Pied d'une monture : ce qui la définit, c'est ce qu'elle PORTE (ses PV sont déjà dans ses
// barres). L'espèce n'est pas répétée — c'est le nom de la carte.
function _piedMonture(m) {
	const charge = +(m.charge || 0), max = +(m.charge_max || 0);
	return `<span>🎒 ${charge.toFixed(1)} / ${max} kg</span>`;
}

// Rafraîchit en place le pied (et le bouton Relâcher) de la carte d'UNE monture, sans
// reconstruire la liste — reconstruire perdrait les viewports de portrait déjà mesurés.
function _majPiedMonture(m) {
	const card = document.querySelector(`#grp-montures-list .character-card[data-porteur="${m.id}"]`);
	if (!card) return;
	const pied = card.querySelector('[data-role="footer"]');
	if (pied) pied.innerHTML = _piedMonture(m);
	const act = card.querySelector('[data-role="actions"]');
	if (act) act.innerHTML = _btnRelacher(m);
}

function _btnRelacher(m) {
	// Relâcher est définitif : on ne le propose pas tant que la bête est chargée (le serveur
	// refuse de toute façon, autant l'expliquer avant le clic).
	const chargee = +(m.charge || 0) > 0;
	return `<button class="sh-drop-btn sh-abandon-btn" ${chargee ? 'disabled' : ''}
		title="${chargee ? 'Videz son sac avant de la relâcher' : 'Relâcher cette monture (définitif)'}"
		onclick="relacherMonture('${m.id}')">✕ Relâcher</button>`;
}

// Les cartes de montures : même composant que les compagnons, mais NON éditable (une monture
// n'est pas dans `groupe_effectif`, `_acteur` refuserait d'enregistrer son cadrage) et non
// cliquable (elle n'a pas de fiche de personnage — pas de stats à dépenser, pas de sorts).
// Les personnes ESCORTÉES tombent exactement sous la même règle : d'où le `pied` paramétrable
// plutôt qu'un second renderer copié-collé.
function _rendreCartesMontures(container, liste, actions, pied) {
	if (!container) return;
	clearCharacterCards(container);
	if (!liste.length) return;   // le titre est masqué par l'appelant : pas de « aucune »
	liste.forEach(m => renderCharacterCard(container, m, {
		editable: false,
		footer: (pied || _piedMonture)(m),
		actions: actions(m),
	}));
}

// Pied d'une carte de personne escortée : ce que le joueur doit surveiller, ce sont ses PV —
// la carte les affiche déjà. On y met donc l'enjeu, pas une statistique de plus.
function _piedProtege(p) {
	return `<span>🛡️ Sous votre protection</span>`;
}

// Sacs côte à côte. Le compagnon affiché à droite est le dernier choisi (mémorisé), à
// défaut le premier du groupe.
function renderGroupeInventaire() {
	const data = _grpEtat || {};
	const groupe = data.groupe || [];
	const montures = data.montures || [];
	// Compagnons PUIS montures : tout ce qui peut porter pour vous. Une monture est un
	// porteur comme un autre ici — c'est même le meilleur.
	const porteurs = groupe.concat(montures);
	const vide = document.getElementById('grp-inv-vide');
	const wrap = document.getElementById('grp-inv-wrap');
	if (!wrap) return;
	if (!porteurs.length) {
		if (vide) vide.style.display = '';
		wrap.style.display = 'none';
		return;
	}
	if (vide) vide.style.display = 'none';
	wrap.style.display = '';

	const ids = porteurs.map(c => c.id);
	if (!ids.includes(_grpSelId)) {
		const memo = _grpLsGet(GRP_INV_KEY);
		_grpSelId = ids.includes(memo) ? memo : ids[0];
	}
	const sel = document.getElementById('grp-inv-select');
	if (sel) {
		const opt = c => `<option value="${c.id}"${c.id === _grpSelId ? ' selected' : ''}>`
			+ `${`${c.prenom || ''} ${c.nom || ''}`.trim()}</option>`;
		// Les montures dans leur propre groupe : on ne confond pas un compagnon et une bête.
		sel.innerHTML = groupe.map(opt).join('')
			+ (montures.length ? `<optgroup label="🐴 Montures">${montures.map(opt).join('')}</optgroup>` : '');
		// Un seul porteur : le sélecteur n'a rien à sélectionner, il devient une étiquette.
		sel.disabled = porteurs.length < 2;
	}

	const principal = data.principal || {};
	const compagnon = (data.sacs || {})[_grpSelId] || {inventaire: [], charge: 0, charge_max: 0};
	_grpCharge('grp-inv-charge-principal', principal);
	_grpCharge('grp-inv-charge-compagnon', compagnon);
	_grpRemplirSac('grp-inv-principal', principal.inventaire, _grpSac(principal.inventaire, compagnon, 'vers_compagnon'));
	_grpRemplirSac('grp-inv-compagnon', compagnon.inventaire, _grpSac(compagnon.inventaire, principal, 'vers_principal'));
}

// Un sac du panneau Groupe : même bascule comptée que le sac de la fiche et que le
// marchand — l'ombre du wrapper .sh-scroll ne s'allume que s'il reste à faire défiler.
function _grpRemplirSac(elId, inventaire, html) {
	const box = document.getElementById(elId);
	if (!box) return;
	box.innerHTML = html;
	if (box.parentElement) box.parentElement.classList.toggle('scrollable', (inventaire || []).length > INV_VISIBLE);
}

function _grpCharge(elId, porteur) {
	const el = document.getElementById(elId);
	if (!el) return;
	const charge = +(porteur.charge || 0), max = +(porteur.charge_max || 0);
	el.textContent = `${charge.toFixed(1)} / ${max} kg`;
	el.classList.toggle('grp-charge-over', charge > max + 1e-6);
}

// Sources de fiche objet propres aux sacs du groupe → sens du transfert (les deux sens de
// `transfererItem` désignent chacun un porteur : celui QUI DONNE est la source de la fiche).
const _GRP_SENS = { grp_principal: 'vers_compagnon', grp_compagnon: 'vers_principal' };
const _GRP_SOURCE = { vers_compagnon: 'grp_principal', vers_principal: 'grp_compagnon' };

// Qui donne, qui reçoit, pour une source de fiche donnée.
function _grpPorteurs(source) {
	const data = _grpEtat || {};
	const principal = data.principal || { inventaire: [], charge: 0, charge_max: 0 };
	const compagnon = (data.sacs || {})[_grpSelId] || { inventaire: [], charge: 0, charge_max: 0 };
	return source === 'grp_principal'
		? { src: principal, dest: compagnon }
		: { src: compagnon, dest: principal };
}
// Même arithmétique que `peut_porter` côté serveur, qui refuserait (409).
function _grpRentre(item, dest) {
	return +(item.poids || 0) <= (+(dest.charge_max || 0) - +(dest.charge || 0)) + 1e-6;
}

// Une ligne par objet ; la flèche est grisée quand l'objet ne rentre pas chez le destinataire.
// Icône + nom ouvrent la fiche de l'objet, comme dans le sac de la fiche perso.
// Affichage trié par nom via `_sortedOrder` : l'index d'origine est conservé pour l'adressage
// serveur (transfert + fiche objet).
function _grpSac(items, dest, sens) {
	items = items || [];
	if (!items.length) return '<div class="sh-empty"><span class="sh-empty-icon">🎒</span>Sac vide</div>';
	const source = _GRP_SOURCE[sens];
	const fleche = sens === 'vers_compagnon' ? '→' : '←';
	return _sortedOrder(items, 'asc').map(idx => {
		const item = items[idx];
		if (!item || typeof item !== 'object') return '';
		const poids = +(item.poids || 0);
		const rentre = _grpRentre(item, dest);
		const btn = `<button class="grp-move-btn" ${rentre ? '' : 'disabled'}
			title="${rentre ? 'Transférer' : 'Trop lourd — le destinataire est à sa charge maximale'}"
			onclick="transfererItem('${sens}',${idx},'${item._id}')">${fleche}</button>`;
		const row = `<span class="sh-inv-name sh-inv-open" onclick="openItemDetail('${source}',${idx})" title="Voir la fiche">${item.icon || '📦'} ${item.nom || '—'}</span>
			<span class="sh-inv-poids">${poids.toFixed(1)} kg</span>`;
		// Le bouton se place du côté où part l'objet : à droite pour →, à gauche pour ←.
		return `<div class="sh-inv-item">${sens === 'vers_principal' ? btn + row : row + btn}</div>`;
	}).join('');
}

function onGroupeInvSelect(avId) {
	_grpSelId = avId;
	_grpLsSet(GRP_INV_KEY, avId);
	renderGroupeInventaire();
}

async function transfererItem(sens, index, itemId) {
	try {
		const res = await fetch('api/groupe/transferer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ compagnon_id: _grpSelId, sens, index, item_id: itemId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		// Le sac du joueur est aussi celui de la fiche : on resynchronise les deux vues.
		_inventaire = data.principal.inventaire;
		_slots      = data.principal.slots;
		_chargeMax  = data.principal.charge_max;
		_refreshInventaire();
		_refreshChargeGauge();
		if (_grpEtat) {
			_grpEtat.principal = Object.assign({}, _grpEtat.principal, {
				inventaire: data.principal.inventaire,
				charge: data.principal.charge, charge_max: data.principal.charge_max,
			});
			(_grpEtat.sacs || {})[data.compagnon_id] = {
				inventaire: data.compagnon.inventaire,
				charge: data.compagnon.charge, charge_max: data.compagnon.charge_max,
			};
			// La carte d'une monture affiche sa charge en pied : sans cette resynchro elle
			// resterait figée sur l'état d'avant le transfert jusqu'à la réouverture du panneau.
			const mnt = (_grpEtat.montures || []).find(m => m.id === data.compagnon_id);
			if (mnt) {
				mnt.charge = data.compagnon.charge;
				_majPiedMonture(mnt);
			}
			renderGroupeInventaire();
		}
		const t = data.transfere || {};
		showToast(`${t.icon || '📦'} ${t.nom} ${t.vers === 'compagnon' ? '→' : '←'} ${t.poids} kg`);
	} catch (err) { console.error('Erreur transfert', err); }
}

// Séparé en DEUX temps (fetch / affichage) pour closeCompagnonSheet : il a besoin
// d'attendre la réponse AVANT de toucher au moindre panneau (cf. son commentaire), ce que
// `openGroupe` seul ne permet pas puisqu'il bascule les panneaux dès sa réponse reçue.
async function _fetchGroupeData() {
	try {
		const res = await fetch('api/groupe');
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return null; }
		return data;
	} catch (err) { console.error('Erreur panneau groupe', err); return null; }
}
function _renderGroupePanel(data) {
	renderGroupe(data);
	if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
	(data.departs || []).forEach(n => showToast('👋 ' + n + ' a quitté le groupe.'));
	_accRestaurer(GRP_SECTIONS, GRP_SECTION_KEY, 'compagnons');
	document.getElementById('game-container').classList.add('panel-hidden');
	document.getElementById('groupe-panel').classList.remove('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'instant' });
}
async function openGroupe() {
	const data = await _fetchGroupeData();
	if (data) _renderGroupePanel(data);
}

function closeGroupe() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('groupe-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Fiche d'un compagnon : le panneau de fiche, en « mode compagnon » ───────────
// On ne duplique aucun rendu : les globales du joueur sont mises de côté, remplacées par
// celles du compagnon, et TOUTES les fonctions de rendu existantes sont rappelées telles
// quelles. Les actions, elles, partent avec un `compagnon_id` (_actionBody) — le serveur
// résout alors le porteur (cf. `_acteur`, routers/user.py).
// `_compagnonActif` / `_sheetSnap` sont déclarés plus haut (près de _inventaire) — TDZ à l'init.

function _actionBody(extra) {
	return _compagnonActif ? Object.assign({}, extra, { compagnon_id: _compagnonActif.id }) : extra;
}

function _sheetIdentiteEls() {
	return {
		// La colonne gauche (paysage) n'est pas une carte : autre mise en page, donc son HTML
		// est réécrit (et restauré depuis le snapshot). La colonne droite, elle, EST la carte
		// `charac-sheet` : elle se pilote par `_setCardIdentite` + `setSujet`, jamais en innerHTML.
		gauche: document.querySelector('.sheet-left-info'),
		imgGauche: document.querySelector('.sheet-left-portrait img'),
		barres: Array.from(document.querySelectorAll('.sheet-left-col .portrait-stat-bar .bar-fill')),
	};
}

// Le personnage affiché par la fiche : le joueur, ou un compagnon. Les deux colonnes suivent.
function _applySheetIdentite(p) {
	const els = _sheetIdentiteEls();
	const v = p.vitals || {};
	const pvPct = v.pv_max ? Math.min(100, Math.round(v.currentPV / v.pv_max * 100)) : 0;
	const pmPct = v.pm_max ? Math.min(100, Math.round(v.currentPM / v.pm_max * 100)) : 0;
	if (els.gauche) {
		const classe = `${_vocLabel(p.voc)} Niv.<span class="voc-niveau niveau-nb">${p.voc_niveau}</span>`
			+ ` - ${p.race} Niv.<span class="race-niveau niveau-nb">${p.niveau}</span> · Rang ${p.rang}`;
		// Mêmes ids que le gabarit Jinja : _refreshDerivedStats continue d'y écrire les max.
		const vitals = `<span class="pv-val">PV ${v.currentPV}/<span id="stat-left-drv-pv_max">${v.pv_max}</span></span>`
			+ `<span class="pm-val">PM ${v.currentPM}/<span id="stat-left-drv-pm_max">${v.pm_max}</span></span>`;
		els.gauche.innerHTML = `<div class="char-name">${p.prenom} ${p.nom}</div>`
			+ `<div class="char-class">${classe}</div>`
			+ `<div class="char-vitals" style="margin-top:8px">${vitals}</div>`
			+ `<div id="sh-effets-actifs" class="sh-effets-chips"></div>`;
	}
	if (els.imgGauche) els.imgGauche.src = '/characters/' + p.image;
	els.barres.forEach((b, i) => { b.style.height = (i % 2 === 0 ? pvPct : pmPct) + '%'; });

	// La carte de la fiche change de porteur : identité, vitaux, barres — et son portrait, dont
	// l'image est mesurée et le cadrage propre au compagnon (enregistrable sur SON doc).
	_setCardIdentite(carteFiche(), p);
	if (PORTRAIT_FICHE) PORTRAIT_FICHE.setSujet({
		image: p.image,
		portrait_zoom: p.portrait_zoom,
		portrait_translate: p.portrait_translate,
		compagnon_id: p.id === PRINCIPAL_ID ? null : p.id,
	});
}

// Le joueur tel que la carte l'attend (l'identité vient des globales, tenues à jour : niveaux
// dépensés, vitaux régénérés) — de quoi rendre la fiche au joueur en sortant du mode compagnon.
function _identiteJoueur() {
	return {
		id: PRINCIPAL_ID,
		prenom: IDENTITE_JOUEUR.prenom, nom: IDENTITE_JOUEUR.nom,
		voc: IDENTITE_JOUEUR.voc, race: IDENTITE_JOUEUR.race, rang: IDENTITE_JOUEUR.rang,
		rang_detail: IDENTITE_JOUEUR.rang_detail,
		voc_niveau: _vocNiveau, niveau: _niveau,
		image: SUJET_JOUEUR.image,
		portrait_zoom: SUJET_JOUEUR.portrait_zoom,
		portrait_translate: SUJET_JOUEUR.portrait_translate,
		vitals: _vitalsJoueur,
	};
}

function _sheetRendreTout() {
	_refreshStatBoxes();
	_refreshDerivedStats(_derivedCur);
	_renderCaractsMod();
	_refreshPaperdoll();
	_refreshInventaire();
	_refreshSol();
	_refreshChargeGauge();
	_renderEffetsActifs(_effetsActifs);
	_renderSorts();
	_renderSortsMagies();
	_renderSortsApprenables();
	_renderCompetences();
	_renderCompetencesApprenables();
	_renderBarreSlots();
	_syncPoints(_attributePoints);
}

async function openCompagnonSheet(avId) {
	try {
		const res = await fetch('api/groupe/compagnon/' + encodeURIComponent(avId));
		const p = await res.json();
		if (!res.ok) { showToast('Erreur : ' + p.detail); return; }

		const els = _sheetIdentiteEls();
		// `_objetsAuSol` n'est PAS mis de côté : le sol appartient au lieu, pas au porteur.
		// Il reste donc à jour pendant tout le détour (ce qu'un compagnon « pose » y tombe)
		// et doit être conservé tel quel au retour — le figer ici ferait disparaître de la
		// vue du joueur ce que son compagnon vient de poser.
		_sheetSnap = {
			inventaire: _inventaire, slots: _slots, chargeMax: _chargeMax,
			effetsActifs: _effetsActifs, charStats: _charStats, statCaps: _statCaps,
			maxBonus: _MAX_BONUS, maxBonusUsed: _maxBonusUsed,
			attributePoints: _attributePoints, vocNiveau: _vocNiveau, caractsDetail: _caractsDetail,
			derived: _derivedCur, raceMin: _RACE_MIN, raceMax: _RACE_MAX,
			xpTotal: _xpTotal, niveau: _niveau, xpNivPrev: _xpNivPrev, xpNivNext: _xpNivNext,
			raceNom: _raceNom, vocId: _vocId, sexe: _sexe,
			sorts: _sorts, sortsApprenables: _sortsApprenables, sortsMagies: _sortsMagies,
			competences: _competences, competencesApprenables: _competencesApprenables,
			barreSlots: _barreSlots, consosCombat: _consosCombat,
			htmlGauche: els.gauche ? els.gauche.innerHTML : '',
			imgGauche: els.imgGauche ? els.imgGauche.getAttribute('src') : '',
			// La CARTE de la fiche n'est pas snapshottée : elle se reconstruit du joueur
			// (`_identiteJoueur()` + `SUJET_JOUEUR`), et un HTML mis de côté serait déjà périmé
			// si le joueur a régénéré ou dépensé un point pendant le détour.
			barres: els.barres.map(b => b.style.height),
		};

		_compagnonActif = p;
		_inventaire = p.inventaire; _slots = p.slots; _objetsAuSol = p.objets_au_sol;
		_chargeMax = p.charge_max; _effetsActifs = p.effets_actifs;
		_charStats = p.caracteristiques_current; _statCaps = p.stat_caps;
		// Le dépassement racial appartient au COMPAGNON (sa race, son bonus déjà brûlé ou non) :
		// la montée passe par le chokepoint `_acteur`, elle écrit sur SON doc.
		_MAX_BONUS = p.max_bonus || {}; _maxBonusUsed = p.max_bonus_used || null;
		_attributePoints = p.attribute_points; _vocNiveau = p.voc_niveau;
		_caractsDetail = p.caracts_detail; _derivedCur = p.derived_stats;
		_RACE_MIN = p.race_min; _RACE_MAX = p.race_max;
		_xpTotal = p.xp_total; _niveau = p.niveau;
		_xpNivPrev = p.xp_niv_prev; _xpNivNext = p.xp_niv_next;
		_raceNom = p.race; _vocId = p.voc; _sexe = p.sex;
		_sorts = p.sorts; _sortsApprenables = p.sorts_apprenables; _sortsMagies = p.sorts_magies;
		_competences = p.competences; _competencesApprenables = p.competences_apprenables;
		// La barre de combat appartient au PORTEUR : configurer depuis la fiche d'un
		// compagnon écrit sur SON doc (chokepoint `_acteur` côté serveur).
		_barreSlots = p.barre_slots || _barreSlots; _consosCombat = p.consommables || [];

		document.body.classList.add('sheet-compagnon');
		_applySheetIdentite(p);
		_sheetRendreTout();

		document.getElementById('groupe-panel').classList.add('panel-hidden');
		document.getElementById('sheet-panel').classList.remove('panel-hidden');
		sheetTab('stats', document.querySelector('.sheet-tab-btn'));
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch (err) { console.error('Erreur fiche compagnon', err); }
}

// Retour au joueur : on restaure l'état mis de côté, puis on rouvre le panneau du groupe
// (les charges ont pu changer — équipement, objets posés).
// ⚠️ Ordre délicat, deux écueils déjà rencontrés ici :
//  1. Attendre `GET /api/groupe` APRÈS avoir masqué `#sheet-panel` ouvre une fenêtre sans
//     AUCUN panneau visible (simples frères en flux normal, pas des calques superposés) →
//     flash sur le fond nu de la page le temps de l'aller-retour réseau.
//  2. Restaurer/re-rendre la fiche du JOUEUR avant cet aller-retour la rend brièvement
//     visible (le panneau reste affiché pendant l'attente) → flash sur SA fiche alors que
//     l'intention du joueur est de revenir au groupe, pas de se regarder.
// Solution : précharger les données du groupe D'ABORD, pendant que `#sheet-panel` affiche
// encore la fiche du COMPAGNON telle quelle (rien ne change à l'écran) ; restaurer l'état
// + re-rendre la fiche joueur + masquer `#sheet-panel` + afficher `#groupe-panel` ensuite,
// d'un bloc synchrone (aucun `await` entre les deux) pour qu'aucune frame intermédiaire
// ne soit peinte entre les deux bascules.
async function closeCompagnonSheet() {
	const data = await _fetchGroupeData();
	const s = _sheetSnap;
	_compagnonActif = null;
	_sheetSnap = null;
	document.body.classList.remove('sheet-compagnon');
	if (s) {
		_inventaire = s.inventaire; _slots = s.slots;   // `_objetsAuSol` : cf. openCompagnonSheet
		_chargeMax = s.chargeMax; _effetsActifs = s.effetsActifs;
		_charStats = s.charStats; _statCaps = s.statCaps;
		_MAX_BONUS = s.maxBonus; _maxBonusUsed = s.maxBonusUsed;
		_attributePoints = s.attributePoints; _vocNiveau = s.vocNiveau;
		_caractsDetail = s.caractsDetail; _derivedCur = s.derived;
		_RACE_MIN = s.raceMin; _RACE_MAX = s.raceMax;
		_xpTotal = s.xpTotal; _niveau = s.niveau;
		_xpNivPrev = s.xpNivPrev; _xpNivNext = s.xpNivNext;
		_raceNom = s.raceNom; _vocId = s.vocId; _sexe = s.sexe;
		_sorts = s.sorts; _sortsApprenables = s.sortsApprenables; _sortsMagies = s.sortsMagies;
		_competences = s.competences; _competencesApprenables = s.competencesApprenables;
		_barreSlots = s.barreSlots; _consosCombat = s.consosCombat;

		const els = _sheetIdentiteEls();
		if (els.gauche) els.gauche.innerHTML = s.htmlGauche;
		if (els.imgGauche) els.imgGauche.src = s.imgGauche;
		els.barres.forEach((b, i) => { b.style.height = s.barres[i] || '0%'; });
		// La carte de la fiche redevient celle du joueur — reconstruite (globales restaurées
		// juste au-dessus), pas restaurée d'un HTML figé.
		_setCardIdentite(carteFiche(), _identiteJoueur());
		if (PORTRAIT_FICHE) PORTRAIT_FICHE.setSujet(SUJET_JOUEUR);
		_sheetRendreTout();
	}
	document.getElementById('sheet-panel').classList.add('panel-hidden');
	if (data) _renderGroupePanel(data);
}

// ── Dialogue PNJ (🗣) ───────────────────────────────────────────────────────
// Panneau plein écran (pattern quêtes/marché). Navigation stateless : chaque choix
// renvoie le nœud suivant déjà filtré/substitué côté serveur ; `noeud: null` = fin.
let _pnjNoeudCourant = null;

// Récompense de réputation posée sur un nœud de dialogue (`relation` côté donnée). Le signe
// est explicite : le même mécanisme sert à punir. ⚠️ `showToast` écrit en textContent — aucun
// échappement à faire (Conventions §9).
function _relationGainTexte(g) {
	const signe = g.delta > 0 ? '+' + g.delta : String(g.delta);
	return '🤝 ' + (g.nom || 'Relation') + ' — relation ' + signe + ' (' + g.valeur + ')';
}

function renderPnjNoeud(noeud) {
	_pnjNoeudCourant = noeud ? noeud.id : null;
	const texte = document.getElementById('pnj-noeud-texte');
	const liste = document.getElementById('pnj-choix');
	if (!noeud) { texte.textContent = ''; liste.innerHTML = ''; return; }
	texte.textContent = noeud.texte || '';
	liste.innerHTML = (noeud.choix || []).map(c =>
		`<li><button class="sub-loc-btn" onclick="choisirPnj('${c.id}')">${c.action ? '✨ ' : ''}${c.label}</button></li>`
	).join('') || '<li><button class="sub-loc-btn" onclick="closePnjPanel()">✕ Prendre congé</button></li>';
}

async function openPnjDialogue() {
	try {
		const res = await fetch('api/pnj/dialogue');
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		// Une course a pu périmer à l'ouverture du dialogue (expiration paresseuse) : le serveur
		// renvoie alors les relations à jour, sanction comprise. Un nœud d'accueil peut aussi
		// porter une récompense de réputation (versée une seule fois, cf. `relation_gain`).
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
		if (data.relation_gain) showToast(_relationGainTexte(data.relation_gain));
		renderPnjNoeud(data.noeud);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('pnj-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch(err) { console.error('Erreur dialogue PNJ', err); }
}

function closePnjPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('pnj-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function choisirPnj(choixId) {
	if (!_pnjNoeudCourant) return;
	try {
		const res = await fetch('api/pnj/dialogue/choix', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ noeud: _pnjNoeudCourant, choix_id: choixId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if (data.vitals) updateVitals(data.vitals);
		if (data.purse) updatePurse(data.purse);
		// Une course livrée/rapportée fait monter la relation du donneur : l'onglet 🤝 est rendu
		// client, il ne se met à jour que si le serveur renvoie le payload complet.
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
		// Récompense de réputation portée par le nœud qu'on vient d'atteindre (versée une seule
		// fois par personnage, tant qu'un autre nœud n'a pas levé sa clé).
		if (data.relation_gain) showToast(_relationGainTexte(data.relation_gain));
		if (data.soin) {
			showToast('✨ +' + data.soin.pv_rendu + ' PV' + (data.soin.gratuit ? ' — offert' : ''));
		}
		if (data.don) {
			const q = data.don.quantite > 1 ? ' ×' + data.don.quantite : '';
			showToast((data.don.icon || '🎁') + ' ' + data.don.nom + q + (data.don.gratuit ? ' — offert' : ''));
			if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
		}
		if (data.transport) {
			if (data.transport.accepte) showToast('📦 Course acceptée : ' + data.transport.accepte);
			// Course à retour : la marchandise est remise ici, mais c'est le donneur qui paie — on
			// ne promet ni XP ni prime tant que le joueur n'est pas allé lui en rendre compte.
			if (data.transport.remis) {
				showToast('📦 Marchandise remise — retournez en rendre compte au donneur.');
				if (data.transport.en_rayon) showToast('🏷️ ' + data.transport.en_rayon + ' colis mis en rayon ici.');
			}
			if (data.transport.livre) {
				showToast('📦 Livré ! ✨ +' + data.transport.xp + ' XP, 🤝 relation ' + data.transport.relation
					+ _xpCompagnieSuffixe(data.transport.xp_compagnie));
				if (data.transport.en_rayon) showToast('🏷️ ' + data.transport.en_rayon + ' colis mis en rayon ici.');
				(data.transport.items || []).forEach(nom => showToast('🎁 ' + nom));
				if (data.transport.niveau_up) showToast('⭐ Niveau supérieur !');
			}
			if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
			renderFicheQuetes(data);
		}
		if (data.rang) {
			if (data.rang.accepte) showToast('🎯 Épreuve de rang acceptée : ' + data.rang.accepte);
			if (data.rang.promu) {
				showToast('🏅 Rang de guilde : ' + data.rang.promu + (data.rang.niveau_up ? ' — ⭐ Niveau supérieur !' : '')
					+ _xpCompagnieSuffixe(data.rang.xp_compagnie));
				// `meilleur`/`detail` = le MEILLEUR rang toutes villes confondues et son détail par
				// ville (même calcul que /play, cf. utils/chasse.meilleur_rang) : la promotion d'UNE
				// ville ne fait pas forcément remonter l'affichage si une autre était déjà meilleure.
				updateRang(data.rang.meilleur, data.rang.detail);
			}
		}
		if (data.acces) {
			showToast('🗝️ ' + data.acces.nom + ' — le passage vous est ouvert.');
			// Le laissez-passer vient d'être posé : sans resynchroniser LINKS ici, le lieu
			// gardé n'apparaîtrait qu'au prochain rechargement de /play.
			if (Array.isArray(data.links)) { LINKS = data.links; buildLocationslist(); }
		}
		if (data.commission) {
			if (data.commission.accepte) showToast('⚔️ Commission acceptée : ' + data.commission.accepte);
			if (data.commission.rapporte) {
				showToast('🏅 Commission accomplie — ✨ +' + data.commission.xp + ' XP'
					+ (data.commission.niveau_up ? ' — ⭐ Niveau supérieur !' : '')
					+ _xpCompagnieSuffixe(data.commission.xp_compagnie));
			}
			renderFicheQuetes(data);
		}
		// Une porte de donjon n'ouvre pas un lieu : elle ouvre un COMBAT (le gardien nous fait
		// descendre). On quitte la page — inutile de rendre le nœud suivant, on ne le verra pas.
		if (data.combat_id) { window.location.href = '/combat/' + data.combat_id; return; }
		// Hook de déplacement automatique (`deplacer` sur un choix) : le PNJ nous fait entrer.
		// On réutilise `moveTo` — donc l'unique endpoint de déplacement et TOUS ses effets de
		// bord (quêtes `visite`, XP de découverte, événement de zone, régén de tour…) ; il
		// recharge la page, ce qui ferme le dialogue de lui-même.
		if (data.deplacer) { closePnjPanel(); await moveTo(data.deplacer); return; }
		if (data.noeud) renderPnjNoeud(data.noeud);
		else closePnjPanel();
	} catch(err) { console.error('Erreur choix de dialogue', err); }
}
</script>
