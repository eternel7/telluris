<script src="{{ url_for('scripts', path='nav.js') }}"></script>
<script>
	let POSITIONS = { "x" : {{ position["x"] | tojson | safe }}, "y": {{ position["y"] | tojson | safe }} }
	let LINKS = {{ links | tojson | safe }};
	let ACCESS = {{ access | tojson | safe }};
	// Ressource récoltable (événement de zone « ressource ») : posée par le serveur au
	// déplacement, transitoire (remplacée/effacée au déplacement suivant, consommée à la récolte).
	let _ressourceRecoltable = {{ ressource_recoltable | tojson | safe }};
	function _refreshRecolte() {
		const el = document.getElementById('recolte-action');
		if (!el) return;
		const r = _ressourceRecoltable;
		const label = r ? (r.a_couper ? `🪓 Abattre ${r.nom}` : `${r.icon || '🌿'} Récolter ${r.nom}`) : '';
		el.innerHTML = r
			? `<h3>Récolte</h3><ul class="sub-locations-list"><li><button class="sub-loc-btn" onclick="recolterRessource()">${label}</button></li></ul>`
			: '';
	}
	async function recolterRessource() {
		try {
			const res = await fetch('api/recolter', { method: 'POST', headers: {'Content-Type': 'application/json'} });
			const data = await res.json();
			if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
			_applyInventoryPayload(data);
			_ressourceRecoltable = null;
			_refreshRecolte();
			if (data.recolte && data.recolte.coupe) showToast('Abattu : ' + data.recolte.n + ' pièce(s) au sol');
			else if (data.recolte) showToast('Récolté : ' + data.recolte.nom);
		} catch (err) { console.error('Erreur récolte', err); }
	}
	_refreshRecolte();
	// ── Focalisation (🧭 lieu / 🎯 quête) ─────────────────────────────────────
	// État injecté au rendu serveur (survit au reload de moveTo), resynchronisé par
	// /api/focaliser, les réponses du tableau de quêtes et chaque déplacement (guidage).
	let _focalisation = {{ focalisation | tojson | safe }};
	let _guidage = {{ guidage | tojson | safe }};
	function _focusEst(type, cible) {
		return !!(_focalisation && _focalisation.type === type && _focalisation.cible === cible);
	}
	// Toggle de la classe dorée sur tous les boutons 🧭/🎯 rendus (Jinja comme miroirs JS).
	function _syncFocusBtns() {
		const key = _focalisation ? _focalisation.type + '|' + _focalisation.cible : null;
		document.querySelectorAll('[data-focus-key]').forEach(btn => {
			btn.classList.toggle('btn-highlight', btn.getAttribute('data-focus-key') === key);
		});
	}
	function _refreshGuidage() {
		const el = document.getElementById('guidage-action');
		if (!el) return;
		const g = _guidage;
		if (!g) { el.innerHTML = ''; return; }
		let detail;
		if (g.injoignable) detail = 'aucun chemin connu 😕';
		else if (!g.direction) detail = `prenez le passage → <strong>${g.etape_nom}</strong>`;
		else detail = `prochaine étape : <strong>${g.etape_nom}</strong>`;
		el.innerHTML = `<h3>🧭 Cap : ${g.cible_nom}</h3><div class="q-desc" style="padding:0 4px">${detail}</div>`;
	}
	async function _postFocaliser(type, cible) {
		try {
			const res = await fetch('api/focaliser', {
				method: 'POST', headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({ type, cible })
			});
			const data = await res.json();
			if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
			_focalisation = data.focalisation || null;
			_guidage = data.guidage || null;
			_refreshGuidage();
			_syncFocusBtns();
			updateControls();
			buildLocationslist();
			showToast(_focalisation
				? (type === 'lieu' ? '🧭 Cap sur : ' : '🎯 Focalisation : ') + _focalisation.label
				: 'Focalisation annulée');
		} catch (err) { console.error('Erreur focalisation', err); }
	}
	function focaliserLieu(lieuId) { _postFocaliser('lieu', lieuId); }
	function focaliserQuete(queteId) { _postFocaliser('quete', queteId); }
	_refreshGuidage();
	// DIRS (et VALID_MOVES / getFinalMask / navAllows) proviennent de scripts/nav.js (partagé).
	const root = document.documentElement;
	let isMoving = false;
	// Colonne gauche de la fiche (paysage) : ce n'est pas une carte (autre mise en page), mais
	// elle miroite le personnage que la fiche affiche.
	function _setLeftColVitals(v) {
		const col = document.querySelector('.sheet-left-col');
		if (!col || !v) return;
		const bar = (side, cur, max) => {
			const pct = max > 0 ? Math.min(Math.round(cur / max * 100), 100) : 0;
			col.querySelectorAll(`.portrait-stat-bar.${side}-side .bar-fill`).forEach(el => {
				el.style.height = pct + '%';
				el.classList.toggle('is-overflow', cur > max);
			});
		};
		const val = (cls, label, cur, max) => {
			col.querySelectorAll(cls).forEach(el => {
				if (el.firstChild && el.firstChild.nodeType === Node.TEXT_NODE) {
					el.firstChild.nodeValue = `${label} ${cur}/`;
				}
				const span = el.querySelector('span');
				if (span) span.textContent = max;
			});
		};
		bar('pv', v.currentPV, v.pv_max);
		bar('pm', v.currentPM, v.pm_max);
		val('.pv-val', 'PV', v.currentPV, v.pv_max);
		val('.pm-val', 'PM', v.currentPM, v.pm_max);
	}

	// Jauges + textes PV/PM d'UN porteur (défaut : le joueur), partout où il est affiché.
	// ⚠️ Ces vitaux appartiennent à quelqu'un : les écrire à l'échelle du document recopierait
	// ceux du joueur sur les cartes de ses compagnons (et inversement, une potion bue par un
	// compagnon écraserait les siennes). Le `data-porteur` de chaque carte tranche.
	function updateVitals(v, porteurId) {
		if (!v) return;
		const cible = porteurId || PRINCIPAL_ID;
		if (cible === PRINCIPAL_ID) _vitalsJoueur = Object.assign({}, v);
		cartesDuPorteur(cible).forEach(card => _setCardVitals(card, v));
		if (cible === porteurActifId()) _setLeftColVitals(v);
	}

	async function move(viewDx, viewDy) {
		if (isMoving) return;
		isMoving = true;
		setMoveButtonsDisabled(true);
		const moveData = {x: viewDx, y: viewDy};
		try {
			const response = await fetch('api/move_character', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(moveData)
			});
			if (response.ok) {
				rep = await response.json();
				root.style.setProperty('--x', rep.position["x"]);
				root.style.setProperty('--y', rep.position["y"]);
				LINKS = rep.links;
				POSITIONS = {"x" : rep.position["x"], "y": rep.position["y"]};
				ACCESS = rep.access;
				// Guidage 🧭 : à jour AVANT buildLocationslist/updateControls (exergues flèche+lien).
				_guidage = rep.guidage || null;
				_refreshGuidage();
				buildLocationslist();
				updateControls();
				updateVitals(rep.vitals);
				_notifierTransportsEchoues(rep);
				// Course échue = réputation en baisse chez le donneur et sa maison : l'onglet 🤝
				// n'en sait rien sans ce resync (le pas ne recharge pas la page).
				if (Array.isArray(rep.relations_lieux)) renderFicheRelations(rep.relations_lieux);
				// Déplacement effectif → le sol transitoire est vidé côté serveur.
				if (rep.ground_cleared) {
					_objetsAuSol = [];
					_refreshSol();
					_refreshChargeGauge();
				}
				if (rep.zone_event) {
					if (rep.zone_event.type === 'combat') {
						const cr = await fetch('/api/combat/start', {
							method: 'POST',
							headers: {'Content-Type': 'application/json'},
							body: JSON.stringify({
								tags: rep.zone_event.tags || [],
								intensite: rep.zone_event.intensite || 0.5,
								modificateurs: rep.zone_event.modificateurs || {}
							})
						});
						if (cr.ok) {
							const cd = await cr.json();
							if (cd.combat_id) {
								window.location.href = '/combat/' + cd.combat_id;
								return;
							}
						}
					} else {
						showZoneEvent(rep.zone_event);
					}
				}
				// Bouton « Récolter » de la sidebar (déplacement par lien = SPA, pas de reload).
				_ressourceRecoltable = rep.ressource_recoltable || null;
				_refreshRecolte();
				// Effets actifs : décrémentés/expirés à chaque tour monde côté serveur.
				_renderEffetsActifs(rep.effets_actifs);
				_renderCaractsMod(rep.caracts_detail);
				// Le groupe régénère au même tour monde que le joueur : la fiche 👥 suit.
				if (rep.affinites_detail) renderFicheCompagnons(rep.affinites_detail);
				// Intro narrative : le pas vient d'atteindre la zone de sécurité de la cité.
				if (rep.intro_terminee) {
					showIntroConclusion(rep.intro_terminee);
					if (rep.intro_xp && rep.intro_xp.niveau_up) showToast('Niveau ' + rep.intro_xp.niveau + ' atteint !');
					else if (rep.intro_xp && rep.intro_xp.gain > 0) showToast('+' + rep.intro_xp.gain + ' XP');
				}
			} else {
				const error = await response.json();
				console.log(error.detail)
				alert("Erreur : " + error.detail);
			}
		} catch (err) { console.error("Erreur de connexion", err); }
		finally {
			isMoving = false;
			updateControls();
		}
	}
	/* lieux accessibles */
	function buildLocationslist() {
		const sub_locations = document.getElementById('sub-locations-list-id');
		const seenLabels = new Set(); // Stocke les labels déjà traités
		sub_locations.innerHTML = LINKS.map(link => {
			return link.nodes
				.filter(l => {
					// Condition 1 : Ne pas correspondre au lieu actuel
					const isNotCurrentLieu = l.lieu !== "{{lieu}}";
					
					// Condition 2 : Le label n'a pas encore été vu
					const isNewLabel = !seenLabels.has(l.details.label);
					
					if (isNotCurrentLieu && isNewLabel) {
						seenLabels.add(l.details.label);
						return true;
					}
					return false;
				})
				.map(l => `<li><button class="sub-loc-btn${_guidage && link._id === _guidage.link_id ? ' btn-highlight' : ''}" onclick="moveTo('${link._id}')">➔ ${l.details.label}</button></li>`)
				.join('');
		}).join('') || `<li>Aucun</li>`;
	}
	buildLocationslist();
	function setMoveButtonsDisabled(disabled) {
		['move_1_1','move_10','move_11','move01','move11','move10','move1_1','move0_1'].forEach(id => {
			const el = document.getElementById(id);
			if (el) el.disabled = disabled;
		});
	}
	function updateControls() {
		const controls = document.getElementById('controls');
		if(controls) {
			const boutons = [
				{ element: document.getElementById('move_1_1'), x: -1, y: -1 , dir : DIRS.HAUT_GAUCHE},
				{ element: document.getElementById('move_10'),  x: -1, y: 0  , dir : DIRS.GAUCHE},
				{ element: document.getElementById('move_11'),  x: -1, y: 1  , dir : DIRS.BAS_GAUCHE},
				{ element: document.getElementById('move01'),   x: 0,  y: 1  , dir : DIRS.BAS},
				{ element: document.getElementById('move11'),   x: 1,  y: 1  , dir : DIRS.BAS_DROITE},
				{ element: document.getElementById('move10'),   x: 1,  y: 0  , dir : DIRS.DROITE},
				{ element: document.getElementById('move1_1'),  x: 1,  y: -1 , dir : DIRS.HAUT_DROITE},
				{ element: document.getElementById('move0_1'),  x: 0,  y: -1 , dir : DIRS.HAUT}
			];
			let access = ACCESS.access;
			let nav = ACCESS.nav;
			// Surcharge : poids porté > charge max → déplacement impossible (miroir de la
			// garde serveur). Le guard `typeof` évite l'erreur au 1er appel (les variables
			// de charge sont déclarées dans un script chargé après celui-ci).
			const surcharge = (typeof _currentCharge === 'function' && typeof _chargeMax !== 'undefined')
				&& _currentCharge() > _chargeMax + 1e-6;
			boutons.forEach(({ element, x, y, dir }) => {
				if (element) {
					const loc_access = access[y + 1][x + 1];
					// access en fonction du type de lieu et des directions disponibles
					element.disabled = surcharge || (loc_access !== 1) || ((nav & dir) === 0);
					// Guidage 🧭 : la flèche du premier pas vers la cible est mise en exergue.
					element.classList.toggle('btn-highlight', !element.disabled
						&& !!(_guidage && _guidage.direction
							&& _guidage.direction.dx === x && _guidage.direction.dy === y));
				}
			});
		}
	}
	updateControls();
	async function waitTurn(){
		// Attendre un tour : pas de déplacement, mais on rejoue la résolution serveur
		// (événements de zone re-testés à la position courante + régén PV hors combat).
		await move(0, 0);
	}
	async function moveTo(linkId) {
		const moveData = {link: linkId};
		try {
			const response = await fetch('api/move_character', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(moveData)
			});
			if (response.ok) {
				const data = await response.json();
				if (data.xp_gain > 0) {
					sessionStorage.setItem('xp_gain_notif', data.xp_gain);
				}
				if (data.niveau_up) {
					sessionStorage.setItem('niveau_up_notif', data.niveau);
				}
				if (data.focalisation_atteinte) {
					// Arrivée au lieu focalisé : toast affiché après le reload (pattern xp_gain_notif).
					sessionStorage.setItem('focus_arrive_notif', data.focalisation_atteinte.nom || '');
				}
				if (data.intro_terminee) {
					// Arrivée par porte directement en zone sûre : conclusion rejouée après le reload.
					sessionStorage.setItem('intro_fin_notif', JSON.stringify(data.intro_terminee));
				}
				if ((data.transports_echoues || []).length) {
					// Le changement de lieu recharge la page : le toast doit survivre au reload.
					sessionStorage.setItem('transports_echoues_notif', JSON.stringify(data.transports_echoues));
				}
				if (data.zone_event && data.zone_event.type === 'combat') {
					const cr = await fetch('/api/combat/start', {
						method: 'POST',
						headers: {'Content-Type': 'application/json'},
						body: JSON.stringify({
							tags: data.zone_event.tags || [],
							intensite: data.zone_event.intensite || 0.5,
							modificateurs: data.zone_event.modificateurs || {}
						})
					});
					if (cr.ok) {
						const cd = await cr.json();
						if (cd.combat_id) {
							window.location.href = '/combat/' + cd.combat_id;
							return;
						}
					}
				} else if (data.zone_event && data.zone_event.type !== 'rien') {
					sessionStorage.setItem('zone_event_notif', JSON.stringify(data.zone_event));
				}
				window.location.reload(true);
			} else {
				const error = await response.json();
				console.log(error.detail)
				alert("Erreur : " + error.detail);
			}
		} catch (err) { console.error("Erreur de connexion", err); }
	}
</script>
<script>
// ── PORTRAITS : moteur de cadrage ───────────────────────────
// UNE INSTANCE PAR VIEWPORT, chacune avec SON sujet : la sidebar montre toujours le joueur,
// la fiche peut montrer un COMPAGNON — dont l'image n'a ni les mêmes dimensions natives ni le
// même cadrage. La taille native est MESURÉE dans le navigateur (naturalWidth/Height) : la
// mesurer côté serveur (PIL) la figeait sur le personnage de la page.
const PORTRAIT_W1 = 100;   // fenêtre d'affichage : constante de mise en page (cf. --portraitW)
const PORTRAIT_H1 = 100;

// Identité du joueur (partie FIXE : ce qui ne bouge pas d'une action à l'autre). Les parties
// mobiles — niveaux, vitaux — vivent dans les globales `_vocNiveau`/`_niveau`/`_vitalsJoueur`,
// que `_identiteJoueur()` recolle pour rendre la fiche au joueur (cf. closeCompagnonSheet).
const IDENTITE_JOUEUR = {
	prenom: {{ character["prenom"] | tojson | safe }},
	nom:    {{ character["nom"] | tojson | safe }},
	voc:    {{ character.get("voc", "") | tojson | safe }},
	race:   {{ character["race"] | tojson | safe }},
	rang:   {{ character.get("rang", "aucun") | tojson | safe }},
};
// Vitaux courants du joueur, tenus à jour par updateVitals (la fiche peut être partie chez un
// compagnon entre-temps : sans mémoire, on ne saurait pas quoi réafficher au retour).
let _vitalsJoueur = {
	currentPV: {{ _pv | tojson | safe }}, pv_max: {{ d.get("pv_max", 0) | tojson | safe }},
	currentPM: {{ _pm | tojson | safe }}, pm_max: {{ d.get("pm_max", 0) | tojson | safe }},
};

// Sujet cadré = son image, son cadrage persisté, et le doc sur lequel l'enregistrer.
const SUJET_JOUEUR = {
	image: {{ character["image"] | tojson | safe }},
	portrait_zoom: {{ character.get("portrait_zoom", 100) | tojson | safe }},
	portrait_translate: {{ character.get("portrait_translate", 0) | tojson | safe }},
	compagnon_id: null,
};

let PORTRAIT_SIDEBAR = null;   // carte de la sidebar — le joueur, toujours
let PORTRAIT_FICHE   = null;   // carte de la fiche   — sujet interchangeable (mode compagnon)

// Un viewport se branche sur une CARTE (racine `.character-card`) et résout ses éléments
// DEDANS, par data-role : la page porte autant de cartes que de personnages affichés, des ids
// globaux seraient forcément dupliqués. Une carte sans éditeur (recrue) n'a ni slider ni
// bouton : les branchements sont tous gardés.
function makePortraitViewport(card) {
	if (!card) return null;
	const q          = (role) => card.querySelector(`[data-role="${role}"]`);
	const vp         = q('vp');
	const img        = q('img');
	const scaleRoot  = q('scale-root');
	const zoomSlider = q('zoom-slider');
	const zoomVal    = q('zoom-val');
	const actionBtn  = q('action-btn');
	const iconEdit   = q('icon-edit');
	const iconSave   = q('icon-save');
	if (!vp || !img) return null;
	// La carte porte-t-elle l'éditeur (curseur + ✏️/💾) ? La macro ne les rend que là où le
	// cadrage est ENREGISTRABLE. Sans lui, le portrait n'est cadré par personne → affiché entier.
	const editable = !!(zoomSlider || actionBtn);

	const W1 = PORTRAIT_W1, H1 = PORTRAIT_H1;
	// État PROPRE à ce viewport. Le partager entre les deux images ÉTAIT le bug : la fiche
	// héritait des dimensions natives et du cadrage du joueur, quel que soit qui elle montrait.
	let sujet = null;
	let W = W1, H = H1;          // taille native de l'image courante
	let zoomPct = 100;
	let offsetX = 0, offsetY = 0;
	let dragMode = false;

	const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
	const imgW  = () => W * zoomPct / 100;
	const imgH  = () => H * zoomPct / 100;
	// Zoom auquel l'image ENTIÈRE tient dans la fenêtre (aperçu au survol d'un portrait non
	// éditable : c'est ainsi qu'on voit qui l'on embauche, plutôt qu'un fragment d'image).
	const zoomFit = () => Math.max(1, 100 * Math.min(W1 / W, H1 / H));

	// Bornes de défilement sur un axe. Image plus grande que la fenêtre : elle défile de 0 à son
	// débord. Image plus PETITE (cas du dézoom) : elle ne défile pas, on la CENTRE — offset
	// négatif, donc translation positive. (L'ancien `Math.abs` renvoyait une valeur négative du
	// mauvais côté au lieu de la borner : un glisser vers le haut faisait sauter l'image.)
	function bornes(taille, fenetre) {
		if (taille <= fenetre) { const c = (taille - fenetre) / 2; return [c, c]; }
		return [0, taille - fenetre];
	}

	function applyOffset(x, y, animated) {
		const [minX, maxX] = bornes(imgW(), W1);
		const [minY, maxY] = bornes(imgH(), H1);
		x = clamp(x, minX, maxX);
		y = clamp(y, minY, maxY);
		offsetX = x; offsetY = y;
		img.classList.toggle('animate', !!animated);
		img.style.width  = imgW() + 'px';
		img.style.height = imgH() + 'px';
		img.style.transform = `translate(${-x}px, ${-y}px)`;
		img.classList.add('cadree');   // dimensionnée : elle peut s'afficher
	}

	function applyZoom(pct, animated) {
		const cx = offsetX + W1 / 2;
		const cy = offsetY + H1 / 2;
		const ratio = pct / zoomPct;
		zoomPct = pct;
		if (zoomVal)    zoomVal.textContent = pct + '%';
		if (zoomSlider) zoomSlider.value    = pct;
		applyOffset(cx * ratio - W1 / 2, cy * ratio - H1 / 2, animated);
	}

	// ⚠️ `portrait_translate` est ce qui a été ENREGISTRÉ : la translation CSS de l'image, donc
	// l'OPPOSÉ de l'offset (on écrit `translate(-x, -y)`, le serveur relit « -30 »). Un offset,
	// lui, est un défilement positif → il faut retourner le signe. C'est ce que faisait, à son
	// insu, le `Math.abs` de l'ancien clamp ; le clamp borne désormais pour de vrai, la
	// conversion doit donc être faite ici, là où elle se comprend.
	function defaultOffset() {
		const t = sujet && sujet.portrait_translate;
		if (t && typeof t === 'object') return { x: Math.abs(t.x), y: Math.abs(t.y) };
		return { x: (imgW() - W1) / 2, y: 0 };   // jamais cadré : centré horizontalement
	}

	function computeScale() {
		const availW = window.innerWidth  - 40; const availH = window.innerHeight - 200;
		return Math.max(0.1, Math.min(1, availW / W1, availH / H1));
	}
	function applyScale() {
		if (!scaleRoot) return;
		const s = computeScale();
		scaleRoot.style.transform    = `scale(${s})`;
		scaleRoot.style.marginBottom = `${(H1 * s - H1)}px`;
	}

	// Change le porteur affiché : pose l'image, la MESURE (une image déjà en cache l'est
	// immédiatement ; sinon `decode()` attend son décodage), puis applique SON cadrage.
	//
	// Un portrait SANS éditeur (une recrue) n'est jamais cadré par personne : on l'affiche
	// ENTIER (zoomFit, centré par `bornes`) plutôt qu'en gros plan sur un fragment d'image —
	// c'est le moment où l'on regarde qui l'on embauche.
	async function setSujet(s) {
		sujet = s || SUJET_JOUEUR;
		zoomPct = parseInt(sujet.portrait_zoom, 10) || 100;
		if (zoomVal)    zoomVal.textContent = zoomPct + '%';
		if (zoomSlider) zoomSlider.value    = zoomPct;
		img.classList.remove('cadree');
		img.src = '/characters/' + sujet.image;
		try { if (!img.complete || !img.naturalWidth) await img.decode(); } catch (e) {}
		W = img.naturalWidth  || W1;
		H = img.naturalHeight || H1;
		if (!editable) zoomPct = zoomFit();
		const d = editable ? defaultOffset() : { x: 0, y: 0 };   // hors cadrage : `bornes` centre
		applyOffset(d.x, d.y, false);
		applyScale();
	}

	async function setDragMode(on) {
		dragMode = on;
		vp.classList.toggle('drag-mode', on);
		if (iconEdit) iconEdit.style.display = on ? 'none' : '';
		if (iconSave) iconSave.style.display = on ? '' : 'none';
		if (actionBtn) {
			actionBtn.classList.toggle('save-mode', on);
			actionBtn.title     = on ? 'Figer la position' : 'Activer le déplacement';
			actionBtn.ariaLabel = actionBtn.title;
		}
		if (on || !img.style.transform) return;
		// Enregistrement sur le doc du porteur cadré ICI : chaque viewport sauve SON sujet (la
		// sidebar reste sur le joueur même quand la fiche montre un compagnon). Le cadrage d'un
		// compagnon vit sur son doc `aventurier:*` — la page de combat le relit pour son jeton.
		const body = { value: img.style.transform, zoom: zoomPct };
		if (sujet && sujet.compagnon_id) body.compagnon_id = sujet.compagnon_id;
		try {
			const response = await fetch('api/update_character_portrait', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(body)
			});
			if (!response.ok) {
				const error = await response.json();
				console.log(error.detail);
				alert("Erreur : " + error.detail);
			}
		} catch (err) { console.error("Erreur de connexion", err); }
	}

	if (zoomSlider) {
		zoomSlider.addEventListener('input',      () => applyZoom(parseInt(zoomSlider.value), false));
		zoomSlider.addEventListener('mousedown',  e  => e.stopPropagation());
		zoomSlider.addEventListener('touchstart', e  => e.stopPropagation(), { passive: true });
	}
	if (actionBtn) {
		actionBtn.addEventListener('click', e => { e.stopPropagation(); setDragMode(!dragMode); });
	}

	let hoverTimer = null;
	function showOverlay() { clearTimeout(hoverTimer); vp.classList.add('hovered'); }
	function hideOverlay() {
		hoverTimer = setTimeout(() => { if (!dragMode) vp.classList.remove('hovered'); }, 120);
	}
	for (const el of [vp, actionBtn]) {
		if (!el) continue;
		el.addEventListener('mouseenter', showOverlay);
		el.addEventListener('mouseleave', hideOverlay);
	}
	vp.addEventListener('touchstart', () => showOverlay(), { passive: true });

	// ── Glisser (souris) ────────────────────────────────────
	let dragging = false; let startClientX, startClientY, startOX, startOY;
	vp.addEventListener('mousedown', e => {
		if (!dragMode) return;
		dragging = true; startClientX = e.clientX; startClientY = e.clientY;
		startOX = offsetX; startOY = offsetY; e.preventDefault();
	});
	window.addEventListener('mousemove', e => {
		if (!dragging) return;
		const s = computeScale();
		applyOffset(startOX - (e.clientX - startClientX) / s, startOY - (e.clientY - startClientY) / s, false);
	});
	window.addEventListener('mouseup', () => { dragging = false; });

	// ── Glisser (tactile) ───────────────────────────────────
	let touch0 = null; let touchOnBtn = false; let touchMoved = false; const TAP_THRESHOLD = 8;
	vp.addEventListener('touchstart', e => {
		showOverlay();
		const t = e.touches[0];
		const el = document.elementFromPoint(t.clientX, t.clientY);
		touchOnBtn = actionBtn && (el === actionBtn || actionBtn.contains(el));
		if (touchOnBtn) return;
		if (!dragMode) return;
		touch0 = t; touchMoved = false; startOX = offsetX; startOY = offsetY; e.preventDefault();
	}, { passive: false });

	vp.addEventListener('touchmove', e => {
		if (!dragMode || !touch0 || touchOnBtn) return;
		const t = e.touches[0];
		const dx = t.clientX - touch0.clientX; const dy = t.clientY - touch0.clientY;
		if (!touchMoved && Math.hypot(dx, dy) < TAP_THRESHOLD) return;
		touchMoved = true;
		const s = computeScale();
		applyOffset(startOX - dx / s, startOY - dy / s, false); e.preventDefault();
	}, { passive: false });

	vp.addEventListener('touchend', e => {
		if (touchOnBtn && !touchMoved) {
			const t = e.changedTouches[0]; const el = document.elementFromPoint(t.clientX, t.clientY);
			if (actionBtn && (el === actionBtn || actionBtn.contains(el))) { setDragMode(!dragMode); e.preventDefault(); }
		}
		touch0 = null; touchOnBtn = false; touchMoved = false;
	}, { passive: false });

	return { setSujet, applyScale, sujet: () => sujet };
}

// ── CARTES DE PERSONNAGE ────────────────────────────────────
// Le markup vient TOUJOURS de la macro Jinja (part-character-card.html) : les cartes fixes
// (sidebar, fiche) sont rendues par le serveur, les cartes de liste (compagnons, recrues) sont
// CLONÉES depuis le <template> qu'elle a rempli. Aucun HTML de carte n'est écrit ici — c'est ce
// qui garantit qu'elles ne divergent pas.
const PRINCIPAL_ID = {{ character["_id"] | tojson | safe }};

const carteSidebar = () => document.querySelector('.character-card[data-card="sidebar"]');
const carteFiche   = () => document.querySelector('.character-card[data-card="charac-sheet"]');
// Toutes les cartes qui montrent CE porteur (le joueur peut apparaître deux fois : sidebar +
// fiche ; un compagnon, dans sa carte de liste et dans la fiche ouverte sur lui).
const cartesDuPorteur = (id) =>
	document.querySelectorAll(`.character-card[data-porteur="${(id || '').replace(/"/g, '\\"')}"]`);
// Le porteur affiché par la fiche : le compagnon en mode compagnon, sinon le joueur.
const porteurActifId = () => (_compagnonActif ? _compagnonActif.id : PRINCIPAL_ID);

// Viewports des cartes de liste, indexés par la CARTE (pas par le porteur : un même compagnon
// peut avoir une carte dans le panneau du groupe ET dans celui du recrutement). Un re-render
// remplace les cartes → les instances mortes partent avec elles.
const _cardViewports = new Map();

function _q(card, role) { return card ? card.querySelector(`[data-role="${role}"]`) : null; }

// Vitaux d'UNE carte. Écrire à l'échelle du document (l'ancien `querySelectorAll('.pv-val')`)
// aurait recopié les PV du joueur sur toutes les cartes de compagnons affichées.
function _setCardVitals(card, v) {
	if (!card || !v) return;
	const set = (role, val) => { const el = _q(card, role); if (el) el.textContent = val; };
	set('pv', v.currentPV); set('pv-max', v.pv_max);
	set('pm', v.currentPM); set('pm-max', v.pm_max);
	const bar = (role, cur, max) => {
		const el = _q(card, role);
		if (!el) return;
		el.style.height = (max > 0 ? Math.min(Math.round(cur / max * 100), 100) : 0) + '%';
		el.classList.toggle('is-overflow', cur > max);
	};
	bar('pv-bar', v.currentPV, v.pv_max);
	bar('pm-bar', v.currentPM, v.pm_max);
}

// Identité d'UNE carte + son porteur (data-porteur suit le personnage affiché : c'est lui qui
// dit à qui s'appliquent les vitaux et les niveaux qu'on écrira ensuite).
function _setCardIdentite(card, p) {
	if (!card || !p) return;
	const set = (role, val) => { const el = _q(card, role); if (el) el.textContent = val; };
	const voc = VOC_LABELS[p.voc] || {};
	card.dataset.porteur = p.id || PRINCIPAL_ID;
	set('nom', `${p.prenom || ''} ${p.nom || ''}`.trim());
	set('voc-niveau', p.voc_niveau !== undefined ? p.voc_niveau : 0);
	set('race', p.race || '');
	set('race-niveau', p.niveau !== undefined ? p.niveau : 0);
	set('rang', p.rang || 'aucun');
	// La ligne « ⚔ Guerrier Niv.<span> - <race> Niv.<span> · Rang <span> » : seul son premier
	// nœud TEXTE porte l'icône et le libellé de vocation (le reste est déjà en data-role).
	const classeEl = _q(card, 'classe');
	if (classeEl && classeEl.firstChild) {
		classeEl.firstChild.nodeValue = `${voc.icon || ''} ${voc.label || p.voc || ''} Niv.`;
	}
	_setCardVitals(card, p.vitals || p);
}

// Une carte de liste : clone du gabarit, remplissage, portrait branché sur SON image et SON
// cadrage. `opts` = { editable, footer (html), actions (html) }.
function renderCharacterCard(container, p, opts) {
	opts = opts || {};
	const tpl = document.getElementById(opts.editable ? 'tpl-character-card' : 'tpl-character-card-ro');
	if (!container || !tpl) return null;
	const card = tpl.content.firstElementChild.firstElementChild.cloneNode(true);
	_setCardIdentite(card, p);
	const footer = _q(card, 'footer');
	const actions = _q(card, 'actions');
	if (footer)  footer.innerHTML  = opts.footer  || '';
	if (actions) actions.innerHTML = opts.actions || '';
	container.appendChild(card);

	const vp = makePortraitViewport(card);
	if (vp) {
		_cardViewports.set(card, vp);
		vp.setSujet({
			image: p.image,
			portrait_zoom: p.portrait_zoom,
			portrait_translate: p.portrait_translate,
			// Le cadrage n'est enregistrable que sur un doc qui nous appartient (groupe_effectif) :
			// une carte non éditable n'a de toute façon ni curseur ni bouton 💾.
			compagnon_id: opts.editable ? p.id : null,
		});
	}
	return card;
}

// Vide un conteneur de cartes (et les viewports qui allaient avec).
function clearCharacterCards(container) {
	if (!container) return;
	container.querySelectorAll('.character-card').forEach(c => _cardViewports.delete(c));
	container.innerHTML = '';
}

PORTRAIT_SIDEBAR = makePortraitViewport(carteSidebar());
PORTRAIT_FICHE   = makePortraitViewport(carteFiche());
for (const p of [PORTRAIT_SIDEBAR, PORTRAIT_FICHE]) { if (p) p.setSujet(SUJET_JOUEUR); }
window.addEventListener('resize', () => {
	for (const p of [PORTRAIT_SIDEBAR, PORTRAIT_FICHE]) { if (p) p.applyScale(); }
	_cardViewports.forEach(v => v.applyScale());
});

// ── FICHE PERSONNAGE ────────────────────────────────────────
function openSheet() {
	document.getElementById('game-container').classList.add('panel-hidden');
	document.getElementById('sheet-panel').classList.remove('panel-hidden');
	sheetTab('stats', document.querySelector('.sheet-tab-btn'));
	window.scrollTo({ top: 0, behavior: 'instant' });
}
function closeSheet() {
	// En mode compagnon, ✕ Fermer (et Échap) rendent la main au groupe, pas à la ville :
	// on restaure d'abord la fiche du joueur (cf. closeCompagnonSheet).
	if (_compagnonActif) { closeCompagnonSheet(); return; }
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('sheet-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}
function sheetTab(id, btn) {
	document.querySelectorAll('.sheet-tab-btn').forEach(b => b.classList.remove('active'));
	document.querySelectorAll('.sheet-panel').forEach(p => p.classList.remove('active'));
	document.getElementById('sh-' + id).classList.add('active');
	if (btn) btn.classList.add('active');
}
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	const qmap = document.getElementById('quest-map-overlay');
	if (qmap && !qmap.classList.contains('hidden')) { closeQuestMap(); return; }
	const itemOv = document.getElementById('item-detail-overlay');
	if (itemOv && !itemOv.classList.contains('item-detail-hidden')) { closeItemDetail(); return; }
	const sell = document.getElementById('sell-panel');
	if (sell && !sell.classList.contains('panel-hidden')) { closeSellPanel(); return; }
	const groupe = document.getElementById('groupe-panel');
	if (groupe && !groupe.classList.contains('panel-hidden')) { closeGroupe(); return; }
	closeSheet();
});

// Clic sur une relation : plie/déplie son portrait (toggle .collapsed sur l'img de
// .sh-rel-portrait). Accordéon → déplier une image replie toutes les autres, une seule
// reste ouverte à la fois. Délégation sur document → couvre le rendu serveur ET le
// re-rendu client (renderFicheRelations). Les boutons internes (🧭) gardent leur action.
// Un clic sur le portrait lui-même (.sh-rel-portrait) ne plie/déplie PAS : le portrait
// zoome au survol (CSS :hover), on n'y attache aucune action de repli.
document.addEventListener('click', e => {
	const rel = e.target.closest('.sh-relation');
	if (!rel || e.target.closest('button, a, .sh-rel-portrait')) return;
	const img = rel.querySelector('.sh-rel-portrait img');
	if (!img) return;
	const willExpand = img.classList.contains('collapsed');
	const panel = rel.closest('#sh-relations');
	(panel || document).querySelectorAll('.sh-rel-portrait img')
		.forEach(i => i.classList.add('collapsed'));
	if (willExpand) img.classList.remove('collapsed');
});

// ── Dépense d'XP ─────────────────────────────────────────────
// Bornes raciales : `let` et non `const` — la fiche sert aussi les compagnons, qui peuvent
// être d'une autre race (openCompagnonSheet les remplace, closeCompagnonSheet les restaure).
let _RACE_MIN  = {{ race["stats"]     | tojson | safe }};
let _RACE_MAX  = {{ race["stats_max"] | tojson | safe }};
let _charStats   = {{ character["caracteristiques_current"] | tojson | safe }};
let _statCaps    = {{ stat_caps | tojson | safe }};
let _attributePoints = {{ character.get("attribute_points", 0) | tojson | safe }};
let _vocNiveau   = {{ character.get("vocations_niveaux", {}).get(character.get("voc", ""), 0) | tojson | safe }};
const _STAT_COEFF = {{ xp_coeff | tojson | safe }};
const _VOC_COEFF = {{ xp_voc_coeff | tojson | safe }};
// Grille « Profil modifié » : {code: {base, total, delta, sources:[{origine,nom,icon,delta}]}}
let _caractsDetail = {{ caracts_detail | tojson | safe }};
// Bloc ✦ Expérience : ces valeurs suivent le personnage AFFICHÉ (le joueur ou un compagnon),
// d'où des globales et un rendu client (_renderXp) plutôt que le seul rendu Jinja initial.
let _xpTotal   = {{ character.get("xp_total", 0) | tojson | safe }};
let _niveau    = {{ character.get("niveau", 0) | tojson | safe }};
let _xpNivPrev = {{ xp_niv_prev | tojson | safe }};
let _xpNivNext = {{ xp_niv_next | tojson | safe }};
let _raceNom   = {{ character.get("race", "") | tojson | safe }};
let _vocId     = {{ character.get("voc", "") | tojson | safe }};
{# `sex` : sert à la silhouette du paperdoll (equipement_<race>_<sexe>.png), remplacée en mode compagnon. #}
let _sexe      = {{ character.get("sex", "m") | tojson | safe }};
// Icône + libellé par vocation : un compagnon n'a pas forcément celle du joueur.
const VOC_LABELS = {{ vocations_labels | tojson | safe }};
function _vocLabel(voc) {
	const v = VOC_LABELS[voc] || {};
	return `${v.icon || ''} ${v.label || voc || ''}`.trim();
}
const _CARACT_NOMS = [["V","Vitesse"],["F","Force"],["R","Résistance"],["Ag","Agilité"],
	["Vol","Volonté"],["Int","Intelligence"],["Cha","Charisme"],["Ch","Chance"]];
const _ORIGINE_LBL = {equipement: "Équipement", competence: "Compétences", effet: "Effets"};

function _xpCostNext(statKey) {
	const cur     = _charStats[statKey] || 0;
	const raceMin = _RACE_MIN[statKey]  || 0;
	const coeff   = _STAT_COEFF[statKey] || 1;
	return Math.max(0, (cur + 1 - raceMin) * coeff);
}

// Bloc ✦ Expérience (XP totale, niveau de race, jauge, vocation) — mêmes formules que le
// rendu Jinja initial, mais sur les globales : elles décrivent le personnage AFFICHÉ, qui
// peut être un compagnon (race, vocation et seuils d'XP différents).
function _renderXp() {
	const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
	set('sh-xp-total', _xpTotal);
	set('sh-race-label', _raceNom);
	set('sh-race-niveau', _niveau);
	set('sh-xp-next-lbl', `Niv. ${_niveau + 1} à ${_xpNivNext} XP`);
	set('sh-voc-label', (VOC_LABELS[_vocId] || {}).label || _vocId);
	set('sh-voc-niveau', _vocNiveau);
	set('sh-voc-cout', (_vocNiveau + 1) * _VOC_COEFF);
	const fill = document.getElementById('sh-xp-fill');
	if (fill) {
		const pct = _xpNivNext > _xpNivPrev
			? Math.min(100, Math.floor((_xpTotal - _xpNivPrev) / (_xpNivNext - _xpNivPrev) * 100))
			: 100;
		fill.style.width = pct + '%';
	}
}

function _refreshStatBoxes() {
	document.getElementById('sh-attribute-points').textContent = _attributePoints;
	_renderXp();
	for (const code of ["V","F","R","Ag","Vol","Int","Cha","Ch"]) {
		const val  = _charStats[code] || 0;
		const cap  = _statCaps[code]  || 0;
		const cost = _xpCostNext(code);
		const isAccessible = cap >= (_RACE_MAX[code] || 0);

		const svEl = document.getElementById('sh-sv-' + code);
		if (svEl) {
			const sep = svEl.querySelector('.sh-stat-max-sep');
			svEl.childNodes[0].textContent = val;
			if (sep) sep.textContent = '/' + cap;

			// Jauge et repère de plafond : mêmes formules que le rendu Jinja initial.
			const box     = svEl.closest('.sh-stat-box');
			const maxRace = _RACE_MAX[code] || 1;
			const fill = box && box.querySelector('.sh-stat-fill');
			if (fill) fill.style.width = Math.round(val / maxRace * 100) + '%';
			const pip = box && box.querySelector('.sh-stat-pip');
			if (pip) {
				pip.style.left = Math.round(cap / maxRace * 100) + '%';
				pip.classList.toggle('subcap', !isAccessible);
			}
		}
		const btn = document.getElementById('sh-btn-' + code);
		if (btn) {
			btn.style.display = _attributePoints > 0 ? '' : 'none';
			btn.disabled = val >= cap || _attributePoints < cost;
			btn.classList.toggle('subcap', !isAccessible);
			const costEl = btn.querySelector('.sh-xp-cost');
			if (costEl) costEl.innerHTML = cost + ' P<small>oints</small>';
		}
	}
	const btn = document.getElementById('sh-btn-voc-niveau');
	if (btn) {
		const cost_vocation = (_vocNiveau + 1) * _VOC_COEFF;
		btn.style.display = (_attributePoints > 0 && _vocNiveau < 5) ? '' : 'none';
		btn.disabled = _vocNiveau >= 5 || _attributePoints < cost_vocation;
	}
}

// Texte de l'infobulle d'une caract : valeur de base, plafond/max racial, puis chaque source
// nommée (objet équipé, compétence passive, consommable/sort en cours). Servi au survol (title)
// ET au clic (toast) — le tactile n'a pas de survol, cf. showCaractTooltip.
function _caractTooltipLignes(code, nom) {
	const d = _caractsDetail[code] || {base: 0, total: 0, delta: 0, sources: []};
	const lignes = [`${nom} : ${d.base}`,
					`Max racial : ${_RACE_MAX[code] || 0} \nCourant : ${d.total || d.base}`];
	// Sources regroupées par origine, dans l'ordre Équipement/Compétences/Effets.
	for (const origine of ['equipement', 'competence', 'effet']) {
		for (const s of (d.sources || []).filter(s => s.origine === origine)) {
			const sd = s.delta > 0 ? '+' + s.delta : '−' + Math.abs(s.delta);
			lignes.push(`${_ORIGINE_LBL[origine]} · ${s.icon} ${s.nom} ${sd}`);
		}
	}
	if (!d.delta) lignes.push('Aucun modificateur');
	return lignes;
}

// Clic sur une boîte de caract : même contenu que le title, mais en toast — seul canal
// disponible au tactile. Le bouton de dépense d'XP garde son propre clic.
function showCaractTooltip(ev, code) {
	if (ev.target.closest('.sh-xp-btn')) return;
	const paire = _CARACT_NOMS.find(([c]) => c === code);
	if (paire) showToast(_caractTooltipLignes(code, paire[1]).join('\n'));
}

// Valeur courante de chaque caract, tous modificateurs compris, avec un tooltip qui
// nomme chaque source (objet équipé, compétence passive, consommable/sort en cours).
function _renderCaractsMod(detail) {
	if (detail) _caractsDetail = detail;
	for (const [code, nom] of _CARACT_NOMS) {
		const el = document.getElementById('sh-mod-' + code);
		if (!el) continue;
		const d = _caractsDetail[code] || {base: 0, total: 0, delta: 0, sources: []};
		const delta = d.delta || 0;
		const signe = delta > 0 ? '+' + delta : (delta < 0 ? '−' + Math.abs(delta) : '');
		const cls   = delta > 0 ? 'pos' : (delta < 0 ? 'neg' : '');

		el.innerHTML = `<span class="sh-stat-delta ${cls}">${signe}</span>${d.total}`;
		const box = el.closest('.sh-stat-box');
		if (box) {
			box.title = _caractTooltipLignes(code, nom).join('\n');
			box.classList.toggle('buffed', !!delta);
		}
		const bar = document.getElementById('sh-stat-bar-' + code);
		if (!bar) continue;
		// Échelle = plafond RACIAL du personnage affiché : _RACE_MAX suit le compagnon en
		// mode compagnon (le data-attribut, lui, est figé sur la race du joueur par Jinja).
		const maxRace = _RACE_MAX[code] || parseInt(bar.dataset.maxrace, 10);
		if (maxRace) bar.style.width = (d.total / maxRace * 100) + '%';
	}
}

// Dernières dérivées affichées : mémorisées pour pouvoir restaurer la fiche du joueur
// après un détour par celle d'un compagnon (le DOM est la seule autre trace).
let _derivedCur = {{ character.get("derived_stats", {}) | tojson | safe }};

function _refreshDerivedStats(d) {
	if (d) _derivedCur = d;
	const units = {deplacement: ' cases', charge_max: ' kg'};
	for (const key of ['pv_max','pm_max','initiative','deplacement','cc','cd','pa','pm_def','degats_cc','degats_cd','charge_max']) {
		const el = document.getElementById('sh-drv-' + key);
		if (el && d[key] !== undefined) el.textContent = d[key] + (units[key] || '');
		const el2 = document.getElementById('stat-drv-' + key);
		if (el2 && d[key] !== undefined) el2.textContent = d[key] + (units[key] || '');
		const el3 = document.getElementById('stat-left-drv-' + key);
		if (el3 && d[key] !== undefined) el3.textContent = d[key] + (units[key] || '');
	}
	// Les max PV/PM affichés par les cartes du porteur de la fiche (l'ancien id
	// `stat-right-drv-*` était unique : il ne pouvait pas servir N cartes).
	if (d.pv_max !== undefined || d.pm_max !== undefined) {
		cartesDuPorteur(porteurActifId()).forEach(card => {
			const pvm = _q(card, 'pv-max'), pmm = _q(card, 'pm-max');
			if (pvm && d.pv_max !== undefined) pvm.textContent = d.pv_max;
			if (pmm && d.pm_max !== undefined) pmm.textContent = d.pm_max;
		});
	}
}

async function spendXpVocation() {
	const cout = (_vocNiveau + 1) * _VOC_COEFF;
	if (_attributePoints < cout) { alert('Points insuffisants'); return; }

	try {
		const res = await fetch('api/spend_xp_vocation', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({}))
		});
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }

		_vocNiveau       = data.voc_niveau;
		_attributePoints = data.attribute_points;
		// Le niveau de vocation monté est celui du PORTEUR : ne le recopier que sur SES cartes
		// (+ l'onglet Stats et la colonne gauche, qui affichent le porteur de la fiche).
		const nivEls = [
			...cartesDuPorteur(porteurActifId()),
			document.querySelector('.sheet-left-col'),
			document.getElementById('sh-stats'),
		].filter(Boolean).flatMap(root => [...root.querySelectorAll('.voc-niveau')]);
		nivEls.forEach(el => { el.textContent = _vocNiveau; });
		const elCout = document.getElementById('sh-voc-cout');
		if (elCout) elCout.textContent = data.xp_cout_next;
		_refreshStatBoxes();
	} catch (err) { console.error('Erreur spend_xp_vocation', err); }
}

async function spendXp(statKey) {
	const newVal = (_charStats[statKey] || 0) + 1;
	const cost   = _xpCostNext(statKey);
	if (_attributePoints < cost) { alert('Points insuffisants'); return; }

	try {
		const res = await fetch('api/spend_xp', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({stat: statKey, new_value: newVal}))
		});
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }

		_charStats[statKey]  = newVal;
		_attributePoints     = data.attribute_points;
		_statCaps = data.stat_caps;
		_refreshStatBoxes();
		_refreshDerivedStats(data.derived_stats);
		_renderCaractsMod(data.caracts_detail);
	} catch (err) { console.error('Erreur spend_xp', err); }
}

</script>
<style>
	#toast {
		position: fixed;
		bottom: 2rem;
		left: 50%;
		transform: translateX(-50%) translateY(4rem);
		background: #2c2c38;

		color: var(--text);

		border-radius: 8px;

		opacity: 0;
		transition: opacity .4s, transform .4s;
		pointer-events: none;

	#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

<div id="toast"></div>
<script>
	function showToast(msg) {
		const t = document.getElementById('toast');
		t.textContent = msg;
		t.classList.add('show');
		setTimeout(() => t.classList.remove('show'), 3500);
	}
	const _xpNotif = sessionStorage.getItem('xp_gain_notif');
	if (_xpNotif) {
		sessionStorage.removeItem('xp_gain_notif');
		showToast('Nouveau lieu découvert ! +' + _xpNotif + ' XP');
	}
	const _niveauUpNotif = sessionStorage.getItem('niveau_up_notif');
	if (_niveauUpNotif) {
		sessionStorage.removeItem('niveau_up_notif');
		showToast('Niveau ' + _niveauUpNotif + ' atteint !');
	}
	const _focusArrive = sessionStorage.getItem('focus_arrive_notif');
	if (_focusArrive !== null) {
		sessionStorage.removeItem('focus_arrive_notif');
		showToast('🧭 Vous êtes arrivé : ' + _focusArrive);
	}
	const _zoneEvt = sessionStorage.getItem('zone_event_notif');
	if (_zoneEvt) {
		sessionStorage.removeItem('zone_event_notif');
		showZoneEvent(JSON.parse(_zoneEvt));
	}
	// ── Intro narrative : choix de la raison + conclusion ─────────────────────
	async function choisirRaisonIntro(raisonId) {
		try {
			const res = await fetch('api/intro/raison', {
				method: 'POST', headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({ raison: raisonId })
			});
			const data = await res.json();
			if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
			document.getElementById('intro-texte').textContent = data.texte_suite || '';
			document.getElementById('intro-raisons').innerHTML =
				'<li><button class="sub-loc-btn" onclick="fermerIntro()">🛤 Prendre la route</button></li>';
		} catch (err) { console.error('Erreur intro', err); }
	}
	function fermerIntro() {
		document.getElementById('intro-overlay').classList.add('intro-hidden');
	}
	// Réutilise l'overlay (toujours présent, masqué) pour afficher la conclusion —
	// déclenchée par un pas (réponse move) ou rejouée après reload (sessionStorage).
	function showIntroConclusion(evt) {
		if (!evt) return;
		const ov = document.getElementById('intro-overlay');
		if (!ov) return;
		document.getElementById('intro-titre').textContent = evt.titre || '';
		document.getElementById('intro-texte').textContent = evt.texte || '';
		document.getElementById('intro-raisons').innerHTML =
			'<li><button class="sub-loc-btn" onclick="fermerIntro()">✔ Continuer</button></li>';
		ov.classList.remove('intro-hidden');
	}
	window.choisirRaisonIntro = choisirRaisonIntro;
	window.fermerIntro = fermerIntro;
	window.showIntroConclusion = showIntroConclusion;
	const _introFin = sessionStorage.getItem('intro_fin_notif');
	if (_introFin) {
		sessionStorage.removeItem('intro_fin_notif');
		showIntroConclusion(JSON.parse(_introFin));
	}
	function _zoneEventLabel(evt) {
		const icons = { combat: '⚔', ressource: '🌿', pnj: '🧙', rien: '…' };
		return (icons[evt.type] || '❓') + ' ' + ((evt.tags || []).join(', ') || evt.type);
	}
	function showZoneEvent(evt) {
		if (!evt || evt.type === 'rien') return;
		showToast(_zoneEventLabel(evt));
	}
</script>
<script>
// ── Équipement ──────────────────────────────────────────────────────────
const SLOT_LABELS = {
	tete: "Tête", cou: "Cou", torse: "Torse",
	mains: "Bras", pieds: "Pieds",
	anneau_1: "Anneau 1", anneau_2: "Anneau 2", ceinture: "Ceinture",
	jambes: "Jambes", main_droite: "Main D.", main_gauche: "Main G."
};

let _inventaire   = {{ character.get("inventaire", []) | tojson | safe }};
let _slots        = {{ character.get("slots", {}) | tojson | safe }};
let _objetsAuSol  = {{ character.get("objets_au_sol", []) | tojson | safe }};
let _chargeMax    = {{ character.get("derived_stats", {}).get("charge_max", 0) }};
let _effetsActifs = {{ effets_actifs | tojson | safe }};
// Mode « fiche compagnon » — déclarés ICI (et non près de openCompagnonSheet) car le premier
// rendu (_refreshSol/_refreshInventaire → _hasOutilCoupe) les lit à l'init, avant ce bloc :
// une déclaration `let` plus bas les mettrait en zone morte temporelle (TDZ → ReferenceError).
let _compagnonActif = null;   // payload de GET api/groupe/compagnon/{id}
let _sheetSnap = null;        // état du personnage principal, restauré à la fermeture

// Onglet 🤝 Relations : payload plat de tous les lieux connus (rendu client, accordéon
// par ville). REL_CHAR_ID sert à retenir la ville ouverte par personnage (localStorage).
const RELATIONS_LIEUX_INIT = {{ relations_lieux | tojson | safe }};
const REL_CHAR_ID = {{ character.get("_id", "") | tojson | safe }};

// Tri par nom (3 états : null → 'asc' → 'desc' → null), mémorisé par navigateur.
// Logique partagée entre le sac (_invSort) et le sol (_solSort).
const INV_VISIBLE = 20;
function _loadSort(key) { try { const s = localStorage.getItem(key); return (s === 'asc' || s === 'desc') ? s : null; } catch (e) { return null; } }
function _saveSort(key, state) { try { if (state) localStorage.setItem(key, state); else localStorage.removeItem(key); } catch (e) {} }
function _cycleSort(state) { return state === null ? 'asc' : (state === 'asc' ? 'desc' : null); }
// Ordre d'AFFICHAGE seulement : renvoie des index d'origine (adressage serveur conservé).
function _sortedOrder(arr, state) {
	const order = arr.map((_, i) => i);
	if (state) {
		const dir = state === 'asc' ? 1 : -1;
		order.sort((a, b) => dir * String((arr[a] || {}).nom || '')
			.localeCompare(String((arr[b] || {}).nom || ''), undefined, { numeric: true, sensitivity: 'base' }));
	}
	return order;
}
function _updateSortBtn(id, state) {
	const b = document.getElementById(id);
	if (!b) return;
	b.textContent = state === 'asc' ? 'Trier ▲' : (state === 'desc' ? 'Trier ▼' : 'Trier');
	b.classList.toggle('active', !!state);
}

let _invSort = _loadSort('telluris.play.inv_sort');
let _solSort = _loadSort('telluris.play.sol_sort');

function cycleInvSort() { _invSort = _cycleSort(_invSort); _saveSort('telluris.play.inv_sort', _invSort); _refreshInventaire(); }
function cycleSolSort() { _solSort = _cycleSort(_solSort); _saveSort('telluris.play.sol_sort', _solSort); _refreshSol(); }

function updateSortBtn()    { _updateSortBtn('inv-sort-btn', _invSort); }
function updateSolSortBtn() { _updateSortBtn('sol-sort-btn', _solSort); }

// Poids porté = somme des `poids` des items du sac + des items équipés.
function _currentCharge() {
	let total = 0;
	(_inventaire || []).forEach(it => { if (it) total += +(it.poids || 0); });
	Object.values(_slots || {}).forEach(it => { if (it) total += +(it.poids || 0); });
	return total;
}

// Jauge de charge : pip fixe à 50 % (= charge_max/2). Orange au-delà (seuil de malus
// en combat, indicatif en ville), rouge en surcharge. Désactive les flèches si surchargé.
function _refreshChargeGauge() {
	const fill = document.getElementById('charge-fill');
	const label = document.getElementById('charge-label');
	if (!fill) return;
	const charge = _currentCharge();
	const max = _chargeMax || 0;
	const half = max / 2;
	fill.style.width = (max > 0 ? Math.min(100, charge / max * 100) : 0) + '%';
	fill.classList.toggle('over-half', charge > half && charge <= max + 1e-6);
	fill.classList.toggle('over-max',  charge > max + 1e-6);
	if (label) {
		let txt = `${charge.toFixed(1)} / ${max} kg`;
		if (charge > max + 1e-6)   txt += ` · <span class="err">surcharge — déplacement bloqué</span>`;
		else if (charge > half)    txt += ` · <span class="warn">demi-charge</span>`;
		label.innerHTML = txt;
	}
	updateControls();
}

// Silhouette du paperdoll : dépend de la race ET du sexe du PORTEUR — donc du compagnon dès
// que la fiche en sert un. Rendue côté client depuis les globales (jamais par Jinja, qui la
// figerait sur le joueur de la page) et rafraîchie avec les slots qu'elle porte.
function _refreshPaperdollImg() {
	const img = document.querySelector('.sh-paperdoll-img');
	if (img && _raceNom && _sexe) {
		img.src = `/icons/equipement_${_raceNom}_${String(_sexe).toLowerCase()}.png`;
	}
}

function _refreshPaperdoll() {
	_refreshPaperdollImg();
	for (const [slot, item] of Object.entries(_slots)) {
		const el = document.getElementById('slot-' + slot);
		if (!el) continue;
		const nameEl    = el.querySelector('.sh-slot-name');
		const unequipEl = el.querySelector('.sh-unequip-btn');
		if (item) {
			if (nameEl) { nameEl.textContent = item.nom || '?'; nameEl.className = 'sh-slot-name'; }
			if (unequipEl) unequipEl.style.display = '';
			el.classList.add('occupied');
			el.title = 'Voir la fiche';
		} else {
			if (nameEl) { nameEl.textContent = '—'; nameEl.className = 'sh-slot-name sh-slot-empty'; }
			if (unequipEl) unequipEl.style.display = 'none';
			el.classList.remove('occupied');
			el.title = '';
		}
	}
}

function _refreshInventaire() {
	const sacEl = document.getElementById('sh-inv-sac');
	const scrollEl = document.getElementById('sh-sac-scroll');
	if (!sacEl) return;
	if (!_inventaire || !_inventaire.length) {
		sacEl.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">🎒</span>Inventaire vide</div>';
		if (scrollEl) scrollEl.classList.remove('scrollable');
		updateSortBtn();
		return;
	}
	sacEl.innerHTML = _sortedOrder(_inventaire, _invSort).map(idx => {
		const item = _inventaire[idx];
		if (!item || typeof item !== 'object') return '';
		const compat = (item.slots || []).filter(s => s in SLOT_LABELS);
		let equipHtml = '';
		if (compat.length) {
			const selHtml = compat.length > 1
				? `<select class="sh-equip-sel">${compat.map(s => `<option value="${s}">${SLOT_LABELS[s]}</option>`).join('')}</select>`
				: `<span class="sh-equip-sel" data-slot="${compat[0]}" style="display:none"></span>`;
			equipHtml = `<div class="sh-equip-row">${selHtml}<button class="sh-equip-btn" onclick="equipFromSac('${item._id}',this)">Équiper</button></div>`;
		}
		const rarHtml = item.rarete ? `<span class="sh-rarity ${item.rarete}">${item.rarete}</span>` : '';
		const poidsHtml = item.poids ? `<span class="sh-inv-poids">${(+item.poids).toFixed(1)} kg</span>` : '';
		const dropHtml = `<button class="sh-drop-btn" onclick="dropItem(${idx},'${item._id}')" title="Poser au sol">Poser</button>`;
		const couperHtml = _estCoupable(item) ? _couperBtn(idx, item._id, 'sac') : '';
		const consoHtml = _estConsommable(item)
			? `<button class="sh-drop-btn" onclick="consommerItem(${idx},'${item._id}',this)" title="Consommer">🍽️ Consommer</button>`
			: '';
		return `<div class="sh-inv-item">
			<span class="sh-inv-open" onclick="openItemDetail('sac',${idx})" title="Voir la fiche">${item.icon || '📦'}</span>
			<span class="sh-inv-name sh-inv-open" onclick="openItemDetail('sac',${idx})" title="Voir la fiche">${item.nom || '—'}</span>
			${poidsHtml}
			${rarHtml}${equipHtml}<span class="sh-inv-actions">${consoHtml}${couperHtml}${dropHtml}</span>
		</div>`;
	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', _inventaire.length > INV_VISIBLE);
	updateSortBtn();
}

// Objets au sol (transitoires) : reprenables tant qu'on n'a pas bougé.
function _refreshSol() {
	const solEl = document.getElementById('sh-inv-sol');
	const section = document.getElementById('sh-sol-section');
	const scrollEl = document.getElementById('sh-sol-scroll');
	if (!solEl) return;
	const has = _objetsAuSol && _objetsAuSol.length;
	if (section) section.style.display = has ? 'flex' : 'none';
	if (scrollEl) scrollEl.style.display = has ? '' : 'none';
	if (!has) { solEl.innerHTML = ''; if (scrollEl) scrollEl.classList.remove('scrollable'); updateSolSortBtn(); return; }
	solEl.innerHTML = _sortedOrder(_objetsAuSol, _solSort).map(idx => {
		const item = _objetsAuSol[idx];
		if (!item || typeof item !== 'object') return '';
		const poidsHtml = item.poids ? `<span class="sh-inv-poids">${(+item.poids).toFixed(1)} kg</span>` : '';
		const rarHtml = item.rarete ? `<span class="sh-rarity ${item.rarete}">${item.rarete}</span>` : '';
		return `<div class="sh-inv-item">
			<span class="sh-inv-open" onclick="openItemDetail('sol',${idx})" title="Voir la fiche">${item.icon || '📦'}</span>
			<span class="sh-inv-name sh-inv-open" onclick="openItemDetail('sol',${idx})" title="Voir la fiche">${item.nom || '—'}</span>
			${poidsHtml}${rarHtml}
			<span class="sh-inv-actions">${_estCoupable(item) ? _couperBtn(idx, item._id, 'sol') : ''}<button class="sh-pickup-btn" onclick="pickupItem(${idx},'${item._id}')" title="Prendre du sol">Prendre</button></span>
		</div>`;
	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', _objetsAuSol.length > INV_VISIBLE);
	updateSolSortBtn();
}

// ── Fiche objet / comparaison d'équipement ────────────────────────────
// Clic sur un objet (sac/sol) ou une case équipée → fiche flottante.
// Si l'objet peut remplacer un équipement (ou l'inverse), les deux objets
// sont affichés côte à côte avec comparaison chiffrée des caractéristiques.
let _itemDetailState = null;

function _itemMode(item) {
	const tags = (item && item.tags) || [];
	if (tags.includes('tir')) return 'tir';
	if (tags.includes('jet')) return 'jet';
	return 'cac';
}
// Miroir client de restriction_satisfaite (utils/characters.py) : ET sur {caract:min}.
function _restrictionOk(restriction) {
	const manque = {};
	if (restriction) {
		for (const [k, v] of Object.entries(restriction)) {
			if ((+(_charStats[k] || 0)) < +v) manque[k] = v;
		}
	}
	return { ok: Object.keys(manque).length === 0, manque };
}
function _slotCandidatesInBag(slot) {
	const out = [];
	(_inventaire || []).forEach((it, i) => {
		if (it && typeof it === 'object' && (it.slots || []).includes(slot)) out.push({ idx: i, item: it });
	});
	return out;
}

// Attributs numériques comparables (better: +1 = plus haut mieux, -1 = plus bas mieux).
const _CMP_ATTRS = [
	{ label: 'Poids',        get: it => +(it.poids || 0),             better: -1, fmt: v => v.toFixed(1) + ' kg', always: true },
	{ label: 'Portée',       get: it => it.categorie === 'arme' ? +(it.portee || 1) : null, better: 1, fmt: v => String(v) },
	{ label: 'Armure',       get: it => +(it.bonus_pa || 0),          better: 1,  fmt: v => '+' + v },
	{ label: 'PV',           get: it => +(it.bonus_pv || 0),          better: 1,  fmt: v => '+' + v },
	{ label: 'PM',           get: it => +(it.bonus_pm || 0),          better: 1,  fmt: v => '+' + v },
	{ label: 'Toucher CàC',  get: it => +(it.bonus_cc || 0),          better: 1,  fmt: v => '+' + v },
	{ label: 'Toucher dist.',get: it => +(it.bonus_cd || 0),          better: 1,  fmt: v => '+' + v },
	{ label: 'Dégâts',       get: it => +(it.bonus_degats || 0),      better: 1,  fmt: v => '+' + v },
	{ label: 'Initiative',   get: it => +(it.bonus_initiative || 0),  better: 1,  fmt: v => '+' + v },
	// V porté par l'objet : `bonus.V` + `bonus_malus_depl` (delta négatif des armures
	// lourdes), les deux se cumulant sur la même caract. Plus haut = mieux.
	{ label: 'Vitesse (V)',  get: it => +((it.bonus || {}).V || 0) + +(it.bonus_malus_depl || 0),
	  better: 1, fmt: v => (v > 0 ? '+' : '') + v },
];

function _fmtDelta(d) { return Number.isInteger(d) ? String(d) : d.toFixed(1); }

function _catText(item) {
	if (!item) return '';
	const c = item.categorie || '';
	const sc = item.sous_categorie || '';
	return sc && sc !== c ? `${c} · ${sc}` : c;
}
function _weaponModeText(item) {
	if (!item || item.categorie !== 'arme') return '';
	const m = _itemMode(item);
	return m === 'tir' ? 'Tir' : (m === 'jet' ? 'Jet' : 'Corps à corps');
}
function _effetsChips(item) {
	const e = (item && item.effets) || {};
	const chips = [];
	if (e.pv) chips.push(`❤️ +${e.pv} PV`);
	if (e.pm) chips.push(`💧 +${e.pm} PM`);
	if (e.regen_pv) chips.push(`❤️ +${e.regen_pv} PV/tour`);
	if (e.regen_pm) chips.push(`💧 +${e.regen_pm} PM/tour`);
	for (const [k, v] of Object.entries(e.buffs || {})) chips.push(`✨ ${v > 0 ? '+' : ''}${v} ${k}`);
	if (e.duree) chips.push(`⏳ ${e.duree} tours`);
	return chips;
}
// `bonus_degats_dice` porte le nombre de FACES en base (6 = 1D6) : miroir de
// models/character_stats.normalize_dice, pour ne pas afficher un « 6 » ambigu.
function _diceText(raw) {
	if (raw === undefined || raw === null || raw === '') return '';
	const s = String(raw).trim().toUpperCase();
	if (s.includes('D')) return s;
	const faces = parseInt(s, 10);
	return faces > 0 ? `1D${faces}` : '';
}

function _bonusChips(item) {
	const b = (item && item.bonus) || {};
	// V est déjà donné par la ligne comparable « Vitesse (V) » (qui y agrège le malus
	// d'armure) : on ne le répète pas en chip.
	return Object.keys(b).filter(k => k !== 'V').sort()
		.map(k => `✨ ${b[k] > 0 ? '+' : ''}${b[k]} ${k}`);
}

function _faceCell(item, role) {
	if (!item) return `<div class="item-cmp-face"><div><span class="item-cmp-role">${role}</span><span class="item-cmp-empty">— aucun —</span></div></div>`;
	const rar = item.rarete ? ` <span class="sh-rarity ${item.rarete}">${item.rarete}</span>` : '';
	return `<div class="item-cmp-face"><span class="ic">${item.icon || '📦'}</span><div><span class="item-cmp-role">${role}</span><span class="nm">${item.nom || '—'}</span>${rar}</div></div>`;
}

// Lignes numériques : delta candidat − équipé affiché sur la face droite (mode comparaison).
function _numRows(left, right, compare) {
	let rows = '';
	for (const a of _CMP_ATTRS) {
		const lv = left ? a.get(left) : null;
		const rv = right ? a.get(right) : null;
		const lHas = lv !== null && lv !== undefined;
		const rHas = rv !== null && rv !== undefined;
		if (!lHas && !rHas) continue;
		if (!a.always) {
			const lz = !lHas || lv === 0, rz = !rHas || rv === 0;
			if (lz && rz) continue;
		}
		const lCell = `<span class="cell">${lHas ? a.fmt(lv) : '—'}</span>`;
		let rCell = '';
		if (compare) {
			let deltaHtml = '';
			if (lHas && rHas && rv !== lv) {
				const d = rv - lv;
				const good = a.better > 0 ? d > 0 : d < 0;
				deltaHtml = `<span class="delta ${good ? 'delta-up' : 'delta-down'}">${good ? '▲' : '▼'} ${d > 0 ? '+' : ''}${_fmtDelta(d)}</span>`;
			}
			rCell = `<span class="cell">${rHas ? a.fmt(rv) : '—'}${deltaHtml}</span>`;
		}
		rows += `<div class="item-cmp-row"><span class="lbl">${a.label}</span>${lCell}${rCell}</div>`;
	}
	return rows;
}
function _textRow(label, lval, rval, compare) {
	const lHas = lval !== null && lval !== undefined && lval !== '';
	const rHas = rval !== null && rval !== undefined && rval !== '';
	if (!lHas && (!compare || !rHas)) return '';
	const l = `<span class="cell muted">${lHas ? lval : '—'}</span>`;
	const r = compare ? `<span class="cell muted">${rHas ? rval : '—'}</span>` : '';
	return `<div class="item-cmp-row"><span class="lbl">${label}</span>${l}${r}</div>`;
}
function _restrictionCell(item) {
	const restr = item && item.restriction;
	if (!restr || !Object.keys(restr).length) return '<span class="cell muted">—</span>';
	const txt = Object.entries(restr).map(([k, v]) => {
		const ok = (+(_charStats[k] || 0)) >= +v;
		return `<span class="${ok ? 'item-cmp-ok' : 'item-cmp-bad'}">${k} ${v}</span>`;
	}).join(', ');
	return `<span class="cell">${txt}</span>`;
}
function _restrictionRow(left, right, compare) {
	const lHas = left && left.restriction && Object.keys(left.restriction).length;
	const rHas = right && right.restriction && Object.keys(right.restriction).length;
	if (!lHas && (!compare || !rHas)) return '';
	let html = `<div class="item-cmp-row"><span class="lbl">Restriction</span>${_restrictionCell(left)}`;
	if (compare) html += _restrictionCell(right);
	return html + `</div>`;
}
function _effetsRow(left, right, compare) {
	const lc = _effetsChips(left), rc = compare ? _effetsChips(right) : [];
	if (!lc.length && !rc.length) return '';
	const cell = arr => arr.length
		? `<span class="cell"><span class="item-cmp-chips">${arr.map(c => `<span class="sh-effet-chip">${c}</span>`).join('')}</span></span>`
		: '<span class="cell muted">—</span>';
	let html = `<div class="item-cmp-row"><span class="lbl">Effets</span>${cell(lc)}`;
	if (compare) html += cell(rc);
	return html + `</div>`;
}
function _bonusRow(left, right, compare) {
	const lc = _bonusChips(left), rc = compare ? _bonusChips(right) : [];
	if (!lc.length && !rc.length) return '';
	const cell = arr => arr.length
		? `<span class="cell"><span class="item-cmp-chips">${arr.map(c => `<span class="sh-effet-chip">${c}</span>`).join('')}</span></span>`
		: '<span class="cell muted">—</span>';
	let html = `<div class="item-cmp-row"><span class="lbl">Bonus caract.</span>${cell(lc)}`;
	if (compare) html += cell(rc);
	return html + `</div>`;
}

// Table comparaison (right null → mono-colonne).
function _renderCmpTable(left, right, roleLeft, roleRight) {
	const compare = !!right;
	let hd = `<div class="item-cmp-hd"><span></span>${_faceCell(left, roleLeft)}`;
	if (compare) hd += _faceCell(right, roleRight);
	hd += `</div>`;
	let rows = '';
	rows += _textRow('Catégorie', _catText(left), compare ? _catText(right) : null, compare);
	rows += _textRow('Mode', _weaponModeText(left), compare ? _weaponModeText(right) : null, compare);
	rows += _numRows(left, right, compare);
	rows += _textRow('Dés de dégâts', left && _diceText(left.bonus_degats_dice),
		compare ? (right && _diceText(right.bonus_degats_dice)) : null, compare);
	rows += _restrictionRow(left, right, compare);
	rows += _bonusRow(left, right, compare);
	rows += _effetsRow(left, right, compare);
	return `<div class="item-cmp ${compare ? 'compare' : 'mono'}">${hd}${rows}</div>`;
}

function _restrictionTitle(chk) {
	return chk.ok ? '' : `title="Restriction non satisfaite : ${Object.entries(chk.manque).map(([k, v]) => k + ' ' + v).join(', ')}"`;
}
function _cardCouperBtn(idx, itemId, source) {
	const tool = _hasOutilCoupe();
	return `<button class="sh-drop-btn" ${tool ? '' : 'disabled'} onclick="_cardCouper(${idx},'${itemId}','${source}')" title="${tool ? 'Couper en pièces plus petites' : 'Outil de coupe requis'}">🪓 Couper</button>`;
}

function _renderMono(st) {
	const item = st.item;
	let html = `<h3>${item.icon || '📦'} ${item.nom || '—'}</h3>`;
	html += _renderCmpTable(item, null, 'Objet', '');
	const acts = [];
	if (st.source === 'sac') {
		if (_estConsommable(item)) acts.push(`<button class="sh-equip-btn" onclick="_cardConsommer(${st.idx},'${item._id}')">🍽️ Consommer</button>`);
		if (_estCoupable(item)) acts.push(_cardCouperBtn(st.idx, item._id, 'sac'));
		acts.push(`<button class="sh-drop-btn" onclick="_cardDrop(${st.idx},'${item._id}')">Poser</button>`);
	} else if (st.source === 'sol') {
		if (_estCoupable(item)) acts.push(_cardCouperBtn(st.idx, item._id, 'sol'));
		acts.push(`<button class="sh-equip-btn" onclick="_cardPickup(${st.idx},'${item._id}')">Prendre</button>`);
	}
	else if (st.source in _GRP_SENS) {
		const dest = _grpPorteurs(st.source).dest;
		const rentre = _grpRentre(item, dest);
		const fleche = st.source === 'grp_principal' ? '→' : '←';
		acts.push(`<button class="sh-equip-btn" ${rentre ? '' : 'disabled'}
			title="${rentre ? 'Transférer' : 'Trop lourd — le destinataire est à sa charge maximale'}"
			onclick="_cardTransferer('${st.source}',${st.idx},'${item._id}')">${fleche} Transférer</button>`);
	}
	if (acts.length) html += `<div class="item-detail-actions">${acts.join('')}</div>`;
	return html;
}
function _renderSacCompare(st) {
	const cand = st.candItem;
	const equipped = _slots[st.slot] || null;
	let html = `<h3>${cand.icon || '📦'} ${cand.nom || '—'}</h3>`;
	if (st.slots.length > 1) {
		const opts = st.slots.map(s => `<option value="${s}"${s === st.slot ? ' selected' : ''}>${SLOT_LABELS[s]}${_slots[s] ? ' — ' + (_slots[s].nom || '') : ' — (vide)'}</option>`).join('');
		html += `<div class="item-cmp-slotsel"><span>Emplacement :</span><select onchange="_setDetailSlot(this.value)">${opts}</select></div>`;
	}
	html += _renderCmpTable(equipped, cand, 'Équipé', 'Sélectionné');
	const chk = _restrictionOk(cand.restriction);
	const acts = [];
	acts.push(`<button class="sh-equip-btn" ${chk.ok ? '' : 'disabled'} ${_restrictionTitle(chk)} onclick="_cardEquip('${cand._id}','${st.slot}')">Équiper${equipped ? ' (remplacer)' : ''}</button>`);
	acts.push(`<button class="sh-drop-btn" onclick="_cardDrop(${st.candIdx},'${cand._id}')">Poser</button>`);
	html += `<div class="item-detail-actions">${acts.join('')}</div>`;
	return html;
}
function _renderEquipCompare(st) {
	const equipped = st.equipItem;
	const alt = (st.altPos >= 0 && st.alts[st.altPos]) ? st.alts[st.altPos] : null;
	const cand = alt ? alt.item : null;
	let html = `<h3>${equipped.icon || '📦'} ${equipped.nom || '—'}</h3>`;
	if (st.alts.length) {
		const opts = st.alts.map((a, i) => `<option value="${i}"${i === st.altPos ? ' selected' : ''}>${a.item.nom || '—'}</option>`).join('');
		html += `<div class="item-cmp-slotsel"><span>Remplacer par :</span><select onchange="_setDetailAlt(this.value)">${opts}</select></div>`;
	}
	html += _renderCmpTable(equipped, cand, 'Équipé', 'Candidat (sac)');
	const acts = [];
	if (cand) {
		const chk = _restrictionOk(cand.restriction);
		acts.push(`<button class="sh-equip-btn" ${chk.ok ? '' : 'disabled'} ${_restrictionTitle(chk)} onclick="_cardEquip('${cand._id}','${st.slot}')">Équiper →</button>`);
	}
	acts.push(`<button class="sh-drop-btn" onclick="_cardUnequip('${st.slot}')">Déséquiper</button>`);
	html += `<div class="item-detail-actions">${acts.join('')}</div>`;
	return html;
}

function _renderItemDetail() {
	const st = _itemDetailState;
	const body = document.getElementById('item-detail-body');
	if (!st || !body) return;
	if (st.mode === 'mono')          body.innerHTML = _renderMono(st);
	else if (st.mode === 'sac')      body.innerHTML = _renderSacCompare(st);
	else if (st.mode === 'equip')    body.innerHTML = _renderEquipCompare(st);
	else if (st.mode === 'marchand') body.innerHTML = _renderMarchandDetail(st);
}

function openItemDetail(source, idx) {
	let item = null;
	if (source === 'sac')        item = _inventaire[idx];
	else if (source === 'sol')   item = _objetsAuSol[idx];
	else if (source === 'equip') item = _slots[idx];   // idx = clé de slot
	// Sacs de l'onglet 🎒 Inventaire du groupe : fiche en mono, sans comparaison — l'équipement
	// porté est celui du JOUEUR, comparer le sac d'un compagnon avec mentirait.
	else if (source in _GRP_SENS) item = (_grpPorteurs(source).src.inventaire || [])[idx];
	if (!item || typeof item !== 'object') return;

	if (source === 'equip') {
		const slot = idx;
		const alts = _slotCandidatesInBag(slot);
		_itemDetailState = { mode: 'equip', slot, equipItem: item, alts, altPos: alts.length ? 0 : -1 };
	} else {
		const compat = (item.slots || []).filter(s => s in SLOT_LABELS);
		if (source === 'sac' && compat.length) {
			const slot = compat.find(s => _slots[s]) || compat[0];   // défaut : 1er slot occupé sinon 1er
			_itemDetailState = { mode: 'sac', candIdx: idx, candItem: item, slots: compat, slot };
		} else {
			_itemDetailState = { mode: 'mono', source, idx, item };
		}
	}
	_renderItemDetail();
	document.getElementById('item-detail-overlay').classList.remove('item-detail-hidden');
}
function closeItemDetail() {
	_itemDetailState = null;
	const ov = document.getElementById('item-detail-overlay');
	if (ov) ov.classList.add('item-detail-hidden');
}
function _setDetailSlot(slot) {
	if (_itemDetailState && (_itemDetailState.mode === 'sac' || _itemDetailState.mode === 'marchand')) {
		_itemDetailState.slot = slot;
		_renderItemDetail();
	}
}
function _setDetailAlt(i) {
	if (_itemDetailState && _itemDetailState.mode === 'equip') { _itemDetailState.altPos = +i; _renderItemDetail(); }
}
// Actions depuis la fiche : ferme la fiche puis délègue aux fonctions existantes
// (elles rafraîchissent sac/paperdoll/stats). Les index deviennent obsolètes après coup.
function _cardEquip(itemId, slot)       { closeItemDetail(); equip(itemId, slot); }
function _cardUnequip(slot)             { closeItemDetail(); unequip(slot); }
function _cardDrop(idx, itemId)         { closeItemDetail(); dropItem(idx, itemId); }
function _cardPickup(idx, itemId)       { closeItemDetail(); pickupItem(idx, itemId); }
function _cardConsommer(idx, itemId)    { closeItemDetail(); consommerItem(idx, itemId, null); }
function _cardCouper(idx, itemId, src)  { closeItemDetail(); couperItem(idx, itemId, src); }
function _cardTransferer(source, idx, itemId) { closeItemDetail(); transfererItem(_GRP_SENS[source], idx, itemId); }

// Fiche d'un objet du marchand (vente/achat) : même carte, avec comparaison à
// l'équipement porté si l'objet est équipable, et actions Vendre/Acheter/Marchander.
function openMarchandDetail(sens, arrIdx) {
	const list = sens === 'vente' ? (MARCHAND.vendables || []) : (MARCHAND.achetables || []);
	const entry = list[arrIdx];
	if (!entry) return;
	const compat = (entry.slots || []).filter(s => s in SLOT_LABELS);
	const slot = compat.length ? (compat.find(s => _slots[s]) || compat[0]) : null;
	_itemDetailState = { mode: 'marchand', item: entry, sens, slots: compat, slot };
	_renderItemDetail();
	document.getElementById('item-detail-overlay').classList.remove('item-detail-hidden');
}
function _renderMarchandDetail(st) {
	const it = st.item;
	let html = `<h3>${it.icon || '📦'} ${it.nom || '—'}</h3>`;
	if (it.compagnon_id) html += `<div class="item-cmp-slotsel"><span>Porteur :</span><strong>👤 ${it.porteur_nom || 'Compagnon'}</strong></div>`;
	if (it.prix) html += `<div class="item-cmp-slotsel"><span>Prix :</span><strong>${it.negocie ? '🤝 ' : ''}${formatPrix(it.prix)}</strong></div>`;
	if (st.slots.length) {
		const equipped = _slots[st.slot] || null;
		if (st.slots.length > 1) {
			const opts = st.slots.map(s => `<option value="${s}"${s === st.slot ? ' selected' : ''}>${SLOT_LABELS[s]}${_slots[s] ? ' — ' + (_slots[s].nom || '') : ' — (vide)'}</option>`).join('');
			html += `<div class="item-cmp-slotsel"><span>Comparer à :</span><select onchange="_setDetailSlot(this.value)">${opts}</select></div>`;
		}
		html += _renderCmpTable(equipped, it, 'Équipé', st.sens === 'vente' ? 'À vendre' : 'Marchandise');
	} else {
		html += _renderCmpTable(it, null, 'Objet', '');
	}
	const acts = [];
	if (st.sens === 'vente') acts.push(`<button class="sh-drop-btn" onclick="_cardSell(${it.index},'${it.item_id}',${_cgArg(it.compagnon_id)})">Vendre</button>`);
	else                     acts.push(`<button class="sh-equip-btn" onclick="_cardBuy('${it.item_id}')">Acheter</button>`);
	const mIdx = st.sens === 'vente' ? it.index : 'null';
	acts.push(`<button class="sh-marchander-btn" ${isMarchBlocked() ? 'disabled' : ''} onclick="_cardMarch(${mIdx},'${it.item_id}','${st.sens}',${_cgArg(it.compagnon_id)})" title="Marchander">🤝 Marchander</button>`);
