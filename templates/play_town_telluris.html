function _cardSell(index, itemId, compagnonId)        { closeItemDetail(); sellItem(index, itemId, compagnonId); }
function _cardBuy(itemId)                             { closeItemDetail(); buyItem(itemId); }
function _cardMarch(index, itemId, sens, compagnonId) { closeItemDetail(); marchanderItem(index, itemId, sens, compagnonId); }

// ── Découpe du bois ───────────────────────────────────────────────────
function _estCoupable(item) {
	return !!item && (item.tags || []).some(t => String(t).toLowerCase() === 'a_couper');
}
function _hasOutilCoupe() {
	const hasTag = o => o && (o.tags || []).some(t => String(t).toLowerCase() === 'outil_coupe_bois');
	const scan = (inv, slots) => (inv || []).some(hasTag) || Object.values(slots || {}).some(hasTag);
	if (scan(_inventaire, _slots)) return true;
	// L'outil est PARTAGÉ par le groupe (miroir de bois.a_outil_coupe côté serveur). En mode
	// compagnon, _inventaire/_slots sont ceux du compagnon affiché ; le principal (qui porte
	// souvent la hache) est rangé dans le snapshot — on l'inclut pour ne pas griser à tort.
	if (_compagnonActif && _sheetSnap && scan(_sheetSnap.inventaire, _sheetSnap.slots)) return true;
	return false;
}
function _couperBtn(idx, itemId, source) {
	const tool = _hasOutilCoupe();
	return `<button class="sh-drop-btn" ${tool ? '' : 'disabled'} onclick="couperItem(${idx},'${itemId}','${source}')" title="${tool ? 'Couper en pièces plus petites' : 'Outil de coupe requis'}">🪓 Couper</button>`;
}
async function couperItem(index, itemId, source) {
	try {
		// `compagnon_id` (injecté par _actionBody en mode compagnon) → le serveur coupe le sac
		// du COMPAGNON ; les pièces tombent toujours au sol du principal (partagé). Le payload
		// renvoyé est alors celui du porteur affiché (sac compagnon + sol principal), donc
		// `_applyInventoryPayload` est correct dans les deux modes. Un « sol » reste toujours
		// une coupe du sol du principal côté serveur, quel que soit le porteur actif.
		const res = await fetch('api/couper', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ index, item_id: itemId, source }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		_applyInventoryPayload(data);
		if (data.coupe) showToast('Coupé : ' + data.coupe.n + ' × ' + (data.coupe.nom || data.coupe.taille));
	} catch(err) { console.error('Erreur coupe', err); }
}

// ── Consommables ──────────────────────────────────────────────────────
// Miroir client de utils/consommables.est_consommable : catégorie + au moins un effet.
function _estConsommable(item) {
	if (!item || item.categorie !== 'consommable') return false;
	const e = item.effets || {};
	return !!(e.pv || e.pm || e.regen_pv || e.regen_pm || (e.buffs && Object.keys(e.buffs).length));
}

// Chips d'effets actifs (colonne gauche de la fiche + onglet stats + panneau perso du jeu).
function _renderEffetsActifs(list) {
	if (Array.isArray(list)) _effetsActifs = list;
	const html = (_effetsActifs || []).map(e => {
		const details = [];
		for (const [k, v] of Object.entries(e.buffs || {})) details.push(`${v > 0 ? '+' : ''}${v} ${k}`);
		if (e.regen_pv) details.push(`+${e.regen_pv} PV/tour`);
		if (e.regen_pm) details.push(`+${e.regen_pm} PM/tour`);
		return `<span class="sh-effet-chip">${e.icon || '✨'} ${e.nom || 'Effet'}${details.length ? ' (' + details.join(', ') + ')' : ''}<span class="sh-effet-restants">⏳${e.restants}</span></span>`;
	}).join('');
	['sh-effets-actifs', 'sh-effets-actifs-stats', 'sh-effets-actifs-panel'].forEach(id => {
		const el = document.getElementById(id);
		if (el) el.innerHTML = html;
	});
}

async function consommerItem(index, itemId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/consommer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ index, item_id: itemId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);   // re-rend le sac (le bouton disparaît avec l'item)
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		const c = data.consomme || {};
		const gains = [];
		if (c.pv_rendu) gains.push(`+${c.pv_rendu} PV`);
		if (c.pm_rendu) gains.push(`+${c.pm_rendu} PM`);
		if (c.effet) gains.push(`effet actif ${c.effet.restants} tours`);
		showToast(`${c.icon || '🍽️'} ${c.nom || 'Consommé'}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur consommation', err); if (btn) btn.disabled = false; }
}

// ── Sorts (onglet ⚡) ─────────────────────────────────────────────────
// Connus (bouton Lancer si utilisable hors combat) + apprenables (coût en points,
// grimoire requis). Rendus client depuis les payloads serveur, resynchronisés par
// les réponses de lancer_sort / apprendre_sort.
let _sorts            = {{ sorts | tojson | safe }};
let _sortsApprenables = {{ sorts_apprenables | tojson | safe }};
let _sortsMagies      = {{ sorts_magies | tojson | safe }};      // écoles pratiquées + achetables
let _sortsEpingles    = {{ sorts_epingles | tojson | safe }};   // accès rapide combat (ids ordonnés)

function _sortEffetsLabel(e) {
	if (!e) return '';
	const parts = [];
	if (e.degats) parts.push(`${e.degats} dég.`);
	if (e.pv) parts.push(`+${e.pv} PV`);
	if (e.pm) parts.push(`+${e.pm} PM`);
	for (const [k, v] of Object.entries(e.buffs || {})) parts.push(`${v > 0 ? '+' : ''}${v} ${k}`);
	if (e.regen_pv) parts.push(`+${e.regen_pv} PV/tour`);
	if (e.regen_pm) parts.push(`+${e.regen_pm} PM/tour`);
	if (e.esquive) parts.push(`esquive +${e.esquive}`);
	if (e.furtivite) parts.push(`🥷 furtivité`);
	if (e.duree) parts.push(`${e.duree} tours`);
	return parts.join(', ');
}
function _sortDomId(sortId) { return sortId.replace(/[^a-zA-Z0-9_-]/g, '_'); }

function _renderSorts(list) {
	if (Array.isArray(list)) _sorts = list;
	const box = document.getElementById('sh-sorts-connus');
	if (!box) return;
	if (!_sorts.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">🔮</span>Aucun sort connu.</div>';
		return;
	}
	box.innerHTML = _sorts.map(s => {
		const compos = (s.composants || []).map(c =>
			`<span class="sh-sort-compo${c.disponible ? '' : ' off'}" title="${c.consomme ? 'Consommé au lancement' : 'Catalyseur (non consommé, il suffit de le porter)'}">${c.consomme ? '⚗️' : '💎'} ${c.icon || ''} ${c.nom}${_sortEffetsLabel(c.bonus) ? ' → ' + _sortEffetsLabel(c.bonus) : ''}</span>`
		).join('');
		const hasCompo = (s.composants || []).some(c => c.disponible);
		const pinned = _sortsEpingles.includes(s.sort_id);
		const pin = `<button type="button" class="sh-pin-btn${pinned ? ' active' : ''}"
			title="${pinned ? 'Retirer de l\'accès rapide (barre de combat)' : 'Épingler en accès rapide (barre de combat)'}"
			onclick="epinglerSort('${s.sort_id}', this)">📌</button>`;
		const actions = pin + (s.lancable
			? `<label class="sh-sort-uselbl" title="Engager les composants disponibles (renforce le sort ; les consommés sont dépensés)"><input type="checkbox" id="sortchk-${_sortDomId(s.sort_id)}" checked ${hasCompo ? '' : 'disabled'}>compo</label>
			   <button type="button" class="sh-drop-btn" onclick="lancerSort('${s.sort_id}', this)">Lancer</button>`
			: `<span class="sh-skill-lvl" title="Utilisable en combat seulement">⚔ combat</span>`);
		return `<div class="sh-skill">
			<span class="sh-skill-icon">${s.icon || '🔮'}</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${s.nom}<span class="sh-sort-pm">${s.cout_pm} PM</span></div>
				<div class="sh-skill-desc">${_sortEffetsLabel(s.effets)}${s.cible === 'ennemi' ? ' · portée ' + s.portee : ''}</div>
				${compos ? `<div class="sh-sort-compos">${compos}</div>` : ''}
			</div>
			<div class="sh-inv-actions">${actions}</div>
		</div>`;
	}).join('');
}

function _renderSortsApprenables(list) {
	if (Array.isArray(list)) _sortsApprenables = list;
	const box = document.getElementById('sh-sorts-apprenables');
	if (!box) return;
	if (!_sortsApprenables.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">📖</span>Aucun sort à apprendre pour l\'instant.</div>';
		return;
	}
	box.innerHTML = _sortsApprenables.map(s => {
		const ok = s.grimoire_ok && _attributePoints >= s.cout_points;
		const grim = s.grimoire_ok
			? '<span class="sh-sort-grim" title="Grimoire porté">📖✔</span>'
			: '<span class="sh-sort-grim" title="Il vous faut le grimoire qui enseigne ce sort (sac ou équipé)">📖✖</span>';
		return `<div class="sh-skill">
			<span class="sh-skill-icon">${s.icon || '🔮'}</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${s.nom}<span class="sh-sort-pm">${s.cout_pm} PM</span> ${grim}</div>
				<div class="sh-skill-desc">Niv. ${s.niveau} · ${_sortEffetsLabel(s.effets)}</div>
			</div>
			<div class="sh-inv-actions">
				<button type="button" class="sh-drop-btn" onclick="apprendreSort('${s.id}', this)" ${ok ? '' : 'disabled'}>Apprendre (${s.cout_points} pts)</button>
			</div>
		</div>`;
	}).join('');
}

async function lancerSort(sortId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	const s = _sorts.find(x => x.sort_id === sortId);
	const chk = document.getElementById('sortchk-' + _sortDomId(sortId));
	const composants = (s && chk && chk.checked)
		? (s.composants || []).filter(c => c.disponible).map(c => c.item) : [];
	try {
		const res = await fetch('api/lancer_sort', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ sort_id: sortId, composants })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_applyInventoryPayload(data);   // composants consommés retirés du sac
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		_renderSorts(data.sorts);
		const l = data.lance || {};
		const gains = [];
		if (l.pv_rendu) gains.push(`+${l.pv_rendu} PV`);
		if (l.pm_rendu > 0) gains.push(`+${l.pm_rendu} PM`);
		if (l.effet) gains.push(`effet actif ${l.effet.restants} tours`);
		showToast(`${l.icon || '🔮'} ${l.nom || 'Sort lancé'}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur sort', err); if (btn) btn.disabled = false; }
}

// Écoles de magie : pratiquées (niveau, native/achetée) + achetables (lettré). Rendu
// client depuis sorts_magies, resync après apprendre_magie / monter_magie / apprendre_sort.
function _renderSortsMagies(payload) {
	if (payload) _sortsMagies = payload;
	const box = document.getElementById('sh-sorts-magies');
	if (!box) return;
	const m = _sortsMagies || {};
	const prat = (m.pratiquees || []).map(e => {
		const tag = e.native ? '<span class="sh-skill-lvl" title="École native de votre vocation">native</span>' : '';
		const monter = (e.montable && m.peut_apprendre)
			? `<button type="button" class="sh-drop-btn" onclick="monterMagie('${e.ecole}', this)" ${_attributePoints >= e.cout_montee ? '' : 'disabled'}>Niv. + (${e.cout_montee} pts)</button>`
			: '';
		return `<div class="sh-skill">
			<span class="sh-skill-icon">✨</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${e.ecole}<span class="sh-sort-pm">Niv. ${e.niveau}</span> ${tag}</div>
			</div>
			<div class="sh-inv-actions">${monter}</div>
		</div>`;
	}).join('');
	const achet = (m.achetables || []).map(e =>
		`<div class="sh-skill">
			<span class="sh-skill-icon">🔓</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${e.ecole}</div>
				<div class="sh-skill-desc">Débloquer la pratique de cette magie</div>
			</div>
			<div class="sh-inv-actions">
				<button type="button" class="sh-drop-btn" onclick="apprendreMagie('${e.ecole}', this)" ${_attributePoints >= e.cout ? '' : 'disabled'}>Pratiquer (${e.cout} pts)</button>
			</div>
		</div>`
	).join('');
	box.innerHTML = (prat || '') + (achet || '')
		|| '<div class="sh-empty"><span class="sh-empty-icon">🏫</span>Aucune école de magie.</div>';
}

function _syncPoints(pts) {
	_attributePoints = pts;
	const a = document.getElementById('sh-attribute-points'); if (a) a.textContent = pts;
	const b = document.getElementById('sh-comp-points');      if (b) b.textContent = pts;
}

async function apprendreMagie(ecole, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_magie', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ ecole }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSortsMagies(data.sorts_magies);
		_renderSortsApprenables(data.apprenables);
		showToast(`🔓 École ${ecole} : pratique débloquée !`);
	} catch(err) { console.error('Erreur apprendre_magie', err); if (btn) btn.disabled = false; }
}

async function monterMagie(ecole, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/monter_magie', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ ecole }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSortsMagies(data.sorts_magies);
		_renderSortsApprenables(data.apprenables);
		showToast(`✨ ${ecole} : niveau ${data.ecole.niveau}`);
	} catch(err) { console.error('Erreur monter_magie', err); if (btn) btn.disabled = false; }
}

async function apprendreSort(sortId, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_sort', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ sort_id: sortId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderSorts(data.sorts);
		_renderSortsApprenables(data.apprenables);
		if (data.sorts_magies) _renderSortsMagies(data.sorts_magies);
		const a = data.appris || {};
		showToast(`${a.icon || '🔮'} ${a.nom || 'Sort'} appris !`);
	} catch(err) { console.error('Erreur apprentissage', err); if (btn) btn.disabled = false; }
}

// ── Compétences (onglet ⚡) ───────────────────────────────────────────
// Miroir des sorts : connues (passives = bonus permanent, actives = bouton Utiliser si
// utilisable hors combat) + apprenables (coût en points, niveau de vocation). Rendues
// client, resynchronisées par les réponses de utiliser_competence / apprendre_competence.
let _competences            = {{ competences | tojson | safe }};
let _competencesApprenables = {{ competences_apprenables | tojson | safe }};
let _competencesEpinglees   = {{ competences_epinglees | tojson | safe }};   // accès rapide combat (ids ordonnés)

function _renderCompetences(list) {
	if (Array.isArray(list)) _competences = list;
	const box = document.getElementById('sh-competences-connues');
	if (!box) return;
	if (!_competences.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">⚡</span>Aucune compétence apprise.</div>';
		return;
	}
	box.innerHTML = _competences.map(c => {
		// Une passive n'a ni action ni pin : son bonus est permanent (inclus dans les dérivées).
		const pinned = _competencesEpinglees.includes(c.competence_id);
		const pin = c.mode === 'active' ? `<button type="button" class="sh-pin-btn${pinned ? ' active' : ''}"
			title="${pinned ? 'Retirer de l\'accès rapide (barre de combat)' : 'Épingler en accès rapide (barre de combat)'}"
			onclick="epinglerCompetence('${c.competence_id}', this)">📌</button>` : '';
		const actions = c.mode === 'passive'
			? '<span class="sh-skill-lvl" title="Bonus permanent, déjà inclus dans vos caractéristiques">🛡 passive</span>'
			: pin + (c.utilisable
				? `<button type="button" class="sh-drop-btn" onclick="utiliserCompetence('${c.competence_id}', this)">Utiliser</button>`
				: '<span class="sh-skill-lvl" title="Utilisable en combat seulement">⚔ combat</span>');
		const pm = c.cout_pm ? `<span class="sh-sort-pm">${c.cout_pm} PM</span>` : '';
		const portee = (c.mode === 'active' && c.cible === 'ennemi') ? ` · portée ${c.portee}` : '';
		return `<div class="sh-skill">
			<span class="sh-skill-icon">${c.icon || '⚡'}</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${c.nom}${pm}</div>
				<div class="sh-skill-desc">${c.description || ''}</div>
				<div class="sh-skill-desc">${_sortEffetsLabel(c.effets)}${portee}</div>
			</div>
			<div class="sh-inv-actions">${actions}</div>
		</div>`;
	}).join('');
}

// Toggle épinglage d'une compétence active en accès rapide (persisté sur le personnage).
async function epinglerCompetence(competenceId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	const epingle = !_competencesEpinglees.includes(competenceId);
	try {
		const res = await fetch('api/epingler_competence', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ competence_id: competenceId, epingle }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_competencesEpinglees = data.competences_epinglees || [];
		_renderCompetences(_competences);   // ré-affiche les états 📌
	} catch(err) { console.error('Erreur épinglage compétence', err); if (btn) btn.disabled = false; }
}

function _renderCompetencesApprenables(list) {
	if (Array.isArray(list)) _competencesApprenables = list;
	const box = document.getElementById('sh-competences-apprenables');
	if (!box) return;
	if (!_competencesApprenables.length) {
		box.innerHTML = '<div class="sh-empty"><span class="sh-empty-icon">📖</span>Aucune compétence à apprendre pour l\'instant.</div>';
		return;
	}
	box.innerHTML = _competencesApprenables.map(c => {
		const ok = _attributePoints >= c.cout_points;
		const tag = c.mode === 'passive' ? '🛡 Passive' : '⚡ Active';
		return `<div class="sh-skill">
			<span class="sh-skill-icon">${c.icon || '⚡'}</span>
			<div class="sh-skill-info">
				<div class="sh-skill-name">${c.nom}<span class="sh-skill-lvl">${tag}</span></div>
				<div class="sh-skill-desc">Niv. ${c.niveau} · ${_sortEffetsLabel(c.effets)}</div>
			</div>
			<div class="sh-inv-actions">
				<button type="button" class="sh-drop-btn" onclick="apprendreCompetence('${c.id}', this)" ${ok ? '' : 'disabled'}>Apprendre (${c.cout_points} pts)</button>
			</div>
		</div>`;
	}).join('');
}

async function utiliserCompetence(competenceId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch
	try {
		const res = await fetch('api/utiliser_competence', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ competence_id: competenceId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		// Vitaux du PORTEUR (un compagnon boit ses propres potions) — pas ceux du joueur.
		updateVitals(data.vitals, porteurActifId());
		_renderEffetsActifs(data.effets_actifs);
		_renderCaractsMod(data.caracts_detail);
		_renderCompetences(data.competences);
		const u = data.utilisee || {};
		const gains = [];
		if (u.pv_rendu) gains.push(`+${u.pv_rendu} PV`);
		if (u.pm_rendu > 0) gains.push(`+${u.pm_rendu} PM`);
		if (u.effet) gains.push(`effet actif ${u.effet.restants} tours`);
		showToast(`${u.icon || '⚡'} ${u.nom || 'Compétence utilisée'}${gains.length ? ' : ' + gains.join(', ') : ''}`);
	} catch(err) { console.error('Erreur compétence', err); if (btn) btn.disabled = false; }
}

async function apprendreCompetence(competenceId, btn) {
	if (btn) btn.disabled = true;
	try {
		const res = await fetch('api/apprendre_competence', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(_actionBody({ competence_id: competenceId }))
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); if (btn) btn.disabled = false; return; }
		_syncPoints(data.attribute_points);
		_renderCompetences(data.competences);
		_renderCompetencesApprenables(data.competences_apprenables);
		_renderCaractsMod(data.caracts_detail);
		// Une passive apprise relève les dérivées (donc les max PV/PM) immédiatement — celles
		// du PORTEUR : la fiche peut être ouverte sur un compagnon, qui apprend pour lui-même.
		if (data.vitals) updateVitals(data.vitals, porteurActifId());
		const a = data.appris || {};
		showToast(`${a.icon || '⚡'} ${a.nom || 'Compétence'} apprise !`);
	} catch(err) { console.error('Erreur apprentissage compétence', err); if (btn) btn.disabled = false; }
}

// Toggle épinglage d'un sort en accès rapide (persisté sur le personnage).
async function epinglerSort(sortId, btn) {
	if (btn) btn.disabled = true;  // anti double-clic pendant le fetch

// ── Vente au marchand ────────────────────────────────────────────────
function formatPrix(prix) {
	const parts = [];
	if (prix.or)     parts.push(prix.or + ' or');
	if (prix.argent) parts.push(prix.argent + ' ar');
	if (prix.cuivre) parts.push(prix.cuivre + ' cu');
	return parts.length ? parts.join(' ') : '0 cu';
}

function updatePurse(purse) {
	if (!purse) return;
	const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
	set('amt-or', purse.or);       set('sell-amt-or', purse.or);
	set('amt-argent', purse.argent); set('sell-amt-argent', purse.argent);
	set('amt-cuivre', purse.cuivre); set('sell-amt-cuivre', purse.cuivre);
}

// État relation/blocage du marchand courant. `blocDeadline` = horloge client absolue
// (on convertit `bloque_jusqu`−`now` serveur en délai relatif pour éviter les décalages).
let MARCHAND = { relation: 50, blocDeadline: 0 };

function isMarchBlocked()  { return MARCHAND.blocDeadline > Date.now(); }
function blocRemainingMin(){ return Math.max(1, Math.ceil((MARCHAND.blocDeadline - Date.now()) / 60000)); }

function setMarchandState(data) {
	if (typeof data.relation === 'number') MARCHAND.relation = data.relation;
	if (typeof data.bloque_jusqu === 'number') {
		const now = (typeof data.now === 'number') ? data.now : Math.floor(Date.now() / 1000);
		const remaining = Math.max(0, data.bloque_jusqu - now);
		MARCHAND.blocDeadline = remaining > 0 ? Date.now() + remaining * 1000 : 0;
	}
	updateRelationBadge();
	if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
}

// Onglet 🤝 Relations : rendu client de TOUS les lieux connus, regroupés par ville
// (lieu_parent → lieu categorie:"ville") en accordéon. Alimenté par RELATIONS_LIEUX_INIT
// à l'init et resynchronisé après quotes/marchander (data.relations_lieux). La ville
// ouverte est retenue par personnage dans localStorage.
function relLieuLabel(v) {
	if (v <= 0)  return 'Banni';
	if (v < 35)  return 'Hostile';
	if (v < 50)  return 'Méfiant';
	if (v === 50) return 'Neutre';
	if (v < 70)  return 'Cordial';
	if (v < 90)  return 'Estimé';
	return 'Honoré';
}

const REL_AUTRES_ID = '__autres__';
function _relOpenKey() { return 'telluris.play.rel_ville_open.' + (typeof REL_CHAR_ID !== 'undefined' ? REL_CHAR_ID : ''); }
function _relLoadOpen() { try { return localStorage.getItem(_relOpenKey()) || ''; } catch (e) { return ''; } }
function _relSaveOpen(id) { try { if (id) localStorage.setItem(_relOpenKey(), id); else localStorage.removeItem(_relOpenKey()); } catch (e) {} }

// Une ligne de lieu (réutilise le markup .sh-relation). Le filtre lit directement le
// texte de .sh-rel-name et .sh-rel-class.
function relLieuRow(r) {
	const v = r.value;
	const cls = v > 50 ? 'pos' : (v < 50 ? 'neg' : 'neu');
	const portrait = r.image
		? `<img src="/${r.image_route}/${r.image}" alt="" class="collapsed">`
		: false;
	return `<div class="sh-relation ${portrait ? "clickable" : ""}">
		${portrait ? "<div class=\"sh-rel-portrait\">"+portrait+"</div>" : ""}
		<div class="sh-rel-info">
			<div class="sh-rel-name"> ${portrait ? "》" : "" } ${r.nom}${r.bloque ? ' <span title="Marchandage bloqué">🚫</span>' : ''}</div>
			<div class="sh-rel-class">${r.categorie || ''}</div>
		</div>
		<div>
			<div class="sh-rel-score ${cls}">${v}<span style="opacity:.5;font-size:.7em">/100</span></div>
			<div class="sh-rel-lbl">${relLieuLabel(v)}</div>
		</div>
		<button class="sh-drop-btn${_focusEst('lieu', r.lieu_id) ? ' btn-highlight' : ''}" data-focus-key="lieu|${r.lieu_id}" onclick="focaliserLieu('${r.lieu_id}')" title="Retrouver ce lieu (guidage)">🧭</button>
	</div>`;
}

function renderFicheRelations(list) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box || !Array.isArray(list)) return;
	if (!list.length) { box.innerHTML = ''; return; }
	const empty = document.getElementById('sh-rel-empty');
	if (empty) empty.remove();

	// Groupement par ville. `own` = la ville elle-même si connue ; `children` = sous-lieux.
	const groups = new Map();
	function ensure(id, nom) {
		let g = groups.get(id);
		if (!g) { g = { id, nom: nom || '', own: null, children: [] }; groups.set(id, g); }
		else if (nom && !g.nom) g.nom = nom;
		return g;
	}
	list.forEach(r => {
		if (r.est_ville) {
			ensure(r.lieu_id, r.nom).own = r;
		} else if (r.lieu_parent) {
			ensure(r.lieu_parent, r.parent_nom).children.push(r);
		} else {
			ensure(REL_AUTRES_ID, 'Autres lieux').children.push(r);
		}
	});
	// Villes triées par nom, « Autres lieux » toujours en dernier.
	const villes = [...groups.values()].filter(g => g.id !== REL_AUTRES_ID)
		.sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
	const autres = groups.get(REL_AUTRES_ID);
	const ordered = autres ? [...villes, autres] : villes;

	const openId = _relLoadOpen();
	let html = '';
	html += ordered.map(g => {
		const children = g.children.slice().sort((a, b) => b.value - a.value);
		const count = children.length + (g.own ? 1 : 0);
		let headScore = '';
		if (g.own) {
			const v = g.own.value;
			const cls = v > 50 ? 'pos' : (v < 50 ? 'neg' : 'neu');
			headScore = `<span class="sh-ville-score ${cls}">${v}/100</span>`;
		}
		const rows = (g.own ? relLieuRow(g.own) : '') + children.map(relLieuRow).join('');
		const isOpen = (g.id === openId);
		return `<div class="sh-ville${isOpen ? ' open' : ''}" data-ville-id="${g.id}">
			<button type="button" class="sh-ville-head" onclick="toggleVilleGroup('${g.id}')">
				<span class="sh-ville-chevron">▶</span>
				<span class="sh-ville-title">${g.nom || g.id}</span>
				<span class="sh-ville-count">${count}</span>
				${headScore}
			</button>
			<div class="sh-ville-body">${rows}</div>
		</div>`;
	}).join('');
	box.innerHTML = html;

	// Ré-appliquer le filtre courant (le rendu remplace tout le HTML).
	const f = document.getElementById('sh-rel-filter');
	if (f && f.value.trim()) applyRelFilter(f.value);
}

// Accordéon : un seul groupe ouvert à la fois, mémorisé par personnage.
function toggleVilleGroup(id) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box) return;
	const target = box.querySelector('.sh-ville[data-ville-id="' + id + '"]');
	if (!target) return;
	const willOpen = !target.classList.contains('open');
	box.querySelectorAll('.sh-ville.open').forEach(el => el.classList.remove('open'));
	if (willOpen) { target.classList.add('open'); _relSaveOpen(id); }
	else { _relSaveOpen(''); }
}

// Filtre texte (nom de lieu, insensible à la casse). Les groupes correspondants sont
// auto-dépliés ; champ vidé → retour à l'état accordéon persistant.
function applyRelFilter(q) {
	const box = document.getElementById('sh-rel-lieux');
	if (!box) return;
	const term = (q || '').trim().toLowerCase();
	const villes = box.querySelectorAll('.sh-ville');
	if (!term) {
		const openId = _relLoadOpen();
		villes.forEach(v => {
			v.classList.remove('hidden');
			v.querySelectorAll('.sh-relation').forEach(r => r.classList.remove('hidden'));
			v.classList.toggle('open', v.getAttribute('data-ville-id') === openId);
		});
		return;
	}
	villes.forEach(v => {
		const villeName = (v.querySelector('.sh-ville-title')?.textContent || '').toLowerCase();
		const villeMatches = villeName.includes(term);
		let anyMatch = false;
		v.querySelectorAll('.sh-relation').forEach(r => {
			const nm = (r.querySelector('.sh-rel-name')?.textContent || '').toLowerCase();
			const cl = (r.querySelector('.sh-rel-class')?.textContent || '').toLowerCase();
			const match = villeMatches || nm.includes(term) || cl.includes(term);
			r.classList.toggle('hidden', !match);
			if (match) anyMatch = true;
		});
		const show = anyMatch || villeMatches;
		v.classList.toggle('hidden', !show);
		v.classList.toggle('open', show);
	});
}

// d'AFFICHAGE seulement — chaque entrée porte son index/item_id d'origine). Les listes

let _sellSort = _loadSort('telluris.play.sell_sort');
let _buySort  = _loadSort('telluris.play.buy_sort');
function cycleSellSort() { _sellSort = _cycleSort(_sellSort); _saveSort('telluris.play.sell_sort', _sellSort); renderSellList({ vendables: MARCHAND.vendables }); }
function cycleBuySort()  { _buySort  = _cycleSort(_buySort);  _saveSort('telluris.play.buy_sort',  _buySort);  renderBuyList({ achetables: MARCHAND.achetables }); }

function renderSellList(data) {
	const list = document.getElementById('sell-list');
	const scrollEl = document.getElementById('sell-scroll');
	const vendables = MARCHAND.vendables = data.vendables || [];
	_updateSortBtn('sell-sort-btn', _sellSort);
	if (!vendables.length) {
		list.innerHTML = '<li class="sell-empty">Rien à vendre ici.</li>';
		if (scrollEl) scrollEl.classList.remove('scrollable');
		return;
	}
	list.innerHTML = _sortedOrder(vendables, _sellSort).map(idx => {
		const v = vendables[idx];
		const owner = v.compagnon_id ? `<span class="sell-owner" title="Objet de ${v.porteur_nom}">👤 ${v.porteur_nom}</span>` : '';
		return `<li class="sh-inv-item">
		<span class="sh-inv-open" onclick="openMarchandDetail('vente',${idx})" title="Voir la fiche">${v.icon || '📦'}</span>
		<span class="sh-inv-name sh-inv-open" onclick="openMarchandDetail('vente',${idx})" title="Voir la fiche">${v.nom || '—'}${owner}</span>
		<span class="sh-inv-poids">${(+v.poids).toFixed(1)} kg</span>
		<span class="sell-prix">${v.negocie ? '🤝 ' : ''}${formatPrix(v.prix)}</span>
		<span class="sh-inv-actions">
			<button class="sh-drop-btn" onclick="sellItem(${v.index},'${v.item_id}',${_cgArg(v.compagnon_id)})" title="Vendre">Vendre</button>
			${marchBtn(v.index, v.item_id, 'vente', v.compagnon_id)}
		</span>
	</li>`;
	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', vendables.length > INV_VISIBLE);
}

function renderBuyList(data) {
	const list = document.getElementById('buy-list');
	if (!list) return;
	const scrollEl = document.getElementById('buy-scroll');
	const achetables = MARCHAND.achetables = data.achetables || [];
	_updateSortBtn('buy-sort-btn', _buySort);
	if (!achetables.length) {
		list.innerHTML = '<li class="sell-empty">Rien à acheter ici.</li>';

		<span class="sh-inv-poids">${(+v.poids).toFixed(1)} kg</span>

	}).join('');
	if (scrollEl) scrollEl.classList.toggle('scrollable', achetables.length > INV_VISIBLE);

// Prix RÉELLEMENT appliqué après marchandage = celui affiché dans la liste re-rendue
// (`prix_marche` = négocié × facteur_stock, re-clampé), et non le prix de bande `prix_negocie`
// renvoyé par l'endpoint (qui ignore l'offre/demande) → le toast doit refléter la liste.
function _appliedMarchPrice(data, index, itemId, sens, compagnonId) {
	const list = sens === 'vente' ? (data.vendables || []) : (data.achetables || []);
	const cg = compagnonId || null;
	let e = null;
	if (sens === 'vente') e = list.find(v => v.index === index && v.item_id === itemId && (v.compagnon_id || null) === cg)
						   || list.find(v => v.item_id === itemId && (v.compagnon_id || null) === cg)
						   || list.find(v => v.item_id === itemId);
	else                  e = list.find(v => v.item_id === itemId);
	return e ? e.prix : null;
}

function marchToast(d, applied) {
	const deal = d.deal || {};
	if (d.crit === 'reussite') return 'Marchandage brillant ! Relation +1 (désormais ' + d.relation + ').';
	if (d.crit === 'echec')    return 'Marchandage désastreux ! Relation −1 (désormais ' + d.relation + '). Le marchand refuse de négocier pendant 1 h.';
	if (deal.succes)           return 'Marchandage réussi 🤝' + (applied ? ' — nouveau prix : ' + formatPrix(applied) : '');
	return 'Marchandage raté — prix inchangé.';
}

async function marchanderItem(index, itemId, sens, compagnonId) {
	if (isMarchBlocked()) { showToast('Le marchand boude — revenez dans ~' + blocRemainingMin() + ' min.'); return; }
	try {
		const body = {index, item_id: itemId, sens};
		if (compagnonId) body.compagnon_id = compagnonId;
		const res  = await fetch('api/marchander', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		showToast(marchToast(data, _appliedMarchPrice(data, index, itemId, sens, compagnonId)));
	} catch(err) { console.error('Erreur marchandage', err); }
}

async function openSellPanel() {
	try {
		const res  = await fetch('api/marchand/quotes');
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('sell-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch(err) { console.error('Erreur quotes', err); }
}

function closeSellPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('sell-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function sellItem(index, itemId, compagnonId) {
	try {
		const body = {index, item_id: itemId};
		if (compagnonId) body.compagnon_id = compagnonId;
		const res  = await fetch('api/sell_item', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }
		_applyInventoryPayload(data);
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		if (data.vendu) showToast('Vendu : ' + data.vendu.nom + ' (' + formatPrix(data.vendu.prix) + ')');
	} catch(err) { console.error('Erreur vente', err); }
}

async function buyItem(itemId) {
	try {
		const res  = await fetch('api/buy_item', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({item_id: itemId})
		});
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }
		_applyInventoryPayload(data);
		setMarchandState(data);
		updatePurse(data.purse);
		renderSellList(data);
		renderBuyList(data);
		if (data.achete) showToast('Acheté : ' + data.achete.nom + ' (' + formatPrix(data.achete.prix) + ')');
	} catch(err) { console.error('Erreur achat', err); }
}

// ── Tableau des quêtes (guilde) ───────────────────────────────────────
// Reconstruit l'onglet 📜 de la fiche (rendu serveur au chargement) pour qu'il reflète
// accept/terminer sans recharger la page. Miroir du gabarit Jinja de #sh-quetes.
// ── Chronos des quêtes à délai réel (transport) ───────────────────────────────────
// Le serveur envoie `expire_at` ET son `now` : on en déduit une deadline LOCALE (l'horloge
// du navigateur peut dériver de celle du serveur — même précaution que le blocage de
// marchandage). Un seul intervalle pour tous les chronos, arrêté dès qu'il n'y en a plus.
let _questTimer = null;

// Une course dont le délai a expiré est soldée par le serveur au premier point de passage
// (rendu de la page, déplacement, dialogue) : on ne fait qu'en informer le joueur.
function _notifierTransportsEchoues(rep) {
	((rep && rep.transports_echoues) || []).forEach(q => {
		showToast('📦 Course échouée : ' + q.titre + ' — réputation en baisse.');
	});
}

function _deadlineLocale(expireAt, nowServeur) {
	const now = Number.isFinite(nowServeur) ? nowServeur : Math.floor(Date.now() / 1000);
	return Date.now() + Math.max(0, expireAt - now) * 1000;
}

function _questDeadlineAttr(q) {
	if (typeof q.expire_at !== 'number') return '';
	return ` data-deadline="${_deadlineLocale(q.expire_at, q.now)}"`;
}

function _fmtRestant(ms) {
	if (ms <= 0) return 'délai dépassé';
	const s = Math.ceil(ms / 1000);
	if (s < 60) return s + ' s';
	const m = Math.floor(s / 60);
	return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function _tickQuestTimers() {
	const spans = document.querySelectorAll('.sh-quest-timer[data-deadline]');
	if (!spans.length) { clearInterval(_questTimer); _questTimer = null; return; }
	spans.forEach(sp => {
		const reste = Number(sp.dataset.deadline) - Date.now();
		sp.textContent = '⏳ ' + _fmtRestant(reste);
		sp.classList.toggle('urgent', reste > 0 && reste < 5 * 60 * 1000);
		sp.classList.toggle('expire', reste <= 0);
	});
}

function _startQuestTimers() {
	// Chronos posés par le rendu Jinja initial : ils portent l'échéance et l'heure SERVEUR
	// et doivent être convertis en deadline locale, comme ceux du rendu client.
	document.querySelectorAll('.sh-quest-timer[data-expire]:not([data-deadline])').forEach(sp => {
		sp.dataset.deadline = _deadlineLocale(Number(sp.dataset.expire), Number(sp.dataset.now));
	});
	_tickQuestTimers();
	if (!_questTimer && document.querySelector('.sh-quest-timer[data-deadline]')) {
		_questTimer = setInterval(_tickQuestTimers, 1000);
	}
}

// Échappe une chaîne (souvent du JSON) pour l'insérer dans un attribut HTML entre
// apostrophes : le nom d'un lieu peut contenir une apostrophe (« L'Étal ») qui, non
// échappée, romprait `data-carte='…'`.
function _escAttr(s) {
	return String(s)
		.replace(/&/g, '&amp;').replace(/'/g, '&#39;')
		.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Carte 3×3 d'une quête de chasse : crop de l'image du lieu centré sur la case cible.
// La géométrie reprend celle de #bg-image (image décalée pour centrer une case), mais
// centrée SUR la case (vrai 3×3) au lieu du demi-décalage du jeu.
function showQuestMap(el) {
	let carte;
	try { carte = JSON.parse(el.dataset.carte); } catch (e) { return; }
	if (!carte || !carte.image || !carte.dimensions) return;
	const dims = carte.dimensions, pos = carte.position || {};
	const px = pos.x || 0, py = pos.y || 0;
	const view = document.getElementById('qmap-view');
	document.getElementById('qmap-title').textContent =
		`${carte.lieu_nom || 'Zone'} — case (${px}, ${py})`;
	view.innerHTML = '';
	view.style.width = view.style.height = '';
	const img = new Image();
	img.onload = () => {
		// Taille native MESURÉE dans le navigateur → px par case (les cases ne sont pas
		// forcément carrées : on garde l'aspect natif via une échelle unique).
		const cw = img.naturalWidth / (dims.x || 1);
		const ch = img.naturalHeight / (dims.y || 1);
		const TARGET = 270;                       // ~270 px pour le plus grand côté du 3×3
		const scale = TARGET / (3 * Math.max(1, cw, ch));
		const cW = cw * scale, cH = ch * scale;
		view.style.width  = (3 * cW) + 'px';
		view.style.height = (3 * cH) + 'px';
		img.style.width  = (img.naturalWidth  * scale) + 'px';
		img.style.height = (img.naturalHeight * scale) + 'px';
		// Coin haut-gauche de la case cible posé à (cW, cH) → case centrée dans le 3×3.
		img.style.left = ((1 - px) * cW) + 'px';
		img.style.top  = ((1 - py) * cH) + 'px';
		view.appendChild(img);
		const marker = document.createElement('div');
		marker.className = 'qmap-marker';
		marker.textContent = '🎯';
		marker.style.left = cW + 'px';  marker.style.top = cH + 'px';
		marker.style.width = cW + 'px'; marker.style.height = cH + 'px';
		view.appendChild(marker);
	};
	img.onerror = () => { view.textContent = 'Carte indisponible.'; };
	img.src = `/${carte.image_route}/${carte.image}`;
	document.getElementById('quest-map-overlay').classList.remove('hidden');
}
function closeQuestMap() {
	document.getElementById('quest-map-overlay').classList.add('hidden');
}

function renderFicheQuetes(data) {
	const panel = document.getElementById('sh-quetes');
	if (!panel || !data || (!data.fiche_actives && !data.fiche_terminees)) return;
	// Resync focalisation : les réponses du tableau la portent (terminer/abandonner l'effacent).
	if ('focalisation' in data) {
		_focalisation = data.focalisation || null;
		if (!_focalisation) { _guidage = null; _refreshGuidage(); updateControls(); buildLocationslist(); }
		_syncFocusBtns();
	}
	const qa = data.fiche_actives || [];
	const qt = data.fiche_terminees || [];
	let html = '';
	if (qa.length) {
		html += '<div class="sh-section">📜 Actives</div>';
		html += `<div class="sh-quest-list-active sh-rel-scroll">`;
		html += qa.map(q => {
			const rang = q.rang || 'F';
			const rew = q.recompenses || {};
			let reward = '';
			if (rew.or)     reward += `<span>🟡 ${rew.or} or</span>`;
			if (rew.argent) reward += `<span>⚪ ${rew.argent} ar</span>`;
			if (rew.xp)     reward += `<span>✨ ${rew.xp} XP</span>`;
			const prog = q.progress_txt ? `<div class="sh-quest-progress">🎯 ${q.progress_txt}${q.complete ? ' ✓ prêt à rendre' : ''}</div>` : '';
			const timer = (typeof q.expire_at === 'number')
				? `<span class="sh-quest-timer"${_questDeadlineAttr(q)}></span>` : '';
			// 🎯 seulement là où la focalisation a un effet (pas sur une course de transport).
			const focusBtn = q.focalisable
				? `<button class="sh-drop-btn${_focusEst('quete', q.id) ? ' btn-highlight' : ''}" data-focus-key="quete|${q.id}" onclick="focaliserQuete('${q.id}')" title="Se focaliser sur cette quête (biaise les rencontres/récoltes)">🎯</button>`
				: '';
			// 🗺️ carte de la zone à explorer (quête de chasse localisée) : les données du crop
			// voyagent dans data-carte pour rester disponibles sans re-fetch.
			const mapBtn = q.carte
				? `<button class="sh-drop-btn" data-carte='${_escAttr(JSON.stringify(q.carte))}' onclick="showQuestMap(this)" title="Voir la zone à explorer sur la carte">🗺️</button>`
				: '';
			return `<div class="sh-quest ${rang}">
				<div class="sh-quest-hdr">
					<span class="sh-quest-rang">${rang}</span>
					<span class="sh-quest-title">${q.titre || '—'}</span>
					<span class="sh-quest-status en-cours">En cours</span>
					${timer}
					<span class="sh-inv-actions">
						${mapBtn}
						${focusBtn}
						<button class="sh-drop-btn sh-abandon-btn" onclick="abandonnerQuete('${q.id}')" title="Abandonner la quête (perte de la progression)">✕ Abandonner</button>
					</span>
				</div>
				<div class="sh-quest-desc">${q.description || ''}</div>
				${prog}
				${reward ? `<div class="sh-quest-reward">${reward}</div>` : ''}
			</div>`;
		}).join('');
		html += `<div class="sh-list-shadow-overlay"></div></div>`;
	}
	if (qt.length) {
		html += `<div class="sh-section" style="opacity:0.6">✓ Terminées (${qt.length})</div>`;
		html += `<div class="sh-quest-list-ended sh-rel-scroll">`;
		html += qt.map(q => {
			const rang = q.rang || 'F';
			return `<div class="sh-quest ${rang}" style="opacity:0.5">
				<div class="sh-quest-hdr"><span class="sh-quest-rang">${rang}</span><span class="sh-quest-title">${q.titre || '—'}</span><span class="sh-quest-status termine">Terminée</span></div>
			</div>`;
		}).join('');
		html += `<div class="sh-list-shadow-overlay"></div></div>`;
	}
	if (!qa.length && !qt.length) {
		html = '<div class="sh-empty"><span class="sh-empty-icon">📜</span>Aucune quête en cours.</div>';
	}
	panel.innerHTML = html;
	_startQuestTimers();
}

// Init des chronos — DOIT rester après les `let` ci-dessus : appelé plus haut dans le script,
// il lèverait une ReferenceError (zone morte temporelle) qui interromprait tout le reste des
// déclarations de haut niveau (dialogue PNJ, panneau de vente…).
_startQuestTimers();
// Courses échues pendant l'absence du joueur : le serveur les a déjà soldées au rendu.
_notifierTransportsEchoues({ transports_echoues: {{ transports_echoues | tojson | safe }} });
// Course expirée pendant un changement de lieu : le toast a été mis de côté avant le reload.
(function () {
	const differe = sessionStorage.getItem('transports_echoues_notif');
	if (!differe) return;
	sessionStorage.removeItem('transports_echoues_notif');
	try { _notifierTransportsEchoues({ transports_echoues: JSON.parse(differe) }); } catch (e) {}
})();

function renderQuetesActives(data) {
	const list = document.getElementById('quetes-actives-list');
	if (!list) return;
	const actives = data.actives || [];
	if (!actives.length) { list.innerHTML = '<li class="sell-empty">Aucune quête en cours ici.</li>'; return; }
	list.innerHTML = actives.map(q => `<li class="sh-inv-item">
		<span>
			<strong>${q.titre}</strong><br>
			<span class="sh-inv-poids">🎯 ${q.progress_txt}</span>
			<span class="sell-prix">✨ ${q.recompenses.xp} XP · ${formatPrix(q.recompenses)}</span>
		</span>
		${q.focalisable ? `<button class="sh-drop-btn${_focusEst('quete', q.id) ? ' btn-highlight' : ''}" data-focus-key="quete|${q.id}" onclick="focaliserQuete('${q.id}')" title="Se focaliser sur cette quête (biaise les rencontres/récoltes)">🎯</button>` : ''}
		${(q.objectif && q.objectif.type === 'collect' && !q.complete) ? `<button class="sh-drop-btn" onclick="deposerQuete('${q.id}')" title="Déposer les pièces portées (en plusieurs voyages si besoin)">📥 Déposer</button>` : ''}
		<button class="sh-drop-btn quest-done-btn" ${q.complete ? '' : 'disabled'} onclick="terminerQuete('${q.id}')" title="Terminer la quête">${q.complete ? 'Terminer' : 'En cours'}</button>
		<button class="sh-drop-btn sh-abandon-btn" onclick="abandonnerQuete('${q.id}')" title="Abandonner la quête (perte de la progression)">✕ Abandonner</button>
	</li>`).join('');
}

function renderQuetesOffres(data) {
	const list = document.getElementById('quetes-offres-list');
	if (!list) return;
	const offres = data.offres || [];
	if (!offres.length) { list.innerHTML = '<li class="sell-empty">Aucune offre pour le moment.</li>'; return; }
	list.innerHTML = offres.map(o => `<li class="sh-inv-item">
		<span>
			<strong>${o.titre}</strong>${o.source === 'authoree' ? ' 📌' : ''}<br>
			<span class="q-desc">${o.description}</span>
			<span class="sell-prix">✨ ${o.recompenses.xp} XP · ${formatPrix(o.recompenses)}</span>
		</span>
		<button class="sh-drop-btn" onclick="accepterQuete('${o.id}')" title="Accepter la quête">Accepter</button>
	</li>`).join('');
}

async function openQuetesBoard() {
	try {
		const res = await fetch('api/quetes/board');
		const data = await res.json();
		if (!res.ok) { alert('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('quetes-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch(err) { console.error('Erreur tableau de quêtes', err); }
}

function closeQuetesPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('quetes-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function accepterQuete(queteId) {
	try {
		const res = await fetch('api/quetes/accepter', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.accepte) showToast('Quête acceptée : ' + data.accepte.titre);
	} catch(err) { console.error('Erreur acceptation quête', err); }
}

async function terminerQuete(queteId) {
	try {
		const res = await fetch('api/quetes/terminer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.termine) {
			let msg = 'Quête terminée : ' + data.termine.titre + ' (+' + data.termine.xp + ' XP)';
			if (data.termine.niveau_up) msg += ' — Niveau supérieur !';
			showToast(msg);
			// Parts de butin des compagnons, prélevées sur le cuivre de la récompense.
			const pc = data.termine.parts_compagnons;
			if (pc) (pc.parts || []).forEach(p => {
				if (p.cuivre > 0) showToast('💰 ' + p.nom + ' prend sa part : ' + p.cuivre + ' cu');
			});
		}
		if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
	} catch(err) { console.error('Erreur fin de quête', err); }
}

// Abandon d'une quête active. Autorisé PARTOUT (backend assoupli) : depuis le tableau de la guilde
// OU l'onglet 📜 de la fiche. Hors guilde le payload est allégé (fiche + bourse + focalisation) ;
// renderQuetesActives/Offres sont alors des no-op (panneau guilde fermé, garde `if (!list) return`).
async function abandonnerQuete(queteId) {
	if (!confirm('Abandonner cette quête ? La progression sera perdue.')) return;
	try {
		const res = await fetch('api/quetes/abandonner', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if (data.purse) updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);   // resync fiche + focalisation (via `'focalisation' in data`)
		showToast('Quête abandonnée' + (data.abandonne ? ' : ' + data.abandonne.titre : ''));
	} catch(err) { console.error('Erreur abandon de quête', err); }
}

async function deposerQuete(queteId) {
	try {
		const res = await fetch('api/quetes/deposer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ quete_id: queteId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		_applyInventoryPayload(data);   // le dépôt a retiré des pièces du sac
		updatePurse(data.purse);
		renderQuetesActives(data);
		renderQuetesOffres(data);
		renderFicheQuetes(data);
		if (data.depose) {
			showToast('Déposé : ' + data.depose.n + ' pièce(s)' + (data.depose.complete ? ' — objectif atteint, à terminer !' : ''));
		}
	} catch(err) { console.error('Erreur dépôt de quête', err); }
}

// ── Recrutement d'aventuriers (🤝) ──────────────────────────────────────────
// Panneau plein écran (clone structurel du tableau de quêtes). Le board exige la
// carte d'aventurier de la cité (403 explicite sinon → toast). Les affinités de
// l'onglet 🤝 sont resynchronisées par chaque réponse (renderFicheCompagnons).

function _affLabel(sc) {
	return sc >= 90 ? 'Dévoué' : sc >= 70 ? 'Ami' : sc >= 55 ? 'Bienveillant'
		: sc >= 45 ? 'Neutre' : sc >= 30 ? 'Méfiant' : sc >= 10 ? 'Hostile' : 'Ennemi';
}

// Onglet 🤝 section 👥 : tous les compagnons CONNUS (mémo du perso), actifs d'abord.
function renderFicheCompagnons(list) {
	const box = document.getElementById('sh-rel-compagnons');
	const titre = document.getElementById('sh-rel-comp-titre');
	if (!box) return;
	if (!list || !list.length) {
		box.innerHTML = '';
		if (titre) titre.style.display = 'none';
		return;
	}
	if (titre) titre.style.display = '';
	box.innerHTML = list.map(r => {
		const sc = (r.affinite === null || r.affinite === undefined) ? 50 : r.affinite;
		const cls = sc > 50 ? 'pos' : sc < 50 ? 'neg' : 'neu';
		const part = (r.exigences_effectives || {}).part_butin_pct;
		// Vitaux : présents pour les compagnons ACTIFS seulement (le mémo d'un parti n'en porte pas).
		const vit = r.pv_max !== undefined
			? ` · ❤️ ${r.currentPV}/${r.pv_max} · 🔵 ${r.currentPM}/${r.pm_max}` : '';
		return `<div class="sh-relation">
			<strong>${r.actif ? '⚔' : '·'}</strong>
			<div class="sh-rel-info">
				<div class="sh-rel-name">${r.prenom || '?'} ${r.nom || ''}${r.actif ? ' <span style="opacity:.6;font-size:.75em">(dans le groupe)</span>' : ''}</div>
				<div class="sh-rel-class">${r.voc || ''} · ${r.race || ''} · rang ${r.rang || 'F'}${part !== undefined ? ` · part ${part}%` : ''}${vit}</div>
			</div>
			<div>
				<div class="sh-rel-score ${cls}">${sc}<span style="opacity:.5;font-size:.7em">/100</span></div>
				<div class="sh-rel-lbl">${_affLabel(sc)}</div>
			</div>
			${r.actif ? `<button class="sh-drop-btn sh-abandon-btn" onclick="congedierAventurier('${r.id}')" title="Congédier ce compagnon">✕</button>` : ''}
			<div class="sh-rel-portrait">
				${r.image ? `<img src="/characters/${r.image}" alt="" class="collapsed compagnon-portrait">`
					: '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">👤</div>'}
			</div>
		</div>`;
	}).join('');
}

// ── Cartes de compagnons / recrues ──────────────────────────────────────────
// Le groupe et le board affichent les MÊMES personnages, avec la même carte que la fiche du
// joueur ; seuls le pied et les actions changent. Rien n'est écrit en HTML de carte ici : la
// macro Jinja reste la seule source du markup (cf. renderCharacterCard).

// Pied d'un compagnon : ce que la carte ne dit pas DÉJÀ — ses PV/PM sont dans ses barres et sa
// ligne de vitaux, inutile de les répéter. Restent le contrat (part de butin) et le lien (affinité).
function _piedCompagnon(c) {
	const aff = (c.affinite === null || c.affinite === undefined) ? 50 : c.affinite;
	const part = (c.exigences_effectives || {}).part_butin_pct;
	return `<span>💰 part ${part}%</span><span>🤝 ${aff} — ${_affLabel(aff)}</span>`;
}

function _btnCongedier(id) {
	return `<button class="sh-drop-btn sh-abandon-btn" onclick="congedierAventurier('${id}')"
		title="Congédier (le lien est conservé)">✕ Congédier</button>`;
}

// Une liste de cartes de compagnons. `actions(c)` compose les boutons propres à l'endroit.
function _rendreCartesCompagnons(container, groupe, actions) {
	if (!container) return;
	clearCharacterCards(container);
	if (!groupe.length) {
		container.innerHTML = '<div class="sell-empty">Personne ne vous accompagne.</div>';
		return;
	}
	groupe.forEach(c => renderCharacterCard(container, c, {
		// Un compagnon du groupe est à nous : son cadrage est enregistrable (cf. _acteur).
		editable: true,
		footer: _piedCompagnon(c),
		actions: actions(c),
	}));
}

function renderRecrutement(data) {
	const plafondEl = document.getElementById('rec-plafond');
	if (plafondEl) plafondEl.textContent = `${(data.groupe || []).length}/${data.plafond}`;
	const full = (data.groupe || []).length >= (data.plafond || 0);

	_rendreCartesCompagnons(document.getElementById('rec-groupe-list'), data.groupe || [],
		c => _btnCongedier(c.id));

	const rl = document.getElementById('rec-recrues-list');
	if (rl) {
		const recrues = data.recrues || [];
		clearCharacterCards(rl);
		if (!recrues.length) {
			rl.innerHTML = '<div class="sell-empty">Personne au tableau pour le moment.</div>';
		}
		recrues.forEach(r => {
			const ex = r.exigences_effectives || {};
			const clauses = (ex.clauses || []).map(c => `<span class="q-desc">• ${c}</span>`).join('');
			const aff = (r.affinite !== null && r.affinite !== undefined)
				? `<span>🤝 ${r.affinite}${r.deja_connu ? ' (déjà connu)' : ''}</span>` : '';
			renderCharacterCard(rl, r, {
				// Recrue seulement OFFERTE : elle n'est pas dans le groupe, `_acteur` refuserait
				// d'enregistrer son cadrage (403) → pas d'éditeur de portrait sur sa carte.
				editable: false,
				footer: `<span class="q-desc">${r.specialite || ''}</span>`

}

// Congédier est autorisé PARTOUT (onglet 🤝 ou panneau) : hors lieu recruteur, le
// payload ne porte pas de recrues → seuls groupe + fiche 👥 sont resynchronisés.
async function congedierAventurier(avId) {
	if (!confirm('Congédier ce compagnon ? Il gardera le souvenir de vos aventures.')) return;
	try {
		const res = await fetch('api/recrutement/congedier', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ aventurier_id: avId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if ('recrues' in data) renderRecrutement(data);
		else if (data.affinites_detail) renderFicheCompagnons(data.affinites_detail);
		// Congédier depuis le panneau 👥 : son état (liste ET sacs) doit être re-tiré, le
		// payload du congédiement ne porte pas les inventaires.
		const grp = document.getElementById('groupe-panel');
		if (grp && !grp.classList.contains('panel-hidden')) {
			const r2 = await fetch('api/groupe');
			if (r2.ok) renderGroupe(await r2.json());
		}
		if (data.congedie) showToast('👋 ' + data.congedie.nom + ' quitte le groupe.');
	} catch(err) { console.error('Erreur congédiement', err); }
}

// ── Panneau 👥 Groupe ───────────────────────────────────────────────────────────
// Deux sections en accordéon : les compagnons (→ fiche complète de chacun) et l'inventaire
// du groupe (le sac du joueur et celui d'un compagnon côte à côte, flèches de transfert).
// Accessible PARTOUT, contrairement au tableau de recrutement (lieu recruteur + carte).
let _grpEtat = null;          // dernier payload de GET api/groupe
let _grpSelId = null;         // compagnon affiché dans la colonne de droite de l'inventaire

const GRP_SECTION_KEY = 'telluris.play.groupe_section.' + REL_CHAR_ID;
const GRP_INV_KEY     = 'telluris.play.groupe_inv.' + REL_CHAR_ID;
function _grpLsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function _grpLsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// Accordéon : une seule section ouverte, mémorisée par personnage.
function toggleGroupeSection(id) {
	const ouvrir = !document.getElementById('grp-head-' + id).parentElement.classList.contains('open');
	['compagnons', 'inventaire'].forEach(s => {
		document.getElementById('grp-head-' + s).parentElement
			.classList.toggle('open', s === id && ouvrir);
	});
	_grpLsSet(GRP_SECTION_KEY, ouvrir ? id : '');
}

function renderGroupe(data) {
	_grpEtat = data;
	const groupe = data.groupe || [];
	const plafond = document.getElementById('grp-plafond');
	if (plafond) plafond.textContent = `${groupe.length}/${data.plafond}`;

	// Chaque compagnon s'affiche avec la MÊME carte que le joueur (portrait cadré, barres
	// PV/PM, identité) ; son pied ne dit que ce qu'elle n'a pas : la part de butin et l'affinité.
	_rendreCartesCompagnons(document.getElementById('grp-compagnons-list'), groupe,
		c => _btnCongedier(c.id));
	// La carte entière ouvre la fiche du compagnon (le bouton 📋 Fiche faisait doublon). Restent
	// exclus : la barre d'actions (→ Congédier) et les contrôles d'édition du portrait.
	document.querySelectorAll('#grp-compagnons-list .character-card').forEach(card => {
		card.classList.add('card-clickable');
		card.addEventListener('click', e => {
			if (e.target.closest('.card-actions, .zoom-bar, [data-role="action-btn"]')) return;
			const vp = card.querySelector('[data-role="vp"]');
			if (vp && vp.classList.contains('drag-mode')) return;  // recadrage du portrait en cours
			openCompagnonSheet(card.dataset.porteur);
		});
	});
	renderGroupeInventaire();
}

// Sacs côte à côte. Le compagnon affiché à droite est le dernier choisi (mémorisé), à
// défaut le premier du groupe.
function renderGroupeInventaire() {
	const data = _grpEtat || {};
	const groupe = data.groupe || [];
	const vide = document.getElementById('grp-inv-vide');
	const wrap = document.getElementById('grp-inv-wrap');
	if (!wrap) return;
	if (!groupe.length) {
		if (vide) vide.style.display = '';
		wrap.style.display = 'none';
		return;
	}
	if (vide) vide.style.display = 'none';
	wrap.style.display = '';

	const ids = groupe.map(c => c.id);
	if (!ids.includes(_grpSelId)) {
		const memo = _grpLsGet(GRP_INV_KEY);
		_grpSelId = ids.includes(memo) ? memo : ids[0];
	}
	const sel = document.getElementById('grp-inv-select');
	if (sel) {
		sel.innerHTML = groupe.map(c =>
			`<option value="${c.id}"${c.id === _grpSelId ? ' selected' : ''}>${c.prenom} ${c.nom}</option>`).join('');
		// Un seul compagnon : le sélecteur n'a rien à sélectionner, il devient une étiquette.
		sel.disabled = groupe.length < 2;
	}

	const principal = data.principal || {};
	const compagnon = (data.sacs || {})[_grpSelId] || {inventaire: [], charge: 0, charge_max: 0};
	_grpCharge('grp-inv-charge-principal', principal);
	_grpCharge('grp-inv-charge-compagnon', compagnon);
	document.getElementById('grp-inv-principal').innerHTML =
		_grpSac(principal.inventaire, compagnon, 'vers_compagnon');
	document.getElementById('grp-inv-compagnon').innerHTML =
		_grpSac(compagnon.inventaire, principal, 'vers_principal');
}

function _grpCharge(elId, porteur) {
	const el = document.getElementById(elId);
	if (!el) return;
	const charge = +(porteur.charge || 0), max = +(porteur.charge_max || 0);
	el.textContent = `${charge.toFixed(1)} / ${max} kg`;
	el.classList.toggle('grp-charge-over', charge > max + 1e-6);
}

// Sources de fiche objet propres aux sacs du groupe → sens du transfert (les deux sens de
// `transfererItem` désignent chacun un porteur : celui QUI DONNE est la source de la fiche).
const _GRP_SENS = { grp_principal: 'vers_compagnon', grp_compagnon: 'vers_principal' };
const _GRP_SOURCE = { vers_compagnon: 'grp_principal', vers_principal: 'grp_compagnon' };

// Qui donne, qui reçoit, pour une source de fiche donnée.
function _grpPorteurs(source) {
	const data = _grpEtat || {};
	const principal = data.principal || { inventaire: [], charge: 0, charge_max: 0 };
	const compagnon = (data.sacs || {})[_grpSelId] || { inventaire: [], charge: 0, charge_max: 0 };
	return source === 'grp_principal'
		? { src: principal, dest: compagnon }
		: { src: compagnon, dest: principal };
}
// Même arithmétique que `peut_porter` côté serveur, qui refuserait (409).
function _grpRentre(item, dest) {
	return +(item.poids || 0) <= (+(dest.charge_max || 0) - +(dest.charge || 0)) + 1e-6;
}

// Une ligne par objet ; la flèche est grisée quand l'objet ne rentre pas chez le destinataire.
// Icône + nom ouvrent la fiche de l'objet, comme dans le sac de la fiche perso.
function _grpSac(items, dest, sens) {
	items = items || [];
	if (!items.length) return '<div class="sh-empty"><span class="sh-empty-icon">🎒</span>Sac vide</div>';
	const source = _GRP_SOURCE[sens];
	const fleche = sens === 'vers_compagnon' ? '→' : '←';
	return items.map((item, idx) => {
		if (!item || typeof item !== 'object') return '';
		const poids = +(item.poids || 0);
		const rentre = _grpRentre(item, dest);
		const btn = `<button class="grp-move-btn" ${rentre ? '' : 'disabled'}
			title="${rentre ? 'Transférer' : 'Trop lourd — le destinataire est à sa charge maximale'}"
			onclick="transfererItem('${sens}',${idx},'${item._id}')">${fleche}</button>`;
		const row = `<span class="sh-inv-name sh-inv-open" onclick="openItemDetail('${source}',${idx})" title="Voir la fiche">${item.icon || '📦'} ${item.nom || '—'}</span>
			<span class="sh-inv-poids">${poids.toFixed(1)} kg</span>`;
		// Le bouton se place du côté où part l'objet : à droite pour →, à gauche pour ←.
		return `<div class="sh-inv-item">${sens === 'vers_principal' ? btn + row : row + btn}</div>`;
	}).join('');
}

function onGroupeInvSelect(avId) {
	_grpSelId = avId;
	_grpLsSet(GRP_INV_KEY, avId);
	renderGroupeInventaire();
}

async function transfererItem(sens, index, itemId) {
	try {
		const res = await fetch('api/groupe/transferer', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ compagnon_id: _grpSelId, sens, index, item_id: itemId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		// Le sac du joueur est aussi celui de la fiche : on resynchronise les deux vues.
		_inventaire = data.principal.inventaire;
		_slots      = data.principal.slots;
		_chargeMax  = data.principal.charge_max;
		_refreshInventaire();
		_refreshChargeGauge();
		if (_grpEtat) {
			_grpEtat.principal = Object.assign({}, _grpEtat.principal, {
				inventaire: data.principal.inventaire,
				charge: data.principal.charge, charge_max: data.principal.charge_max,
			});
			(_grpEtat.sacs || {})[data.compagnon_id] = {
				inventaire: data.compagnon.inventaire,
				charge: data.compagnon.charge, charge_max: data.compagnon.charge_max,
			};
			renderGroupeInventaire();
		}
		const t = data.transfere || {};
		showToast(`${t.icon || '📦'} ${t.nom} ${t.vers === 'compagnon' ? '→' : '←'} ${t.poids} kg`);
	} catch (err) { console.error('Erreur transfert', err); }
}

// ── Fiche d'un compagnon : le panneau de fiche, en « mode compagnon » ───────────
// On ne duplique aucun rendu : les globales du joueur sont mises de côté, remplacées par
// celles du compagnon, et TOUTES les fonctions de rendu existantes sont rappelées telles
// quelles. Les actions, elles, partent avec un `compagnon_id` (_actionBody) — le serveur
// résout alors le porteur (cf. `_acteur`, routers/user.py).
// `_compagnonActif` / `_sheetSnap` sont déclarés plus haut (près de _inventaire) — TDZ à l'init.

function _actionBody(extra) {
	return _compagnonActif ? Object.assign({}, extra, { compagnon_id: _compagnonActif.id }) : extra;
}

function _sheetIdentiteEls() {
	return {
		// La colonne gauche (paysage) n'est pas une carte : autre mise en page, donc son HTML
		// est réécrit (et restauré depuis le snapshot). La colonne droite, elle, EST la carte
		// `charac-sheet` : elle se pilote par `_setCardIdentite` + `setSujet`, jamais en innerHTML.
		gauche: document.querySelector('.sheet-left-info'),
		imgGauche: document.querySelector('.sheet-left-portrait img'),
		barres: Array.from(document.querySelectorAll('.sheet-left-col .portrait-stat-bar .bar-fill')),
	};
}

// Le personnage affiché par la fiche : le joueur, ou un compagnon. Les deux colonnes suivent.
function _applySheetIdentite(p) {
	const els = _sheetIdentiteEls();
	const v = p.vitals || {};
	const pvPct = v.pv_max ? Math.min(100, Math.round(v.currentPV / v.pv_max * 100)) : 0;
	const pmPct = v.pm_max ? Math.min(100, Math.round(v.currentPM / v.pm_max * 100)) : 0;
	if (els.gauche) {
		const classe = `${_vocLabel(p.voc)} Niv.<span class="voc-niveau niveau-nb">${p.voc_niveau}</span>`
			+ ` - ${p.race} Niv.<span class="race-niveau niveau-nb">${p.niveau}</span> · Rang ${p.rang}`;
		// Mêmes ids que le gabarit Jinja : _refreshDerivedStats continue d'y écrire les max.
		const vitals = `<span class="pv-val">PV ${v.currentPV}/<span id="stat-left-drv-pv_max">${v.pv_max}</span></span>`
			+ `<span class="pm-val">PM ${v.currentPM}/<span id="stat-left-drv-pm_max">${v.pm_max}</span></span>`;
		els.gauche.innerHTML = `<div class="char-name">${p.prenom} ${p.nom}</div>`
			+ `<div class="char-class">${classe}</div>`
			+ `<div class="char-vitals" style="margin-top:8px">${vitals}</div>`
			+ `<div id="sh-effets-actifs" class="sh-effets-chips"></div>`;
	}
	if (els.imgGauche) els.imgGauche.src = '/characters/' + p.image;
	els.barres.forEach((b, i) => { b.style.height = (i % 2 === 0 ? pvPct : pmPct) + '%'; });

	// La carte de la fiche change de porteur : identité, vitaux, barres — et son portrait, dont
	// l'image est mesurée et le cadrage propre au compagnon (enregistrable sur SON doc).
	_setCardIdentite(carteFiche(), p);
	if (PORTRAIT_FICHE) PORTRAIT_FICHE.setSujet({
		image: p.image,
		portrait_zoom: p.portrait_zoom,
		portrait_translate: p.portrait_translate,
		compagnon_id: p.id === PRINCIPAL_ID ? null : p.id,
	});
}

// Le joueur tel que la carte l'attend (l'identité vient des globales, tenues à jour : niveaux
// dépensés, vitaux régénérés) — de quoi rendre la fiche au joueur en sortant du mode compagnon.
function _identiteJoueur() {
	return {
		id: PRINCIPAL_ID,
		prenom: IDENTITE_JOUEUR.prenom, nom: IDENTITE_JOUEUR.nom,
		voc: IDENTITE_JOUEUR.voc, race: IDENTITE_JOUEUR.race, rang: IDENTITE_JOUEUR.rang,
		voc_niveau: _vocNiveau, niveau: _niveau,
		image: SUJET_JOUEUR.image,
		portrait_zoom: SUJET_JOUEUR.portrait_zoom,
		portrait_translate: SUJET_JOUEUR.portrait_translate,
		vitals: _vitalsJoueur,
	};
}

function _sheetRendreTout() {
	_refreshStatBoxes();
	_refreshDerivedStats(_derivedCur);
	_renderCaractsMod();
	_refreshPaperdoll();
	_refreshInventaire();
	_refreshSol();
	_refreshChargeGauge();
	_renderEffetsActifs(_effetsActifs);
	_renderSorts();
	_renderSortsMagies();
	_renderSortsApprenables();
	_renderCompetences();
	_renderCompetencesApprenables();
	_syncPoints(_attributePoints);
}

async function openCompagnonSheet(avId) {
	try {
		const res = await fetch('api/groupe/compagnon/' + encodeURIComponent(avId));
		const p = await res.json();
		if (!res.ok) { showToast('Erreur : ' + p.detail); return; }

		const els = _sheetIdentiteEls();
		// `_objetsAuSol` n'est PAS mis de côté : le sol appartient au lieu, pas au porteur.
		// Il reste donc à jour pendant tout le détour (ce qu'un compagnon « pose » y tombe)
		// et doit être conservé tel quel au retour — le figer ici ferait disparaître de la
		// vue du joueur ce que son compagnon vient de poser.
		_sheetSnap = {
			inventaire: _inventaire, slots: _slots, chargeMax: _chargeMax,
			effetsActifs: _effetsActifs, charStats: _charStats, statCaps: _statCaps,
			attributePoints: _attributePoints, vocNiveau: _vocNiveau, caractsDetail: _caractsDetail,
			derived: _derivedCur, raceMin: _RACE_MIN, raceMax: _RACE_MAX,
			xpTotal: _xpTotal, niveau: _niveau, xpNivPrev: _xpNivPrev, xpNivNext: _xpNivNext,
			raceNom: _raceNom, vocId: _vocId, sexe: _sexe,
			sorts: _sorts, sortsApprenables: _sortsApprenables, sortsMagies: _sortsMagies,
			sortsEpingles: _sortsEpingles, competences: _competences,
			competencesApprenables: _competencesApprenables, competencesEpinglees: _competencesEpinglees,
			htmlGauche: els.gauche ? els.gauche.innerHTML : '',
			imgGauche: els.imgGauche ? els.imgGauche.getAttribute('src') : '',
			// La CARTE de la fiche n'est pas snapshottée : elle se reconstruit du joueur
			// (`_identiteJoueur()` + `SUJET_JOUEUR`), et un HTML mis de côté serait déjà périmé
			// si le joueur a régénéré ou dépensé un point pendant le détour.
			barres: els.barres.map(b => b.style.height),
		};

		_compagnonActif = p;
		_inventaire = p.inventaire; _slots = p.slots; _objetsAuSol = p.objets_au_sol;
		_chargeMax = p.charge_max; _effetsActifs = p.effets_actifs;
		_charStats = p.caracteristiques_current; _statCaps = p.stat_caps;
		_attributePoints = p.attribute_points; _vocNiveau = p.voc_niveau;
		_caractsDetail = p.caracts_detail; _derivedCur = p.derived_stats;
		_RACE_MIN = p.race_min; _RACE_MAX = p.race_max;
		_xpTotal = p.xp_total; _niveau = p.niveau;
		_xpNivPrev = p.xp_niv_prev; _xpNivNext = p.xp_niv_next;
		_raceNom = p.race; _vocId = p.voc; _sexe = p.sex;
		_sorts = p.sorts; _sortsApprenables = p.sorts_apprenables; _sortsMagies = p.sorts_magies;
		_sortsEpingles = p.sorts_epingles; _competences = p.competences;
		_competencesApprenables = p.competences_apprenables;
		_competencesEpinglees = p.competences_epinglees;

		document.body.classList.add('sheet-compagnon');
		_applySheetIdentite(p);
		_sheetRendreTout();

		document.getElementById('groupe-panel').classList.add('panel-hidden');
		document.getElementById('sheet-panel').classList.remove('panel-hidden');
		sheetTab('stats', document.querySelector('.sheet-tab-btn'));
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch (err) { console.error('Erreur fiche compagnon', err); }
}

// Retour au joueur : on restaure l'état mis de côté, puis on rouvre le panneau du groupe
// (les charges ont pu changer — équipement, objets posés).
function closeCompagnonSheet() {
	const s = _sheetSnap;
	_compagnonActif = null;
	_sheetSnap = null;
	document.body.classList.remove('sheet-compagnon');
	if (s) {
		_inventaire = s.inventaire; _slots = s.slots;   // `_objetsAuSol` : cf. openCompagnonSheet
		_chargeMax = s.chargeMax; _effetsActifs = s.effetsActifs;
		_charStats = s.charStats; _statCaps = s.statCaps;
		_attributePoints = s.attributePoints; _vocNiveau = s.vocNiveau;
		_caractsDetail = s.caractsDetail; _derivedCur = s.derived;
		_RACE_MIN = s.raceMin; _RACE_MAX = s.raceMax;
		_xpTotal = s.xpTotal; _niveau = s.niveau;
		_xpNivPrev = s.xpNivPrev; _xpNivNext = s.xpNivNext;
		_raceNom = s.raceNom; _vocId = s.vocId; _sexe = s.sexe;
		_sorts = s.sorts; _sortsApprenables = s.sortsApprenables; _sortsMagies = s.sortsMagies;
		_sortsEpingles = s.sortsEpingles; _competences = s.competences;
		_competencesApprenables = s.competencesApprenables;
		_competencesEpinglees = s.competencesEpinglees;

		const els = _sheetIdentiteEls();
		if (els.gauche) els.gauche.innerHTML = s.htmlGauche;
		if (els.imgGauche) els.imgGauche.src = s.imgGauche;
		els.barres.forEach((b, i) => { b.style.height = s.barres[i] || '0%'; });
		// La carte de la fiche redevient celle du joueur — reconstruite (globales restaurées
		// juste au-dessus), pas restaurée d'un HTML figé.
		_setCardIdentite(carteFiche(), _identiteJoueur());
		if (PORTRAIT_FICHE) PORTRAIT_FICHE.setSujet(SUJET_JOUEUR);
		_sheetRendreTout();
	}
	document.getElementById('sheet-panel').classList.add('panel-hidden');
	openGroupe();
}

// ── Dialogue PNJ (🗣) ───────────────────────────────────────────────────────
// Panneau plein écran (pattern quêtes/marché). Navigation stateless : chaque choix
// renvoie le nœud suivant déjà filtré/substitué côté serveur ; `noeud: null` = fin.
let _pnjNoeudCourant = null;

function renderPnjNoeud(noeud) {
	_pnjNoeudCourant = noeud ? noeud.id : null;
	const texte = document.getElementById('pnj-noeud-texte');
	const liste = document.getElementById('pnj-choix');
	if (!noeud) { texte.textContent = ''; liste.innerHTML = ''; return; }
	texte.textContent = noeud.texte || '';
	liste.innerHTML = (noeud.choix || []).map(c =>
		`<li><button class="sub-loc-btn" onclick="choisirPnj('${c.id}')">${c.action ? '✨ ' : ''}${c.label}</button></li>`
	).join('') || '<li><button class="sub-loc-btn" onclick="closePnjPanel()">✕ Prendre congé</button></li>';
}

async function openPnjDialogue() {
	try {
		const res = await fetch('api/pnj/dialogue');
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		// Une course a pu périmer à l'ouverture du dialogue (expiration paresseuse) : le serveur
		// renvoie alors les relations à jour, sanction comprise.
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
		renderPnjNoeud(data.noeud);
		document.getElementById('game-container').classList.add('panel-hidden');
		document.getElementById('pnj-panel').classList.remove('panel-hidden');
		window.scrollTo({ top: 0, behavior: 'instant' });
	} catch(err) { console.error('Erreur dialogue PNJ', err); }
}

function closePnjPanel() {
	document.getElementById('game-container').classList.remove('panel-hidden');
	document.getElementById('pnj-panel').classList.add('panel-hidden');
	window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function choisirPnj(choixId) {
	if (!_pnjNoeudCourant) return;
	try {
		const res = await fetch('api/pnj/dialogue/choix', {
			method: 'POST', headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({ noeud: _pnjNoeudCourant, choix_id: choixId })
		});
		const data = await res.json();
		if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
		if (data.vitals) updateVitals(data.vitals);
		if (data.purse) updatePurse(data.purse);
		// Une course livrée/rapportée fait monter la relation du donneur : l'onglet 🤝 est rendu
		// client, il ne se met à jour que si le serveur renvoie le payload complet.
		if (Array.isArray(data.relations_lieux)) renderFicheRelations(data.relations_lieux);
		if (data.soin) {
			showToast('✨ +' + data.soin.pv_rendu + ' PV' + (data.soin.gratuit ? ' — offert' : ''));
		}
		if (data.don) {
			const q = data.don.quantite > 1 ? ' ×' + data.don.quantite : '';
			showToast((data.don.icon || '🎁') + ' ' + data.don.nom + q + (data.don.gratuit ? ' — offert' : ''));
			if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
		}
		if (data.transport) {
			if (data.transport.accepte) showToast('📦 Course acceptée : ' + data.transport.accepte);
			// Course à retour : la marchandise est remise ici, mais c'est le donneur qui paie — on
			// ne promet ni XP ni prime tant que le joueur n'est pas allé lui en rendre compte.
			if (data.transport.remis) {
				showToast('📦 Marchandise remise — retournez en rendre compte au donneur.');
				if (data.transport.en_rayon) showToast('🏷️ ' + data.transport.en_rayon + ' colis mis en rayon ici.');
			}
			if (data.transport.livre) {
				showToast('📦 Livré ! ✨ +' + data.transport.xp + ' XP, 🤝 relation ' + data.transport.relation);
				if (data.transport.en_rayon) showToast('🏷️ ' + data.transport.en_rayon + ' colis mis en rayon ici.');
				(data.transport.items || []).forEach(nom => showToast('🎁 ' + nom));
				if (data.transport.niveau_up) showToast('⭐ Niveau supérieur !');
			}
			if (data.inventaire_payload) _applyInventoryPayload(data.inventaire_payload);
			renderFicheQuetes(data);
		}
		if (data.noeud) renderPnjNoeud(data.noeud);
		else closePnjPanel();
	} catch(err) { console.error('Erreur choix de dialogue', err); }
}
