{# Carte de personnage : source unique du markup, partagée par la sidebar, la fiche, la liste
   du groupe et le board de recrutement (les deux dernières la clonent depuis <template>). #}
{% import "part-character-card.html" as cards %}
{# Barre de slots : CSS partagé avec l'écran de combat (macro paramétrée par les sélecteurs,
   les deux pages ne portant pas les mêmes noms de classes). #}
{% import "part-slot-bar-css.html" as slotbar %}
{# Pavé de déplacement : markup ET CSS partagés avec la page de combat et le mode « test de
   déplacement » de l'éditeur de carte. #}
{% import "part-move-panel.html" as movepanel %}
<!DOCTYPE html>
<html lang="fr">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Telluris — {{ title }}</title>
	<link rel="icon" type="image/png" href="{{ url_for('icons', path='favicon.svg') }}" sizes="any">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
	<style>
		:root {
			--x: {{ position["x"] | tojson | safe }};
			--y: {{ position["y"] | tojson | safe }};
			--dim_x: {{ dim_x | tojson | safe }};
			--dim_y: {{ dim_y | tojson | safe }};
			--portraitW: 100;
			--portraitH: 100;
			--dist-view: 10;
			--map-anim: 260ms;   /* glissement de la carte à chaque pas */
			--bg: #0e0e0e;
			--surface: #181818;
			--border: #2a2a2a;
			--accent: #c8a96e;
			--text: #e8e4dc;
			--muted: #c5c5c5;
			--bg-color: #1a1a24;
			--panel-bg: #2c2c38;
			--border-color: #4a4a5a;
			--accent-color: #ffd700;
			--text-color: #e0e0e0;
			--text-card-color: #aaa;
			--btn-bg: #3a3a4a;
			--inv-row-h: 26px;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Cinzel', serif;
		}

		body {
			background-color: var(--bg-color);
			color: var(--text-color);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 10px;
		}

		/* 2. DESCRIPTION DU LIEU */
		.location-desc {
			grid-area: header;
			background: rgba(0, 0, 0, 0.4);
			padding: 10px;
			border: 2px solid var(--border-color);
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.location-desc h2 {
			color: var(--accent-color);
			font-size: 1.1rem;
			line-height: 1;
		}

		/* CARTE */
		.map-area {
			grid-area: map;
			border: 2px solid var(--border-color);
			background: #111;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 0; 
		}
		.grid-placeholder {
			color: #444;
			font-style: italic;
		}

		/* SIDEBAR DROITE */
		.sidebar {
			grid-area: sidebar;
			display: flex;
			flex-direction: column;
			gap: 10px;
			overflow: hidden;
		}

		/* 1. PANNEAU DE DÉPLACEMENT */
		.navigation-panel {
			border: 2px solid var(--border-color);
			padding: 8px;
			background: rgba(0, 0, 0, 0.3);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		/* 3. ACCÈS AUX SOUS-LIEUX */
		.sub-locations-panel {
			border: 2px solid var(--border-color);
			padding: 10px;
			background: rgba(0, 0, 0, 0.1);
			flex-grow: 1;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			min-height: 20vh;
		}
		.sub-locations-panel h3 {
			font-size: 1rem;
			border-bottom: 2px solid var(--border-color);
			padding-bottom: 3px;
			margin-bottom: 8px;
			color: var(--accent-color);
		}
		/* Texte d'ambiance du lieu (champ `texte` du doc lieu:*), en tête du panneau, au-dessus
		   des Actions et des Lieux. `pre-line` respecte les retours à la ligne de la donnée
		   (listes à puces « - … »), comme #intro-texte. Il défile CHEZ LUI : le panneau est en
		   overflow:hidden, un texte long pousserait sinon la liste des lieux hors du cadre. */
		.loc-texte {
			font-size: 1rem;
			line-height: 1.4;
			padding: 10px;
			white-space: pre-line;
			box-shadow: rgba(0, 0, 0, 0.8) 0px -20px 20px -20px inset;
			position: relative;
			color: var(--text, rgb(224, 224, 224));
			max-height: 22vh;
			overflow-y: auto;
			flex-shrink: 0;
			margin-bottom: 10px;
			border-bottom: 1px dashed var(--border-color);
			scrollbar-width: thin;
			scrollbar-color: var(--border-color) transparent;
		}
		.sub-locations-list {
			list-style: none;
			display: flex;
			flex-direction: column;
			gap: 6px;
			margin-bottom: 10px;
		}
		.sub-loc-btn {
			width: 100%;
			padding: 8px;
			background: var(--btn-bg);
			border: 1px solid var(--border-color);
			color: var(--text-color);
			text-align: left;
			cursor: pointer;
			font-size: 0.9rem;
			white-space: normal;
		}
		.sub-loc-btn:hover {
			border-color: var(--accent-color);
		}

		/* 4. SECTION GESTION DU PERSONNAGE */
		.character-panel {
			grid-area: char;
			width: 100%;
		}
		.character-card {
			background: rgba(34, 34, 34, 0.9);
			border: 1px solid #444;
			border-radius: 12px;
			padding: 10px;
			color: white;
			font-size: 13px;
		}
		.char-header {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 10px;
		}
		.char-portrait {
			flex-shrink: 0;
			transform-origin: top center;
		}

		/* ── Barres PV / PM verticales superposées sur le portrait ─ */
		.portrait-overlay-bars {
			position: absolute;
			inset: 0;
			z-index: 5;
			pointer-events: none;
			display: flex;
			flex-direction: row;
			justify-content: space-between;
		}
		.portrait-stat-bar {
			width: 8px;
			height: 100%;
			background: rgba(0, 0, 0, 0.3);
			position: relative;
			overflow: hidden;
		}
		.portrait-stat-bar .bar-fill {
			position: absolute;
			bottom: 0; left: 0; right: 0;
			border-radius: 10px 10px 0 0;
			transition: height 0.5s ease;
		}
		.portrait-stat-bar.pv-side .bar-fill { background: rgba(200, 40, 50, 0.4); }
		.portrait-stat-bar.pm-side .bar-fill { background: rgba(40, 90, 210, 0.4); }
		/* Overflow : indicateur lumineux au sommet */
		.portrait-stat-bar .bar-fill.is-overflow::after {
			content: '';
			position: absolute;
			top: 0; left: 0; right: 0;
			height: 25%;
			animation: overflow-tip 1.8s ease-in-out infinite;
		}
		.portrait-stat-bar.pv-side .bar-fill.is-overflow::after {
			background: linear-gradient(to bottom, rgba(255, 200, 50, 0.9), rgba(200, 40, 50, 0));
		}
		.portrait-stat-bar.pm-side .bar-fill.is-overflow::after {
			background: linear-gradient(to bottom, rgba(100, 220, 255, 0.9), rgba(40, 90, 210, 0));
		}
		@keyframes overflow-tip {
			0%, 100% { opacity: 0.6; }
			50%       { opacity: 1;   }
		}
		.char-vitals {
			display: flex;
			gap: 10px;
			margin-top: 6px;
			font-size: 12px;
			flex-wrap: wrap;
			max-width: 400px;
			width: 100%;
		}
		.char-vitals .pv-val { color: #ff4757; }
		.char-vitals .pm-val { color: #4a9eff; }
		span.pm-val{
			margin-left: auto;
		}
		.sheet-left-portrait { position: relative; }

		.viewport-wrapper {
			position: relative;
			width:  calc(var(--portraitW) * 1px);
			height: calc(var(--portraitH) * 1px);
			overflow: hidden;
			border: 1px solid var(--border);
			box-shadow: 0 24px 80px rgba(0,0,0,0.7);
			border-radius: 2px;
			cursor: default;
		}
		.viewport-wrapper.drag-mode {
			cursor: move;
		}
		.viewport-wrapper.drag-mode:active {
			cursor: grabbing;
		}

		/* `width`/`height` posés en inline par le contrôleur, une fois l'image mesurée. Masquée
		   d'ici là : sans cela, l'image s'afficherait un instant à sa taille naturelle. */
		.viewport-wrapper img {
			position: absolute;
			max-width: none;
			display: block;
			pointer-events: none;
			will-change: transform;
			opacity: 0;
		}
		.viewport-wrapper img.cadree { 
			opacity: 1;
			filter: drop-shadow(rgba(255, 255, 255, 0.4) 0px 0px 12px) brightness(1.2) contrast(1.1);
			background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
		}
		/* Un changement de zoom touche la TAILLE de l'image autant que sa position : sans
		   transition sur width/height, elle sauterait pendant que la translation, elle, glisse. */
		.viewport-wrapper img.animate {
			transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
						width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
						height 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
		}

		/* Éditeur de portrait : accroché par CLASSE, jamais par id — une page porte autant de
		   cartes que de personnages affichés (joueur, compagnons, recrues). */
		.action-btn {
			position: absolute;
			top: 5px;
			right: 5px;
			z-index: 10;
			width: 36px;
			height: 36px;
			border-radius: 50%;
			border: 1px solid rgba(255,255,255,0.18);
			background: rgba(14,14,14,0.72);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			color: var(--text);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			opacity: 0;
			transform: scale(0.8);
			transition: opacity 0.2s ease, transform 0.2s ease,
						background 0.2s ease, border-color 0.2s ease,
						color 0.2s ease;
			pointer-events: none;
		}

		.viewport-wrapper.hovered .action-btn {
			opacity: 1;
			transform: scale(1);
			pointer-events: auto;
		}

		.action-btn.save-mode {
			border-color: rgba(200,169,110,0.5);
			color: var(--accent);
		}
		.action-btn:hover {
			background: rgba(200,169,110,0.2);
			border-color: var(--accent);
			color: var(--accent);
		}
		.icon { width: 18px; height: 18px; fill: none; stroke: currentColor;
				stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

		/* ── Slider de zoom ─────────────────────────────────────── */
		.zoom-bar {
			position: absolute;
			bottom: 5px;
			left: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 4px 5px;
			border-radius: 20px;
			background: rgba(14,14,14,0.72);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1px solid rgba(255,255,255,0.12);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.25s ease;
			white-space: nowrap;
		}
		.viewport-wrapper.drag-mode .zoom-bar {
			opacity: 1;
			pointer-events: auto;
		}
		.zoom-bar .z-icon {
			color: var(--muted);
			font-size: 12px;
			user-select: none;
		}
		.zoom-slider {
			-webkit-appearance: none;
			appearance: none;
			width: 80%;
			height: 3px;
			border-radius: 2px;
			background: var(--border);
			outline: none;
			cursor: pointer;
		}
		.zoom-slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 12px; height: 12px;
			border-radius: 50%;
			background: var(--accent);
			border: 2px solid #0e0e0e;
			cursor: pointer;
		}
		.zoom-slider::-moz-range-thumb {
			width: 12px; height: 12px;
			border-radius: 50%;
			background: var(--accent);
			border: 2px solid #0e0e0e;
			cursor: pointer;
		}
		.zoom-val {
			font-size: 0.65rem;
			color: var(--accent);
			min-width: 20%;
			text-align: right;
		}

		.char-identity {
			flex: 1;
			min-width: 0;
		}
		.char-name { font-weight: bold; color: #ff4757; font-size: 16px; margin-bottom: 2px; }
		.char-class { color: var(--text-card-color, #aaa); font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }

		/* ── Emplacements libres de la carte (part de butin, spécialité, boutons…) ─────
		   Vides = invisibles : une carte sans pied ni actions (sidebar, fiche) ne montre rien. */
		.card-footer:empty, .card-actions:empty { display: none; }
		.card-footer {
			font-size: 12px; color: var(--muted, #aaa);
			margin-top: 6px; display: flex; flex-wrap: wrap; gap: 10px;
		}
		.card-actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
		/* Carte posée dans une liste (groupe, board de recrutement) : encadrée et resserrée. */
		.character-card.card-list {
			border: 1px solid var(--border-color, #6b5836);
			border-radius: 6px; padding: .6rem .7rem; margin-bottom: .6rem;
			background: rgba(0,0,0,.15);
		}
		.character-card.card-list .char-class { margin-bottom: 4px; }
		/* Carte de liste cliquable (compagnons du groupe) : la carte ouvre la fiche du compagnon. */
		.character-card.card-clickable { cursor: pointer; }
		.cards-list { display: flex; flex-direction: column; }
		.cards-list .sell-empty { padding: .4rem 0; }

		.stat-row { 
			margin-bottom: 8px; 
			display: flex; 
			flex-wrap: wrap; 
			justify-content: space-between;
			align-items: center;
		}

		.stat-value {
			font-weight: bold;
			color: #eee;
		}
		/* MAIN PANELS */
		/* Cadre commun à tous les panneaux plein-écran (carte, fiche, marché, quêtes).
		   Chaque #id ne porte que sa disposition propre (grid / flex…). */
		.panel-frame {
			position: relative;
			width: 100%;
			min-height: 95vh;
			border: 4px double var(--border-color);
			background-color: var(--panel-bg);
			padding: 10px;
			overflow: hidden;
		}
		/* LOCATION PANEL */
		#game-container {
			display: grid;
			grid-template-columns: 1.8fr 1.2fr;
			grid-template-rows: auto 1fr auto auto;
			grid-template-areas: 
				"header header"
				"map sidebar"
				"char char"
				"footer footer";
			gap: 10px;
		}
		.panel-hidden {
			display: none !important; 
		}
		/* FICHE PERSONNAGE */
		#sheet-panel {
			display: flex;
			inset: 0;
			flex-direction: column;
			height: auto;
			bottom: auto;
		}
		/* PANNEAU VENTE (marchand) */
		#purse {
			margin-left: auto;
		}
		/* Disposition « tableau » commune au marché (#sell-panel) et aux quêtes (#quetes-panel). */
		.board-panel {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}
		.board-panel .sell-topbar {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			flex-wrap: wrap;
		}
		.board-panel h2 { margin: 0; }
		.board-panel .sh-inv-item:last-child { border-bottom: none; }
		.sell-prix { font-weight: bold; color: var(--accent-color); white-space: nowrap; }
		.sell-empty { opacity: .7; padding: 12px 0; }
		.q-desc { display: block; white-space: normal; color: var(--text-card-color, #aaa); font-size: .85rem; margin: 2px 0; }
		.sell-relation {
			display: flex;
			align-items: center;
			font-weight: bold;
			padding: 4px 12px;
			border: 2px solid var(--accent-color);
			border-radius: 16px;
			background: rgba(0,0,0,0.25);
			white-space: nowrap;
		}
		.sell-relation.relation-bad { border-color: #b3402f; color: #e88; }
		.sh-marchander-btn {
			padding: 2px 8px; background: rgba(255,215,0,0.08);
			border: 1px solid rgba(255,215,0,0.3); color: var(--accent-color);
			cursor: pointer; font-size: 0.8rem; white-space: nowrap;
			margin-left: auto;
		}
		.sh-marchander-btn:disabled { opacity: .4; cursor: not-allowed; }
		/* Badge « objet d'un compagnon ou d'une monture » dans la liste de vente
		   (biens mis en commun ; l'icône vient du serveur, cf. `porteur_icon`). */
		.sell-owner {
			margin-left: 6px; padding: 0 6px; border-radius: 8px;
			font-size: 0.72rem; color: #cbb98a;
			background: rgba(120,110,80,0.28); border: 1px solid rgba(205,163,73,0.3);
			white-space: nowrap; vertical-align: middle;
		}
		.sheet-tab-bar {
			display: flex;
			align-items: stretch;
			padding: 2px;
			background: rgba(0,0,0,0.4);
			border-bottom: 2px solid var(--border-color);
			flex-shrink: 0;
			overflow: hidden;
		}
		.sheet-tabs-scroll {
			display: flex;
			gap: 4px;
			overflow-x: auto;
			flex: 1;
			min-width: 0;
			scrollbar-width: thin;
			scrollbar-color: var(--border-color) transparent;
		}
		.sheet-tabs-scroll::-webkit-scrollbar { height: 3px; }
		.sheet-tabs-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
		.sheet-tab-btn {
			padding: 6px 10px;
			background: var(--btn-bg);
			border: 1px solid var(--border-color);
			color: var(--text-color);
			cursor: pointer;
			font-size: 0.85rem;
			white-space: nowrap;
			flex-shrink: 0;
		}
		.sheet-tab-btn.active {
			border-color: var(--accent-color);
			color: var(--accent-color);
		}
		.close-sheet-btn {
			flex-shrink: 0;
			margin-left: 4px;
			border-left: 2px solid var(--border-color);
			position: relative;
			color:#ff4757;
			margin-left:auto;
		}
		#close-sheet::before {
			content: '';
			position: absolute;
			right: 100%;
			top: 0;
			bottom: 0;
			width: 20px;
			background: linear-gradient(to right, transparent, rgba(0,0,0,0.55));
			pointer-events: none;
		}
		.sheet-body {
			padding: 12px;
		}
		.sheet-panel {
			display: none;
		}
		.sheet-panel.active {
			display: block;
		}
		.sh-section {
			font-size: 0.95rem;
			color: var(--accent-color);
			text-transform: uppercase;
			border-bottom: 1px solid var(--border-color);
			padding-bottom: 4px;
			margin: 12px 0 8px;
		}
		.sh-base-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
			gap: 8px;
		}
		/* La boîte entière est cliquable : le clic rejoue le title en toast (seul canal au
		   tactile, cf. showCaractTooltip) — le bouton d'XP garde son propre clic. */
		.sh-stat-box {
			background: var(--btn-bg);
			border: 1px solid var(--border-color);
			padding: 8px;
			text-align: center;
			cursor: help;
		}
		.sh-stat-lbl { font-size: 0.8rem; color: var(--muted); display: block; }
		/* Style des valeurs et petits séparateurs */
		.sh-stat-val {
			font-size: 1.3rem;
			color: var(--accent-color);
			margin: 4px 0;
		}
		.niveau-txt {
			font-size: 0.85rem;
			color: var(--muted);
		}
		.sh-stat-max-sep {
			font-size: 1rem;
			font-weight: normal;
			margin-left: 2px;
		}

		/* Valeur courante (tous modificateurs compris), sous la jauge de la valeur de base.
		   Le delta est coloré et le tooltip (title) de la boîte détaille chaque source. */
		.sh-mod-val {
			font-size: 1.5rem;
			font-weight: bold;
			margin: 2px 0 4px;
		}
		.sh-stat-box.buffed {
			border-color: var(--accent-color);
		}
		.sh-stat-delta {
			margin-right: 8px;
			font-size: 0.75rem;
			font-weight: bold;
			min-height: 1em;
		}
		.sh-stat-delta.pos { color: #4caf50; }
		.sh-stat-delta.neg { color: #e05252; }

		/* Conteneur de la jauge pour gérer le survol ou le positionnement */
		.sh-stat-bar-wrapper {
			width: 100%;

		.sh-ville-score { font-weight: bold; font-size: 0.95rem; }
		.sh-ville-score.pos { color: #2ed573; }
		.sh-ville-score.neg { color: #ff4757; }
		.sh-ville-score.neu { color: var(--muted); }
		.sh-ville-body { display: none; padding-left: 10px; }
		.sh-ville.open > .sh-ville-body { display: block; }
		.sh-ville-body .sh-relation:last-child { border-bottom: 0; }
		.sh-ville-body .sh-relation.hidden { display: none; }
		/* Chips d'effets actifs (consommables) — colonne gauche de la fiche + onglet stats. */
		.sh-effets-chips { display: flex; flex-wrap: wrap; gap: 6px; }
		.sh-effets-chips:not(:empty) { margin-top: 8px; }
		.sh-effet-chip { font-size: 0.8rem; padding: 3px 8px; background: var(--btn-bg); border: 1px solid var(--border-color); border-radius: 12px; white-space: nowrap; }
		.sh-effet-chip .sh-effet-restants { color: var(--muted); margin-left: 4px; }
		.sh-quest { padding: 10px; background: var(--btn-bg); border: 1px solid var(--border-color); margin-bottom: 8px; }
		/* Hauteurs par famille de liste : la classe est portée par le WRAPPER, la
		   contrainte s'applique au scroller. Listes de l'onglet ⚡ (sorts, écoles,
		   compétences, apprentissages) : le contenu est réécrit en innerHTML dans
		   le scroller, l'ombre vit dans le wrapper et survit à chaque rendu client. */
		.sh-quest-list-active > .sh-rel-scroll { min-height: 35vh; max-height : 38vh; }
		.sh-quest-list-ended > .sh-rel-scroll { max-height : 35vh; }
		.sh-capa-list > .sh-rel-scroll { max-height: 34vh; }
		.sh-jnl-list          > .sh-rel-scroll { max-height: 34vh; }
		.sh-quest-hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
		.sh-quest-rang { font-size: 0.8rem; font-weight: bold; padding: 2px 6px; background: #333; border-radius: 3px; color: var(--accent-color); }
		.sh-quest-title { flex: 1; min-width: 200px; font-weight: bold; font-size: 1rem; }
		.sh-quest-status { font-size: 0.8rem; padding: 2px 6px; border-radius: 3px; }
		.sh-quest-status.en-cours { background: rgba(46,133,213,0.3); color: #2e86de; }
		.sh-quest-status.termine { background: rgba(46,213,115,0.2); color: #2ed573; }
		/* Chrono des quêtes à délai réel (transport) — vire à l'orange dans les 5 dernières minutes. */
		.sh-quest-timer { font-size: 0.8rem; padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.08); color: var(--gold2, var(--gold)); white-space: nowrap; }
		.sh-quest-timer.urgent { background: rgba(255,165,2,0.25); color: #ffa502; }
		.sh-quest-timer.expire { background: rgba(255,71,87,0.25); color: #ff4757; }
		/* Groupe d'actions du header de quête : poussé à droite, reste insécable (le header wrap
		   au-dessus de lui en mobile) ; on neutralise l'auto-margin global de .sh-drop-btn (l.749)
		   pour que les boutons du groupe restent collés au lieu de s'écarter. */
		.sh-quest-hdr .sh-inv-actions { margin-left: auto; flex-wrap: wrap; }
		.sh-quest-hdr .sh-inv-actions .sh-drop-btn { margin-left: 0 !important; }
		.sh-abandon-btn { border-color: #7a4a3a; color: #d98b6b; }
		.sh-abandon-btn:hover { background: rgba(160,60,40,0.15); }
		.sh-quest-desc { font-size: 0.9rem; color: var(--muted); }
		.sh-quest-progress { font-size: 0.9rem; color: var(--gold2, var(--gold)); margin-top: 4px; }
		.sh-quest-reward { display: flex; gap: 8px; margin-top: 6px; font-size: 0.9rem; }
		.sh-journal-entry { padding: 10px; background: var(--btn-bg); border-left: 3px solid var(--accent-color); margin-bottom: 8px; font-size: 0.95rem; }
		.sh-journal-date { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
		/* ⚠️ pre-wrap : une entrée est MULTI-LIGNE et `auberge.nettoyer_texte` préserve ses
		   sauts de ligne — les écraser au rendu annulerait le soin pris au serveur (même
		   règle, même raison que `.aub-msg-txt` pour une annonce de taverne). */
		.sh-journal-txt { white-space: pre-wrap; overflow-wrap: anywhere; }
		/* Bestiaire : une ligne par espèce — vignette servie par le mount /monsters. */
		.jnl-best { display: flex; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border-color); }
		.jnl-best:last-child { border-bottom: 0; }
		.jnl-best-img {
			width: 64px; height: 64px; flex: 0 0 64px; border-radius: 6px;
			background: rgba(0,0,0,.25) center/contain no-repeat;
			border: 1px solid var(--border-color);
		}
		.jnl-best-corps { flex: 1 1 auto; min-width: 0; }
		.jnl-best-nom { font-weight: bold; }
		.jnl-best-compte { font-size: .82rem; color: var(--muted); font-weight: normal; }
		.jnl-best-desc { font-size: .88rem; color: var(--muted); margin: 3px 0; }
		.jnl-best-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
		.jnl-best-tag {
			font-size: .72rem; padding: 1px 6px; border-radius: 9px;
			background: rgba(255,255,255,.06); border: 1px solid var(--border-color);
		}
		.jnl-best-lieux { font-size: .8rem; color: var(--muted); margin-top: 3px; }
		.sh-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0px; color: var(--muted); font-size: 1rem; }
		.sh-empty-icon { font-size: 2.1rem; }
		.sh-xp-btn {
			width: 100%; margin-top: 5px; padding: 3px 5px;
			background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.25);
			color: var(--accent-color); cursor: pointer; font-size: 0.8rem; text-align: center;
		}
		.sh-xp-btn:hover:not(:disabled) { background: rgba(255,215,0,0.22); border-color: var(--accent-color); }
		.sh-xp-btn:disabled { opacity: 0.3; cursor: not-allowed; }
		.sh-xp-btn.subcap { border-color: rgba(197,197,197,0.2); color: var(--muted); }
		.sh-stat-pip.subcap { background-color: var(--muted); box-shadow: 0 0 2px rgba(197,197,197,0.4); }
		/* Dépassement du max racial : unique et IRRÉVERSIBLE — il ne doit pas se confondre
		   avec le bouton d'XP ordinaire, doré comme tout le reste de la fiche. */
		.sh-bonus-btn {
			margin-top: 3px; border-color: rgba(150,120,220,0.45);
			color: #b9a3ee; background: rgba(150,120,220,0.10);
		}
		.sh-bonus-btn:hover:not(:disabled) { background: rgba(150,120,220,0.22); border-color: #b9a3ee; }
		.sh-xp-cost { font-size: 0.75rem; }

		/* ── Sheet panel layout ──────────────────────────────────── */
		.sheet-layout {
			display: flex;
			flex-direction: row;
			flex: 1;
			overflow: visible;
			min-height: 0;
			height: auto;
		}
		.sheet-left-col {
			width: 25vw;
			max-width: 300px;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			border-right: 2px solid var(--border-color);
			background: rgba(0,0,0,0.3);
			overflow: hidden;
		}
		.sheet-left-portrait {
			flex: 1;
			overflow: hidden;
			min-height: 0;
		}
		.sheet-left-portrait img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: top center;
			display: block;
		}
		.sheet-left-info {
			padding: 10px;
			border-top: 1px solid var(--border-color);
			flex-shrink: 0;
			font-size: 13px;
		}
		.sheet-right-col {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
		}
		.sheet-char-mini {
			display: none;
		}
		@media (orientation: portrait) {
			.sheet-layout {
				flex-direction: column;
			}
			.sheet-left-col {
				display: none;
			}
			.sheet-char-mini {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px;
				background: rgba(34,34,34,0.9);
				border-bottom: 2px solid var(--border-color);
				flex-shrink: 0;
				font-size: 13px;
			}
		}

		/* 5. GESTION (Footer) */
		.management-footer {
			grid-area: footer;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}
		.manage-btn {
			padding: 10px;
			height : 45px;
			background: #222;
			border: 2px solid var(--border-color);
			color: var(--text-color);
			font-weight: bold;
			cursor: pointer;
			text-transform: uppercase;
		}
		.viewport {
			position: relative;
			width: calc(var(--dim_x) * var(--dist-view)* 1px); 
			height: calc(var(--dim_y) * var(--dist-view)* 1px); 
			touch-action: none;
			overflow: hidden;
		}

		img#bg-image {
			position: absolute;
			display: block;
			top: 0;
			left: 0;
			/* Décalage porté par `transform` et non plus par top/left : c'est la seule
			   propriété que le compositeur peut animer sans relayout — et la transition
			   ci-dessous était déclarée sur elle depuis toujours, sans que rien ne la
			   fasse varier (le pas sautait donc d'une case à l'autre).
			   ⚠️ `--x`/`--y` ne sont pas des custom properties enregistrées (@property),
			   donc non interpolables — mais on ne les anime pas : c'est la valeur
			   CALCULÉE de `transform` qui est interpolée à chaque `setProperty` de move(). */
			transform: translate3d(
				calc((var(--dist-view)/2 - var(--x)) * var(--dim_x) * 1px),
				calc((var(--dist-view)/2 - var(--y)) * var(--dim_y) * 1px),
				0);
			max-width: none;
			transition: transform var(--map-anim, 260ms) ease-out;
			will-change: transform;
		}
		@media (prefers-reduced-motion: reduce) {
			img#bg-image { transition: none; }
		}
		img#bg-image-fit {
			width : 56vw;
			max-width : 75vw;
			height: stretch;
			max-height: 75vh;
			object-fit: contain;
		}
		.token {
			position: absolute;
			top: calc(var(--dim_y) * (var(--dist-view)/2) * 1px);
			left: calc(var(--dim_x) * (var(--dist-view)/2) * 1px);
			width: calc(var(--dim_x) * 1px);
			height: calc(var(--dim_y) * 1px);
			display: flex; align-items: center; justify-content: center;
			z-index: 10; pointer-events: none;
			border-width: 3px;
			border-style: solid;
			border-color: red;
			border-radius: 30%;
		}
		.token::after {
			content: '';
			background: #ff4757; border-radius: 50%; border: 2px solid red;
			box-shadow: 0 0 10px #ff4757;
		}

		/* Pavé de déplacement — SOURCE UNIQUE (part-move-panel.html), partagée avec la page de
		   combat et le mode test de l'éditeur. ⚠️ Les règles sont désormais SCOPÉES en
		   `.controls .btn` : `.btn` était global ici, mais il n'est porté que par les neuf
		   flèches (vérifié) — et un `.btn` nu existe dans l'éditeur, où il vaut `width:100%`. */
{{ movepanel.move_panel_css('.navigation-panel', '.controls') }}
		#personnage {
			display: none;
		}
		.val-niveau {
			display:flex;
			justify-content:space-between;
			align-items:center;
			margin-top:8px;
			gap: 12px;
			justify-content: flex-start;
		}
		.val-niveau>span {
			color:var(--muted);
			font-size:.85rem;
			white-space: nowrap;
		}
		.niveau-nb {
			color:var(--text)
		}
		#sh-btn-voc-niveau{
			width: auto;
			margin-top: 0px;
			margin-bottom: 0px;
		}
		#sh-voc-cout{
		}

		/* RESPONSIVE UNIQUE : Portable Paysage */
		@media (max-height: 600px) and (orientation: landscape) {
			#game-container {
				grid-template-columns: 1.8fr 1.2fr;
				grid-template-rows: auto auto auto auto;
				grid-template-areas: 
					"header header"
					"map sidebar"
					"char subloc"
					"footer footer";
				height: auto;
				overflow: visible;
			}
			/* Extrait la liste des lieux de la sidebar pour la mettre sur la 3ème ligne */
			.sidebar {
				overflow: visible;
			}
			.sub-locations-panel {
				grid-area: subloc;
				overflow: visible;
			}
			.character-panel {
				grid-area: char;
				grid-column: 1 / 3;
			}
			.map-area {
				height: stretch;
				max-height: 300px;
			}
			.location-desc {
				padding: 5px;
			}
			.location-desc h2 {
				font-size: 0.9rem;
			}
			.sub-locations-panel h3 {
				font-size: 0.85rem;
			}
			.sub-loc-btn {
				font-size: 0.8rem;
			}
			.sh-section {
				font-size: 0.9rem;
			}
		}

		/* RESPONSIVE : Mode Portrait Mobile */
		@media (max-width: 768px) and (orientation: portrait) {
			.sheet-layout {
				flex-direction: column;
			}
			.sheet-left-col {
				display: none;
			}
			#personnage {
				display: inline;
			}
			.sheet-char-mini {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px;
				background: rgba(34,34,34,0.9);
				border-bottom: 2px solid var(--border-color);
				flex-shrink: 0;
				font-size: 13px;
			}
			#game-container {
				grid-template-columns: 1fr;
				grid-template-rows: auto auto auto auto;
				grid-template-areas: 
					"header"
					"map"
					"sidebar"
					"char"
					"footer";
				height: auto;
				overflow: visible;
			}
			img#bg-image-fit {
				width : 85vw;
				max-width: min-content;
			}
			.sidebar {
				overflow: visible;
			}
			.navigation-panel {
				order: 2;
			}
			.sub-locations-panel {
				order: 1;
				overflow: visible;
			}
			.map-area {
				height: stretch;
				max-height: 465px;
			}		
			.controls {
				background: rgba(34, 34, 34, 0.8);
				padding: 5px;
				margin: 0 auto;
				border-radius: 0 0 15px 15px;
			}
			.sh-quest-status {
				width: 30vw;
				text-align: center;
			}
		}
	</style>
</head>
<body>
	<div id="game-container" class="panel-frame">
		<header class="location-desc" aria-label="Fiche personnage">
			<h2>{{title}}</h2>
		</header>
		<main class="map-area">
			{% if dimensions %}
			<div class="grid-placeholder">
				<div class="viewport" id="swipe-zone">
					<img id="bg-image" src="{{ url_for(image_route, path=image) }}">
					<div class="token"></div>
				</div>
			</div>
			{% else %}
			<img id="bg-image-fit" src="{{ url_for(image_route, path=image) }}">
			{% endif %}
		</main>
		<aside class="sidebar">
			<section class="sub-locations-panel">
				{% if lieu_texte %}
				<div class="loc-texte">{{ lieu_texte }}</div>
				{% endif %}
				{% if achat_sous_categories or est_guilde or est_recrutement or est_etable or est_auberge or pnj_present %}
				<h3 id="sub-actions-title" >Actions</h3>
				<ul class="sub-locations-list">
					{% if achat_sous_categories %}
					<li><button class="sub-loc-btn" onclick="openSellPanel()">🏷️ Achat-Vente</button></li>
					{% endif %}
					{% if est_guilde %}
					<li><button class="sub-loc-btn" onclick="openQuetesBoard()">📜 Tableau des quêtes</button></li>
					{% endif %}
					{% if est_recrutement %}
					<li><button class="sub-loc-btn" onclick="openRecrutementBoard()">🤝 Recrues</button></li>
					{% endif %}
					{% if est_etable %}
					<li><button class="sub-loc-btn" onclick="openEtable()">🐴 Montures</button></li>
					{% endif %}
					{% if est_auberge %}
					<li><button class="sub-loc-btn" onclick="openAuberge()">🍺 Salle commune</button></li>
					{# Passer la nuit est une action du LIEU, pas de la salle commune : on ne
					   traverse pas les tables pour aller se coucher. Le coût est rendu ici, le
					   log de nuit est servi par le contexte (cf. AUBERGE_NUIT). #}
					<li><button class="sub-loc-btn" id="aub-nuit-btn" onclick="passerLaNuit()">🌙 Passer la nuit{% if auberge_nuit and auberge_nuit.cout %} <span class="aub-nuit-cout" id="aub-nuit-cout"></span>{% endif %}</button></li>
					{% endif %}
					{% if pnj_present %}
					<li><button class="sub-loc-btn" onclick="openPnjDialogue()">🗣 Parler à {{pnj_present.nom}}</button></li>
					{% endif %}
				</ul>
				{% endif %}
				<section id="recolte-action"></section>
				<section id="guidage-action"></section>
				<h3 id="sub-locations-title">Lieux</h3>
				<ul id="sub-locations-list-id" class="sub-locations-list">
				</ul>
			</section>
			{% if dimensions %}
			<!-- Pavé de déplacement : markup et CSS viennent de part-move-panel.html, partagés avec
			     la page de combat et le mode test de l'éditeur de carte. ⚠️ Le `{% raw %}{% if dimensions %}{% endraw %}`
			     reste À L'EXTÉRIEUR : un lieu sans grille afficherait sinon un pavé mort. -->
			<section class="navigation-panel">
				{{ movepanel.move_panel('controls', fn='move',
					centre={'classes': 'btn move_btn', 'onclick': 'waitTurn()', 'title': 'Attendre un tour'}) }}
			</section>
			{% endif %}
		</aside>
		{% set d       = character.get("derived_stats", {}) %}
		{% set _pv     = character.get("currentPV", character["caracteristiques_current"].get("PV", 0)) %}
		{% set _pm     = character.get("currentPM", character["caracteristiques_current"].get("PM", 0)) %}
		{% set _pv_max = d.get("pv_max") or 1 %}
		{% set _pm_max = d.get("pm_max") or 1 %}
		{% set _pv_pct = [(_pv / _pv_max * 100)|int, 100]|min %}
		{% set _pm_pct = [(_pm / _pm_max * 100)|int, 100]|min %}
		{# Les paramètres de la carte du joueur, une fois pour les deux exemplaires (sidebar + fiche). #}
		{% set carte_joueur = {
			"porteur_id": character["_id"],
			"nom": character["prenom"] ~ " " ~ character["nom"],
			"voc_icon": vocation["icon"], "voc_label": vocation["label"],
			"voc_niveau": character.get("vocations_niveaux", {}).get(character.get("voc",""), 0),
			"race": character["race"], "niveau": character.get("niveau", 0),
			"rang": character.get("rang", "aucun"),
			"rang_title": character.get("rangs_guilde_title", ""),
			"pv": _pv, "pv_max": d.get("pv_max", 0), "pm": _pm, "pm_max": d.get("pm_max", 0),
			"image": character["image"], "zoom": character.get("portrait_zoom", 50),
		} %}
		<section class="character-panel">
		{% call cards.character_card(card_id="sidebar", **carte_joueur) %}
			<!-- Effets actifs (consommables) : miroir du panneau latéral, resynchronisé
			     à chaque déplacement via _renderEffetsActifs (rep.effets_actifs). -->
			<div id="sh-effets-actifs-panel" class="sh-effets-chips"></div>
		{% endcall %}
		</section>
		<footer class="management-footer">
			{# Pastille verte = des points d'attribut attendent d'être répartis (le joueur pour
			   👤, n'importe quel compagnon pour 👥). Rendue TOUJOURS, masquée par `hidden` :
			   `_majIndicateursPoints` n'a alors qu'à basculer l'attribut. L'état initial vient
			   du serveur — `compagnons_points` évite d'avoir à ouvrir le panneau 👥 pour
			   apprendre qu'un compagnon a des points. #}
			<button class="manage-btn" onclick="openSheet()">👤 Personnage<span
				class="pts-indic pts-dispo" id="pts-indic-perso" title="Points d'attribut à répartir"
				{% if character.get("attribute_points", 0) <= 0 %}hidden{% endif %}>★</span></button>
			<button class="manage-btn" onclick="openGroupe()">👥 Groupe<span
				class="pts-indic pts-dispo" id="pts-indic-groupe" title="Un compagnon a des points d'attribut à répartir"
				{% if not compagnons_points %}hidden{% endif %}>★</span></button>
		</footer>
	</div><!-- /#game-container -->
	<div id="sheet-panel" class="panel-hidden panel-frame" aria-label="Fiche personnage">
		<!-- ══ FICHE PERSONNAGE ══ -->
		<div class="sheet-layout">
			<!-- Colonne gauche : portrait (paysage uniquement) -->
			<div class="sheet-left-col">
				<div class="sheet-left-portrait">
					<div class="portrait-overlay-bars">
						<div class="portrait-stat-bar pv-side">
							<div class="bar-fill{% if _pv > _pv_max %} is-overflow{% endif %}" style="height:{{_pv_pct}}%"></div>
						</div>
						<div class="portrait-stat-bar pm-side">
							<div class="bar-fill{% if _pm > _pm_max %} is-overflow{% endif %}" style="height:{{_pm_pct}}%"></div>
						</div>
					</div>
					<img src="{{ url_for('characters', path=character['image']) }}" alt="">
				</div>
				<div class="sheet-left-info">
					<div class="char-name">{{character["prenom"]}} {{character["nom"]}}</div>
					<div class="char-class">{{vocation["icon"]}} {{vocation["label"]}} Niv.<span id="niv-voc-left-info" class="voc-niveau niveau-nb">{{character.get("vocations_niveaux", {}).get(character.get("voc",""), 0)}}</span> - {{character["race"]}} Niv.<span id="niv-left-info" class="race-niveau niveau-nb">{{character.get("niveau",'0')}}</span> ·<span id="rang-left-info"{% if character.get("rangs_guilde_title") %} title="{{ character['rangs_guilde_title'] }}"{% endif %}> Rang {{character.get("rang",'aucun')}}</span></div>
					<div class="char-vitals" style="margin-top:8px">
						<span class="pv-val">PV {{_pv}}/<span id="stat-left-drv-pv_max">{{d.get("pv_max","—")}}</span></span>
						<span class="pm-val">PM {{_pm}}/<span id="stat-left-drv-pm_max">{{d.get("pm_max","—")}}</span></span>
					</div>
					<!-- Effets actifs (consommables) : rendu par _renderEffetsActifs. -->
					<div id="sh-effets-actifs" class="sh-effets-chips"></div>
				</div>
			</div>
			<!-- Colonne droite : contenu -->
			<div class="sheet-right-col">
				{# Carte du joueur, exemplaire de la fiche (mobile). Le mode compagnon la rebascule sur
				   un compagnon : c'est la MÊME carte, un autre porteur (renderCharacterCard / setSujet). #}
				<div id="personnage">
					{{ cards.character_card(card_id="charac-sheet", **carte_joueur) }}
				</div>
				<!-- Tab bar -->
				<nav class="sheet-tab-bar" role="tablist">
					<div class="sheet-tabs-scroll">
						<button class="sheet-tab-btn active" onclick="sheetTab('stats', this)"      role="tab" aria-selected="true">📊 Stats</button>
						<button class="sheet-tab-btn"        onclick="sheetTab('inventaire', this)" role="tab">🎒 Inventaire</button>
						<button class="sheet-tab-btn tab-principal-only" onclick="sheetTab('quetes', this)"     role="tab">📜 Quêtes</button>
						<button class="sheet-tab-btn"        onclick="sheetTab('competences', this)" role="tab">⚡ Compétences</button>
						<button class="sheet-tab-btn tab-principal-only" onclick="sheetTab('relations', this)"  role="tab">🤝 Relations</button>
						<button class="sheet-tab-btn tab-principal-only" onclick="sheetTab('journal', this)"    role="tab">📖 Journal</button>
					</div>
					<button id="close-sheet" class="sheet-tab-btn close-sheet-btn" onclick="closeSheet()" role="button">✕ Fermer</button>
				</nav>
				<div class="sheet-body">
					<!-- ── STATS ── -->
					<div class="sheet-panel active" id="sh-stats">
						{% set xp_total    = character.get("xp_total", 0) %}
						{% set attribute_points = character.get("attribute_points", 0) %}
						{% set niveau      = character.get("niveau", 0) %}
						{# Seuils xp_niv_prev / xp_niv_next fournis par le serveur (xp_seuil_niveau,
						   même formule que compute_character_level — ne pas les recalculer ici). #}
						{% set xp_bar_pct  = [((xp_total - xp_niv_prev) / (xp_niv_next - xp_niv_prev) * 100)|int, 100]|min if xp_niv_next > xp_niv_prev else 100 %}
						{% set voc_id      = character.get("voc", "") %}
						{% set voc_niveau  = character.get("vocations_niveaux", {}).get(voc_id, 0) %}
						{% set voc_cout    = (voc_niveau + 1) * xp_voc_coeff %}
						<div class="sh-section">✦ Expérience</div>
						<div style="background:var(--btn-bg);border:1px solid var(--border-color);padding:12px;margin-bottom:8px">
							<!-- Valeurs identifiées : la fiche sert aussi les compagnons (mode compagnon),
							     donc ce bloc est entièrement re-rendu côté client par _renderXp(). -->
							<div class="sh-xp-header">
								<span>XP totale : <strong id="sh-xp-total" style="color:var(--accent-color)">{{ xp_total }}</strong></span>
								<span class="pts-dispo">Points : <span id="sh-attribute-points">{{ attribute_points }}</span></span>
							</div>
							<div class="val-niveau">
								<span><span id="sh-race-label">{{character["race"]}}</span> Niv. : <strong id="sh-race-niveau" class="race-niveau niveau-nb">{{ niveau }}</strong></span>
								<span id="sh-xp-next-lbl" style="white-space: wrap;text-align:right;width: 100%;">Niv. {{ niveau + 1 }} à {{ xp_niv_next }} XP</span>
							</div>
							<div class="sh-xp-bar">
								<div class="sh-xp-fill" id="sh-xp-fill" style="width:{{ xp_bar_pct }}%"></div>
							</div>
							<div class="val-niveau">
								<span><span id="sh-voc-label">{{ vocation["label"] }}</span> Niv. : <strong id="sh-voc-niveau" class="voc-niveau niveau-nb">{{ voc_niveau }}</strong></span>
								<button class="sh-xp-btn" id="sh-btn-voc-niveau"
										{% if attribute_points < voc_cout %}disabled{% endif %}
										{% if attribute_points == 0 %}style="display:none"{% endif %}
										onclick="spendXpVocation()">
									Monter — <span id="sh-voc-cout">{{ voc_cout }}</span> P<small>oints</small>
								</button>
							</div>
						</div>

						<!-- Chaque boîte porte la valeur de BASE (val/plafond + jauge) puis la valeur
						     COURANTE, tous modificateurs compris (objets équipés, compétences passives,
						     effets actifs) : rendu 100 % client (_renderCaractsMod) pour que le tooltip
						     d'origine n'ait qu'une seule implémentation. -->
						<div class="sh-section">⚔ Caractéristiques</div>
						<div class="sh-base-grid">
{% for code, nom in [("V","Vitesse"),("F","Force"),("R","Résistance"),("Ag","Agilité"),("Vol","Volonté"),("Int","Intelligence"),("Cha","Charisme"),("Ch","Chance")] %}
{% set val      = character["caracteristiques_current"].get(code,0) %}
{% set cap      = stat_caps.get(code, 0) %}
{% set maxRace  = race["stats_max"].get(code,1) %}
{% set race_min = race["stats"].get(code, 0) %}
{% set coeff    = xp_coeff.get(code, 1) %}
{% set cost_next = [(val + 1 - race_min) * coeff, 0] | max %}
{% set at_cap        = val >= cap %}
{% set is_accessible = cap >= maxRace %}
{% set can_afford    = attribute_points >= cost_next %}
{# Échelle de la jauge : le max racial, SAUF si le bonus de dépassement a été engagé ici —
   le plafond passe alors AU-DESSUS et le remplissage sortirait de la barre.
   Le pip, lui, reste PLANTÉ au max naturel de la race : c'est le repère que le
   remplissage doit visiblement franchir. Il ne descend en-dessous que lorsque le quota
   de maxima rabaisse le plafond (`subcap`) — jamais au-dessus. #}
{% set echelle       = [maxRace, cap] | max %}
{% set pip_val       = [cap, maxRace] | min %}
{# `max_bonus` / `max_bonus_used` viennent de bloc_fiche, comme stat_caps : même source que
   celle que lit la fiche d'un compagnon (qui, elle, ne reçoit pas `race`). #}
{% set bonus_depass  = max_bonus.get(code, 0) %}
							<div class="sh-stat-box" onclick="showCaractTooltip(event, '{{ code }}')">
								<span class="sh-stat-lbl">{{ nom }}</span>
								<div class="sh-stat-val" id="sh-sv-{{ code }}">
									{{ val }}<span class="sh-stat-max-sep">/{{ maxRace | int }}</span>
								</div>
								<div class="sh-stat-val sh-mod-val" id="sh-mod-{{ code }}"></div>
								<div class="sh-stat-bar-wrapper">
									<div class="sh-stat-bar">
										<div class="sh-stat-fill" id="sh-stat-bar-{{ code }}" style="width: {{ (val / echelle * 100) | int }}%" data-maxrace="{{ maxRace | int }}"></div>
										<div class="sh-stat-pip{% if not is_accessible %} subcap{% endif %}"
											 style="left: {{ (pip_val / echelle * 100) | int }}%"></div>
									</div>
								</div>
								<button class="sh-xp-btn{% if not is_accessible %} subcap{% endif %}"
										id="sh-btn-{{ code }}"
										{% if at_cap or not can_afford %}disabled{% endif %}
										{% if attribute_points == 0 %}style="display:none"{% endif %}
										onclick="spendXp('{{ code }}')">
									- <span class="sh-xp-cost">{{ cost_next }} P<small>oints</small></span>
								</button>
								{# Dépassement du max racial (humain) : offert sur les seules caracts BLOQUÉES
								   (au max racial, ou coincées au sous-plafond par le quota de maxima). Le
								   bouton est rendu même quand il n'est pas offert, en `display:none` : une
								   caract peut se bloquer en cours de session (montée jusqu'au max, ou quota
								   qui se remplit et rabaisse un autre plafond) et `_refreshStatBoxes`
								   l'allume par `getElementById` — sans l'élément, il n'aurait rien à allumer. #}
								{% if bonus_depass > 0 and not max_bonus_used and at_cap and attribute_points > 0 %}
								<button class="sh-xp-btn sh-bonus-btn" id="sh-bonus-{{ code }}"
										{% if not can_afford %}disabled{% endif %}
										onclick="demanderMaxBonus('{{ code }}')">
									✦ Dépasser <span class="sh-xp-cost">+{{ bonus_depass }}</span>
								</button>
								{% else %}
								<button class="sh-xp-btn sh-bonus-btn" id="sh-bonus-{{ code }}" style="display:none"></button>
								{% endif %}
							</div>
							{% endfor %}
						</div>

						<div class="sh-section" style="margin-top:14px">🛡 Caractéristiques dérivées</div>
						{% for lbl, key, unit in [
							("PV max","pv_max",""),("PM max","pm_max",""),
							("Initiative","initiative",""),("Déplacement","deplacement"," cases"),
							("Corps à corps","cc",""),("À distance","cd",""),
							("Armure (PA)","pa",""),("Déf. magique","pm_def",""),
							("Dégâts CàC","degats_cc",""),("Charge max","charge_max"," kg")
						] %}
						<div class="sh-derived-row">
							<span class="sh-derived-lbl">{{ lbl }}</span>
							<span class="sh-derived-val" id="sh-drv-{{ key }}">{{ d.get(key,"—") }}{{ unit }}</span>
						</div>
						{% endfor %}

						<!-- Effets actifs de consommables (buffs/régén, décrémentés au déplacement).
						     Les dérivées ci-dessus les incluent déjà (caracts_avec_buffs). -->
						<div id="sh-effets-actifs-stats" class="sh-effets-chips"></div>
					</div>

					<!-- ── INVENTAIRE ── -->
					<div class="sheet-panel" id="sh-inventaire">
						<div class="sh-section">💰 Finances</div>
						<div class="sh-finance-row">
							<div class="sh-finance">🟡 <span class="amt" id="amt-or">{{ character.get("or",0) }}</span> Or</div>
							<div class="sh-finance">⚪ <span class="amt" id="amt-argent">{{ character.get("argent",0) }}</span> Argent</div>
							<div class="sh-finance">🟤 <span class="amt" id="amt-cuivre">{{ character.get("cuivre",0) }}</span> Cuivre</div>
						</div>

						{# Deux colonnes hors mobile (.sh-inv-wrap) : la silhouette à gauche, le sac
						   à droite — équiper depuis le sac ne demande plus de faire défiler l'onglet.
						   Charge et « Au sol » restent en pleine largeur, dessous. #}
						<div class="sh-inv-wrap">
						<div class="sh-inv-col">
						<div class="sh-section">🛡 Équipement</div>
						{% set slots = character.get("slots",{}) %}
						<div class="sh-paperdoll">
							{# `src` posé par `_refreshPaperdollImg` (globales `_raceNom`/`_sexe`) : la fiche
							   sert aussi les COMPAGNONS, une silhouette rendue ici serait figée sur le joueur. #}
							<img class="sh-paperdoll-img" alt="Équipement">
							{% for key, nom, sx, sy in [
								("tete",        "Tête",     "0%",  "5%"),
								("epaules",     "Epaules",  "0%",  "17%"),
								("torse",       "Torse",    "0%",  "29%"),
								("mains",       "Bras",     "0%",  "41%"),
								("jambes",      "Jambes",   "0%",  "75%"),
								("pieds",       "Pieds",    "0%",  "85%"),
								("cou",         "Cou",      "70%", "5%"),
								("anneau_1",    "Anneau 1", "70%", "17%"),
								("anneau_2",    "Anneau 2", "70%", "29%"),
								("ceinture",    "Ceinture", "70%", "41%"),
								("main_droite", "Main D.",  "5%", "55%"),
								("main_gauche", "Main G.",  "65%", "55%"),
							] %}
							<div class="sh-slot{% if slots.get(key) %} occupied{% endif %}" id="slot-{{ key }}" style="left:{{ sx }};top:{{ sy }}" onclick="openItemDetail('equip','{{ key }}')"{% if slots.get(key) %} title="Voir la fiche"{% endif %}>
								<button class="sh-unequip-btn" onclick="event.stopPropagation();unequip('{{ key }}')" title="Déséquiper"{% if not slots.get(key) %} style="display:none"{% endif %}>×</button>
								<span class="sh-slot-lbl">{{ nom }}</span>
								<span class="sh-slot-name{% if not slots.get(key) %} sh-slot-empty{% endif %}">{% if slots.get(key) %}{{ slots[key]["nom"] if slots[key] is mapping else slots[key] }}{% else %}—{% endif %}</span>
							</div>
							{% endfor %}
						</div>
						</div><!-- /.sh-inv-col (équipement) -->

						<div class="sh-inv-col">
						{# Pas de margin-top ici : en deux colonnes cet en-tête doit s'aligner sur
						   celui de l'équipement (la marge par défaut de .sh-section suffit). #}
						<div class="sh-section" style="display:flex; align-items:center; justify-content:space-between">
							<span>🎒 Sac</span>
							<button type="button" id="inv-sort-btn" class="sh-drop-btn" onclick="cycleInvSort()"
								title="Trier le sac par nom (clic : A→Z, Z→A, puis annuler)">Trier</button>
						</div>
						<div class="sh-inv-scroll sh-scroll" id="sh-sac-scroll"><div id="sh-inv-sac" class="sh-inv-box"></div></div>
						</div><!-- /.sh-inv-col (sac) -->
						</div><!-- /.sh-inv-wrap -->

						<div class="sh-section">⚖️ Charge</div>
						<div class="sh-stat-bar-wrapper" title="Charge portée. Le repère marque la moitié de la charge max (seuil de pénalité en combat).">
							<div class="sh-stat-bar">
								<div class="sh-stat-fill" id="charge-fill"></div>
								<div class="sh-stat-pip" style="left:50%"></div>
							</div>
						</div>
						<div id="charge-label" class="sh-charge-label"></div>

						<div class="sh-section" id="sh-sol-section" style="margin-top:14px;display:none; align-items:center; justify-content:space-between">
								<span>⬇️ Au sol</span>
								<button type="button" id="sol-sort-btn" class="sh-drop-btn" onclick="cycleSolSort()"
									title="Trier les objets au sol par nom (clic : A→Z, Z→A, puis annuler)">Trier</button>
							</div>
						<div class="sh-inv-scroll sh-scroll" id="sh-sol-scroll"><div id="sh-inv-sol" class="sh-inv-box"></div></div>
					</div>

					<!-- ── COMPETENCES ── -->
					<div class="sheet-panel" id="sh-competences"><div class="pts-dispo" style="font-size:.85rem; float: right;">Points : <span id="sh-comp-points">{{ character.get("attribute_points", 0) }}</span></div>
						{# Barre de combat : la disposition se compose ICI, au calme (le mode ⚙
						   de l'écran de combat n'en est qu'un raccourci). Rendue 100 % client
						   par _renderBarreSlots depuis le payload `slots`. #}
						<div class="sh-section" style="margin-top:14px">🎯 Barre de combat</div>
						<div class="sh-barre-grid" id="sh-slot-grid"></div>
						<div class="sh-barre-hint">Clic long sur une case puis glisser pour échanger deux cases. Les actions ⚔ 🫳 🏃 se déplacent mais ne se retirent pas.</div>
						{# Modes d'attaque : ⚔ est obligatoire (toujours sur la barre), 🪃 et 🏹
						   s'ajoutent et se retirent librement. Sans ces sélecteurs, seul le
						   mode ⚙ de l'écran de combat — qui coûte UNE ACTION — permettrait de
						   poser sa case de tir : un archer restait sans bouton pour tirer. #}
						<div class="sh-section" style="margin-top:14px">🏹 Modes d'attaque</div>
						<div id="sh-modes-attaque"></div>
						{# Compétences : mêmes règles que les sorts, rendues 100 % côté client
						   depuis _competences / _competencesApprenables — resync après
						   utiliser/apprendre. #}
						<div class="sh-section" style="margin-top:14px">⚡ Compétences</div>
						<div class="sh-capa-list sh-scroll scrollable">
							<div id="sh-competences-connues" class="sh-rel-scroll"></div>
						</div>
						<div class="sh-section" style="margin-top:14px">📖 Apprentissage</div>
						<div class="sh-capa-list sh-scroll scrollable">
							<div id="sh-competences-apprenables" class="sh-rel-scroll"></div>
						</div>
						{# Sorts : rendus 100 % côté client depuis les payloads injectés (_sorts /
						   _sortsApprenables), comme le sac — resync après lancer/apprendre. #}
						<div class="sh-section" style="display:flex; align-items:center; justify-content:space-between">
							<span>🔮 Sorts connus</span>
						</div>
						<div class="sh-capa-list sh-scroll scrollable">
							<div id="sh-sorts-connus" class="sh-rel-scroll"></div>
						</div>
						<div class="sh-section" style="margin-top:14px">🏫 Écoles de magie</div>
						<div class="sh-capa-list sh-scroll scrollable">
							<div id="sh-sorts-magies" class="sh-rel-scroll"></div>
						</div>
						<div class="sh-section" style="margin-top:14px">📖 Apprentissage</div>
						<div class="sh-capa-list sh-scroll scrollable">
							<div id="sh-sorts-apprenables" class="sh-rel-scroll"></div>
						</div>
					</div>

					<!-- ── RELATIONS ── -->
					<div class="sheet-panel" id="sh-relations">
						{% set rels_lieux = relations_lieux %}
						{% set rels = affinites_detail %}
						{% if not rels_lieux and not rels %}
							<div class="sh-empty" id="sh-rel-empty"><span class="sh-empty-icon">🤝</span>Aucune relation établie.</div>
						{% endif %}

						{# Relations de lieu : TOUS les lieux connus (lieux_visites), regroupés par
						   ville (lieu_parent → lieu categorie:"ville") en accordéon. Échelle 0–100,
						   neutre 50, 0 = banni. Section rendue entièrement côté client par
						   renderFicheRelations (RELATIONS_LIEUX_INIT à l'init + resync marchandage). #}
					   <div class="sh-section">🏪 Lieux connus</div>
						<input id="sh-rel-filter" class="sh-rel-filter" type="search" placeholder="🔍 Filtrer les lieux…" autocomplete="off">
						<div id="sh-rel-lieux-scroll" class="sh-scroll scrollable">
							<div id="sh-rel-lieux" class="sh-rel-scroll"><!-- rendu par renderFicheRelations --></div>
						</div>

						{# Compagnons recrutés (affinités 0–100, neutre 50, alignée sur les lieux) :
						   rendu 100 % client par renderFicheCompagnons (AFFINITES_INIT à l'init +
						   resync embauche/congédiement/retour de combat). #}
						<div class="sh-section" id="sh-rel-comp-titre" style="display:none">👥 Compagnons</div>
						<div id="sh-rel-compagnons"><!-- rendu par renderFicheCompagnons --></div>
					</div>

					<!-- ── QUÊTES ── -->
					<div class="sheet-panel" id="sh-quetes">
						{% set qa = character.get("quetes_actives_detail",[]) %}
						{% set qt = character.get("quetes_terminees_detail",[]) %}
						{% if qa %}
							<div class="sh-section">📜 Actives</div>
							<div class="sh-quest-list-active sh-scroll scrollable">
							<div class="sh-rel-scroll">
							{# La plus récemment acceptée en premier : quetes_actives est empilée par ordre chronologique. #}
							{% for q in qa|reverse %}
							<div class="sh-quest {{ q.get('rang','F') }}">
								<div class="sh-quest-hdr">
									<span class="sh-quest-rang">{{ q.get("rang","F") }}</span>
									<span class="sh-quest-title">{{ q.get("titre","—") }}</span>
									<span class="sh-quest-status en-cours">En cours</span>
									{% if q.get("expire_at") %}<span class="sh-quest-timer" data-expire="{{ q.expire_at }}" data-now="{{ q.now }}"></span>{% endif %}
									<span class="sh-inv-actions">
										{% if q.get("focalisable") %}<button class="sh-drop-btn{% if focalisation and focalisation.type == 'quete' and focalisation.cible == q.get('id') %} btn-highlight{% endif %}" data-focus-key="quete|{{ q.get('id') }}" onclick="focaliserQuete('{{ q.get('id') }}')" title="Se focaliser sur cette quête (biaise les rencontres/récoltes)">🎯</button>{% endif %}
										{% if q.get("carte") %}<button class="sh-drop-btn" data-carte='{{ q.carte | tojson }}' onclick="showQuestMap(this)" title="Voir la zone à explorer sur la carte">Carte</button>{% endif %}
										<button class="sh-drop-btn sh-abandon-btn" onclick="abandonnerQuete('{{ q.get('id') }}',this)" title="Abandonner la quête (perte de la progression)">✕ Abandonner</button>
									</span>
								</div>
								<div class="sh-quest-desc">{{ q.get("description","") }}</div>
								{% if q.get("progress_txt") %}<div class="sh-quest-progress">🎯 {{ q.progress_txt }}{% if q.get("complete") %} ✓ prêt à rendre{% endif %}</div>{% endif %}
								{% if q.get("recompenses") %}<div class="sh-quest-reward">{% if q.recompenses.get("or") %}<span>🟡 {{ q.recompenses.or }} or</span>{% endif %}{% if q.recompenses.get("argent") %}<span>⚪ {{ q.recompenses.argent }} ar</span>{% endif %}{% if q.recompenses.get("xp") %}<span>✨ {{ q.recompenses.xp }} XP</span>{% endif %}</div>{% endif %}
							</div>
							{% endfor %}
							</div>
							</div>
						{% endif %}
						{% if qt %}
							<div class="sh-section" style="opacity:0.6">✓ Terminées ({{ qt|length }})</div>
							<div class="sh-quest-list-ended sh-scroll scrollable">
							<div class="sh-rel-scroll">
							{# La plus récemment terminée en premier : quetes_terminees est empilée par ordre chronologique. #}
							{% for q in qt|reverse %}
							<div class="sh-quest {{ q.get('rang','F') }}" style="opacity:0.5">
								<div class="sh-quest-hdr"><span class="sh-quest-rang">{{ q.get("rang","F") }}</span><span class="sh-quest-title">{{ q.get("titre","—") }}</span><span class="sh-quest-status termine">Terminée</span></div>
							</div>
							{% endfor %}
							</div>
							</div>
						{% endif %}

					   renderFicheJournal (JOURNAL_INIT à l'init + resync après chaque écriture) —
					   la coquille ci-dessous n'émet que les conteneurs vides. Rendre les listes
					   ici EN PLUS les peindrait deux fois, et l'ombre de défilement sauterait au
					   premier resync (cf. § listes scrollables). #}
					<div class="sheet-panel" id="sh-journal">

							</button>

								<div class="aub-ecrire">

									<textarea id="jnl-txt" class="aub-annonce-txt" rows="4"
											  placeholder="Ce que vous voulez consigner…"

									</div>

								{# Wrapper qui NE DÉFILE PAS (il porte l'ombre ::after) + UN enfant
								   qui défile : le renderer écrase l'INTÉRIEUR du scroller, jamais
								   le wrapper — sinon l'ombre partirait au premier rendu. #}
								<div class="sh-jnl-list sh-scroll scrollable">
									<div id="jnl-entrees" class="sh-rel-scroll"></div>
								</div>
							</div>
						</section>
						<section class="acc-section">
							<button type="button" class="acc-head" id="acc-head-bestiaire"
									onclick="toggleAccordeon(JNL_SECTIONS, 'bestiaire', JNL_SECTION_KEY)">
								<span>🐾 Bestiaire (<span id="jnl-best-compte">0</span>)</span><span class="acc-chevron">▾</span>
							</button>
							<div class="acc-body" id="acc-body-bestiaire">
								<div class="sh-jnl-list sh-scroll scrollable">
									<div id="jnl-bestiaire" class="sh-rel-scroll"></div>
								</div>
							</div>
						</section>
					</div>
				</div><!-- /.sheet-body -->
			</div><!-- /.sheet-right-col -->
		</div><!-- /.sheet-layout -->

	{# Gabarits clonés par renderCharacterCard : la macro est la SEULE à écrire du markup de
	   carte — le JS ne fait que cloner et remplir les [data-role]. Trois variantes, parce que le
	   portrait n'est éditable que là où son cadrage peut être ENREGISTRÉ (cf. part-character-card),
	   et qu'un avatar de chat n'est ni éditable, ni porteur des vitaux d'autrui. #}
	<template id="tpl-character-card"><div>{{ cards.character_card(classes="card-list", editable=true) }}</div></template>
	<template id="tpl-character-card-ro"><div>{{ cards.character_card(classes="card-list", editable=false) }}</div></template>
	<template id="tpl-character-portrait"><div>{{ cards.character_card(classes="card-chat", editable=false, vitaux=false, identite=false) }}</div></template>

	<style>
		/* (La vignette ronde `.rec-portrait` des listes a disparu : recrues et compagnons
		   s'affichent désormais avec la CARTE de personnage, portrait cadré compris.) */
		/* ── Panneau 👥 Groupe ────────────────────────────────────────────────── */
		.acc-section { border: 1px solid var(--border-color, #6b5836); border-radius: 6px; overflow: hidden; }
		.acc-head {
			width: 100%; display: flex; align-items: center; justify-content: space-between;
			padding: .6rem .8rem; background: rgba(0,0,0,.18); border: 0; cursor: pointer;
			color: inherit; font: inherit; font-weight: 700;
		}
		.acc-head:hover { background: rgba(0,0,0,.28); }
		.acc-chevron { transition: transform .15s ease; }
		.acc-section.open .acc-chevron { transform: rotate(180deg); }
		.acc-body { display: none; padding: .7rem .8rem; }
		.acc-section.open .acc-body { display: block; }
		/* Les deux sacs côte à côte ; en dessous de 720px ils s'empilent (les flèches
		   gardent leur sens : ← / → restent lisibles en colonne). */
		.grp-inv-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
		@media (max-width: 720px) { .grp-inv-wrap { grid-template-columns: 1fr; } }
		.grp-inv-col { min-width: 0; }
		.grp-inv-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .35rem; }
		.grp-inv-head select { max-width: 65%; color: var(--accent-color); background: var(--bg);}
		.grp-inv-head select:disabled { background: #474747;}
		/* Flèche de transfert : désactivée (et explicite) quand l'objet ne rentre pas chez
		   le destinataire — le serveur refuserait de toute façon (409). */
		.grp-move-btn {
			border: 1px solid var(--border-color, #6b5836); background: rgba(0,0,0,.25);
			color: inherit; border-radius: 4px; cursor: pointer; padding: 0 .45rem; font-size: 1rem;
		}
		.grp-move-btn:hover:not(:disabled) { background: var(--accent, #b98c4a); color: #1c1710; }
		.grp-move-btn:disabled { opacity: .3; cursor: not-allowed; }
		.grp-charge-over { color: #e06c5a; }
		/* ── Montures ─────────────────────────────────────────────────────────── */
		/* Sous-titre du regroupement en fin de liste des compagnons. */
		.grp-sous-titre {
			margin: 1rem 0 .4rem; padding-top: .6rem; font-size: 1rem;
			border-top: 1px solid var(--border-color, #6b5836);
		}
		/* Les bêtes à vendre : une ligne par espèce (image, texte, bouton), pas une carte de
		   personnage — on n'achète pas encore un individu, seulement une espèce. */
		.mnt-offres { display: flex; flex-direction: column; gap: .5rem; }
		.mnt-offre {
			display: flex; align-items: center; gap: .75rem; padding: .5rem;
			border-radius: 6px;  background: rgba(255, 255, 255, 0.03);
			backdrop-filter: blur(10px);
			border: 1px solid var(--border-color, #6b5836);
			box-shadow: rgba(0, 0, 0, 0.3) 0px 4px 15px;
			padding: 12px 16px;
			transition: transform 0.2s, background 0.2s;
		}
		.mnt-offre-img {
			width: 120px;
			height: auto;
			filter: drop-shadow(rgba(255, 255, 255, 0.2) 0px 0px 8px) brightness(1.1) contrast(1.1);
			transition: transform 0.3s, filter 0.3s;
			cursor: pointer;
			object-fit: contain; flex: 0 0 auto;
		}
		.mnt-offre-txt { display: flex; flex-direction: column; gap: .15rem; flex: 1 1 auto; }
		@media (max-width: 720px) {
			.mnt-offre { flex-wrap: wrap; }
			.mnt-offre-img { display: block; margin-left: auto; margin-right: auto; }
			.mnt-offre-txt { flex-basis: 100%; }
		}
		/* ── Salle commune d'une taverne ──────────────────────────────────────────
		   Tables (chatrooms) + tableau d'information. */
		.aub-nuit-cout { opacity: .7; font-size: .9em; }
		.aub-tables { display: flex; flex-direction: column; gap: .5rem; }
		.aub-table {
			border: 1px solid rgba(220, 200, 160, .28); border-radius: 10px;
			padding: .5rem .7rem; background: rgba(0, 0, 0, .18);
		}
		.aub-table.assis { border-color: var(--accent, #b98c4a); }
		.aub-table-tete {
			display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
			margin-bottom: .35rem;
		}
		.aub-table-titre { font-weight: 600; }
		.aub-table-occ { opacity: .7; font-size: .85em; }
		.aub-msgs { max-height: 30vh; overflow-y: auto; scrollbar-width: thin; }
		.aub-msg {
			padding: .25rem 0; border-top: 1px solid rgba(220, 200, 160, .12);
			display: flex; gap: .5rem; align-items: flex-start;
		}
		.aub-msg:first-child { border-top: 0; }
		.aub-msg-corps { flex: 1 1 auto; min-width: 0; }
		/* ── Avatar de l'auteur ───────────────────────────────────────────────────
		   ⚠️ La fenêtre du portrait est FIXÉE à 100×100 côté JS (PORTRAIT_W1/H1) et
		   `applyScale()` écrit un `transform: scale()` INLINE sur [data-role="scale-root"] :
		   une règle CSS posée là serait écrasée à chaque setSujet et à chaque resize. On
		   réduit donc en scalant la CARTE, depuis un conteneur qui la recadre — le calcul de
		   cadrage, lui, continue de raisonner en 100×100 et reste juste. */
		/* ⚠️ Surtout PAS de centrage flex ici : la carte occupe son gabarit NON scalé (100 px
		   de large), donc `justify-content:center` la poserait à x = (44−100)/2 = −28 px, et
		   le `scale()` — dont l'origine est `top left` — partirait de cette position déjà
		   décalée. Le portrait sortait alors du cadre, en haut à gauche. La carte doit être
		   ancrée au coin du conteneur ; c'est le `transform` seul qui la met à l'échelle. */
		.aub-msg-portrait {
			flex: 0 0 auto; width: 44px; height: 44px; overflow: hidden;
			border-radius: 6px; background: rgba(0, 0, 0, .25);
		}
		/* Le repli 👤 n'est pas une carte : il porte SON propre centrage. */
		.aub-msg-anon {
			width: 100%; height: 100%; font-size: 22px; opacity: .55;
			display: flex; align-items: center; justify-content: center;
		}
		.character-card.card-chat {
			transform: scale(.44); transform-origin: top left;
			padding: 0; border: 0; background: none; font-size: inherit;
		}
		.character-card.card-chat .char-header { margin-bottom: 0; gap: 0; }
		/* Ombre calibrée pour un portrait de 100 px : absurde sous 44. */
		.character-card.card-chat .viewport-wrapper { box-shadow: none; border-radius: 6px; }
		/* Emplacements libres de la carte : rien à y mettre pour un avatar. */
		.character-card.card-chat .card-footer,
		.character-card.card-chat .card-actions { display: none; }
		.aub-msg-tete { font-size: .8em; opacity: .7; }
		/* ⚠️ pre-wrap : une annonce est MULTI-LIGNE et `nettoyer_texte` préserve ses sauts
		   de ligne — les écraser au rendu annulerait le soin pris côté serveur. */
		.aub-msg-txt { white-space: pre-wrap; overflow-wrap: anywhere; }
		.aub-msg-vide { opacity: .55; font-style: italic; padding: .3rem 0; }
		.aub-ecrire { margin: .5rem 0 .8rem; }
		.aub-annonce-txt {
			width: 100%; box-sizing: border-box; resize: vertical;
			padding: .45rem .6rem; border-radius: 6px;
			border: 1px solid rgba(220, 200, 160, .35);
			background: rgba(0, 0, 0, .35); color: inherit; font: inherit;
		}
		.aub-ecrire-bas {
			display: flex; align-items: center; justify-content: space-between;
			gap: .6rem; margin-top: .35rem; font-size: .85em; opacity: .8;
		}
		.aub-ecrivain-ligne {
			display: flex; align-items: center; gap: .4rem;
			font-size: .85em; margin-bottom: .35rem;
		}
		/* ⚠️ Indispensable : un `display` d'auteur l'emporte sur le `[hidden]{display:none}`
		   de la feuille du navigateur — sans cette règle, la rangée resterait visible
		   quoi qu'on écrive dans `.hidden`, et le joueur solitaire verrait un sélecteur
		   à une seule entrée. */
		.aub-ecrivain-ligne[hidden] { display: none; }
		.aub-ecrivain-sel {
			flex: 0 1 auto; min-width: 0; max-width: 100%;
			padding: .15rem .3rem; font: inherit;

<script src="{{ url_for('scripts', path='deplacement.js') }}"></script>
<script>
	let POSITIONS = { "x" : {{ position["x"] | tojson | safe }}, "y": {{ position["y"] | tojson | safe }} }
	let LINKS = {{ links | tojson | safe }};
	let ACCESS = {{ access | tojson | safe }};
	// Ressource récoltable (événement de zone « ressource ») : posée par le serveur au
	// déplacement, transitoire (remplacée/effacée au déplacement suivant, consommée à la récolte).
	let _ressourceRecoltable = {{ ressource_recoltable | tojson | safe }};
	function _refreshRecolte() {
		const el = document.getElementById('recolte-action');
		if (!el) return;
		const r = _ressourceRecoltable;
		const label = r ? (r.a_couper ? `🪓 Abattre ${r.nom}` : `${r.icon || '🌿'} Récolter ${r.nom}`) : '';
		el.innerHTML = r
			? `<h3>Récolte</h3><ul class="sub-locations-list"><li><button class="sub-loc-btn" onclick="recolterRessource()">${label}</button></li></ul>`
			: '';
	}
	async function recolterRessource() {
		try {
			const res = await fetch('api/recolter', { method: 'POST', headers: {'Content-Type': 'application/json'} });
			const data = await res.json();
			if (!res.ok) { showToast('Erreur : ' + data.detail); return; }
			_applyInventoryPayload(data);
			_ressourceRecoltable = null;
			_refreshRecolte();

	function _setLeftColVitals(v) {

	// Jauges + textes PV/PM d'UN porteur (défaut : le joueur), partout où il est affiché.
	// ⚠️ Ces vitaux appartiennent à quelqu'un : les écrire à l'échelle du document recopierait
	// ceux du joueur sur les cartes de ses compagnons (et inversement, une potion bue par un
	// compagnon écraserait les siennes). Le `data-porteur` de chaque carte tranche.
	function updateVitals(v, porteurId) {

	// updateVitals) : seul le JOUEUR peut le voir changer en jeu (promotion au comptoir de
	// guilde), mais générique par cohérence si un jour un compagnon en gagne un.
	function updateRang(rang, rangDetail, porteurId) {
		if (!rang) return;
		const cible = porteurId || PRINCIPAL_ID;
